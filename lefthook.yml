pre-commit:
  commands:
    branch-check:
      run: |
        branch=$(git rev-parse --abbrev-ref HEAD)
        if [ "$branch" = "main" ]; then
          echo "Direct commits to main branch are forbidden!"
          exit 1
        fi
    conflict-markers:
      run: tools/ci/check-conflict-markers.sh --staged
    kotlin-lint:
      glob: '**/*.kt'
      run: ./gradlew spotlessCheck
    extension-lint:
      glob: 'editors/code/**/*.ts'
      run: cd editors/code && pnpm run check-types && pnpm run lint
    extension-format:
      glob: 'editors/code/**/*.{ts,js,json,css,md,yaml,yml}'
      run: editors/code/node_modules/.bin/prettier --check {staged_files}
    yaml-lint:
      glob: '**/*.{yml,yaml}'
      run: yq '.' {staged_files} > /dev/null # Requires mikefarah/yq v4+
    python-lint:
      glob: '**/*.py'
      run: ruff format --check {staged_files} && ruff check {staged_files}
    shell-lint:
      glob: '**/*.sh'
      run: shellcheck --rcfile tools/lint/shellcheckrc {staged_files}
    workflow-lint:
      glob: '.github/workflows/*.{yml,yaml}'
      run: ghalint -c tools/lint/ghalint.yaml run && actionlint -config-file tools/lint/actionlint.yml {staged_files}
    markdown-lint:
      glob: '**/*.md'
      # Snapshot files hold server output verbatim; dprint would rewrite their Markdown.
      exclude: 'tests/e2e/resources/snapshots/**'
      run: dprint check --config dprint.json {staged_files}

pre-push:
  commands:
    conflict-markers:
      # Catches markers left by a rebase, which pre-commit never sees.
      run: |
        if git rev-parse --verify --quiet origin/main >/dev/null; then
          tools/ci/check-conflict-markers.sh origin/main
        else
          echo "origin/main not found; skipping conflict marker check" >&2
        fi

commit-msg:
  commands:
    "conventional-commit":
      run: |
        commit_msg=$(head -n1 {1})
        if ! echo "$commit_msg" | grep -qE "^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([^)]+\))?!?: .+$"; then
          echo "Error: Commit message does not follow conventional commits format."
          echo "Example: feat(api): add new endpoint"
          exit 1
        fi
