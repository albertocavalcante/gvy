name: Sync rewrite-codenarc

# ==============================================================================
# Bidirectional sync between gvy monorepo and standalone rewrite-codenarc repo
#
# This workflow supports contributions from BOTH repositories:
# - push: Sync changes FROM monorepo TO standalone repo
# - pull: Sync changes FROM standalone repo TO monorepo (creates PR)
# ==============================================================================

on:
  # Auto-trigger on push to main (DISABLED - uncomment when ready)
  # push:
  #   branches: [main]
  #   paths:
  #     - 'refactor/openrewrite/rewrite-codenarc/**'

  workflow_dispatch:
    inputs:
      direction:
        description: 'Sync direction'
        type: choice
        options:
          - push-to-rewrite-codenarc
          - pull-from-rewrite-codenarc
        default: push-to-rewrite-codenarc
      force_sync:
        description: 'Force sync (overwrite history)'
        type: boolean
        default: false
      dry_run:
        description: 'Dry run (preview changes)'
        type: boolean
        default: false

jobs:
  sync:
    name: Sync ${{ inputs.direction || 'push-to-rewrite-codenarc' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Java (for Copybara)
        uses: actions/setup-java@f2beeb24e141e01a676f977032f5a29d81c9e27e # v5
        with:
          distribution: temurin
          java-version: 21

      - name: Run Copybara
        uses: olivr/copybara-action@042b4395839f3a374a6455b541e29e40c949d717 # v1.2.5
        with:
          # Deploy key for rewrite-codenarc repo (repo-specific, separate from vscode-groovy key)
          # Setup: Generate key pair, add public key to rewrite-codenarc repo deploy keys (with write access),
          #        add private key as COPYBARA_REWRITE_CODENARC_SSH_KEY secret in gvy repo
          ssh_key: ${{ secrets.COPYBARA_REWRITE_CODENARC_SSH_KEY }}
          access_token: ${{ secrets.GITHUB_TOKEN }}
          workflow: ${{ inputs.direction || 'push-to-rewrite-codenarc' }}
          copybara_options: ${{ inputs.force_sync && inputs.dry_run && '--force --dry-run' || inputs.force_sync && '--force' || inputs.dry_run && '--dry-run' || '' }}
          custom_config: infra/copybara/rewrite-codenarc.bara.sky
