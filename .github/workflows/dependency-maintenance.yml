name: Dependency Maintenance

on:
  # Include stacked PR bases; runtime CI still runs after the final main retarget.
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '15 5 * * *' # Daily expiry check, independent of dependency/build cache changes
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  accountability:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'

      - name: Test inventory and expiry enforcement
        run: node --test tools/ci/dependency-maintenance.test.mjs

      - name: Enforce temporary dependency accountability
        run: node tools/ci/dependency-maintenance.mjs
