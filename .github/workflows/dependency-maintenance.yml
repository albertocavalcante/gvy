name: Temporary A1901 validation worker

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: temporary-a1901-validation-worker
  cancel-in-progress: false

jobs:
  validate:
    if: github.ref == 'refs/heads/ci/a1901-validation-worker' && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read
    env:
      JDK_JAVA_OPTIONS: '-Xmx256m -XX:MaxMetaspaceSize=256m'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'

      - name: Check fixed worker controls
        run: node --test tools/ci/a1901-validation-worker.test.mjs

      - name: Admit fixed helper context and capacity
        env:
          GH_TOKEN: ${{ github.token }}
        run: node tools/ci/a1901-validation-worker.mjs prepare

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 70c639403588b74d556eb42591c9a7aa2941df2a
          path: build/a1901-target
          persist-credentials: false

      - name: Stage reviewed source patch
        run: node tools/ci/a1901-validation-worker.mjs stage

      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '21'

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'

      - name: Execute fixed source validation phases
        run: node tools/ci/a1901-validation-worker.mjs execute

      - name: Stop only owned validation processes
        if: always()
        run: node tools/ci/a1901-validation-worker.mjs cleanup

      - name: Publish bounded validation receipt
        if: always()
        run: node tools/ci/a1901-validation-worker.mjs publish

      - name: Upload source-bound evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: a1901-validation-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/a1901-validation-${{ github.run_id }}-${{ github.run_attempt }}/publication
          if-no-files-found: error
          retention-days: 7
