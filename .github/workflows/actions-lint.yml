# Lint GitHub Actions workflows for security policy (ghalint) and correctness (actionlint).
name: Actions Lint

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/**'
      - '.github/actions/**'
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  # Cancel superseded runs on PRs; never cancel runs on main.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: "1.25.x"
          # Tools use version-qualified go install; this repo has no Go module.
          cache: false

      - name: Install linters
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.9
          go install github.com/suzuki-shunsuke/ghalint/cmd/ghalint@v1.5.4

      - name: Run actionlint
        id: actionlint
        run: actionlint -color -config-file tools/lint/actionlint.yml
        continue-on-error: true

      - name: Run ghalint
        run: ghalint -c tools/lint/ghalint.yaml run

      - name: Fail if actionlint failed
        if: ${{ steps.actionlint.outcome == 'failure' }}
        run: exit 1
