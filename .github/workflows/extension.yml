name: Extension CI

on:
  push:
    branches: [main]
    # Backend changes must also prove the editor works with the current server.
    paths-ignore:
      - '*.md'
      - 'docs/**'
      - 'kb/**'
      - 'editors/zed/**'
      - 'tests/e2e/README.md'
  pull_request:
    # Backend changes must also prove the editor works with the current server.
    paths-ignore:
      - '*.md'
      - 'docs/**'
      - 'kb/**'
      - 'editors/zed/**'
      - 'tests/e2e/README.md'

permissions:
  contents: read

defaults:
  run:
    working-directory: editors/code

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-server:
    name: Build current server
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Setup Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: 17

      - name: Setup licensing tools
        uses: ./.github/actions/setup-licensing

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Build candidate server
        run: ./gradlew :gls:stageEditorServer --build-cache --console=plain --max-workers=2
        working-directory: .

      - name: Upload candidate server
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: current-editor-server
          path: gls/build/editor-server/gls.jar
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  validate:
    name: Validate
    needs: build-server
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24

      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 12.14.0

      - name: Get pnpm store directory
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> "$GITHUB_ENV"

      - name: Cache pnpm store
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('editors/code/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Setup Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: 17

      - name: Download candidate server
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: current-editor-server
          path: gls/build/editor-server

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SKIP_PREPARE_SERVER: false
          GLS_LOCAL_JAR: ${{ github.workspace }}/gls/build/editor-server/gls.jar
          FORCE_DOWNLOAD: 'true'

      - name: Lint
        run: pnpm run lint

      - name: Check types
        run: pnpm run check-types

      - name: Build
        run: pnpm run compile

      - name: Run tests
        env:
          GVY_TEST_SERVER_JAR: ${{ github.workspace }}/gls/build/editor-server/gls.jar
        run: |
          /usr/bin/Xvfb :99 -screen 0 1024x768x24 > /dev/null 2>&1 &
          export DISPLAY=:99
          pnpm run test:all

      - name: Upload failed editor logs
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: editor-logs-linux
          path: editors/code/.vscode-test/user-data/logs
          retention-days: 1

      - name: Check bundle size
        run: |
          if [ -f "client/out/extension.js" ]; then
            size=$(stat -c%s client/out/extension.js 2>/dev/null || stat -f%z client/out/extension.js)
            echo "Bundle size: $size bytes"
            if [ "$size" -gt 2000000 ]; then
              echo "❌ Bundle too large (>2MB)"
              exit 1
            fi
            echo "✅ Bundle size OK"
          else
            echo "❌ Extension bundle not found"
            exit 1
          fi

  test-matrix:
    name: Test (${{ matrix.os }})
    needs: [build-server, validate]
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24

      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 12.14.0

      # Keep the queried and installed store on the workspace drive on Windows.
      # STORE_PATH already includes pnpm's store version; pass the unversioned base below.
      - name: Get pnpm store directory
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent --store-dir "${{ runner.temp }}/pnpm-store")" >> "$GITHUB_ENV"

      - name: Cache pnpm store
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('editors/code/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Setup Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: 17

      - name: Download candidate server
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: current-editor-server
          path: gls/build/editor-server

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --store-dir "${{ runner.temp }}/pnpm-store"
        working-directory: editors/code
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SKIP_PREPARE_SERVER: false
          GLS_LOCAL_JAR: ${{ github.workspace }}/gls/build/editor-server/gls.jar
          FORCE_DOWNLOAD: 'true'

      - name: Build
        run: pnpm run compile
        working-directory: editors/code

      - name: Run tests
        env:
          GVY_TEST_SERVER_JAR: ${{ github.workspace }}/gls/build/editor-server/gls.jar
        run: pnpm run test:all
        working-directory: editors/code

      - name: Upload failed editor logs
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: editor-logs-${{ matrix.os }}
          path: editors/code/.vscode-test/user-data/logs
          retention-days: 1

  package:
    name: Package VSIX (${{ matrix.os }})
    needs: [build-server, validate]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]
    defaults:
      run:
        working-directory: editors/code
        shell: bash
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24

      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 12.14.0

      - name: Get pnpm store directory
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> "$GITHUB_ENV"

      - name: Cache pnpm store
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('editors/code/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Setup Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: 17

      - name: Download candidate server
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: current-editor-server
          path: gls/build/editor-server

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: editors/code
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SKIP_PREPARE_SERVER: false
          GLS_LOCAL_JAR: ${{ github.workspace }}/gls/build/editor-server/gls.jar
          FORCE_DOWNLOAD: 'true'

      - name: Build
        run: pnpm run compile
        working-directory: editors/code

      - name: Compile packaged-test harness
        run: pnpm run compile:tests

      - name: Package
        run: pnpm run package
        env:
          GLS_LOCAL_JAR: ${{ github.workspace }}/gls/build/editor-server/gls.jar
          FORCE_DOWNLOAD: 'true'
        working-directory: editors/code

      - name: Unpack and verify VSIX
        env:
          GLS_LOCAL_JAR: ${{ github.workspace }}/gls/build/editor-server/gls.jar
        run: |
          set -euo pipefail
          ls -la -- ./*.vsix
          pnpm exec vsce ls -- ./*.vsix
          cp ./*.vsix "$RUNNER_TEMP/gvy-package.zip"
          pwsh -NoProfile -Command "Expand-Archive -LiteralPath (Join-Path \$env:RUNNER_TEMP 'gvy-package.zip') -DestinationPath (Join-Path \$env:RUNNER_TEMP 'gvy-packaged-extension')"
          node -e 'const fs = require("fs"); const crypto = require("crypto"); const path = require("path"); const hash = p => crypto.createHash("sha256").update(fs.readFileSync(p)).digest("hex"); if (hash(process.env.GLS_LOCAL_JAR) !== hash(path.join(process.env.RUNNER_TEMP, "gvy-packaged-extension/extension/server/gls.jar"))) throw new Error("Packaged server checksum mismatch");'

      - name: Test packaged GDSL and implementation navigation
        env:
          # Exercise the workspace fallback even when an override is present but empty.
          GVY_TEST_SERVER_JAR: ''
          GVY_TEST_EXTENSION_ROOT: ${{ runner.temp }}/gvy-packaged-extension/extension
        run: |
          set -euo pipefail
          if [ "$RUNNER_OS" = Linux ]; then
            /usr/bin/Xvfb :99 -screen 0 1024x768x24 > /dev/null 2>&1 &
            xvfb_pid=$!
            trap 'kill "$xvfb_pid" 2>/dev/null || true' EXIT
            export DISPLAY=:99
          fi
          node --test tools/tests/gdsl-contract.test.js
          pnpm exec vscode-test --label integrationTests --grep "Implementation navigation|GDSL authoring" --fail-zero --forbid-pending
          pnpm exec vscode-test --label gdslLifecycle --fail-zero --forbid-pending

      - name: Upload failed editor logs
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: editor-logs-package-${{ matrix.os }}
          path: |
            editors/code/.vscode-test/user-data/logs
            editors/code/.vscode-test/gdsl-user-data/logs
          retention-days: 1

      - name: Upload VSIX
        if: matrix.os == 'ubuntu-24.04'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: vsix
          path: editors/code/*.vsix
          retention-days: 7
