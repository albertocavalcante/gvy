name: Extension CI

on:
  push:
    branches: [main]
    # Backend changes must also prove the editor works with the current server.
    paths-ignore:
      - '*.md'
      - 'docs/**'
      - 'kb/**'
  pull_request:
    # Backend changes must also prove the editor works with the current server.
    paths-ignore:
      - '*.md'
      - 'docs/**'
      - 'kb/**'

permissions:
  contents: read

defaults:
  run:
    working-directory: editors/code

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-server:
    name: Build current server
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Setup Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Build candidate server
        run: ./gradlew :gls:stageEditorServer --build-cache --console=plain --max-workers=2
        working-directory: .

      - name: Upload candidate server
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: current-editor-server
          path: gls/build/editor-server/gls.jar
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  validate:
    name: Validate
    needs: build-server
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24

      - name: Setup pnpm
        uses: pnpm/action-setup@41ff72655975bd51cab0327fa583b6e92b6d3061 # v4.2.0
        with:
          version: 12.14.0

      - name: Get pnpm store directory
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> "$GITHUB_ENV"

      - name: Cache pnpm store
        uses: actions/cache@8b402f58fbc84540c8b491a91e594a4576fec3d7 # v5.0.2
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('editors/code/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Setup Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: 17

      - name: Download candidate server
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: current-editor-server
          path: gls/build/editor-server

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SKIP_PREPARE_SERVER: false
          GLS_LOCAL_JAR: ${{ github.workspace }}/gls/build/editor-server/gls.jar
          FORCE_DOWNLOAD: 'true'

      - name: Setup pinned Just
        run: node ../../tools/setup-just.js --github-path

      - name: Check developer commands
        run: just check-commands

      - name: Check editor
        run: just check-editor

      - name: Run tests
        env:
          GVY_TEST_SERVER_JAR: ${{ github.workspace }}/gls/build/editor-server/gls.jar
        run: |
          /usr/bin/Xvfb :99 -screen 0 1024x768x24 > /dev/null 2>&1 &
          export DISPLAY=:99
          pnpm run test:integration

      - name: Upload failed editor logs
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: editor-logs-linux
          path: editors/code/.vscode-test/user-data/logs
          retention-days: 1

      - name: Check bundle size
        run: |
          if [ -f "client/out/extension.js" ]; then
            size=$(stat -c%s client/out/extension.js 2>/dev/null || stat -f%z client/out/extension.js)
            echo "Bundle size: $size bytes"
            if [ "$size" -gt 2000000 ]; then
              echo "❌ Bundle too large (>2MB)"
              exit 1
            fi
            echo "✅ Bundle size OK"
          else
            echo "❌ Extension bundle not found"
            exit 1
          fi

  test-matrix:
    name: Test (${{ matrix.os }})
    needs: [build-server, validate]
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24

      - name: Setup pnpm
        uses: pnpm/action-setup@41ff72655975bd51cab0327fa583b6e92b6d3061 # v4.2.0
        with:
          version: 12.14.0

      - name: Get pnpm store directory
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> "$GITHUB_ENV"

      - name: Cache pnpm store
        uses: actions/cache@8b402f58fbc84540c8b491a91e594a4576fec3d7 # v5.0.2
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('editors/code/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Setup Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: 17

      - name: Download candidate server
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: current-editor-server
          path: gls/build/editor-server

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: editors/code
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SKIP_PREPARE_SERVER: false
          GLS_LOCAL_JAR: ${{ github.workspace }}/gls/build/editor-server/gls.jar
          FORCE_DOWNLOAD: 'true'

      - name: Setup pinned Just
        run: node tools/setup-just.js --github-path
        working-directory: .

      - name: Check developer commands
        run: just check-commands
        working-directory: .

      - name: Check editor
        run: just check-editor
        working-directory: .

      - name: Run tests
        env:
          GVY_TEST_SERVER_JAR: ${{ github.workspace }}/gls/build/editor-server/gls.jar
        run: pnpm run test:integration
        working-directory: editors/code

      - name: Upload failed editor logs
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: editor-logs-${{ matrix.os }}
          path: editors/code/.vscode-test/user-data/logs
          retention-days: 1

  package:
    name: Package VSIX
    needs: [build-server, validate]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24

      - name: Setup pnpm
        uses: pnpm/action-setup@41ff72655975bd51cab0327fa583b6e92b6d3061 # v4.2.0
        with:
          version: 12.14.0

      - name: Get pnpm store directory
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> "$GITHUB_ENV"

      - name: Cache pnpm store
        uses: actions/cache@8b402f58fbc84540c8b491a91e594a4576fec3d7 # v5.0.2
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('editors/code/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Setup Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: 17

      - name: Download candidate server
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: current-editor-server
          path: gls/build/editor-server

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: editors/code
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SKIP_PREPARE_SERVER: false
          GLS_LOCAL_JAR: ${{ github.workspace }}/gls/build/editor-server/gls.jar
          FORCE_DOWNLOAD: 'true'

      - name: Build
        run: pnpm run compile
        working-directory: editors/code

      - name: Compile packaged-test harness
        run: pnpm run compile:tests

      - name: Package
        run: pnpm run package
        env:
          GLS_LOCAL_JAR: ${{ github.workspace }}/gls/build/editor-server/gls.jar
          FORCE_DOWNLOAD: 'true'
        working-directory: editors/code

      - name: Verify VSIX
        env:
          GLS_LOCAL_JAR: ${{ github.workspace }}/gls/build/editor-server/gls.jar
        shell: bash
        run: |
          set -euo pipefail
          echo "Generated VSIX files:"
          ls -la -- ./*.vsix
          pnpm exec vsce ls -- ./*.vsix
          candidate_checksum=$(sha256sum "$GLS_LOCAL_JAR")
          for vsix in ./*.vsix; do
            packaged_checksum=$(unzip -p "$vsix" extension/server/gls.jar | sha256sum)
            test "${candidate_checksum%% *}" = "${packaged_checksum%% *}"
          done
        working-directory: editors/code

      - name: Unpack VSIX
        run: unzip -q ./*.vsix -d "$RUNNER_TEMP/gvy-packaged-extension"

      - name: Test packaged implementation navigation
        env:
          # Exercise the workspace fallback even when an override is present but empty.
          GVY_TEST_SERVER_JAR: ''
          GVY_TEST_EXTENSION_ROOT: ${{ runner.temp }}/gvy-packaged-extension/extension
        run: |
          /usr/bin/Xvfb :99 -screen 0 1024x768x24 > /dev/null 2>&1 &
          export DISPLAY=:99
          pnpm exec vscode-test --grep "Implementation navigation" --fail-zero --forbid-pending

      - name: Upload failed editor logs
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: editor-logs-package
          path: editors/code/.vscode-test/user-data/logs
          retention-days: 1

      - name: Upload VSIX
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: vsix
          path: editors/code/*.vsix
          retention-days: 7
