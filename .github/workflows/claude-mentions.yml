name: Claude Mentions

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    # NOTE: Permissions here are required by ghalint policy (job_permissions).
    # They match _claude-base.yml which actually enforces them at runtime.
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    uses: ./.github/workflows/_claude-base.yml
    with:
      workflow_name: Claude Mentions
      artifact_prefix: claude-log
      artifact_suffix: ${{ github.event.issue.number || github.event.pull_request.number }}
      timeout_minutes: 30
      additional_permissions: |
        actions: read
      claude_args: |
        --allowed-tools "Read,Glob,Grep,Edit,Bash(./gradlew :*),Bash(git status),Bash(git diff:*),Bash(git log:*),Bash(git branch:*),Bash(gh :*),Bash(make :*)"
        --disallowed-tools "Bash(git add .),Bash(git push --force),Bash(rm -rf:*),Bash(curl :*),Bash(wget :*)"
        --max-turns 10
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
