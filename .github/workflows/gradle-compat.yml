# Manual qualification branch only. This replaces the registered dispatch path.
name: Coursier candidate qualification

on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: coursier-qualification-${{ github.ref }}
  cancel-in-progress: false

jobs:
  resolve:
    permissions:
      contents: read
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        os: [ubuntu-24.04, macos-15]
        version: [2.1.25-M23, 2.1.26, 2.1.27]
        mode: [permissive, strict]
    name: ${{ matrix.os }} / ${{ matrix.version }} / ${{ matrix.mode }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 38
    env:
      PROBE_VERSION: ${{ matrix.version }}
      PROBE_MODE: ${{ matrix.mode }}
      JAVA_TOOL_OPTIONS: -Xmx2g
      LC_ALL: C
    steps:
      - name: Checkout frozen source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Set up JDK 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Verify source and frozen assertions
        id: source
        run: |
          node tools/ci/coursier-probe/run.mjs source "$PROBE_VERSION" "$PROBE_MODE"
          node --test tools/ci/coursier-probe/*.test.mjs
      - name: Verify published release identity and bytes
        id: download
        env:
          GH_TOKEN: ${{ github.token }}
        run: node tools/ci/coursier-probe/run.mjs download "$PROBE_VERSION" "$PROBE_MODE"
      - name: Check resolver against loopback checksum cases
        if: matrix.mode == 'permissive'
        run: node tools/ci/coursier-probe/run.mjs fixtures "$PROBE_VERSION" "$PROBE_MODE"
      - name: Set up Bazelisk without restoring build or dependency caches
        if: ${{ !cancelled() && steps.download.outcome == 'success' }}
        id: bazel
        uses: bazel-contrib/setup-bazel@f34d6a05eae3c24acab7fa54587492daeaeffdab # 0.19.2
        with:
          bazelisk-cache: false
          cache-save: false
      - name: Resolve full Maven repository through gvy's patched Bazel module
        if: ${{ !cancelled() && steps.bazel.outcome == 'success' }}
        env:
          BAZELISK_GITHUB_TOKEN: ''
        run: node tools/ci/coursier-probe/run.mjs graph "$PROBE_VERSION" "$PROBE_MODE"
      - name: Hash and audit evidence
        id: evidence
        if: always()
        run: node tools/ci/coursier-probe/artifacts.mjs "$RUNNER_TEMP/coursier-evidence"
      - name: Preserve checked text evidence, including unsuccessful invocations
        if: ${{ always() && steps.evidence.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coursier-${{ runner.os }}-${{ matrix.version }}-${{ matrix.mode }}-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 7
          if-no-files-found: error
          path: ${{ runner.temp }}/coursier-evidence/
