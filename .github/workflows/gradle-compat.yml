# Temporary qualification branch only. Never merge this replacement.
name: Raw Rewrite candidate qualification

on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: rewrite-candidate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    permissions:
      contents: read
    env:
      GRADLE_OPTS: -Xmx512m
    steps:
      - name: Checkout frozen probe
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '22'
      - name: Set up licensing tools
        uses: ./.github/actions/setup-licensing
      - name: Set up read-only Gradle cache
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2
        with:
          cache-read-only: true
          gradle-home-cache-excludes: |
            caches/transforms-*
            caches/*/transforms
      - name: Record source and environment
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/rewrite-evidence"
          git rev-parse HEAD > "$RUNNER_TEMP/rewrite-evidence/head.txt"
          git cat-file -p HEAD > "$RUNNER_TEMP/rewrite-evidence/commit.txt"
          git status --porcelain > "$RUNNER_TEMP/rewrite-evidence/status-before.txt"
          git diff --binary > "$RUNNER_TEMP/rewrite-evidence/source-before.patch"
          java -version 2> "$RUNNER_TEMP/rewrite-evidence/java.txt"
          uname -a > "$RUNNER_TEMP/rewrite-evidence/os.txt"
          printf '%s %s\n' "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" > "$RUNNER_TEMP/rewrite-evidence/run.txt"
      - name: Run baseline then candidate with identical tests
        shell: bash
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/rewrite-evidence"
          for variant in baseline candidate; do
            if [ "$variant" = candidate ]; then
              node <<'NODE'
          const fs = require('node:fs');
          const p = 'gradle/libs.versions.toml';
          const text = fs.readFileSync(p, 'utf8');
          const before = 'rewriteGroovy = "8.84.1"';
          if (text.split(before).length !== 2) throw new Error('Expected exactly one Rewrite version');
          fs.writeFileSync(p, text.replace(before, 'rewriteGroovy = "8.90.4"'));
          NODE
            fi
            mkdir -p "$evidence/$variant"
            git diff -- gradle/libs.versions.toml > "$evidence/$variant/catalog.patch"
            shasum -a 256 gradle/libs.versions.toml > "$evidence/$variant/catalog.sha256"
            cp gradle/libs.versions.toml "$evidence/$variant/catalog.toml"
            rm -rf fmt/build/test-results/test parser/rewrite/build/test-results/test
            set +e
            node tools/ci/run-gradle.mjs --report-root "$evidence/$variant/invocations" --producer fmt-graph :fmt:dependencies --configuration testRuntimeClasspath --no-daemon --no-parallel --max-workers=1 --no-configuration-cache --stacktrace '-Dorg.gradle.jvmargs=-Xms256m -Xmx3g -XX:MaxMetaspaceSize=2g -Dfile.encoding=UTF-8' > "$evidence/$variant/fmt-graph.log" 2>&1
            fmt_graph_status=$?
            node tools/ci/run-gradle.mjs --report-root "$evidence/$variant/invocations" --producer parser-graph :parser:rewrite:dependencies --configuration testRuntimeClasspath --no-daemon --no-parallel --max-workers=1 --no-configuration-cache --stacktrace '-Dorg.gradle.jvmargs=-Xms256m -Xmx3g -XX:MaxMetaspaceSize=2g -Dfile.encoding=UTF-8' > "$evidence/$variant/parser-graph.log" 2>&1
            parser_graph_status=$?
            node tools/ci/run-gradle.mjs --report-root "$evidence/$variant/invocations" --producer rewrite-suites :fmt:test :parser:rewrite:test --continue --no-daemon --no-parallel --max-workers=1 --no-configuration-cache --stacktrace '-Dorg.gradle.jvmargs=-Xms256m -Xmx3g -XX:MaxMetaspaceSize=2g -Dfile.encoding=UTF-8' > "$evidence/$variant/suite.log" 2>&1
            suite_status=$?
            set -e
            printf 'fmt_graph=%s\nparser_graph=%s\nsuite=%s\n' "$fmt_graph_status" "$parser_graph_status" "$suite_status" > "$evidence/$variant/exit-codes.txt"
            for module in fmt parser/rewrite; do
              if [ -d "$module/build/test-results/test" ]; then
                mkdir -p "$evidence/$variant/junit/$module"
                find "$module/build/test-results/test" -maxdepth 1 -name '*.xml' -exec cp {} "$evidence/$variant/junit/$module/" \;
              fi
            done
          done
      - name: Preserve final source and status
        if: always()
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/rewrite-evidence"
          git diff --binary > "$RUNNER_TEMP/rewrite-evidence/source-after.patch"
          git status --porcelain > "$RUNNER_TEMP/rewrite-evidence/status-after.txt"
      - name: Upload raw evidence even on failure
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rewrite-probe-${{ matrix.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 7
          if-no-files-found: error
          path: ${{ runner.temp }}/rewrite-evidence/**
      - name: Preserve nonzero results as job failure
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          for variant in baseline candidate; do
            test -f "$RUNNER_TEMP/rewrite-evidence/$variant/exit-codes.txt"
            grep -qx 'fmt_graph=0' "$RUNNER_TEMP/rewrite-evidence/$variant/exit-codes.txt"
            grep -qx 'parser_graph=0' "$RUNNER_TEMP/rewrite-evidence/$variant/exit-codes.txt"
            grep -qx 'suite=0' "$RUNNER_TEMP/rewrite-evidence/$variant/exit-codes.txt"
          done
