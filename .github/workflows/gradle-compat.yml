# Temporary qualification branch only. Never merge this replacement.
name: G6 actual compiler input baselines

on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: g6-handler-input-baselines-${{ github.ref }}
  cancel-in-progress: false

jobs:
  baseline:
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: physical-members
            selectors: --tests '*PhysicalMemberSourceDeliveryTest'
          - group: binary-members
            selectors: --tests '*SignatureCompletionBinaryInputsTest'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      GRADLE_OPTS: -Xmx512m
    steps:
      - name: Checkout frozen baseline and tests
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '22'
      - name: Set up licensing tools
        uses: ./.github/actions/setup-licensing
      - name: Set up read-only Gradle cache
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2
        with:
          cache-read-only: true
          gradle-home-cache-excludes: |
            caches/transforms-*
            caches/*/transforms
      - name: Record source identity
        shell: bash
        run: |
          set -euo pipefail
          git rev-parse HEAD
          git status --porcelain
          git cat-file -p HEAD
          java -version
      - name: Format the exact candidate modules
        id: format
        shell: bash
        run: >-
          node tools/ci/run-gradle.mjs --report-root "$RUNNER_TEMP/g6-evidence" --producer candidate-format
          :gls:spotlessApply :parser:native:spotlessApply :ext:spock:spotlessApply :diagnostics:codenarc:spotlessApply --continue
          --no-daemon --no-parallel --max-workers=1 --no-configuration-cache --stacktrace '-Dorg.gradle.jvmargs=-Xms256m -Xmx3g -XX:MaxMetaspaceSize=2g -Dfile.encoding=UTF-8'
      - name: Run frozen actual input controls with bounded diagnostic sampling
        if: ${{ !cancelled() && steps.format.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/g6-source"
          node --input-type=module <<'NODE' &
          import {execFileSync} from 'node:child_process';
          import {writeFileSync} from 'node:fs';
          let sample = 0;
          setInterval(() => {
            sample++;
            const root = process.env.RUNNER_TEMP + '/g6-source/';
            try {
              const list = execFileSync('jcmd', ['-J-Xmx128m', '-l'], {encoding:'utf8', timeout:15000});
              writeFileSync(root + 'jcmd-' + sample + '.txt', list);
              for (const line of list.split('\n').filter(line => line.includes('GradleWorkerMain'))) {
                const pid = line.split(' ')[0];
                const trace = execFileSync('jcmd', ['-J-Xmx128m', pid, 'Thread.print'], {timeout:15000});
                writeFileSync(root + 'threads-' + sample + '-' + pid + '.txt', trace);
              }
            } catch (error) { writeFileSync(root + 'sampling-' + sample + '.txt', String(error)); }
            if (sample >= 4) process.exit(0);
          }, 240000);
          NODE
          watcher=$!
          trap 'kill "$watcher" 2>/dev/null || true' EXIT
          node tools/ci/run-gradle.mjs --report-root "$RUNNER_TEMP/g6-evidence" --producer combined-unit \
            :gls:test ${{ matrix.selectors }} \
            --continue --no-daemon --no-parallel --max-workers=1 --no-configuration-cache --stacktrace \
            '-Dorg.gradle.jvmargs=-Xms256m -Xmx3g -XX:MaxMetaspaceSize=2g -Dfile.encoding=UTF-8'
      - name: Preserve exact formatter delta and resulting file hashes
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/g6-source"
          git diff --binary -- gls parser/native ext/spock diagnostics/codenarc > "$RUNNER_TEMP/g6-source/format.patch"
          git diff --name-only -- gls parser/native ext/spock diagnostics/codenarc > "$RUNNER_TEMP/g6-source/changed-paths.txt"
          git ls-files -z gls parser/native ext/spock diagnostics/codenarc | xargs -0 sha256sum > "$RUNNER_TEMP/g6-source/postimages.sha256"
          git status --porcelain > "$RUNNER_TEMP/g6-source/worktree-status.txt"
      - name: Preserve raw invocation and JUnit evidence even on failure
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: g6-handler-input-baselines-${{ matrix.group }}-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 7
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/g6-evidence/**
            ${{ runner.temp }}/g6-source/**
            gls/build/test-results/test/*.xml
            parser/native/build/test-results/test/*.xml
            ext/spock/build/test-results/test/*.xml
            diagnostics/codenarc/build/test-results/test/*.xml
            gls/build/reports/tests/test/**
