# Temporary qualification branch only. Never merge this replacement.
name: G6 discovery reuse regression baseline

on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: g6-editor-discovery-r10-red-${{ github.ref }}
  cancel-in-progress: false

jobs:
  baseline:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      contents: read
    env:
      JAVA_TOOL_OPTIONS: -Xmx2g
      GRADLE_OPTS: -Xmx512m
    steps:
      - name: Checkout frozen baseline and tests
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '22'
      - name: Set up licensing tools
        uses: ./.github/actions/setup-licensing
      - name: Set up read-only Gradle cache
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2
        with:
          cache-read-only: true
          gradle-home-cache-excludes: |
            caches/transforms-*
            caches/*/transforms
      - name: Record source identity
        shell: bash
        run: |
          set -euo pipefail
          git rev-parse HEAD
          git status --porcelain
          git cat-file -p HEAD
          java -version
      - name: Run the six frozen reuse and close regressions
        shell: bash
        run: |
          set -euo pipefail
          node tools/ci/run-gradle.mjs --report-root "$RUNNER_TEMP/g6-evidence" --producer discovery-r10-baseline \
            :gls:test --tests '*DiscoveryReuseTest' \
            --no-daemon --no-parallel --max-workers=1 --no-configuration-cache --stacktrace \
            '-Dorg.gradle.jvmargs=-Xms256m -Xmx3g -XX:MaxMetaspaceSize=2g -Dfile.encoding=UTF-8'
      - name: Preserve raw invocation and JUnit evidence even on failure
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: g6-editor-discovery-r10-red-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 7
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/g6-evidence/**
            gls/build/test-results/test/*.xml
            gls/build/reports/tests/test/**
