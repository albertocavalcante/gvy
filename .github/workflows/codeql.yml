# CodeQL scans this repo for security/code quality issues in Kotlin/Java and JS/TS.
# Runs on PRs and main to catch regressions early, plus a weekly scheduled scan.
name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    paths:
      - 'editors/code/**'
      - '**/*.ts'
      - '**/*.js'
      - '**/*.mjs'
      - '**/*.cjs'
      - '.github/workflows/codeql.yml'
  schedule:
    - cron: "0 6 * * 1" # Weekly on Monday at 06:00 UTC

concurrency:
  # Cancel superseded runs on PRs; never cancel runs on main.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: 21

      - name: Initialize CodeQL
        uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          # Temporarily disabled kotlin due to CodeQL not supporting Kotlin 2.3.0
          # CodeQL currently only supports Kotlin versions below 2.2.30
          languages: javascript-typescript
          config-file: .github/codeql/codeql-config.yml

      - name: Autobuild
        uses: github/codeql-action/autobuild@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3

      - name: Analyze
        uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
