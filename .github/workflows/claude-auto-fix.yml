name: Claude Auto-Fix Bug

on:
  workflow_dispatch:
    inputs:
      issue_number:
        description: 'Issue number to fix'
        required: true
        type: number
  issues:
    types: [labeled]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.issue.number || inputs.issue_number }}
  cancel-in-progress: false

jobs:
  auto-fix:
    # Only run when issue is labeled with 'auto-fix' or manually triggered
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issues' && contains(github.event.issue.labels.*.name, 'auto-fix'))
    # NOTE: Permissions here are required by ghalint policy (job_permissions).
    # They match _claude-base.yml which actually enforces them at runtime.
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
    uses: ./.github/workflows/_claude-base.yml
    with:
      workflow_name: Claude Auto-Fix
      artifact_prefix: claude-auto-fix-log
      artifact_suffix: ${{ github.event.issue.number || inputs.issue_number }}
      timeout_minutes: 45
      fetch_depth: 0
      prompt: |
        REPO: ${{ github.repository }}
        ISSUE NUMBER: ${{ github.event.issue.number || inputs.issue_number }}

        Fix the bug described in issue #${{ github.event.issue.number || inputs.issue_number }} following TDD workflow:

        **Step 1: Understand the Bug**
        - Read the issue description thoroughly
        - Identify affected files and components
        - Determine root cause

        **Step 2: Write Failing Test (TDD - MANDATORY)**
        - Create a test that reproduces the bug
        - Run: just test
        - Verify test FAILS for the right reason
        - If test passes immediately, the bug may not exist or test is wrong

        **Step 3: Implement Fix**
        - Write minimal code to make the test pass
        - Follow AGENTS.md conventions:
          * Kotlin best practices
          * Proper error handling
          * Null safety

        **Step 4: Verify Fix**
        - Run: just test (all tests must pass)
        - Run: just lint (must pass)
        - Verify no regressions

        **Step 5: Create PR**
        - Create branch following git workflow rules
        - Use explicit git add (NEVER git add .)
        - Conventional commit: "fix: <description>"
        - Create PR with:
          * Clear title
          * Link to issue: "Fixes #${{ github.event.issue.number || inputs.issue_number }}"
          * Summary of changes
          * Test coverage added

        **CRITICAL RULES (from AGENTS.md):**
        - TDD: Failing test FIRST, then implementation
        - Git: Use `git add <file>` explicitly, NEVER `git add .`
        - Git: Check branch with `git branch --show-current`
        - Lint: Run `just lint` before commit
        - Build: Verify with `just build`
      claude_args: |
        --allowed-tools "Read,Write,Edit,Glob,Grep,Bash(./gradlew :*),Bash(just :*),Bash(git status),Bash(git branch:*),Bash(git checkout:*),Bash(git add:*),Bash(git commit:*),Bash(git push:*),Bash(gh :*)"
        --disallowed-tools "Bash(git add .),Bash(git push --force),Bash(git push -f:*),Bash(rm -rf:*)"
        --max-turns 15
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
