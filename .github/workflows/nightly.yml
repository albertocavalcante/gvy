name: Nightly Build

on:
  schedule:
    - cron: "0 3 * * *" # Daily at 03:00 UTC
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/nightly.yml
      - .github/workflows/extension-nightly.yml
      - tools/ci/nightly-artifacts*
      - tools/ci/provision-vscode*
      - tools/ci/vscode-provisioning*
      - editors/code/.vscode-test.mjs
      - editors/code/tools/vscode-test-config.mjs
      - tools/ci/gradle-memory-options*
      - tools/ci/gradle-memory-probe*
      - tools/ci/run-gradle*
      - tools/ci/check-gradle-diagnostics*
      - tools/ci/gradle-diagnostics.json
      - tools/ci/read-evidence*
      - tools/ci/bazel-diagnostics*
      - tools/ci/native-provisioning*
      - gradle.properties

permissions:
  contents: read

concurrency:
  group: nightly-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Lint nightly source
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      JAVA_OPTS: -Xmx2g
      GVY_GRADLE_MEMORY_PROBE: 'true'
      GVY_GRADLE_MEMORY_PROFILE: nightly
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Setup Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24

      - name: Lint current source
        run: >-
          node tools/ci/run-gradle.mjs --report-root "${RUNNER_TEMP}/nightly-lint-gradle-evidence" --producer nightly-lint
          --daemon lint --stacktrace --max-workers=2

      - name: Upload lint diagnostic evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gradle-evidence-nightly-lint-${{ github.run_attempt }}
          path: ${{ runner.temp }}/nightly-lint-gradle-evidence/
          if-no-files-found: error
          retention-days: 14

  build:
    name: Build and test nightly pair
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      # The wrapper consumes JAVA_OPTS without adding text to child JVM stderr.
      JAVA_OPTS: -Xmx2g
      GVY_GRADLE_MEMORY_PROBE: 'true'
      GVY_GRADLE_MEMORY_PROFILE: nightly
      GVY_VSCODE_MATRIX: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Setup Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24

      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 12.14.0

      - name: Test artifact verification and VS Code provisioning controls
        run: >-
          node --test --test-concurrency=1 tools/ci/nightly-artifacts.test.mjs
          tools/ci/vscode-provisioning.test.mjs tools/ci/read-evidence.test.mjs

      # Build before stamping package.json so JAR provenance sees a clean tree.
      # stageEditorServer supplies an exact path; never select the first old JAR.
      - name: Test and build current server
        run: >-
          node tools/ci/run-gradle.mjs --report-root "${RUNNER_TEMP}/nightly-gradle-evidence" --producer nightly-server
          --daemon test :tests:e2eTest :gls:stageEditorServer --stacktrace --max-workers=2

      - name: Upload Gradle diagnostic evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gradle-evidence-nightly-${{ github.run_attempt }}
          path: ${{ runner.temp }}/nightly-gradle-evidence/
          if-no-files-found: error
          retention-days: 14

      - name: Install extension dependencies with current server
        working-directory: editors/code
        run: pnpm install --frozen-lockfile
        env:
          GLS_LOCAL_JAR: ${{ github.workspace }}/gls/build/editor-server/gls.jar
          GLS_ALLOW_PINNED_FALLBACK: 'false'
          FORCE_DOWNLOAD: 'true'

      - name: Build, run unit tests and compile integration harness
        working-directory: editors/code
        env:
          GVY_TEST_SERVER_JAR: ${{ github.workspace }}/gls/build/editor-server/gls.jar
        run: |
          pnpm run compile
          pnpm run test
          pnpm run compile:tests

      - name: Provision pinned VS Code
        run: node tools/ci/provision-vscode.mjs --provision --report "$RUNNER_TEMP/gvy-vscode-public"

      - name: Test extension with current server once
        id: editor_integration
        working-directory: editors/code
        run: xvfb-run -a node ../../tools/ci/provision-vscode.mjs --run --report "$RUNNER_TEMP/gvy-vscode-public"
        env:
          GVY_TEST_SERVER_JAR: ${{ github.workspace }}/gls/build/editor-server/gls.jar

      - name: Audit provisioning and integration evidence
        id: vscode_audit
        if: ${{ !cancelled() }}
        run: node tools/ci/provision-vscode.mjs --audit --report "$RUNNER_TEMP/gvy-vscode-public"

      - name: Upload audited VS Code provisioning result
        if: ${{ !cancelled() && steps.vscode_audit.outputs.safe == 'true' }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: vscode-provisioning-nightly-${{ github.run_attempt }}
          path: ${{ runner.temp }}/gvy-vscode-public/result.json
          if-no-files-found: error
          retention-days: 14

      - name: Compute nightly version
        id: version
        run: |
          node - <<'JS' >> "$GITHUB_OUTPUT"
          const base = require('./editors/code/package.json').version.split('-')[0];
          if (!/^\d+\.\d+\.\d+$/.test(base)) throw new Error('Invalid base version');
          const stamp = new Date().toISOString().replace(/[-:TZ.]/g, '').slice(0, 14);
          console.log(`version=${base}-nightly.${stamp}.${process.env.GITHUB_RUN_ID}.${process.env.GITHUB_RUN_ATTEMPT}`);
          JS

      - name: Package extension with verified current server
        working-directory: editors/code
        env:
          NIGHTLY_VERSION: ${{ steps.version.outputs.version }}
          GLS_LOCAL_JAR: ${{ github.workspace }}/gls/build/editor-server/gls.jar
          GLS_ALLOW_PINNED_FALLBACK: 'false'
          FORCE_DOWNLOAD: 'true'
        run: |
          node - <<'JS'
          const fs = require('node:fs');
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          pkg.version = process.env.NIGHTLY_VERSION;
          fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          JS
          mkdir -p ../../dist/nightly
          pnpm exec vsce package --no-dependencies --out ../../dist/nightly/gvy-nightly.vsix

      - name: Verify paired artifacts and write checksums
        env:
          NIGHTLY_VERSION: ${{ steps.version.outputs.version }}
          JAVA_TOOL_OPTIONS: -Xmx2g
        run: |
          cp gls/build/editor-server/gls.jar dist/nightly/gls-nightly.jar
          node tools/ci/nightly-artifacts.mjs dist/nightly "$GITHUB_SHA" "$NIGHTLY_VERSION" \
            "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          node editors/code/tools/smoke-server.js dist/nightly/gls-nightly.jar

      - name: Upload nightly pair
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: nightly-pair
          path: dist/nightly/*
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  publish:
    name: Publish tested main nightly
    needs: [lint, build]
    if: >-
      needs.lint.result == 'success' && needs.build.result == 'success' &&
      github.repository == 'albertocavalcante/gvy' && github.ref == 'refs/heads/main' &&
      (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      # No checkout or repository code runs with the publishing token.
      - name: Download tested pair
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: nightly-pair
          path: dist

      - name: Verify checksums and publish immutable prerelease
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          NIGHTLY_VERSION: ${{ needs.build.outputs.version }}
        run: |
          cd dist
          sha256sum -c checksums.txt
          # A publish-only retry reuses the build version but has a new attempt.
          # Leave a failed upload's draft untouched and use a fresh tag.
          tag="nightly-${NIGHTLY_VERSION}-publish.${GITHUB_RUN_ATTEMPT}"
          gh release create "$tag" gls-nightly.jar gvy-nightly.vsix nightly.json checksums.txt \
            --draft --prerelease --latest=false --target "$GITHUB_SHA" \
            --title "Nightly $NIGHTLY_VERSION" --notes-file release-notes.md
          gh release edit "$tag" --draft=false --prerelease --latest=false
