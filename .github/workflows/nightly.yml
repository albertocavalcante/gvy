name: Nightly Build

on:
  schedule:
    - cron: "0 3 * * *" # Daily at 03:00 UTC
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/nightly.yml
      - .github/workflows/extension-nightly.yml
      - tools/ci/nightly-artifacts*

permissions:
  contents: read

concurrency:
  group: nightly-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build and test nightly pair
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      JAVA_TOOL_OPTIONS: -Xmx2g
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Setup Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24

      - name: Setup pnpm
        uses: pnpm/action-setup@41ff72655975bd51cab0327fa583b6e92b6d3061 # v4.2.0
        with:
          version: 12.14.0

      - name: Test artifact verification
        run: node --test tools/ci/nightly-artifacts.test.mjs

      # Build before stamping package.json so JAR provenance sees a clean tree.
      # stageEditorServer supplies an exact path; never select the first old JAR.
      - name: Test and build current server
        run: ./gradlew --no-daemon lint test :tests:e2eTest :gls:stageEditorServer --stacktrace --max-workers=2

      - name: Install extension dependencies with current server
        working-directory: editors/code
        run: pnpm install --frozen-lockfile
        env:
          GLS_LOCAL_JAR: ${{ github.workspace }}/gls/build/editor-server/gls.jar
          GLS_ALLOW_PINNED_FALLBACK: 'false'
          FORCE_DOWNLOAD: 'true'

      - name: Build and test extension with current server
        working-directory: editors/code
        run: |
          pnpm run compile
          xvfb-run -a pnpm run test:all
        env:
          GVY_TEST_SERVER_JAR: ${{ github.workspace }}/gls/build/editor-server/gls.jar

      - name: Compute nightly version
        id: version
        run: |
          node - <<'JS' >> "$GITHUB_OUTPUT"
          const base = require('./editors/code/package.json').version.split('-')[0];
          if (!/^\d+\.\d+\.\d+$/.test(base)) throw new Error('Invalid base version');
          const stamp = new Date().toISOString().replace(/[-:TZ.]/g, '').slice(0, 14);
          console.log(`version=${base}-nightly.${stamp}.${process.env.GITHUB_RUN_ID}.${process.env.GITHUB_RUN_ATTEMPT}`);
          JS

      - name: Package extension with verified current server
        working-directory: editors/code
        env:
          NIGHTLY_VERSION: ${{ steps.version.outputs.version }}
          GLS_LOCAL_JAR: ${{ github.workspace }}/gls/build/editor-server/gls.jar
          GLS_ALLOW_PINNED_FALLBACK: 'false'
          FORCE_DOWNLOAD: 'true'
        run: |
          node - <<'JS'
          const fs = require('node:fs');
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          pkg.version = process.env.NIGHTLY_VERSION;
          fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          JS
          mkdir -p ../../dist/nightly
          pnpm exec vsce package --no-dependencies --out ../../dist/nightly/gvy-nightly.vsix

      - name: Verify paired artifacts and write checksums
        env:
          NIGHTLY_VERSION: ${{ steps.version.outputs.version }}
        run: |
          cp gls/build/editor-server/gls.jar dist/nightly/gls-nightly.jar
          node tools/ci/nightly-artifacts.mjs dist/nightly "$GITHUB_SHA" "$NIGHTLY_VERSION" \
            "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          node editors/code/tools/smoke-server.js dist/nightly/gls-nightly.jar

      - name: Upload nightly pair
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: nightly-pair
          path: dist/nightly/*
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  publish:
    name: Publish tested main nightly
    needs: build
    if: github.repository == 'albertocavalcante/gvy' && github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      # No checkout or repository code runs with the publishing token.
      - name: Download tested pair
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: nightly-pair
          path: dist

      - name: Verify checksums and publish immutable prerelease
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          NIGHTLY_VERSION: ${{ needs.build.outputs.version }}
        run: |
          cd dist
          sha256sum -c checksums.txt
          tag="nightly-${NIGHTLY_VERSION}"
          gh release create "$tag" gls-nightly.jar gvy-nightly.vsix nightly.json checksums.txt \
            --draft --prerelease --latest=false --target "$GITHUB_SHA" \
            --title "Nightly $NIGHTLY_VERSION" --notes-file release-notes.md
          gh release edit "$tag" --draft=false --prerelease --latest=false
