name: Sanity Check

on:
  pull_request:

# Each job declares only the permissions it needs.
permissions: {}

concurrency:
  # Cancel superseded runs on PRs; never cancel runs on main.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # One job instead of three: each was under a minute, and every job costs a queue slot. Steps after the
  # first run even when an earlier gate failed (`!cancelled()`), so one push reports every failing gate.
  sanity:
    name: Sanity checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      # Only the large-file comment step is given the token explicitly (see below). Earlier steps run PR
      # code in the same job, so this is job-level write access, as the old check-file-size job had.
      pull-requests: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Self-test conflict marker gate
        run: bash tools/ci/check-conflict-markers_test.sh

      - name: Check for leftover conflict markers
        if: ${{ !cancelled() }}
        env:
          BASE_REF: ${{ github.base_ref }}
        run: bash tools/ci/check-conflict-markers.sh "origin/${BASE_REF}"

      - name: Self-test make ext-latest helpers
        if: ${{ !cancelled() }}
        run: bash tools/ext-latest_test.sh

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: ${{ !cancelled() }}
        with:
          node-version: 24

      - name: Self-test logging baseline tools
        if: ${{ !cancelled() }}
        run: |
          node --version
          node -e 'if (Number(process.versions.node.split(".")[0]) < 24) { console.error("Node 24 or newer is required"); process.exit(1); }'
          node --test tools/logging/fixtures.test.mjs tools/logging/server-baseline.test.mjs

      - name: Self-test large-file gate
        if: ${{ !cancelled() }}
        run: bash tools/ci/check-large-files_test.sh

      # The PR-controlled script runs without a token; only the comment step
      # below gets GH_TOKEN.
      - name: Check for large files (>700KB)
        if: ${{ !cancelled() }}
        env:
          BASE_REF: ${{ github.base_ref }}
          COMMENT_FILE: ${{ runner.temp }}/large-file-comment.md
        run: bash tools/ci/check-large-files.sh "origin/${BASE_REF}"

      - name: Comment large-file report on the PR
        if: failure() && hashFiles(format('{0}/large-file-comment.md', runner.temp)) != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          COMMENT_FILE: ${{ runner.temp }}/large-file-comment.md
        run: gh pr comment "$PR_NUMBER" --body-file "$COMMENT_FILE"
