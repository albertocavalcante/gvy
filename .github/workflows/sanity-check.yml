name: Sanity Check

on:
  pull_request:

# Each job declares only the permissions it needs.
permissions: {}

concurrency:
  # Cancel superseded runs on PRs; never cancel runs on main.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check-conflict-markers:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Self-test conflict marker gate
        run: bash tools/ci/check-conflict-markers_test.sh

      - name: Check for leftover conflict markers
        env:
          BASE_REF: ${{ github.base_ref }}
        run: bash tools/ci/check-conflict-markers.sh "origin/${BASE_REF}"

  ext-latest-selftest:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Self-test make ext-latest helpers
        run: bash tools/ext-latest_test.sh

  check-file-size:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Self-test large-file gate
        run: bash tools/ci/check-large-files_test.sh

      # The PR-controlled script runs without a token; only the comment step
      # below gets GH_TOKEN.
      - name: Check for large files (>700KB)
        env:
          BASE_REF: ${{ github.base_ref }}
          COMMENT_FILE: ${{ runner.temp }}/large-file-comment.md
        run: bash tools/ci/check-large-files.sh "origin/${BASE_REF}"

      - name: Comment large-file report on the PR
        if: failure() && hashFiles(format('{0}/large-file-comment.md', runner.temp)) != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          COMMENT_FILE: ${{ runner.temp }}/large-file-comment.md
        run: gh pr comment "$PR_NUMBER" --body-file "$COMMENT_FILE"
