name: Sanity Check

on:
  pull_request:

permissions:
  pull-requests: write
  contents: read

jobs:
  check-file-size:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Self-test large-file gate
        run: bash tools/ci/check-large-files_test.sh

      - name: Check for large files (>700KB)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BASE_REF: ${{ github.base_ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          COMMENT_FILE: ${{ runner.temp }}/large-file-comment.md
        run: |
          if ! bash tools/ci/check-large-files.sh "origin/${BASE_REF}"; then
            if [[ -f "$COMMENT_FILE" ]]; then
              gh pr comment "$PR_NUMBER" --body-file "$COMMENT_FILE"
            fi
            exit 1
          fi
