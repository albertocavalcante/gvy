name: Mirror to vscode-groovy

on:
  push:
    branches: [main]
    paths:
      - 'editors/code/**'
      - 'LICENSES/Apache-2.0.txt'
      - 'infra/copybara/vscode-groovy.bara.sky'
      - '.github/workflows/mirror-vscode-groovy.yml'
  workflow_dispatch:
    inputs:
      force_sync:
        description: 'Force sync (overwrite history)'
        type: boolean
        default: false
      dry_run:
        description: 'Dry run (preview changes)'
        type: boolean
        default: false

jobs:
  mirror:
    name: Sync to vscode-groovy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Java (for Copybara)
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: 17

      - name: Setup licensing tools
        uses: ./.github/actions/setup-licensing

      - name: Check license metadata
        run: uv run --offline --locked --no-dev --project .reuse python .reuse/check.py --root .

      - name: Bind the validated source revision
        id: source_config
        run: |
          config=$(uv run --offline --locked --no-dev --project .reuse python .reuse/pin_export.py \
            --workflow push-to-vscode-groovy --revision "$GITHUB_SHA" \
            --output "$RUNNER_TEMP/gvy-vscode-copy.bara.sky")
          printf 'path=%s\n' "$config" >> "$GITHUB_OUTPUT"

      - name: Run Copybara
        uses: olivr/copybara-action@042b4395839f3a374a6455b541e29e40c949d717 # v1.2.5
        with:
          # Deploy key for vscode-groovy repo (repo-specific, not shared with other repos)
          ssh_key: ${{ secrets.COPYBARA_SSH_KEY }}
          workflow: push-to-vscode-groovy
          copybara_options: ${{ inputs.force_sync && '--force' || '' }} ${{ inputs.dry_run && '--dry-run' || '' }}
          custom_config: ${{ steps.source_config.outputs.path }}
