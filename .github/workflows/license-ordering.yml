name: License task ordering

on:
  pull_request:
    branches: [main]
    paths:
      - 'build.gradle.kts'
      - 'tools/ci/**'
      - 'gradle/wrapper/**'
      - 'gradlew'
      - 'gradlew.bat'
      - '.github/workflows/license-ordering.yml'
  push:
    branches: [main]
    paths:
      - 'build.gradle.kts'
      - 'tools/ci/**'
      - 'gradle/wrapper/**'
      - 'gradlew'
      - 'gradlew.bat'
      - '.github/workflows/license-ordering.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ordering:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      JDK_JAVA_OPTIONS: -Xmx256m -XX:MaxMetaspaceSize=256m
      GVY_GRADLE_MEMORY_PROBE: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
      - name: Verify the real Gradle ordering and negative controls
        run: node tools/ci/verify-license-task-ordering.mjs --execute --report-root "$RUNNER_TEMP/license-ordering"
      - name: Check the actual project graph and configuration-cache reuse
        run: |
          for attempt in store reuse; do
            node tools/ci/run-gradle.mjs \
              --report-root "$RUNNER_TEMP/license-ordering/project-$attempt" \
              --producer "license-order-project-$attempt" \
              :gls:lint --dry-run --no-daemon --max-workers=1 \
              --project-cache-dir "$RUNNER_TEMP/license-ordering-project-cache" \
              --configuration-cache --configuration-cache-problems=fail \
              '-Dorg.gradle.jvmargs=-Xms64m -Xmx1536m -XX:MaxMetaspaceSize=768m' \
              -Dorg.gradle.scan=false --stacktrace
          done
      - name: Require observed project ordering and cache store/reuse
        env:
          ORDERING_REPORT: ${{ runner.temp }}/license-ordering
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import { readdirSync, readFileSync } from 'node:fs';
          import { join } from 'node:path';
          const logs = {};
          for (const attempt of ['store', 'reuse']) {
            const root = join(process.env.ORDERING_REPORT, `project-${attempt}`);
            const entries = readdirSync(root);
            assert.equal(entries.length, 1, 'Expected one fresh project invocation');
            const log = readFileSync(join(root, entries[0], 'console.log'), 'utf8');
            const tasks = [...log.matchAll(/^(:\S+) SKIPPED\s*$/gm)].map(match => match[1]);
            assert.equal(tasks.filter(task => task === ':licenseCheck').length, 1);
            assert.equal(tasks[0], ':licenseCheck', 'Licensing must precede every selected task');
            for (const task of [':gls:detekt', ':gls:spotlessCheck', ':gls:lint']) {
              assert.ok(tasks.includes(task), `Required project task missing: ${task}`);
            }
            logs[attempt] = log;
          }
          assert.match(logs.store, /^Configuration cache entry stored\./m);
          assert.match(logs.reuse, /^Reusing configuration cache\./m);
          JS
      - name: Retain ordering evidence, including expected failures
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: license-ordering-${{ github.run_attempt }}
          path: ${{ runner.temp }}/license-ordering/
          if-no-files-found: error
          retention-days: 14
