name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize]
    # Optional: Only run on specific file changes
    # paths:
    #   - "src/**/*.ts"
    #   - "src/**/*.tsx"
    #   - "src/**/*.js"
    #   - "src/**/*.jsx"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  claude-review:
    # Only run for trusted contributors to prevent abuse from forks
    # OWNER, MEMBER, CONTRIBUTOR are trusted; FIRST_TIME_CONTRIBUTOR and others require approval
    if: |
      github.event.pull_request.author_association == 'OWNER' ||
      github.event.pull_request.author_association == 'MEMBER' ||
      github.event.pull_request.author_association == 'CONTRIBUTOR'

    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@a017b830c03e23789b11fb69ed571ea61c12e45c # v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request following the standards in AGENTS.md:

            **Code Quality:**
            - Kotlin conventions and null safety
            - Code readability and maintainability
            - Proper error handling

            **Security:**
            - No hardcoded credentials or secrets
            - Safe file operations (no path traversal)
            - Proper input validation

            **Testing:**
            - TDD followed (failing tests first)?
            - 80%+ coverage for public APIs
            - Edge cases covered

            **Performance:**
            - No N+1 queries or inefficient algorithms
            - Appropriate use of Kotlin sequences/collections
            - LSP protocol efficiency (request/response cycles)

            **Git Workflow:**
            - Conventional commit format
            - Explicit file additions (no wildcards)
            - Lint passes: ./gradlew lintFix

            Use `gh pr comment` to post your review. Be constructive and specific.

          # Security: Read-only code analysis + commenting only
          # Allows reading code and using gh CLI for viewing/commenting
          # Prevents edits during automated reviews
          claude_args: |
            --allowed-tools "Read,Glob,Grep,Bash(gh issue view:*),Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr checks:*),Bash(gh pr comment:*),Bash(./gradlew test)"
            --max-turns 5

      # Log path is hardcoded because claude-code-action doesn't expose an output variable.
      # This is the standard path used by the action on GitHub-hosted runners.
      # See: https://github.com/anthropics/claude-code-action
      - name: Upload Claude execution log
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: claude-review-log-pr-${{ github.event.pull_request.number }}
          path: /home/runner/work/_temp/claude-execution-output.json
          retention-days: 7
          if-no-files-found: ignore

      - name: Output failure summary
        if: failure()
        run: |
          LOG_FILE="/home/runner/work/_temp/claude-execution-output.json"
          {
            echo "## Claude Code Review Failed"
            echo ""
            if [ -f "$LOG_FILE" ]; then
              echo "### Execution Details"
              echo '```json'
              if jq -e . "$LOG_FILE" >/dev/null 2>&1; then
                jq -r 'if .type == "result" then {type, subtype, is_error, duration_ms, num_turns, total_cost_usd, permission_denials} else {type, subtype, message} end' "$LOG_FILE" | head -200
              else
                echo "# Warning: Log is not valid JSON, showing raw content:"
                head -200 "$LOG_FILE"
              fi
              echo '```'
              echo ""
              echo "Full log available in artifacts: **claude-review-log-pr-${{ github.event.pull_request.number }}**"
            else
              echo "No execution log found."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

