# Temporary execution support. Never merge into main or the product PR.
name: Verification analysis quarantine assertion controls
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verification-q04-authority-${{ github.sha }}
  cancel-in-progress: false
jobs:
  proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      JDK_JAVA_OPTIONS: '-Xmx512m'
      JAVA_TOOL_OPTIONS: '-Xmx512m -Dorg.gradle.deprecation.trace=true'
      GRADLE_OPTS: >-
        -Dorg.gradle.jvmargs="-Xmx1536m -XX:MaxMetaspaceSize=768m -XX:+UseSerialGC"
        -Dorg.gradle.workers.max=1 -Dorg.gradle.parallel=false -Dorg.gradle.daemon=false
      NODE_OPTIONS: '--max-old-space-size=256'
      NO_COLOR: '1'
      TERM: dumb
    steps:
      - name: Checkout reviewed support ref
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: support
          persist-credentials: false
      - name: Checkout frozen source base
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 2a762e982c227ee806f3a96cf3d8216bfdee0b4b
          path: candidate
          persist-credentials: false
      - name: Set up Java 17 test runtime
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Java 21 compiler runtime
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24'
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
      - name: Check proof verifier controls
        working-directory: support/.publication
        run: node --test proof-tools.test.mjs
      - name: Install locked licensing tools
        working-directory: candidate
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --require-hashes --only-binary=:all: -r .reuse/bootstrap-requirements.txt
          uv sync --project .reuse --locked
      - name: Fetch checksum-pinned hook tools
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          : "${RUNNER_TEMP:?}"
          : "${GITHUB_PATH:?}"
          bins="${RUNNER_TEMP}/q04-hook-bin"
          download="${RUNNER_TEMP}/q04-hook-download"
          mkdir "${bins}" "${download}"
          gh release download v2.38.2 --repo direnv/direnv --pattern direnv.linux-amd64 --dir "${download}"
          printf '%s  %s\n' 148820a187930d36ca6a204504e5cdb30d8396cd1a97e64c3b3f10d793c11247 "${download}/direnv.linux-amd64" | sha256sum -c -
          install -m 755 "${download}/direnv.linux-amd64" "${bins}/direnv"
          gh release download v2.2.2 --repo evilmartians/lefthook --pattern lefthook_2.2.2_Linux_x86_64 --dir "${download}"
          printf '%s  %s\n' 4fbf89eb7748c6aed84d833ee1a29edac48fae614468ca9a82896ec32f2800b6 "${download}/lefthook_2.2.2_Linux_x86_64" | sha256sum -c -
          install -m 755 "${download}/lefthook_2.2.2_Linux_x86_64" "${bins}/lefthook"
          printf '%s\n' "${bins}" >>"${GITHUB_PATH}"
      - name: Prove baseline and assertion failures then export quality evidence
        shell: bash
        run: bash "${GITHUB_WORKSPACE}/support/.publication/run-proof.sh"
      - name: Upload original evidence on success or failure
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gvy-q04-authority-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/gvy-q04-authority-proof/
            candidate/gls/build/test-results/test/*.xml
          if-no-files-found: error
          retention-days: 7
