name: Backend noise preparation
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: backend-noise-preparation-${{ github.sha }}
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
    env:
      JDK_JAVA_OPTIONS: '-Xmx512m'
      JAVA_TOOL_OPTIONS: '-Xmx512m'
    steps:
      - name: Prepare retained evidence
        run: |
          set -euo pipefail
          mkdir -m 700 "$RUNNER_TEMP/noise-proof"
          printf 'support=%s\ncandidate=%s\n' "$GITHUB_SHA" f4ee9eb5ccaa7ab17f44f7fbec4db8654cfb361f >"$RUNNER_TEMP/noise-proof/preparation-identity.txt"
      - name: Checkout support
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: support
          persist-credentials: false
      - name: Checkout red
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: a2baf77a1f5808e1fc2f222e3d178e4d6fd51a2c
          path: red
          persist-credentials: false
      - name: Checkout candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: f4ee9eb5ccaa7ab17f44f7fbec4db8654cfb361f
          path: candidate
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Java 17
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Java 21
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '21'
      - name: Verify worker and pinned tools
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          bins="$RUNNER_TEMP/noise-bin"
          download="$RUNNER_TEMP/noise-download"
          mkdir -p "$bins" "$download"
          gh release download v3.12.0 --repo mvdan/sh --pattern shfmt_v3.12.0_linux_amd64 --dir "$download"
          printf '%s  %s\n' d9fbb2a9c33d13f47e7618cf362a914d029d02a6df124064fff04fd688a745ea "$download/shfmt_v3.12.0_linux_amd64" | sha256sum -c -
          install -m 755 "$download/shfmt_v3.12.0_linux_amd64" "$bins/shfmt"
          gh release download v0.11.0 --repo koalaman/shellcheck --pattern shellcheck-v0.11.0.linux.x86_64.tar.gz --dir "$download"
          printf '%s  %s\n' b7af85e41cc99489dcc21d66c6d5f3685138f06d34651e6d34b42ec6d54fe6f6 "$download/shellcheck-v0.11.0.linux.x86_64.tar.gz" | sha256sum -c -
          tar -xzf "$download/shellcheck-v0.11.0.linux.x86_64.tar.gz" -C "$download"
          install -m 755 "$download/shellcheck-v0.11.0/shellcheck" "$bins/shellcheck"
          gh release download v2.38.2 --repo direnv/direnv --pattern direnv.linux-amd64 --dir "$download"
          printf '%s  %s\n' 148820a187930d36ca6a204504e5cdb30d8396cd1a97e64c3b3f10d793c11247 "$download/direnv.linux-amd64" | sha256sum -c -
          install -m 755 "$download/direnv.linux-amd64" "$bins/direnv"
          gh release download v2.2.2 --repo evilmartians/lefthook --pattern lefthook_2.2.2_Linux_x86_64 --dir "$download"
          printf '%s  %s\n' 4fbf89eb7748c6aed84d833ee1a29edac48fae614468ca9a82896ec32f2800b6 "$download/lefthook_2.2.2_Linux_x86_64" | sha256sum -c -
          install -m 755 "$download/lefthook_2.2.2_Linux_x86_64" "$bins/lefthook"
          "$bins/shellcheck" --version
          "$bins/shfmt" --version
          bash -n support/.publication/backend-noise-worker.sh
          "$bins/shellcheck" support/.publication/backend-noise-worker.sh
          "$bins/shfmt" -d support/.publication/backend-noise-worker.sh
          python3 - support/.github/workflows/ci.yml "$RUNNER_TEMP/noise-proof" <<'PYWORKFLOW'
          import pathlib
          import sys
          lines = pathlib.Path(sys.argv[1]).read_text(encoding="utf-8").splitlines()
          scripts = []
          index = 0
          while index < len(lines):
              line = lines[index]
              if not line.startswith("        run: "):
                  index += 1
                  continue
              value = line.removeprefix("        run: ")
              index += 1
              if value == "|":
                  body = []
                  while index < len(lines) and (lines[index].startswith("          ") or not lines[index]):
                      body.append(lines[index][10:])
                      index += 1
                  value = "\n".join(body)
              scripts.append(value + "\n")
          if len(scripts) != 3:
              raise SystemExit("unexpected workflow shell step count")
          for number, script in enumerate(scripts):
              pathlib.Path(sys.argv[2], f"workflow-step-{number}.sh").write_text(script, encoding="utf-8")
          PYWORKFLOW
          for script in "$RUNNER_TEMP/noise-proof"/workflow-step-*.sh; do
            bash -n "$script"
            "$bins/shellcheck" --shell=bash "$script"
            "$bins/shfmt" -i 2 -d "$script"
          done
          sha256sum support/.publication/backend-noise-worker.sh support/.github/workflows/ci.yml >"$RUNNER_TEMP/noise-proof/worker.sha256"
          echo "$bins" >>"$GITHUB_PATH"
      - name: Prepare and verify candidate
        shell: bash
        run: bash support/.publication/backend-noise-worker.sh
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: backend-noise-proof
          path: |
            ${{ runner.temp }}/noise-proof/*.xml
            ${{ runner.temp }}/noise-proof/*.txt
            ${{ runner.temp }}/noise-proof/*.status
            ${{ runner.temp }}/noise-proof/*.sha256
            ${{ runner.temp }}/noise-proof/head
            ${{ runner.temp }}/noise-proof/tree
            ${{ runner.temp }}/noise-proof/formatted-tree
            ${{ runner.temp }}/noise-proof/formatted.patch
            ${{ runner.temp }}/noise-proof/candidate.bundle
          if-no-files-found: error
          retention-days: 7
