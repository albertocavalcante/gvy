name: Reporter preparation
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: reporter-preparation-${{ github.sha }}
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
    env:
      JDK_JAVA_OPTIONS: '-Xmx512m'
      JAVA_TOOL_OPTIONS: '-Xmx512m'
    steps:
      - name: Prepare retained evidence
        run: |
          set -euo pipefail
          mkdir -m 700 "$RUNNER_TEMP/reporter-proof"
          printf 'support=%s\ncandidate=%s\n' "$GITHUB_SHA" e0250f654f358b03947f003d9cfabde16c38f0a2 >"$RUNNER_TEMP/reporter-proof/preparation-identity.txt"
      - name: Checkout support
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: support
          persist-credentials: false
      - name: Checkout product
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: e0250f654f358b03947f003d9cfabde16c38f0a2
          path: product
          fetch-depth: 0
          persist-credentials: false
      - uses: bazel-contrib/setup-bazel@f34d6a05eae3c24acab7fa54587492daeaeffdab # 0.19.2
        with:
          bazelisk-cache: true
          disk-cache: reporter-preparation
          repository-cache: true
      - name: Set up Java 17
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Java 21
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '21'
      - name: Verify worker and pinned tools
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          bins="$RUNNER_TEMP/noise-bin"
          download="$RUNNER_TEMP/noise-download"
          mkdir -p "$bins" "$download"
          gh release download v3.12.0 --repo mvdan/sh --pattern shfmt_v3.12.0_linux_amd64 --dir "$download"
          printf '%s  %s\n' d9fbb2a9c33d13f47e7618cf362a914d029d02a6df124064fff04fd688a745ea "$download/shfmt_v3.12.0_linux_amd64" | sha256sum -c -
          install -m 755 "$download/shfmt_v3.12.0_linux_amd64" "$bins/shfmt"
          gh release download v0.11.0 --repo koalaman/shellcheck --pattern shellcheck-v0.11.0.linux.x86_64.tar.gz --dir "$download"
          printf '%s  %s\n' b7af85e41cc99489dcc21d66c6d5f3685138f06d34651e6d34b42ec6d54fe6f6 "$download/shellcheck-v0.11.0.linux.x86_64.tar.gz" | sha256sum -c -
          tar -xzf "$download/shellcheck-v0.11.0.linux.x86_64.tar.gz" -C "$download"
          install -m 755 "$download/shellcheck-v0.11.0/shellcheck" "$bins/shellcheck"
          gh release download v2.38.2 --repo direnv/direnv --pattern direnv.linux-amd64 --dir "$download"
          printf '%s  %s\n' 148820a187930d36ca6a204504e5cdb30d8396cd1a97e64c3b3f10d793c11247 "$download/direnv.linux-amd64" | sha256sum -c -
          install -m 755 "$download/direnv.linux-amd64" "$bins/direnv"
          gh release download v2.2.2 --repo evilmartians/lefthook --pattern lefthook_2.2.2_Linux_x86_64 --dir "$download"
          printf '%s  %s\n' 4fbf89eb7748c6aed84d833ee1a29edac48fae614468ca9a82896ec32f2800b6 "$download/lefthook_2.2.2_Linux_x86_64" | sha256sum -c -
          install -m 755 "$download/lefthook_2.2.2_Linux_x86_64" "$bins/lefthook"
          "$bins/shellcheck" --version
          "$bins/shfmt" --version
          printf '%s  %s\n' 84ad04d16533b38f489a8b06e87b5a7ee9ead2f7130c4b9f9d9df3ea4e5156dc support/.publication/reporter-prepare.sh | sha256sum -c -
          bash -n support/.publication/reporter-prepare.sh
          "$bins/shellcheck" support/.publication/reporter-prepare.sh
          "$bins/shfmt" -d support/.publication/reporter-prepare.sh
          python3 - support/.github/workflows/ci.yml "$RUNNER_TEMP/reporter-proof" <<'PYWORKFLOW'
          import pathlib
          import sys
          lines = pathlib.Path(sys.argv[1]).read_text(encoding="utf-8").splitlines()
          scripts = []
          index = 0
          while index < len(lines):
              line = lines[index]
              if not line.startswith("        run: "):
                  index += 1
                  continue
              value = line.removeprefix("        run: ")
              index += 1
              if value == "|":
                  body = []
                  while index < len(lines) and (lines[index].startswith("          ") or not lines[index]):
                      body.append(lines[index][10:])
                      index += 1
                  value = "\n".join(body)
              scripts.append(value + "\n")
          if len(scripts) != 4:
              raise SystemExit("unexpected workflow shell step count")
          for number, script in enumerate(scripts):
              pathlib.Path(sys.argv[2], f"workflow-step-{number}.sh").write_text(script, encoding="utf-8")
          PYWORKFLOW
          for script in "$RUNNER_TEMP/reporter-proof"/workflow-step-*.sh; do
            bash -n "$script"
            "$bins/shellcheck" --shell=bash "$script"
            "$bins/shfmt" -i 2 -d "$script"
          done
          sha256sum support/.publication/reporter-prepare.sh support/.github/workflows/ci.yml >"$RUNNER_TEMP/reporter-proof/worker.sha256"
          echo "$bins" >>"$GITHUB_PATH"
      - name: Prepare and verify candidate
        shell: bash
        run: bash support/.publication/reporter-prepare.sh
      - name: Bound evidence export
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$RUNNER_TEMP/reporter-proof" "$RUNNER_TEMP/reporter-export" <<'PYEXPORT'
          import json
          import os
          import pathlib
          import stat
          import sys

          source, dest = map(pathlib.Path, sys.argv[1:])
          dest.mkdir(mode=0o700)
          limits = {
              "candidate.bundle": 2 * 1024 * 1024,
              "formatted.patch": 1024 * 1024,
              "lock.patch": 1024 * 1024,
          }
          names = (
              "preparation-identity.txt", "worktrees.txt", "initial-branch.txt", "lock-state.txt",
              "lock.sha256", "uv.sha256", "worker.sha256", "head", "tree", "formatted-tree",
              "formatted.patch", "lock.patch", "candidate.bundle", "evidence.sha256",
              "resolve-update.status", "resolve-error.status", "buildifier-fix.status",
              "buildifier-check.status",
          )
          descriptors = []
          try:
              total = 0
              for name in names:
                  try:
                      fd = os.open(source / name, os.O_RDONLY | os.O_NOFOLLOW | os.O_NONBLOCK)
                  except FileNotFoundError:
                      continue
                  info = os.fstat(fd)
                  descriptors.append((name, fd, info))
                  if not stat.S_ISREG(info.st_mode) or info.st_size > limits.get(name, 65536):
                      raise ValueError("invalid evidence")
                  total += info.st_size
                  if total > 4 * 1024 * 1024:
                      raise ValueError("aggregate evidence too large")
              for name, fd, before in descriptors:
                  current = os.fstat(fd)
                  if (before.st_dev, before.st_ino, before.st_size, before.st_mtime_ns) != (current.st_dev, current.st_ino, current.st_size, current.st_mtime_ns):
                      raise ValueError("evidence changed")
                  with (dest / name).open("xb") as output:
                      remaining = before.st_size
                      while remaining:
                          chunk = os.read(fd, min(65536, remaining))
                          if not chunk:
                              raise ValueError("evidence shortened")
                          output.write(chunk)
                          remaining -= len(chunk)
                  after = os.fstat(fd)
                  if (before.st_dev, before.st_ino, before.st_size, before.st_mtime_ns) != (after.st_dev, after.st_ino, after.st_size, after.st_mtime_ns):
                      raise ValueError("evidence changed")
              (dest / "export-status.json").write_text(json.dumps({"ok": True}) + "\n")
          except (OSError, ValueError):
              for path in dest.iterdir():
                  path.unlink()
              (dest / "export-status.json").write_text(json.dumps({"ok": False}) + "\n")
              raise SystemExit("evidence export rejected")
          finally:
              for _, fd, _ in descriptors:
                  os.close(fd)
          PYEXPORT
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reporter-proof
          path: ${{ runner.temp }}/reporter-export/
          if-no-files-found: error
          retention-days: 7
