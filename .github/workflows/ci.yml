# Temporary execution support only. Never merge into main or the product PR.
name: Verification assertion validity publication
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verification-assertion-validity-publication-${{ github.sha }}
  cancel-in-progress: false
jobs:
  candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      CARGO_BUILD_JOBS: 1
      JDK_JAVA_OPTIONS: '-Xmx512m'
      JAVA_TOOL_OPTIONS: '-Xmx512m -Dorg.gradle.deprecation.trace=true'
      GRADLE_OPTS: >-
        -Dorg.gradle.jvmargs="-Xmx1536m -XX:MaxMetaspaceSize=768m -XX:+UseSerialGC"
        -Dorg.gradle.workers.max=1 -Dorg.gradle.parallel=false -Dorg.gradle.daemon=false
      NODE_OPTIONS: '--max-old-space-size=768'
      SKIP_PREPARE_SERVER: 'true'
    steps:
      - name: Checkout temporary support ref
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: support
          persist-credentials: false
      - name: Validate support receipt
        id: receipt
        shell: bash
        run: |
          set -euo pipefail
          receipt="$GITHUB_WORKSPACE/support/.publication/receipt.json"
          base=$(jq -er '.base' "$receipt")
          tree=$(jq -er '.tree' "$receipt")
          digest=$(jq -er '.patchSha256' "$receipt")
          compressed=$(jq -er '.payloadSha256' "$receipt")
          [[ "$base" =~ ^[0-9a-f]{40}$ && "$tree" =~ ^[0-9a-f]{40}$ && "$digest" =~ ^[0-9a-f]{64}$ && "$compressed" =~ ^[0-9a-f]{64}$ ]]
          printf '%s  %s\n' "$compressed" "$GITHUB_WORKSPACE/support/.publication/payload.patch.gz" | sha256sum -c -
          [[ "$(stat -c %s "$GITHUB_WORKSPACE/support/.publication/payload.patch.gz")" == "$(jq -er '.payloadBytes' "$receipt")" ]]
          [[ "$(jq -er '.payloadBytes' "$receipt")" -le 65536 ]]
          [[ "$(jq -er '.patchBytes' "$receipt")" -le 131072 ]]
          python3 - "$GITHUB_WORKSPACE/support/.publication/payload.patch.gz" "$RUNNER_TEMP/gvy-reviewed.patch" <<'PYBOUND'
          import gzip, pathlib, sys
          with gzip.open(sys.argv[1], 'rb') as stream:
              data = stream.read(131073)
          if len(data) > 131072:
              raise SystemExit('patch exceeds 128 KiB')
          pathlib.Path(sys.argv[2]).write_bytes(data)
          PYBOUND
          [[ "$(stat -c %s "$RUNNER_TEMP/gvy-reviewed.patch")" == "$(jq -er '.patchBytes' "$receipt")" ]]
          printf '%s  %s\n' "$digest" "$RUNNER_TEMP/gvy-reviewed.patch" | sha256sum -c -
          printf 'base=%s\ntree=%s\npatch=%s\n' "$base" "$tree" "$digest" >> "$GITHUB_OUTPUT"
      - name: Checkout exact approved base
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.receipt.outputs.base }}
          path: candidate
          fetch-depth: 1
          persist-credentials: false
      - name: Apply reviewed patch and prove tree
        working-directory: candidate
        shell: bash
        env:
          EXPECTED_BASE: ${{ steps.receipt.outputs.base }}
          EXPECTED_TREE: ${{ steps.receipt.outputs.tree }}
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "$EXPECTED_BASE" ]]
          git switch -c fix/assertion-validity-publication
          git apply --check --index "$RUNNER_TEMP/gvy-reviewed.patch"
          git apply --index "$RUNNER_TEMP/gvy-reviewed.patch"
          [[ "$(git write-tree)" == "$EXPECTED_TREE" ]]
          git diff --quiet
          git diff --cached --check
          expected_paths=(
            tests/e2e/kotlin/com/github/albertocavalcante/gvy/gls/e2e/ScenarioCheckValidation.kt
            tests/e2e/kotlin/com/github/albertocavalcante/gvy/gls/e2e/ScenarioContext.kt
            tests/e2e/kotlin/com/github/albertocavalcante/gvy/gls/e2e/ScenarioExecutor.kt
            tests/e2e/kotlin/com/github/albertocavalcante/gvy/gls/e2e/ScenarioValidationTest.kt
            tests/e2e/kotlin/com/github/albertocavalcante/gvy/gls/e2e/StepExecutors.kt
            tests/e2e/kotlin/com/github/albertocavalcante/gvy/gls/e2e/StepExecutorsTest.kt
          )
          printf '%s\0' "${expected_paths[@]}" > "$RUNNER_TEMP/expected-paths.nul"
          git diff --cached --name-only --diff-filter=ACMRT -z > "$RUNNER_TEMP/actual-paths.nul"
          cmp "$RUNNER_TEMP/expected-paths.nul" "$RUNNER_TEMP/actual-paths.nul"
          test -z "$(git ls-files --others --exclude-standard)"
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
      - name: Set up JDK
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24'
      - name: Set up pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 12.14.0
      - name: Install locked project tools
        working-directory: candidate
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --require-hashes --only-binary=:all: -r .reuse/bootstrap-requirements.txt
          uv sync --project .reuse --locked
          echo "$PWD/.reuse/.venv/bin" >> "$GITHUB_PATH"
          pnpm --dir editors/code install --frozen-lockfile
          rustup toolchain install --no-self-update --profile minimal 1.96.1
          rustup component add --toolchain 1.96.1 clippy rustfmt
          rustup target add --toolchain 1.96.1 wasm32-wasip2
      - name: Fetch checksum-pinned hook tools
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          bins="$RUNNER_TEMP/spdx-hook-bin"
          download="$RUNNER_TEMP/spdx-hook-download"
          mkdir -p "$bins" "$download"
          fetch() {
            local repo="$1" version="$2" asset="$3" digest="$4"
            gh release download "$version" --repo "$repo" --pattern "$asset" --dir "$download"
            printf '%s  %s\n' "$digest" "$download/$asset" | sha256sum -c -
          }
          fetch direnv/direnv v2.38.2 direnv.linux-amd64 148820a187930d36ca6a204504e5cdb30d8396cd1a97e64c3b3f10d793c11247
          install -m 755 "$download/direnv.linux-amd64" "$bins/direnv"
          fetch evilmartians/lefthook v2.2.2 lefthook_2.2.2_Linux_x86_64 4fbf89eb7748c6aed84d833ee1a29edac48fae614468ca9a82896ec32f2800b6
          install -m 755 "$download/lefthook_2.2.2_Linux_x86_64" "$bins/lefthook"
          fetch dprint/dprint 0.64.3 dprint-x86_64-unknown-linux-gnu.zip f71cb7e22d6776439eba168d5cb296092d6413fea7148fe4d70684a2702a4fee
          unzip -q "$download/dprint-x86_64-unknown-linux-gnu.zip" -d "$download/dprint"
          install -m 755 "$download/dprint/dprint" "$bins/dprint"
          fetch mikefarah/yq v4.52.4 yq_linux_amd64 0c4d965ea944b64b8fddaf7f27779ee3034e5693263786506ccd1c120f184e8c
          install -m 755 "$download/yq_linux_amd64" "$bins/yq"
          fetch koalaman/shellcheck v0.11.0 shellcheck-v0.11.0.linux.x86_64.tar.xz 8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198
          tar -xJf "$download/shellcheck-v0.11.0.linux.x86_64.tar.xz" -C "$download"
          install -m 755 "$download/shellcheck-v0.11.0/shellcheck" "$bins/shellcheck"
          fetch mvdan/sh v3.12.0 shfmt_v3.12.0_linux_amd64 d9fbb2a9c33d13f47e7618cf362a914d029d02a6df124064fff04fd688a745ea
          install -m 755 "$download/shfmt_v3.12.0_linux_amd64" "$bins/shfmt"
          fetch astral-sh/ruff 0.17.4 ruff-x86_64-unknown-linux-gnu.tar.gz 3ab2b34aeacdbc1ea5c529cdbda3e05792633d587228123fd09f3b5a0facb27a
          mkdir "$download/ruff"; tar -xzf "$download/ruff-x86_64-unknown-linux-gnu.tar.gz" -C "$download/ruff"
          install -m 755 "$download/ruff/ruff-x86_64-unknown-linux-gnu/ruff" "$bins/ruff"
          fetch rhysd/actionlint v1.7.9 actionlint_1.7.9_linux_amd64.tar.gz 233b280d05e100837f4af1433c7b40a5dcb306e3aa68fb4f17f8a7f45a7df7b4
          mkdir "$download/actionlint"; tar -xzf "$download/actionlint_1.7.9_linux_amd64.tar.gz" -C "$download/actionlint"
          install -m 755 "$download/actionlint/actionlint" "$bins/actionlint"
          fetch suzuki-shunsuke/ghalint v1.5.4 ghalint_1.5.4_linux_amd64.tar.gz 977555b7142cc057aad4663679772510a9ed3f1687f26f2359d18bb6b67314fe
          mkdir "$download/ghalint"; tar -xzf "$download/ghalint_1.5.4_linux_amd64.tar.gz" -C "$download/ghalint"
          install -m 755 "$download/ghalint/ghalint" "$bins/ghalint"
          echo "$bins" >> "$GITHUB_PATH"
      - name: Run normal hooks and create candidate commit
        working-directory: candidate
        shell: bash
        env:
          EXPECTED_BASE: ${{ steps.receipt.outputs.base }}
          EXPECTED_TREE: ${{ steps.receipt.outputs.tree }}
          PATCH_SHA: ${{ steps.receipt.outputs.patch }}
        run: |
          set -euo pipefail
          [[ -z "${LEFTHOOK:-}" && -z "${LEFTHOOK_EXCLUDE:-}" && -z "${LEFTHOOK_SKIP:-}" ]]
          [[ -z "$(git config --get core.hooksPath || true)" ]]
          command -v shellcheck; command -v shfmt; command -v dprint; command -v yq; command -v ruff
          lefthook install
          test -x .git/hooks/pre-commit && test -x .git/hooks/commit-msg
          git config user.name 'gvy publication automation'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git diff --quiet
          [[ "$(git write-tree)" == "$EXPECTED_TREE" ]]
          direnv allow
          direnv exec . java -version
          # The wrapper checkout is the reviewed base plus a staged patch; workflow SHA identifies support.
          [[ "$(git -C "$GITHUB_WORKSPACE/support" rev-parse HEAD)" == "$GITHUB_SHA" ]]
          mkdir "$RUNNER_TEMP/gvy-assertion-lint" "$RUNNER_TEMP/gvy-assertion-green"
          GITHUB_SHA="$EXPECTED_BASE" direnv exec . node tools/ci/run-gradle.mjs \
            --report-root "$RUNNER_TEMP/gvy-assertion-lint" --producer assertion-publication-lint \
            lintFix --no-daemon --no-parallel --max-workers=1 \
            '-Dorg.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=768m -XX:+UseSerialGC'
          if ! git diff --quiet; then
            git diff --binary --full-index > "$RUNNER_TEMP/gvy-assertion-formatter.patch"
            git diff --name-only -z > "$RUNNER_TEMP/gvy-assertion-formatter-paths.nul"
            echo 'Formatter changed the reviewed candidate; preserving the diff for review.' >&2
            exit 1
          fi
          [[ "$(git write-tree)" == "$EXPECTED_TREE" ]]
          GITHUB_SHA="$EXPECTED_BASE" direnv exec . node tools/ci/run-gradle.mjs \
            --report-root "$RUNNER_TEMP/gvy-assertion-green" --producer assertion-publication-green \
            :tests:lint :tests:e2eTest --rerun --tests '*.ScenarioValidationTest' --tests '*.StepExecutorsTest' \
            --tests '*.ScenarioContextTest' --tests '*.ScenarioCatalogTest' \
            --no-daemon --no-parallel --no-build-cache --max-workers=1 \
            '-Dorg.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=768m -XX:+UseSerialGC'
          python3 - "$RUNNER_TEMP/gvy-assertion-lint" "$RUNNER_TEMP/gvy-assertion-green" "$EXPECTED_BASE" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" <<'PYPRODUCER'
          import hashlib, json, pathlib, re, sys
          base, run, attempt = sys.argv[3:]
          for root in map(pathlib.Path, sys.argv[1:3]):
              dirs=list(root.iterdir()); assert len(dirs)==1 and dirs[0].is_dir()
              d=dirs[0]; report=json.loads((d/'diagnostics.json').read_text()); ctx=json.loads((d/'context.json').read_text())
              assert report['complete'] and report['ok'] and not report['unexpected'] and not report['errors']
              assert report['commandExitCode']==0 and report['captureExitCode']==0 and report['worktreeDirty'] is True
              assert report['context']==ctx and ctx['headSha']==base and ctx['testedSha']==base
              assert ctx['runId']==run and ctx['runAttempt']==int(attempt) and ctx['command']=='gradle'
              assert re.fullmatch(r'[0-9a-f-]{36}',ctx['invocationId']) and d.name.endswith(ctx['invocationId'])
              raw=(d/'raw.log').read_bytes(); console=(d/'console.log').read_bytes()
              assert raw==console and report['log']=={'bytes':len(raw),'sha256':hashlib.sha256(raw).hexdigest()}
          PYPRODUCER
          for class in ScenarioValidationTest StepExecutorsTest ScenarioContextTest ScenarioCatalogTest; do
            cp "tests/build/test-results/e2eTest/TEST-com.github.albertocavalcante.gvy.gls.e2e.$class.xml" "$RUNNER_TEMP/gvy-assertion-green/$class.xml"
          done
          python3 - "$RUNNER_TEMP/gvy-assertion-green" <<'PYXML'
          import pathlib, sys, xml.etree.ElementTree as ET
          root=pathlib.Path(sys.argv[1]); counts={'ScenarioValidationTest':3,'StepExecutorsTest':36,'ScenarioContextTest':5,'ScenarioCatalogTest':5}
          required={'ScenarioValidationTest':['invalid static JSONPath fails before workspace or server startup','invalid static regex fails before workspace or server startup'],
                    'StepExecutorsTest':['optional wait rejects invalid interpolated checks before waiting','required wait rejects invalid interpolated JSONPath before waiting','dynamic snapshot check does not require a regex pattern']}
          for name, count in counts.items():
              p=root/(name+'.xml'); assert p.stat().st_size <= 1048576
              r=ET.parse(p).getroot(); assert int(r.attrib['tests']) == count
              assert all(int(r.attrib.get(k,'0')) == 0 for k in ('failures','errors','skipped'))
              cases=r.findall('testcase'); assert len(cases) == count
              assert all(not c.findall('failure') and not c.findall('error') and not c.findall('skipped') for c in cases)
              assert all(sum(x in c.attrib['name'] for c in cases)==1 for x in required.get(name,[]))
          PYXML
          git diff --quiet
          [[ "$(git write-tree)" == "$EXPECTED_TREE" ]]
          git diff --cached --name-only --diff-filter=ACMRT -z > "$RUNNER_TEMP/gvy-staged-paths"
          while IFS= read -r -d '' staged_file; do
            [[ -f "$staged_file" ]] || continue
            first_line=''
            IFS= read -r first_line < "$staged_file" || true
            case "$staged_file:$first_line" in
              *.zsh:*) zsh -n "$staged_file" ;;
              *.sh:*|.envrc:*|*:'#!'*bash*|*:'#!'*'/sh'*)
                shellcheck --rcfile tools/lint/shellcheckrc "$staged_file"
                shfmt -i 4 -ci -d "$staged_file"
                bash -n "$staged_file"
                ;;
              *) ;;
            esac
          done < "$RUNNER_TEMP/gvy-staged-paths"
          set +e
          git commit -m 'fix(e2e): validate assertion expressions before execution' 2>&1 | tee "$RUNNER_TEMP/gvy-commit-hooks.log"
          hook_statuses=("${PIPESTATUS[@]}")
          node tools/ci/check-gradle-diagnostics.mjs --log "$RUNNER_TEMP/gvy-commit-hooks.log" \
            --exit-code "${hook_statuses[0]}" --capture-exit-code "${hook_statuses[1]}" --producer assertion-publication-hook \
            --baseline tools/ci/gradle-diagnostics.json --root "$PWD" --report "$RUNNER_TEMP/gvy-assertion-hook-diagnostics"
          hook_checker=$?
          set -e
          [[ ${hook_statuses[0]} == 0 && ${hook_statuses[1]} == 0 && ${hook_checker} == 0 ]]
          python3 - "$RUNNER_TEMP/gvy-assertion-hook-diagnostics/diagnostics.json" <<'PYHOOK'
          import json, pathlib, sys
          d=json.loads(pathlib.Path(sys.argv[1]).read_text()); assert d['complete'] and d['ok'] and not d['unexpected'] and not d['errors']
          assert d['commandExitCode'] == 0 and d['captureExitCode'] == 0
          PYHOOK
          [[ "$(git rev-parse HEAD^)" == "$EXPECTED_BASE" ]]
          [[ "$(git rev-parse 'HEAD^{tree}')" == "$EXPECTED_TREE" ]]
          git diff --quiet && git diff --cached --quiet
          test -z "$(git status --porcelain --untracked-files=all)"
          mkdir "$RUNNER_TEMP/gvy-publication-proof"
          git bundle create "$RUNNER_TEMP/gvy-publication-proof/candidate.bundle" HEAD "^$EXPECTED_BASE"
          git bundle verify "$RUNNER_TEMP/gvy-publication-proof/candidate.bundle"
          cp "$RUNNER_TEMP/gvy-commit-hooks.log" "$RUNNER_TEMP/gvy-publication-proof/"
          cp -R "$RUNNER_TEMP/gvy-assertion-lint" "$RUNNER_TEMP/gvy-publication-proof/lint"
          cp -R "$RUNNER_TEMP/gvy-assertion-green" "$RUNNER_TEMP/gvy-publication-proof/green"
          cp -R "$RUNNER_TEMP/gvy-assertion-hook-diagnostics" "$RUNNER_TEMP/gvy-publication-proof/hook-diagnostics"
          cp "$RUNNER_TEMP/gvy-staged-paths" "$RUNNER_TEMP/gvy-publication-proof/staged-paths.nul"
          jq -n --arg base "$EXPECTED_BASE" --arg tree "$EXPECTED_TREE" --arg patch "$PATCH_SHA" \
            --arg head "$(git rev-parse HEAD)" --arg support "$GITHUB_SHA" \
            '{base:$base,tree:$tree,patchSha256:$patch,head:$head,supportHead:$support}' \
            > "$RUNNER_TEMP/gvy-publication-proof/receipt.json"
          (cd "$RUNNER_TEMP/gvy-publication-proof" && sha256sum candidate.bundle > bundle.sha256)
      - name: Upload candidate and evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gvy-assertion-evidence-publication-proof
          path: ${{ runner.temp }}/gvy-publication-proof/
          if-no-files-found: error
          retention-days: 7
      - name: Upload failed validation evidence
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gvy-assertion-evidence-publication-failed
          path: |
            ${{ runner.temp }}/gvy-assertion-formatter.patch
            ${{ runner.temp }}/gvy-assertion-formatter-paths.nul
            ${{ runner.temp }}/gvy-assertion-lint/
            ${{ runner.temp }}/gvy-assertion-green/
            ${{ runner.temp }}/gvy-assertion-hook-diagnostics/
            ${{ runner.temp }}/gvy-commit-hooks.log
            candidate/tests/build/test-results/e2eTest/*.xml
          if-no-files-found: warn
          retention-days: 7
