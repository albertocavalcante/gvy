# Temporary execution support only. Never merge into main or the product PR.
name: Pinned pnpm inspection and lock preparation
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: e2e-pnpm-inspection-${{ github.sha }}
  cancel-in-progress: false
jobs:
  candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      CARGO_BUILD_JOBS: 1
      JDK_JAVA_OPTIONS: '-Xmx512m'
      JAVA_TOOL_OPTIONS: '-Xmx512m -Dorg.gradle.deprecation.trace=true'
      GRADLE_OPTS: >-
        -Dorg.gradle.jvmargs="-Xmx1536m -XX:MaxMetaspaceSize=768m -XX:+UseSerialGC"
        -Dorg.gradle.workers.max=1 -Dorg.gradle.parallel=false -Dorg.gradle.daemon=false
      NODE_OPTIONS: '--max-old-space-size=768'
      SKIP_PREPARE_SERVER: 'true'
    steps:
      - name: Checkout temporary support ref
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: support
          persist-credentials: false
      - name: Validate support receipt
        id: receipt
        shell: bash
        run: |
          set -euo pipefail
          receipt="${GITHUB_WORKSPACE:?}/support/.publication/receipt.json"
          base=$(jq -er '.base' "${receipt}")
          tree=$(jq -er '.tree' "${receipt}")
          digest=$(jq -er '.patchSha256' "${receipt}")
          compressed=$(jq -er '.payloadSha256' "${receipt}")
          [[ "${base}" =~ ^[0-9a-f]{40}$ && "${tree}" =~ ^[0-9a-f]{40}$ && "${digest}" =~ ^[0-9a-f]{64}$ && "${compressed}" =~ ^[0-9a-f]{64}$ ]]
          printf '%s  %s\n' "${compressed}" "${GITHUB_WORKSPACE:?}/support/.publication/payload.patch.gz" | sha256sum -c -
          payload_bytes=$(stat -c %s "${GITHUB_WORKSPACE:?}/support/.publication/payload.patch.gz")
          expected_payload_bytes=$(jq -er '.payloadBytes' "${receipt}")
          expected_patch_bytes=$(jq -er '.patchBytes' "${receipt}")
          [[ "${payload_bytes}" == "${expected_payload_bytes}" ]]
          [[ "${expected_payload_bytes}" -le 65536 ]]
          [[ "${expected_patch_bytes}" -le 131072 ]]
          python3 - "${GITHUB_WORKSPACE:?}/support/.publication/payload.patch.gz" "${RUNNER_TEMP:?}/gvy-reviewed.patch" <<'PYBOUND'
          import gzip, pathlib, sys
          with gzip.open(sys.argv[1], 'rb') as stream:
              data = stream.read(131073)
          if len(data) > 131072:
              raise SystemExit('patch exceeds 128 KiB')
          pathlib.Path(sys.argv[2]).write_bytes(data)
          PYBOUND
          patch_bytes=$(stat -c %s "${RUNNER_TEMP:?}/gvy-reviewed.patch")
          [[ "${patch_bytes}" == "${expected_patch_bytes}" ]]
          printf '%s  %s\n' "${digest}" "${RUNNER_TEMP:?}/gvy-reviewed.patch" | sha256sum -c -
          printf 'base=%s\ntree=%s\npatch=%s\n' "${base}" "${tree}" "${digest}" >>"${GITHUB_OUTPUT:?}"
      - name: Checkout exact pinned base
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.receipt.outputs.base }}
          path: candidate
          fetch-depth: 1
          persist-credentials: false
      - name: Apply pinned candidate patch and prove tree
        working-directory: candidate
        shell: bash
        env:
          EXPECTED_BASE: ${{ steps.receipt.outputs.base }}
          EXPECTED_TREE: ${{ steps.receipt.outputs.tree }}
        run: |
          set -euo pipefail
          base=$(git rev-parse HEAD)
          [[ "${base}" == "${EXPECTED_BASE:?}" ]]
          git switch -c ci/e2e-pnpm-inspection-preparation
          git apply --check --index "${RUNNER_TEMP:?}/gvy-reviewed.patch"
          git apply --index "${RUNNER_TEMP:?}/gvy-reviewed.patch"
          index_tree=$(git write-tree)
          [[ "${index_tree}" == "${EXPECTED_TREE:?}" ]]
          git diff --exit-code
          git diff --cached --check
          cp "${GITHUB_WORKSPACE:?}/support/.publication/paths.nul" "${RUNNER_TEMP:?}/expected-paths.nul"
          paths_sha=$(sha256sum "${RUNNER_TEMP:?}/expected-paths.nul" | cut -d' ' -f1)
          expected_paths_sha=$(jq -er '.pathsSha256' "${GITHUB_WORKSPACE:?}/support/.publication/receipt.json")
          [[ "${paths_sha}" == "${expected_paths_sha}" ]]
          git diff --cached --name-only --diff-filter=ACMRT -z >"${RUNNER_TEMP:?}/actual-paths.nul"
          cmp "${RUNNER_TEMP:?}/expected-paths.nul" "${RUNNER_TEMP:?}/actual-paths.nul"
          untracked=$(git ls-files --others --exclude-standard)
          test -z "${untracked}"
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
      - name: Set up JDK
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24'
      - name: Install locked licensing tools
        working-directory: candidate
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --require-hashes --only-binary=:all: -r .reuse/bootstrap-requirements.txt
          uv sync --project .reuse --locked
          echo "${PWD}/.reuse/.venv/bin" >>"${GITHUB_PATH:?}"
      - name: Fetch checksum-pinned hooks and environment tools
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          bins="${RUNNER_TEMP:?}/pnpm-inspection-hook-bin"
          download="${RUNNER_TEMP:?}/pnpm-inspection-hook-download"
          mkdir -p "${bins}" "${download}"
          gh release download v2.38.2 --repo direnv/direnv --pattern direnv.linux-amd64 --dir "${download}"
          printf '%s  %s\n' '148820a187930d36ca6a204504e5cdb30d8396cd1a97e64c3b3f10d793c11247' \
              "${download}/direnv.linux-amd64" | sha256sum -c -
          install -m 755 "${download}/direnv.linux-amd64" "${bins}/direnv"
          gh release download v2.2.2 --repo evilmartians/lefthook --pattern lefthook_2.2.2_Linux_x86_64 --dir "${download}"
          printf '%s  %s\n' '4fbf89eb7748c6aed84d833ee1a29edac48fae614468ca9a82896ec32f2800b6' \
              "${download}/lefthook_2.2.2_Linux_x86_64" | sha256sum -c -
          install -m 755 "${download}/lefthook_2.2.2_Linux_x86_64" "${bins}/lefthook"
          echo "${bins}" >>"${GITHUB_PATH:?}"
      - name: Set up pinned Bazelisk
        uses: bazel-contrib/setup-bazel@f34d6a05eae3c24acab7fa54587492daeaeffdab # 0.19.2
        with:
          bazelisk-cache: true
          disk-cache: false
          repository-cache: true
      - name: Verify actual EXIT trap outcome contract
        working-directory: candidate
        shell: bash
        run: |
          set -euo pipefail
          worker="${GITHUB_WORKSPACE:?}/support/.publication/inspect-and-package.sh"
          controls="${GITHUB_WORKSPACE:?}/support/.publication/check-exit-contract.sh"
          previous="${GITHUB_WORKSPACE:?}/support/.publication/reviewed-r2-worker.sh"
          printf '%s  %s\n' '301290c6e238305347f6684087393a498ebec9becc8afdfdd58637ebe8e300e2' "${worker}" | sha256sum -c -
          printf '%s  %s\n' '78eb53d1d948d718f0cb9a3033e79a87539774a90ea01ca337780902f089aeeb' "${controls}" | sha256sum -c -
          printf '%s  %s\n' '6ee0f5b53bc91593d3fb5475b39d7736d2d23cdd190e095c40d8b8d50b7bd9d2' "${previous}" | sha256sum -c -
          bash "${controls}" "${worker}" "${previous}" "${RUNNER_TEMP:?}/gvy-pnpm-exit-contract"
      - name: Inspect pinned pnpm and package actual source
        working-directory: candidate
        shell: bash
        env:
          EXPECTED_BASE: ${{ steps.receipt.outputs.base }}
          EXPECTED_TREE: ${{ steps.receipt.outputs.tree }}
          PATCH_SHA: ${{ steps.receipt.outputs.patch }}
        run: |
          set -euo pipefail
          preparation="${GITHUB_WORKSPACE:?}/support/.publication/inspect-and-package.sh"
          printf '%s  %s\n' '301290c6e238305347f6684087393a498ebec9becc8afdfdd58637ebe8e300e2' "${preparation}" | sha256sum -c -
          direnv allow
          direnv exec . java -version
          GITHUB_SHA="${EXPECTED_BASE:?}" direnv exec . bash "${preparation}" "${RUNNER_TEMP:?}/gvy-pnpm-inspection-proof"
      - name: Upload preparation evidence including failures
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gvy-xfail-format-resolve-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/gvy-pnpm-inspection-proof/
            ${{ runner.temp }}/gvy-pnpm-exit-contract/
            ${{ runner.temp }}/gvy-pnpm-gradle-evidence/
            ${{ runner.temp }}/gvy-pnpm-bazel-evidence/
            ${{ runner.temp }}/gvy-pnpm-bazel-private/
            support/.publication/receipt.json
          if-no-files-found: error
          retention-days: 7
