name: Focused Bazel logging parity witness
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: bazel-logging-parity-witness-${{ github.sha }}
  cancel-in-progress: false
jobs:
  witness:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 1cd527e018f1cf397acb25f01a98dfa0a6662c5b
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: bazel-contrib/setup-bazel@f34d6a05eae3c24acab7fa54587492daeaeffdab # 0.19.2
        with:
          bazelisk-cache: true
          disk-cache: bazel-logging-parity-witness
          repository-cache: true
      - name: Run isolated witness
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == 1cd527e018f1cf397acb25f01a98dfa0a6662c5b ]]
          [[ "$(git rev-parse 'HEAD^{tree}')" == 71d313b3e182b2bc7de166a8308f33b2a03e2ea5 ]]
          private="$RUNNER_TEMP/parity-private"
          public="$RUNNER_TEMP/parity-receipt"
          mkdir -m 700 "$private" "$public"
          cat >"$private/wrapper" <<'SH'
          #!/usr/bin/env bash
          set -euo pipefail
          : "${TEST_UNDECLARED_OUTPUTS_DIR:?}"
          exec "$@" '--include-classname=^.*\.LoggingProviderTest$' "--reports-dir=$TEST_UNDECLARED_OUTPUTS_DIR/junit"
          SH
          chmod 700 "$private/wrapper"
          bazel --version >"$private/bazel-version" 2>&1
          echo 'BAZELISK_GITHUB_TOKEN=' >>"$GITHUB_ENV"
          if ! bazel --host_jvm_args=-Xmx1024m test --jobs=1 --local_test_jobs=1 --nocache_test_results --zip_undeclared_test_outputs --test_output=errors --test_env=JDK_JAVA_OPTIONS=-Xmx512m --run_under="$private/wrapper" //build-tool:build-tool_test //jenkins:jenkins_test >"$private/bazel.log" 2>&1; then
          	echo "Focused Bazel witness failed; private output withheld." >&2
          	exit 1
          fi
          if ! python3 - "$public/receipt.json" >"$private/receipt-build.log" 2>&1 <<'PY'
          import hashlib
          import json
          import os
          import pathlib
          import sys
          import xml.etree.ElementTree as ET
          import zipfile

          modules = {
              "build-tool": ("build-tool_test", "com.github.albertocavalcante.gvy.build.LoggingProviderTest"),
              "jenkins": ("jenkins_test", "com.github.albertocavalcante.gvy.jenkins.LoggingProviderTest"),
          }
          expected = {
              "test logging uses the Logback provider()",
              "quiet test policy retains warnings and errors and allows a restored debug override()",
          }
          result = []
          for module, (target, classname) in modules.items():
              path = pathlib.Path("bazel-testlogs") / module / target / "test.outputs/outputs.zip"
              if not path.is_file() or path.stat().st_size > 4 * 1024 * 1024:
                  raise SystemExit("missing or oversized private report archive")
              with zipfile.ZipFile(path) as archive:
                  selected = [x for x in archive.infolist() if x.filename == "junit/TEST-junit-jupiter.xml"]
                  if len(selected) != 1 or selected[0].file_size > 1024 * 1024:
                      raise SystemExit("missing or oversized private JUnit report")
                  raw = archive.read(selected[0])
              root = ET.fromstring(raw)
              cases = root.findall(".//testcase")
              if len(cases) != 2 or {x.get("name") for x in cases} != expected:
                  raise SystemExit("unexpected test case inventory")
              if any(x.get("classname") != classname or list(x.findall("failure")) or list(x.findall("error")) or list(x.findall("skipped")) for x in cases):
                  raise SystemExit("unexpected test class or outcome")
              result.append({"module": module, "class": classname, "cases": sorted(expected), "passed": 2, "errors": 0, "failures": 0, "skipped": 0, "xmlSha256": hashlib.sha256(raw).hexdigest()})
          receipt = {"schemaVersion": 1, "sourceHead": "f04406dac415a5b7cc1698ca8feb0d0de3e9e956", "testedHead": "1cd527e018f1cf397acb25f01a98dfa0a6662c5b", "testedTree": "71d313b3e182b2bc7de166a8308f33b2a03e2ea5", "runId": os.environ["GITHUB_RUN_ID"], "attempt": os.environ["GITHUB_RUN_ATTEMPT"], "invocation": "bazel focused parity tests, no test-result cache", "results": result}
          pathlib.Path(sys.argv[1]).write_text(json.dumps(receipt, sort_keys=True) + "\n")
          PY
          then
          	echo "Private report validation failed; details withheld." >&2
          	exit 1
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bazel-logging-parity-receipt
          path: ${{ runner.temp }}/parity-receipt/receipt.json
          if-no-files-found: error
          retention-days: 7
