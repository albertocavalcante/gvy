# Temporary proof worker; do not merge. Requires independent review before publishing or dispatch.
name: Receipt packaged-child proof DRAFT
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: receipt-jvm-intermediate-${{ github.sha }}
  cancel-in-progress: false
jobs:
  proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
    env:
      JDK_JAVA_OPTIONS: '-Xmx512m'
      JAVA_TOOL_OPTIONS: '-Xmx512m -Dorg.gradle.deprecation.trace=true'
      GRADLE_OPTS: >-
        -Dorg.gradle.jvmargs="-Xmx1536m -XX:MaxMetaspaceSize=768m -XX:+UseSerialGC"
        -Dorg.gradle.workers.max=1 -Dorg.gradle.parallel=false -Dorg.gradle.daemon=false
      SKIP_PREPARE_SERVER: 'true'
    steps:
      - name: Checkout reviewed support payload
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: support
          persist-credentials: false
      - name: Checkout pinned main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: b7e6657a923f2fb24c73b1ae1cb48b3088540bac
          path: candidate
          persist-credentials: false
      - name: Verify payload and exact candidate tree
        shell: bash
        working-directory: candidate
        run: |
          set -euo pipefail
          : "${GITHUB_WORKSPACE:?}"
          : "${RUNNER_TEMP:?}"
          payload="${GITHUB_WORKSPACE}/support/.publication/candidate.patch.gz"
          proof_cmd_8_1=$(stat -c %s "${payload}")
          [[ "${proof_cmd_8_1}" == 108402 ]]
          printf '%s  %s\n' b08814c3ee5568fadcc166534de7135c1c4a3eab37553b41abf74e56a77e4252 "${payload}" | sha256sum -c -
          python3 - "${payload}" "${RUNNER_TEMP}/candidate.patch" <<'PY'
          import gzip, pathlib, sys
          with gzip.open(sys.argv[1], 'rb') as source:
              data = source.read(555466)
          assert len(data) == 555465
          pathlib.Path(sys.argv[2]).write_bytes(data)
          PY
          printf '%s  %s\n' 59e6bf26c7d13b53e24a86facc13aecb3a5725a187e857a43aa4b2572c35bfc3 "${RUNNER_TEMP}/candidate.patch" | sha256sum -c -
          git apply --check --index "${RUNNER_TEMP}/candidate.patch"
          git apply --index "${RUNNER_TEMP}/candidate.patch"
          proof_cmd_20_2=$(git write-tree)
          [[ "${proof_cmd_20_2}" == 3016dd0fa8b6459e5c27420b95df7c39bab349bf ]]
          git diff --quiet
          git diff --cached --check
      - name: Set up JDK
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24'
      - name: Prepare producer-context verifier
        working-directory: candidate
        shell: bash
        run: |
          set -euo pipefail
          : "${GITHUB_WORKSPACE:?}"
          : "${RUNNER_TEMP:?}"
          : "${GITHUB_SHA:?}"
          mkdir -p "${RUNNER_TEMP}/receipt-proof"
          proof_cmd_9_1=$(git -C "${GITHUB_WORKSPACE}/support" rev-parse HEAD)
          [[ "${proof_cmd_9_1}" == "${GITHUB_SHA}" ]]
          printf '%s\n' "${GITHUB_SHA}" >"${RUNNER_TEMP}/receipt-proof/support-sha.txt"
          verifier="${GITHUB_WORKSPACE}/support/.publication/hosted-child-verify-producer.mjs"
          printf '%s  %s\n' ee9fb9c3c9ac62a1361d9f82b9d65c3f13679733f27f86d0c7dc03414a37e87b "${verifier}" | sha256sum -c -
          cp "${verifier}" "${RUNNER_TEMP}/receipt-proof/verify-producer.mjs"
      - name: Set up proof hook tools and clean synthetic commit
        working-directory: candidate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          : "${RUNNER_TEMP:?}"
          : "${GITHUB_ENV:?}"
          : "${GITHUB_PATH:?}"
          mkdir -p "${RUNNER_TEMP}/receipt-proof"
          python3 -m pip install --require-hashes --only-binary=:all: -r .reuse/bootstrap-requirements.txt
          uv sync --project .reuse --locked
          PATH="${PWD}/.reuse/.venv/bin:${PATH}"
          bins="${RUNNER_TEMP}/receipt-hook-bin"
          download="${RUNNER_TEMP}/receipt-hook-download"
          mkdir -p "${bins}" "${download}"
          fetch() {
            local repo="$1" version="$2" asset="$3" digest="$4"
            gh release download "${version}" --repo "${repo}" --pattern "${asset}" --dir "${download}"
            printf '%s  %s\n' "${digest}" "${download}/${asset}" | sha256sum -c -
          }
          fetch evilmartians/lefthook v2.2.2 lefthook_2.2.2_Linux_x86_64 4fbf89eb7748c6aed84d833ee1a29edac48fae614468ca9a82896ec32f2800b6
          install -m 755 "${download}/lefthook_2.2.2_Linux_x86_64" "${bins}/lefthook"
          fetch dprint/dprint 0.64.3 dprint-x86_64-unknown-linux-gnu.zip f71cb7e22d6776439eba168d5cb296092d6413fea7148fe4d70684a2702a4fee
          unzip -q "${download}/dprint-x86_64-unknown-linux-gnu.zip" -d "${download}/dprint"
          install -m 755 "${download}/dprint/dprint" "${bins}/dprint"
          fetch mikefarah/yq v4.52.4 yq_linux_amd64 0c4d965ea944b64b8fddaf7f27779ee3034e5693263786506ccd1c120f184e8c
          install -m 755 "${download}/yq_linux_amd64" "${bins}/yq"
          fetch koalaman/shellcheck v0.11.0 shellcheck-v0.11.0.linux.x86_64.tar.xz 8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198
          tar -xJf "${download}/shellcheck-v0.11.0.linux.x86_64.tar.xz" -C "${download}"
          install -m 755 "${download}/shellcheck-v0.11.0/shellcheck" "${bins}/shellcheck"
          fetch mvdan/sh v3.12.0 shfmt_v3.12.0_linux_amd64 d9fbb2a9c33d13f47e7618cf362a914d029d02a6df124064fff04fd688a745ea
          install -m 755 "${download}/shfmt_v3.12.0_linux_amd64" "${bins}/shfmt"
          PATH="${bins}:${PATH}"
          export PATH
          printf '%s\n' "${bins}" "${PWD}/.reuse/.venv/bin" >>"${GITHUB_PATH}"
          {
            lefthook version
            dprint --version
            yq --version
            shellcheck --version
            shfmt --version
            uv --version
          } >"${RUNNER_TEMP}/receipt-proof/hook-tool-versions.txt"
          set +e
          GITHUB_SHA=b7e6657a923f2fb24c73b1ae1cb48b3088540bac node tools/ci/run-gradle.mjs --report-root "${RUNNER_TEMP}/receipt-proof/gradle" --producer receipt-format lintFix --no-daemon --no-parallel --no-build-cache --max-workers=1 '-Dorg.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=768m -XX:+UseSerialGC'
          format_status=$?
          set -e
          printf '%s\n' "${format_status}" >"${RUNNER_TEMP}/receipt-proof/formatter-exit.txt"
          git diff --binary >"${RUNNER_TEMP}/receipt-proof/formatter.patch"
          sha256sum "${RUNNER_TEMP}/receipt-proof/formatter.patch" >"${RUNNER_TEMP}/receipt-proof/formatter.sha256"
          if ((format_status == 0 || format_status == 1)); then
            TESTED_SHA=b7e6657a923f2fb24c73b1ae1cb48b3088540bac node "${RUNNER_TEMP}/receipt-proof/verify-producer.mjs" receipt-format "${format_status}" >"${RUNNER_TEMP}/receipt-proof/formatter-dir.txt"
          fi
          ((format_status == 0))
          if [[ -s "${RUNNER_TEMP}/receipt-proof/formatter.patch" ]]; then
            echo 'Formatter changed candidate; stop for frozen-delta review.' >&2
            exit 1
          fi
          [[ -z "${LEFTHOOK:-}" && -z "${LEFTHOOK_EXCLUDE:-}" && -z "${LEFTHOOK_SKIP:-}" ]]
          [[ -z "$(git config --get core.hooksPath || true)" ]]
          git diff --cached --name-only >"${RUNNER_TEMP}/receipt-proof/hook-staged-paths.txt"
          node --input-type=module <<'JSINVENTORY'
          import fs from 'node:fs'; import assert from 'node:assert/strict';
          const root = process.env.RUNNER_TEMP + '/receipt-proof/';
          const paths = fs.readFileSync(root + 'hook-staged-paths.txt', 'utf8').trimEnd().split('\n');
          const groups = { kotlin: [], yaml: [], markdown: [], shell: [], python: [], workflows: [] };
          for (const file of paths) {
            if (file.endsWith('.kt')) groups.kotlin.push(file);
            if (/\.ya?ml$/.test(file)) groups.yaml.push(file);
            if (file.endsWith('.md')) groups.markdown.push(file);
            if (file.endsWith('.sh')) groups.shell.push(file);
            if (file.endsWith('.py')) groups.python.push(file);
            if (/^\.github\/workflows\/.*\.ya?ml$/.test(file)) groups.workflows.push(file);
          }
          assert.equal(groups.kotlin.length, 38); assert.equal(groups.yaml.length, 1); assert.equal(groups.markdown.length, 2);
          assert.equal(groups.shell.length + groups.python.length + groups.workflows.length, 0);
          fs.writeFileSync(root + 'hook-glob-inventory.json', JSON.stringify(groups, null, 2) + '\n');
          JSINVENTORY
          git switch -c receipt-proof-synthetic
          lefthook install
          set +e
          git -c user.name='Receipt proof' -c user.email='receipt-proof@example.invalid' commit -m 'test: prepare synthetic receipt proof' 2>&1 | tee "${RUNNER_TEMP}/receipt-proof/commit-hooks.log"
          statuses=("${PIPESTATUS[@]}")
          node tools/ci/check-gradle-diagnostics.mjs --log "${RUNNER_TEMP}/receipt-proof/commit-hooks.log" \
            --exit-code "${statuses[0]}" --capture-exit-code "${statuses[1]}" --producer receipt-commit-hook \
            --baseline tools/ci/gradle-diagnostics.json --root "${PWD}" --report "${RUNNER_TEMP}/receipt-proof/commit-hook-diagnostics"
          hook_checker=$?
          set -e
          printf 'commit_exit=%s capture_exit=%s checker_exit=%s\n' "${statuses[0]}" "${statuses[1]}" "${hook_checker}" >"${RUNNER_TEMP}/receipt-proof/commit-hooks-status.txt"
          printf '%s\n' 'Raw commit hook log: Git and tee exits recorded; no enriched Gradle invocation context.' >"${RUNNER_TEMP}/receipt-proof/commit-hook-qualification.txt"
          ((statuses[0] == 0 && statuses[1] == 0 && hook_checker == 0))
          grep -E '^> Task :.*spotlessCheck([[:space:]]|$)' "${RUNNER_TEMP}/receipt-proof/commit-hooks.log" >/dev/null
          node --input-type=module <<'JSHOOK'
          import assert from 'node:assert/strict'; import path from 'node:path';
          import { readEvidenceText } from './tools/ci/read-evidence.mjs';
          const file = path.join(process.env.RUNNER_TEMP, 'receipt-proof', 'commit-hook-diagnostics', 'diagnostics.json');
          const data = JSON.parse(readEvidenceText(file, 2 * 1024 * 1024));
          assert.equal(data.complete, true); assert.equal(data.ok, true); assert.deepEqual(data.unexpected, []); assert.deepEqual(data.errors, []);
          assert.equal(data.commandExitCode, 0); assert.equal(data.captureExitCode, 0);
          JSHOOK
          proof_cmd_24_2=$(git rev-parse 'HEAD^{tree}')
          [[ "${proof_cmd_24_2}" == 3016dd0fa8b6459e5c27420b95df7c39bab349bf ]]
          proof_cmd_25_3=$(git rev-parse HEAD^)
          [[ "${proof_cmd_25_3}" == b7e6657a923f2fb24c73b1ae1cb48b3088540bac ]]
          proof_cmd_26_4=$(git status --porcelain)
          [[ -z "${proof_cmd_26_4}" ]]
          git rev-parse HEAD >"${RUNNER_TEMP}/receipt-proof/tested-sha.txt"
          proof_cmd_28_5=$(cat "${RUNNER_TEMP}/receipt-proof/tested-sha.txt")
          echo "TESTED_SHA=${proof_cmd_28_5}" >>"${GITHUB_ENV}"
          git show -s --format=fuller HEAD >"${RUNNER_TEMP}/receipt-proof/tested-commit.txt"
      - name: Focused Node controls
        working-directory: candidate
        shell: bash
        run: |
          set -euo pipefail
          : "${RUNNER_TEMP:?}"
          set +e
          node --test --test-reporter=tap tools/perf/*verification*.test.mjs tools/perf/prepared-classpath.test.mjs tools/perf/agent-outcome-envelope.test.mjs tools/perf/runtime-facts*.test.mjs tools/perf/runtime-assessment.test.mjs tools/perf/input-identity.test.mjs tools/perf/private-log.test.mjs 2>&1 | tee "${RUNNER_TEMP}/receipt-proof/node.tap"
          statuses=("${PIPESTATUS[@]}")
          set -e
          printf 'node_exit=%s capture_exit=%s\n' "${statuses[0]}" "${statuses[1]}" >"${RUNNER_TEMP}/receipt-proof/node-status.txt"
          ((statuses[0] == 0 && statuses[1] == 0))
          for line in '# tests 184' '# pass 184' '# fail 0' '# cancelled 0' '# skipped 0' '# todo 0'; do grep -Fx "${line}" "${RUNNER_TEMP}/receipt-proof/node.tap" >/dev/null; done
      - name: Compile and run focused Kotlin controls
        working-directory: candidate
        shell: bash
        run: |
          set -euo pipefail
          : "${RUNNER_TEMP:?}"
          : "${GITHUB_WORKSPACE:?}"
          : "${TESTED_SHA:?}"
          mkdir -p "${RUNNER_TEMP}/receipt-proof"
          set +e
          GITHUB_SHA="${TESTED_SHA}" node tools/ci/run-gradle.mjs --report-root "${RUNNER_TEMP}/receipt-proof/gradle" --producer receipt-kotlin :tests:harnessTest --rerun --tests '*PublicOutcomeVisibilityTest' --tests '*RequestWaitTest' --tests '*XfailOutcomeTest' --tests '*AgentRunEvidenceCollectorTest' --tests '*AgentRunObserverTest' --tests '*AgentOutcomeJsonTest' --tests '*NamedObservationExecutionTest' --tests '*NamedObservationRecorderTest' --tests '*AgentVerificationScenarioTest' --tests '*PackagedLaunchTest' --tests '*PackagedSessionFactoryTest' --tests '*SessionResourcesTest' --no-daemon --no-parallel --no-build-cache --max-workers=1 '-Dorg.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=768m -XX:+UseSerialGC'
          status=$?
          set -e
          printf '%s\n' "${status}" >"${RUNNER_TEMP}/receipt-proof/kotlin-exit.txt"
          # Preserve the first test outputs before any verifier or RED control can stop/overwrite them.
          mkdir -p "${RUNNER_TEMP}/receipt-proof/original-test-results" "${RUNNER_TEMP}/receipt-proof/original-test-reports"
          for task in harnessTest e2eTest; do
            if [[ -d "tests/build/test-results/${task}" ]]; then cp -R "tests/build/test-results/${task}" "${RUNNER_TEMP}/receipt-proof/original-test-results/"; fi
            if [[ -d "tests/build/reports/tests/${task}" ]]; then cp -R "tests/build/reports/tests/${task}" "${RUNNER_TEMP}/receipt-proof/original-test-reports/"; fi
          done
          node "${RUNNER_TEMP}/receipt-proof/verify-producer.mjs" receipt-kotlin 0 >"${RUNNER_TEMP}/receipt-proof/kotlin-dir.txt"
          ((status == 0))
          proof_cmd_21_1=$(cat "${RUNNER_TEMP}/receipt-proof/kotlin-dir.txt")
          grep -Fx '> Task :tests:harnessTest' "${proof_cmd_21_1}/raw.log" >/dev/null
          mkdir -p "${RUNNER_TEMP}/receipt-proof/green-xml"
          case_map="${GITHUB_WORKSPACE}/support/.publication/hosted-child-test-cases.json"
          printf '%s  %s\n' fcec3042e5df91243b1de2b81aca1e813d61da9db7f0d4013719b332c7a8add8 "${case_map}" | sha256sum -c -
          python3 - "${PWD}/tests/build/test-results/harnessTest" "${RUNNER_TEMP}/receipt-proof/green-xml" "${case_map}" <<'PY'
          import json, pathlib, shutil, sys, xml.etree.ElementTree as ET
          root = pathlib.Path(sys.argv[1]); destination = pathlib.Path(sys.argv[2]); expected_cases = json.loads(pathlib.Path(sys.argv[3]).read_text())
          prefix = 'com.github.albertocavalcante.gvy.gls.e2e.'
          expected = {prefix + name for name in ('RequestWaitTest', 'XfailOutcomeTest', 'AgentRunEvidenceCollectorTest', 'AgentRunObserverTest', 'AgentOutcomeJsonTest', 'NamedObservationExecutionTest', 'NamedObservationRecorderTest', 'AgentVerificationScenarioTest', 'PackagedLaunchTest', 'PackagedSessionFactoryTest', 'SessionResourcesTest')}
          expected.add(prefix + 'visibility.PublicOutcomeVisibilityTest')
          assert set(expected_cases) == expected
          files = list(root.glob('TEST-*.xml'))
          assert {path.name for path in files} == {'TEST-' + name + '.xml' for name in expected} and len(files) == 12
          inventory = {}
          for path in files:
              assert path.stat().st_size <= 1048576
              doc = ET.parse(path).getroot(); name = doc.attrib['name']
              assert name in expected and name not in inventory and path.name == 'TEST-' + name + '.xml'
              assert int(doc.attrib['tests']) > 0 and int(doc.attrib['failures']) == 0 and int(doc.attrib['errors']) == 0 and int(doc.attrib['skipped']) == 0
              cases = doc.findall('testcase'); names = [case.attrib['name'] for case in cases]
              assert len(cases) == int(doc.attrib['tests']) and len(names) == len(set(names))
              assert sorted(names) == expected_cases[name]
              assert all(case.attrib['classname'] == name and not case.findall('failure') and not case.findall('error') and not case.findall('skipped') for case in cases)
              shutil.copyfile(path, destination / path.name)
              inventory[name] = {'count': len(cases), 'cases': names}
          controls = {
              prefix + 'RequestWaitTest': ['interrupted get restores interrupt after successful request cancellation', 'socket timeout does not set the interrupt flag'],
              prefix + 'XfailOutcomeTest': ['IO interruption from a failure getter propagates while socket timeout remains incomplete'],
              prefix + 'AgentRunEvidenceCollectorTest': ['wrapped socket timeout is unavailable without setting interrupt'],
              prefix + 'NamedObservationExecutionTest': ['factory digest rejection before session acquisition retains typed evidence', 'factory source rejection retains typed evidence without starting child', 'observer interrupted IO restores flag and preserves rejection and cleanup', 'ordinary socket timeout does not set interrupt flag', 'unsuppressible fatal observer retains rejection and cleanup without changing control category'],
              prefix + 'AgentVerificationScenarioTest': ['authored agent declaration scenario passes preparation without external fixture'],
              prefix + 'NamedObservationRecorderTest': ['interrupted IO is cancelled and socket timeout remains failure'],
              prefix + 'AgentOutcomeJsonTest': ['private cancellation and cleanup omit throwable content'],
              prefix + 'PackagedLaunchTest': ['preparation preserves interruption and restores its flag after cleanup', 'dirty expected source does not retain arbitrary hash content'],
              prefix + 'PackagedSessionFactoryTest': ['packaged launch forwards the isolated Jenkins cache root before the jar', 'private launch sanitizes socket timeout without marking interrupt'],
              prefix + 'SessionResourcesTest': ['interrupted construction still closes acquired resources before restoring cancellation'],
              prefix + 'visibility.PublicOutcomeVisibilityTest': ['public result evidence is accessible to callers'],
          }
          for name, fragments in controls.items():
              for fragment in fragments: assert sum(fragment in case for case in inventory[name]['cases']) == 1
          (destination / 'inventory.json').write_text(json.dumps(inventory, indent=2, sort_keys=True) + '\n')
          PY
      - name: Build tested packaged server
        working-directory: candidate
        shell: bash
        run: |
          set -euo pipefail
          : "${RUNNER_TEMP:?}"
          : "${TESTED_SHA:?}"
          build_java=$(command -v java)
          build_java=$(readlink -f "${build_java}")
          printf '%s\n' "${build_java}" >"${RUNNER_TEMP}/receipt-proof/build-java-path.txt"
          sha256sum "${build_java}" >"${RUNNER_TEMP}/receipt-proof/build-java-sha256.txt"
          set +e
          "${build_java}" -Xmx512m -version >"${RUNNER_TEMP}/receipt-proof/build-java.txt" 2>&1
          build_java_status=$?
          set -e
          printf '%s\n' "${build_java_status}" >"${RUNNER_TEMP}/receipt-proof/build-java-exit.txt"
          ((build_java_status == 0))
          set +e
          GITHUB_SHA="${TESTED_SHA}" node tools/ci/run-gradle.mjs --report-root "${RUNNER_TEMP}/receipt-proof/gradle" --producer receipt-jar :gls:shadowJar --no-daemon --no-parallel --no-build-cache --max-workers=1 '-Dorg.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=768m -XX:+UseSerialGC'
          status=$?
          set -e
          printf '%s\n' "${status}" >"${RUNNER_TEMP}/receipt-proof/jar-exit.txt"
          node "${RUNNER_TEMP}/receipt-proof/verify-producer.mjs" receipt-jar 0 >"${RUNNER_TEMP}/receipt-proof/jar-dir.txt"
          ((status == 0))
          proof_cmd_15_1=$(cat "${RUNNER_TEMP}/receipt-proof/jar-dir.txt")
          grep -Fx '> Task :gls:shadowJar' "${proof_cmd_15_1}/raw.log" >/dev/null
          find "${PWD}/gls/build/libs" -maxdepth 1 -type f -name 'gls-*-all.jar' -print >"${RUNNER_TEMP}/receipt-proof/jar-inventory.txt"
          mapfile -t jars <"${RUNNER_TEMP}/receipt-proof/jar-inventory.txt"
          ((${#jars[@]} == 1))
          printf '%s\n' "${jars[0]}" >"${RUNNER_TEMP}/receipt-proof/jar-path.txt"
          jar_size=$(stat -c %s "${jars[0]}")
          ((jar_size > 0 && jar_size <= 536870912))
          sha256sum "${jars[0]}" >"${RUNNER_TEMP}/receipt-proof/jar-sha256.txt"
          JAR="${jars[0]}" python3 - <<'PYJAR'
          import os, zipfile
          with zipfile.ZipFile(os.environ['JAR']) as z:
              matches = [i for i in z.infolist() if i.filename == 'version.properties']
              assert len(matches) == 1 and matches[0].file_size <= 16384
              with z.open(matches[0]) as stream:
                  data = stream.read(16385)
              assert len(data) <= 16384
              content = data.decode('utf-8')
          pairs = [line.split('=', 1) for line in content.splitlines() if line and not line.startswith('#') and '=' in line]
          assert len(pairs) == len({key for key, _ in pairs})
          fields = dict(pairs)
          assert fields['gitSha'] == os.environ['TESTED_SHA'] and fields['gitDirty'] == 'false'
          assert os.path.basename(os.environ['JAR']) == f"gls-{fields['version']}-all.jar"
          open(os.environ['RUNNER_TEMP'] + '/receipt-proof/jar-version.properties', 'w').write(content)
          PYJAR
          mkdir -p "${RUNNER_TEMP}/receipt-jar"
          cp "${jars[0]}" "${RUNNER_TEMP}/receipt-jar/selected.jar"
          sha256sum "${RUNNER_TEMP}/receipt-jar/selected.jar" >"${RUNNER_TEMP}/receipt-proof/retained-jar-sha256.txt"
          selected_hash=$(sha256sum "${jars[0]}" | cut -d' ' -f1)
          retained_hash=$(sha256sum "${RUNNER_TEMP}/receipt-jar/selected.jar" | cut -d' ' -f1)
          [[ "${selected_hash}" == "${retained_hash}" ]]
      - name: Prepare Gradle classpath manifest
        working-directory: candidate
        shell: bash
        run: |
          set -euo pipefail
          : "${RUNNER_TEMP:?}"
          : "${TESTED_SHA:?}"
          # Synthetic local commit is the tested source, not the merged product head.
          proof_cmd_8_1=$(git rev-parse 'HEAD^{tree}')
          [[ "${proof_cmd_8_1}" == 3016dd0fa8b6459e5c27420b95df7c39bab349bf ]]
          proof_cmd_9_2=$(git status --porcelain)
          [[ -z "${proof_cmd_9_2}" ]]
          proof_cmd_10_3=$(command -v java)
          java_path=$(readlink -f "${proof_cmd_10_3}")
          java_hash=$(sha256sum "${java_path}" | cut -d' ' -f1)
          set +e
          GITHUB_SHA="${TESTED_SHA}" node tools/ci/run-gradle.mjs --report-root "${RUNNER_TEMP}/receipt-proof/gradle" --producer receipt-prepare :tests:prepareAgentVerification -Dgroovy.lsp.agent.manifest="${RUNNER_TEMP}/receipt-proof/classpath.json" -Dgroovy.lsp.agent.sourceCommit="${TESTED_SHA}" -Dgroovy.lsp.agent.sourceDirty=false -Dgroovy.lsp.agent.javaSha256="${java_hash}" --no-daemon --no-parallel --no-build-cache --max-workers=1 '-Dorg.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=768m -XX:+UseSerialGC'
          status=$?
          set -e
