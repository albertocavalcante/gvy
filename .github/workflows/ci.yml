# Temporary red-control support only; never merge into main or product PR.
name: L05b bounded encoder red control
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: l05b-bounded-encoder-${{ github.sha }}
  cancel-in-progress: false
jobs:
  red-control:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      JDK_JAVA_OPTIONS: '-Xmx512m'
      JAVA_TOOL_OPTIONS: '-Xmx512m'
    steps:
      - name: Create evidence directory
        run: mkdir -m 700 "$RUNNER_TEMP/l05b-red-proof"
      - name: Checkout temporary support ref
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Java 17
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Java 21
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '21'
      - name: Install pinned direnv
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/direnv-bin" "$RUNNER_TEMP/direnv-download"
          gh release download v2.38.2 --repo direnv/direnv --pattern direnv.linux-amd64 --dir "$RUNNER_TEMP/direnv-download"
          printf '%s  %s\n' 148820a187930d36ca6a204504e5cdb30d8396cd1a97e64c3b3f10d793c11247 "$RUNNER_TEMP/direnv-download/direnv.linux-amd64" | sha256sum -c -
          install -m 755 "$RUNNER_TEMP/direnv-download/direnv.linux-amd64" "$RUNNER_TEMP/direnv-bin/direnv"
          echo "$RUNNER_TEMP/direnv-bin" >>"$GITHUB_PATH"
      - name: Prove expected red control
        shell: bash
        run: |
          set -euo pipefail
          proof="$RUNNER_TEMP/l05b-red-proof"
          cp .publication/red.init.gradle "$RUNNER_TEMP/red.init.gradle"
          printf '%s  %s\n' cc0742e076410f51f5824988f3a8f9921b372624ee84e634ceb8b3cf39d08efb "$RUNNER_TEMP/red.init.gradle" | sha256sum -c -
          git switch --detach 2e5352cf833d2d74c5c86a112336a97aeed1102f
          [[ "$(git rev-parse HEAD)" == 2e5352cf833d2d74c5c86a112336a97aeed1102f ]]
          [[ "$(git rev-parse 'HEAD^{tree}')" == 7c7d23c8daf49ca5341d513a0e80d347a93e80e3 ]]
          test -z "$(git status --porcelain --untracked-files=all)"
          printf '%s  %s\n' 9b2a01fedb679bbee1342bb8b46c4e55765df2a4c23806b91e87b339cb3a0296 gls/src/main/resources/logback.xml | sha256sum -c -
          printf '%s  %s\n' e50ae858510db2dad587b761504de1e880e57a2469053066cb843f17c4870ec0 gls/src/test/kotlin/com/github/albertocavalcante/gvy/gls/config/BoundedLogbackRenderingTest.kt | sha256sum -c -
          [[ -n "${JAVA_HOME_17_X64:-}" && -n "${JAVA_HOME_21_X64:-}" ]]
          direnv allow
          test ! -e gls/build/test-results/test
          set +e
          direnv exec . ./gradlew :gls:test --tests '*BoundedLogbackRenderingTest' --no-daemon --no-parallel --max-workers=1 --no-build-cache --rerun-tasks --info \
              -I "$RUNNER_TEMP/red.init.gradle" \
              '-Dorg.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=768m -XX:+UseSerialGC' \
              "-Dorg.gradle.java.installations.paths=$JAVA_HOME_17_X64,$JAVA_HOME_21_X64" 2>&1 | tee "$proof/gradle.log"
          status=${PIPESTATUS[0]}
          set -e
          printf '%s\n' "$status" >"$proof/gradle-status.txt"
          [[ "$status" -ne 0 ]]
          xml=gls/build/test-results/test/TEST-com.github.albertocavalcante.gvy.gls.config.BoundedLogbackRenderingTest.xml
          test -f "$xml"
          cp "$xml" "$proof/encoder-red.xml"
          python3 - "$xml" <<'PYXML'
          import sys
          import xml.etree.ElementTree as ET
          root = ET.parse(sys.argv[1]).getroot()
          cases = root.findall('testcase')
          if root.get('name') != 'com.github.albertocavalcante.gvy.gls.config.BoundedLogbackRenderingTest' or len(cases) != 9 or root.get('errors') != '0' or root.get('skipped') != '0':
              raise SystemExit('expected nine executed encoder controls')
          required = ('configured stderr encoder bounds the complete message and throwable', 'configured stderr encoder never invokes arbitrary argument toString')
          for name in required:
              matches = [case for case in cases if case.get('name', '').startswith(name)]
              if len(matches) != 1 or matches[0].find('failure') is None or 'AssertionFailedError' not in ''.join(matches[0].find('failure').itertext()):
                  raise SystemExit('expected encoder assertion failure missing: ' + name)
          print('verified real size and hostile-argument assertion failures')
          PYXML
          python3 - "$proof/gradle.log" "$proof" <<'PYWORKER'
          import pathlib
          import shlex
          import sys
          text = pathlib.Path(sys.argv[1]).read_text(errors='replace')
          lines = [line for line in text.splitlines() if line.startswith("Starting process 'Gradle Test Executor ") and ' Command: ' in line]
          if len(lines) != 1:
              raise SystemExit('expected one actual Gradle Test Executor command')
          command = lines[0].split(' Command: ', 1)[1]
          args = shlex.split(command)
          heaps = [arg for arg in args if arg.startswith('-Xmx')]
          metas = [arg for arg in args if arg.startswith('-XX:MaxMetaspaceSize=')]
          if not args or not args[0].startswith('/') or not args[0].endswith('/bin/java') or heaps != ['-Xmx128m'] or not metas or any(arg != '-XX:MaxMetaspaceSize=512m' for arg in metas):
              raise SystemExit('actual test worker executable or memory flags differ')
          proof = pathlib.Path(sys.argv[2])
          (proof / 'worker-command.txt').write_text(lines[0] + '\n')
          (proof / 'worker-java.path').write_text(args[0] + '\n')
          PYWORKER
          test_java=$(cat "$proof/worker-java.path")
          test -x "$test_java"
          env JDK_JAVA_OPTIONS= JAVA_TOOL_OPTIONS= "$test_java" -Xmx64m -XX:MaxMetaspaceSize=128m -XshowSettings:properties -version 2>&1 | tee "$proof/test-java-version.log"
          grep -Eq '^[[:space:]]*java\.specification\.version[[:space:]]*=[[:space:]]*17[[:space:]]*$' "$proof/test-java-version.log"
          test -z "$(git status --porcelain --untracked-files=all)"
          printf '%s\n' 'candidate=2e5352cf833d2d74c5c86a112336a97aeed1102f' 'tree=7c7d23c8daf49ca5341d513a0e80d347a93e80e3' 'base=eb9d0251900a1a51894c13634db0e88a4cd846ff' >"$proof/receipt.txt"
      - name: Upload all available evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: l05b-bounded-encoder-red
          path: ${{ runner.temp }}/l05b-red-proof/
          if-no-files-found: error
          retention-days: 7
