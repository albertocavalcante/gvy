# Temporary execution support only. Never merge into main or the product PR.
name: Ruleset failure case identity preparation
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: e2e-ruleset-identities-preparation-${{ github.sha }}
  cancel-in-progress: false
jobs:
  candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      CARGO_BUILD_JOBS: 1
      JDK_JAVA_OPTIONS: '-Xmx512m'
      JAVA_TOOL_OPTIONS: '-Xmx512m -Dorg.gradle.deprecation.trace=true'
      GRADLE_OPTS: >-
        -Dorg.gradle.jvmargs="-Xmx1536m -XX:MaxMetaspaceSize=768m -XX:+UseSerialGC"
        -Dorg.gradle.workers.max=1 -Dorg.gradle.parallel=false -Dorg.gradle.daemon=false
      NODE_OPTIONS: '--max-old-space-size=768'
      SKIP_PREPARE_SERVER: 'true'
    steps:
      - name: Checkout temporary support ref
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: support
          persist-credentials: false
      - name: Validate support receipt
        id: receipt
        shell: bash
        run: |
          set -euo pipefail
          receipt="$GITHUB_WORKSPACE/support/.publication/receipt.json"
          base=$(jq -er '.base' "$receipt")
          tree=$(jq -er '.tree' "$receipt")
          digest=$(jq -er '.patchSha256' "$receipt")
          compressed=$(jq -er '.payloadSha256' "$receipt")
          [[ "$base" =~ ^[0-9a-f]{40}$ && "$tree" =~ ^[0-9a-f]{40}$ && "$digest" =~ ^[0-9a-f]{64}$ && "$compressed" =~ ^[0-9a-f]{64}$ ]]
          printf '%s  %s\n' "$compressed" "$GITHUB_WORKSPACE/support/.publication/payload.patch.gz" | sha256sum -c -
          [[ "$(stat -c %s "$GITHUB_WORKSPACE/support/.publication/payload.patch.gz")" == "$(jq -er '.payloadBytes' "$receipt")" ]]
          [[ "$(jq -er '.payloadBytes' "$receipt")" -le 65536 ]]
          [[ "$(jq -er '.patchBytes' "$receipt")" -le 131072 ]]
          python3 - "$GITHUB_WORKSPACE/support/.publication/payload.patch.gz" "$RUNNER_TEMP/gvy-reviewed.patch" <<'PYBOUND'
          import gzip, pathlib, sys
          with gzip.open(sys.argv[1], 'rb') as stream:
              data = stream.read(131073)
          if len(data) > 131072:
              raise SystemExit('patch exceeds 128 KiB')
          pathlib.Path(sys.argv[2]).write_bytes(data)
          PYBOUND
          [[ "$(stat -c %s "$RUNNER_TEMP/gvy-reviewed.patch")" == "$(jq -er '.patchBytes' "$receipt")" ]]
          printf '%s  %s\n' "$digest" "$RUNNER_TEMP/gvy-reviewed.patch" | sha256sum -c -
          printf 'base=%s\ntree=%s\npatch=%s\n' "$base" "$tree" "$digest" >>"$GITHUB_OUTPUT"
      - name: Checkout exact pinned base
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.receipt.outputs.base }}
          path: candidate
          fetch-depth: 1
          persist-credentials: false
      - name: Apply pinned candidate patch and prove tree
        working-directory: candidate
        shell: bash
        env:
          EXPECTED_BASE: ${{ steps.receipt.outputs.base }}
          EXPECTED_TREE: ${{ steps.receipt.outputs.tree }}
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "$EXPECTED_BASE" ]]
          git switch -c ci/e2e-ruleset-identities-publication
          git apply --check --index "$RUNNER_TEMP/gvy-reviewed.patch"
          git apply --index "$RUNNER_TEMP/gvy-reviewed.patch"
          [[ "$(git write-tree)" == "$EXPECTED_TREE" ]]
          git diff --exit-code
          git diff --cached --check
          cp "$GITHUB_WORKSPACE/support/.publication/paths.nul" "$RUNNER_TEMP/expected-paths.nul"
          [[ "$(sha256sum "$RUNNER_TEMP/expected-paths.nul" | cut -d' ' -f1)" == "$(jq -er '.pathsSha256' "$GITHUB_WORKSPACE/support/.publication/receipt.json")" ]]
          git diff --cached --name-only --diff-filter=ACMRT -z >"$RUNNER_TEMP/actual-paths.nul"
          cmp "$RUNNER_TEMP/expected-paths.nul" "$RUNNER_TEMP/actual-paths.nul"
          test -z "$(git ls-files --others --exclude-standard)"
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
      - name: Set up JDK
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24'
      - name: Set up pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 12.14.0
      - name: Install locked project tools
        working-directory: candidate
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --require-hashes --only-binary=:all: -r .reuse/bootstrap-requirements.txt
          uv sync --project .reuse --locked
          echo "$PWD/.reuse/.venv/bin" >>"$GITHUB_PATH"
          pnpm --dir editors/code install --frozen-lockfile
      - name: Fetch checksum-pinned hook tools
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          bins="$RUNNER_TEMP/e2e-ruleset-identities-hook-bin"
          download="$RUNNER_TEMP/e2e-ruleset-identities-hook-download"
          mkdir -p "$bins" "$download"
          fetch() {
              local repo="$1" version="$2" asset="$3" digest="$4"
              gh release download "$version" --repo "$repo" --pattern "$asset" --dir "$download"
              printf '%s  %s\n' "$digest" "$download/$asset" | sha256sum -c -
          }
          fetch direnv/direnv v2.38.2 direnv.linux-amd64 148820a187930d36ca6a204504e5cdb30d8396cd1a97e64c3b3f10d793c11247
          install -m 755 "$download/direnv.linux-amd64" "$bins/direnv"
          fetch evilmartians/lefthook v2.2.2 lefthook_2.2.2_Linux_x86_64 4fbf89eb7748c6aed84d833ee1a29edac48fae614468ca9a82896ec32f2800b6
          install -m 755 "$download/lefthook_2.2.2_Linux_x86_64" "$bins/lefthook"
          fetch dprint/dprint 0.64.3 dprint-x86_64-unknown-linux-gnu.zip f71cb7e22d6776439eba168d5cb296092d6413fea7148fe4d70684a2702a4fee
          unzip -q "$download/dprint-x86_64-unknown-linux-gnu.zip" -d "$download/dprint"
          install -m 755 "$download/dprint/dprint" "$bins/dprint"
          fetch mikefarah/yq v4.52.4 yq_linux_amd64 0c4d965ea944b64b8fddaf7f27779ee3034e5693263786506ccd1c120f184e8c
          install -m 755 "$download/yq_linux_amd64" "$bins/yq"
          fetch koalaman/shellcheck v0.11.0 shellcheck-v0.11.0.linux.x86_64.tar.xz 8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198
          tar -xJf "$download/shellcheck-v0.11.0.linux.x86_64.tar.xz" -C "$download"
          install -m 755 "$download/shellcheck-v0.11.0/shellcheck" "$bins/shellcheck"
          fetch mvdan/sh v3.12.0 shfmt_v3.12.0_linux_amd64 d9fbb2a9c33d13f47e7618cf362a914d029d02a6df124064fff04fd688a745ea
          install -m 755 "$download/shfmt_v3.12.0_linux_amd64" "$bins/shfmt"
          fetch astral-sh/ruff 0.17.4 ruff-x86_64-unknown-linux-gnu.tar.gz 3ab2b34aeacdbc1ea5c529cdbda3e05792633d587228123fd09f3b5a0facb27a
          mkdir "$download/ruff"
          tar -xzf "$download/ruff-x86_64-unknown-linux-gnu.tar.gz" -C "$download/ruff"
          install -m 755 "$download/ruff/ruff-x86_64-unknown-linux-gnu/ruff" "$bins/ruff"
          fetch rhysd/actionlint v1.7.9 actionlint_1.7.9_linux_amd64.tar.gz 233b280d05e100837f4af1433c7b40a5dcb306e3aa68fb4f17f8a7f45a7df7b4
          mkdir "$download/actionlint"
          tar -xzf "$download/actionlint_1.7.9_linux_amd64.tar.gz" -C "$download/actionlint"
          install -m 755 "$download/actionlint/actionlint" "$bins/actionlint"
          fetch suzuki-shunsuke/ghalint v1.5.4 ghalint_1.5.4_linux_amd64.tar.gz 977555b7142cc057aad4663679772510a9ed3f1687f26f2359d18bb6b67314fe
          mkdir "$download/ghalint"
          tar -xzf "$download/ghalint_1.5.4_linux_amd64.tar.gz" -C "$download/ghalint"
          install -m 755 "$download/ghalint/ghalint" "$bins/ghalint"
          echo "$bins" >>"$GITHUB_PATH"
      - name: Run normal hooks and create candidate commit
        working-directory: candidate
        shell: bash
        env:
          EXPECTED_BASE: ${{ steps.receipt.outputs.base }}
          EXPECTED_TREE: ${{ steps.receipt.outputs.tree }}
          PATCH_SHA: ${{ steps.receipt.outputs.patch }}
        run: |
          set -euo pipefail
          [[ -z "${LEFTHOOK:-}" && -z "${LEFTHOOK_EXCLUDE:-}" && -z "${LEFTHOOK_SKIP:-}" ]]
          [[ -z "$(git config --get core.hooksPath || true)" ]]
          command -v shellcheck
          command -v shfmt
          command -v dprint
          command -v yq
          command -v ruff
          lefthook install
          test -x .git/hooks/pre-commit && test -x .git/hooks/commit-msg
          git config user.name 'Alberto Cavalcante'
          git config user.email 'alberto@cavalcante.uk'
          git diff --exit-code
          [[ "$(git write-tree)" == "$EXPECTED_TREE" ]]
          direnv allow
          direnv exec . java -version
          pnpm --dir editors/code run compile
          pnpm --dir editors/code test
          editors/code/node_modules/.bin/prettier --check editors/code/client/src/test/integration/implementation.test.ts
          candidate_sha=$(git rev-parse HEAD)
          gradle_evidence="$RUNNER_TEMP/gvy-preparation-gradle-evidence"
          GITHUB_SHA="$candidate_sha" direnv exec . node tools/ci/run-gradle.mjs \
              --report-root "$gradle_evidence" --producer preparation-lint-fix \
              lintFix --no-daemon --no-parallel --max-workers=1 \
              '-Dorg.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=768m -XX:+UseSerialGC'
          git diff --exit-code
          [[ "$(git write-tree)" == "$EXPECTED_TREE" ]]
          GITHUB_SHA="$candidate_sha" direnv exec . node tools/ci/run-gradle.mjs \
              --report-root "$gradle_evidence" --producer preparation-codenarc-native \
              :diagnostics:codenarc:test --tests '*.RulesetFailureOutcomeTest' \
              --no-build-cache --rerun-tasks --info -PtestJavaVersion=17 \
              --no-daemon --no-parallel --max-workers=1 \
              '-Dorg.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=768m -XX:+UseSerialGC'
          native_reports=("$gradle_evidence"/preparation-codenarc-native-*/console.log)
          [[ "${#native_reports[@]}" -eq 1 && -f "${native_reports[0]}" ]]
          cp "${native_reports[0]}" "$RUNNER_TEMP/gvy-codenarc-native.log"
          python3 - diagnostics/codenarc/build/test-results/test "$RUNNER_TEMP/gvy-codenarc-native.log" "$RUNNER_TEMP/gvy-case-identities.json" <<'PYIDENTITY'
          import hashlib, json, pathlib, sys, xml.etree.ElementTree as ET
          reports = sorted(pathlib.Path(sys.argv[1]).glob('TEST-*.xml'))
          assert len(reports) == 1, 'focused class must produce one report'
          report = reports[0]
          assert report.stat().st_size <= 1048576
          root = ET.parse(report).getroot()
          assert root.attrib['name'] == 'com.github.albertocavalcante.gvy.diagnostics.codenarc.RulesetFailureOutcomeTest'
          totals = {key: int(root.attrib.get(key, '0')) for key in ('tests', 'failures', 'errors', 'skipped')}
          assert totals == dict(tests=14, failures=0, errors=0, skipped=0), totals
          cases = root.findall('testcase')
          assert len(cases) == 14 and len({(case.attrib['classname'], case.attrib['name']) for case in cases}) == 14
          assert all(not case.findall('failure') and not case.findall('error') and not case.findall('skipped') for case in cases)
          data = pathlib.Path(sys.argv[2]).read_bytes()
          lines = data.decode().splitlines()
          task = '> Task :diagnostics:codenarc:test'
          assert [line for line in lines if line == task or line.startswith(task + ' ')] == [task]
          launchers = [line for line in lines if 'Starting process' in line and 'Gradle Test Executor' in line and 'Command:' in line]
          assert launchers, 'missing actual executor command'
          pathlib.Path(sys.argv[3]).write_text(json.dumps(dict(totals=totals, uniqueIdentities=14,
              names=sorted(case.attrib['name'] for case in cases), actualExecutorLines=launchers,
              xmlSha256=hashlib.sha256(report.read_bytes()).hexdigest(), logSha256=hashlib.sha256(data).hexdigest()), indent=2) + '\n')
          PYIDENTITY
          git diff --exit-code
          [[ "$(git write-tree)" == "$EXPECTED_TREE" ]]
          git diff --cached --name-only --diff-filter=ACMRT -z >"$RUNNER_TEMP/gvy-staged-paths"
          while IFS= read -r -d '' staged_file; do
              [[ -f "$staged_file" ]] || continue
              first_line=''
              IFS= read -r first_line <"$staged_file" || true
              case "$staged_file:$first_line" in
                  *.zsh:*) zsh -n "$staged_file" ;;
                  *.sh:* | .envrc:* | *:'#!'*bash* | *:'#!'*'/sh'*)
                      shellcheck --rcfile tools/lint/shellcheckrc "$staged_file"
                      shfmt -i 4 -ci -d "$staged_file"
                      bash -n "$staged_file"
                      ;;
                  *) ;;
              esac
          done <"$RUNNER_TEMP/gvy-staged-paths"
          git commit -m 'test(diagnostics): identify ruleset failure boundaries' 2>&1 | tee "$RUNNER_TEMP/gvy-commit-hooks.log"
          node tools/ci/check-gradle-diagnostics.mjs \
              --log "$RUNNER_TEMP/gvy-commit-hooks.log" --exit-code 0 --capture-exit-code 0 \
              --producer preparation-hooks --baseline tools/ci/gradle-diagnostics.json \
              --report "$RUNNER_TEMP/gvy-hook-diagnostics" --root "$PWD"
          [[ "$(git rev-parse HEAD^)" == "$EXPECTED_BASE" ]]
          [[ "$(git rev-parse 'HEAD^{tree}')" == "$EXPECTED_TREE" ]]
          git diff --exit-code && git diff --cached --quiet
          test -z "$(git status --porcelain --untracked-files=all)"
          mkdir "$RUNNER_TEMP/gvy-publication-proof"
          cp "$RUNNER_TEMP/gvy-case-identities.json" "$RUNNER_TEMP/gvy-publication-proof/case-identities.json"
          cp -R "$gradle_evidence" "$RUNNER_TEMP/gvy-publication-proof/gradle-evidence"
          cp -R "$RUNNER_TEMP/gvy-hook-diagnostics" "$RUNNER_TEMP/gvy-publication-proof/hook-diagnostics"
          git bundle create "$RUNNER_TEMP/gvy-publication-proof/candidate.bundle" HEAD "^$EXPECTED_BASE"
          git bundle verify "$RUNNER_TEMP/gvy-publication-proof/candidate.bundle"
          cp "$RUNNER_TEMP/gvy-commit-hooks.log" "$RUNNER_TEMP/gvy-publication-proof/"
          cp "$RUNNER_TEMP/gvy-codenarc-native.log" "$RUNNER_TEMP/gvy-publication-proof/"
          for report_dir in diagnostics/codenarc/build/test-results/test; do
              test -d "$report_dir"
              while IFS= read -r -d '' report_file; do
                  mkdir -p "$RUNNER_TEMP/gvy-publication-proof/junit/$(dirname "$report_file")"
                  cp "$report_file" "$RUNNER_TEMP/gvy-publication-proof/junit/$report_file"
              done < <(find "$report_dir" -maxdepth 1 -type f -name 'TEST-*.xml' -print0)
          done
          cp "$RUNNER_TEMP/gvy-staged-paths" "$RUNNER_TEMP/gvy-publication-proof/staged-paths.nul"
          jq -n --arg base "$EXPECTED_BASE" --arg tree "$EXPECTED_TREE" --arg patch "$PATCH_SHA" \
              --arg head "$(git rev-parse HEAD)" --arg support "$GITHUB_SHA" \
              '{base:$base,tree:$tree,patchSha256:$patch,head:$head,supportHead:$support}' \
              >"$RUNNER_TEMP/gvy-publication-proof/receipt.json"
          (cd "$RUNNER_TEMP/gvy-publication-proof" && sha256sum candidate.bundle >bundle.sha256)
      - name: Upload candidate and evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gvy-e2e-ruleset-identities-publication-proof
          path: ${{ runner.temp }}/gvy-publication-proof/
          if-no-files-found: error
          retention-days: 7
      - name: Upload failed validation evidence
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gvy-e2e-ruleset-identities-failure-proof
          path: |
            support/.publication/receipt.json
            candidate/diagnostics/codenarc/build/test-results/test/*.xml
            candidate/diagnostics/codenarc/src/test/kotlin/com/github/albertocavalcante/gvy/diagnostics/codenarc/RulesetFailureOutcomeTest.kt
            ${{ runner.temp }}/gvy-codenarc-native.log
            ${{ runner.temp }}/gvy-case-identities.json
            ${{ runner.temp }}/gvy-preparation-gradle-evidence/
            ${{ runner.temp }}/gvy-hook-diagnostics/
            ${{ runner.temp }}/gvy-commit-hooks.log
          if-no-files-found: warn
          retention-days: 7
