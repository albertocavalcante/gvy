{
  "name": "Detekt support offline preparation",
  "on": {
    "workflow_dispatch": {
      "inputs": {
        "linux12": {
          "description": "Run the fixed owned-Node-only Linux acceptance cases",
          "type": "boolean",
          "default": true
        }
      }
    }
  },
  "permissions": {
    "contents": "read"
  },
  "concurrency": {
    "group": "detekt-support-offline-${{ github.ref }}",
    "cancel-in-progress": false
  },
  "jobs": {
    "offline": {
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 20,
      "permissions": {
        "contents": "read"
      },
      "env": {
        "NODE_OPTIONS": "--max-old-space-size=128"
      },
      "steps": [
        {
          "uses": "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1", # v7.0.1
          "timeout-minutes": 5,
          "with": {
            "persist-credentials": false,
            "fetch-depth": 2
          }
        },
        {
          "uses": "actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38", # v6.5.0
          "timeout-minutes": 5,
          "with": {
            "node-version": "24.20.0"
          }
        },
        {
          "name": "Authenticate fixed metadata-only support",
          "timeout-minutes": 2,
          "shell": "bash",
          "run": "set -euo pipefail\nmkdir -m 700 \"$RUNNER_TEMP/detekt-support-offline\"\nnode --max-old-space-size=128 --input-type=module <<'NODE' >\"$RUNNER_TEMP/detekt-support-offline/preflight.log\" 2>&1\nimport fs from 'node:fs';\nimport {createHash} from 'node:crypto';\nimport {execFileSync} from 'node:child_process';\nconst hash=b=>createHash('sha256').update(b).digest('hex');\nconst root=fs.realpathSync(process.cwd());\nconst read=p=>{\n  const fd=fs.openSync(p,fs.constants.O_RDONLY|fs.constants.O_NOFOLLOW|fs.constants.O_NONBLOCK);\n  try{\n    const st=fs.fstatSync(fd),b=Buffer.alloc(1048577);let n=0;\n    if(!st.isFile()||st.nlink!==1||st.uid!==process.getuid()||st.size>1048576||fs.realpathSync(p)!==p)throw Error('Unsafe metadata source');\n    while(n<b.length){const k=fs.readSync(fd,b,n,b.length-n,null);if(!k)break;n+=k;}\n    const end=fs.fstatSync(fd),last=fs.lstatSync(p);\n    if(n!==st.size||n>1048576||[end,last].some(s=>s.dev!==st.dev||s.ino!==st.ino||s.size!==st.size||s.mtimeMs!==st.mtimeMs||s.ctimeMs!==st.ctimeMs||s.nlink!==1))throw Error('Changed metadata source');\n    return b.subarray(0,n);\n  }finally{fs.closeSync(fd);}\n};\nconst raw=read(root+'/.publication/detekt-adoption/offline-inputs.json');\nif(hash(raw)!=='4abd5a7855516cec092c2f6b7c5f7106c587f8b8a382ea241aefbf0663ea8542')throw Error('Wrong fixed offline manifest');\nconst m=JSON.parse(raw);\nif(m.schemaVersion!==1||m.kind!=='detekt-offline-bootstrap'||m.nativeDispatchAllowed!==false||m.productCommitAllowed!==false||m.base!=='26578e4d48678feaa3bc8f03dcfac57793b8f70b'||m.productTree!=='b1816e949dd3b19777aac418201cd722f36e6578'||m.files.length!==22)throw Error('Wrong offline scope');\nif(process.version!=='v24.20.0'||process.platform!=='linux'||process.arch!=='x64')throw Error('Wrong declared Node/Linux runtime');\nfor(const row of m.files){\n  if(!/^\\.publication\\/detekt-adoption\\/[A-Za-z0-9][A-Za-z0-9.-]*$/.test(row.path)||row.mode!=='100644')throw Error('Escaped support path');\n  const b=read(root+'/'+row.path);if(b.length!==row.bytes||hash(b)!==row.sha256)throw Error('Wrong source bytes');\n}\nconst git=a=>execFileSync('/usr/bin/git',a,{encoding:'utf8',timeout:5000,maxBuffer:1048576}).trim();\nconst head=git(['rev-parse','HEAD']);\nif(head!==process.env.GITHUB_SHA||git(['rev-list','--parents','-n','1','HEAD'])!==head+' '+m.base)throw Error('Wrong actual support provenance');\nconst allowed=['.github/workflows/ci.yml','.publication/detekt-adoption/offline-inputs.json',...m.files.map(r=>r.path)].sort();\nconst actual=git(['diff','--name-only',m.base,'HEAD']).split('\\n').sort();\nif(new Set(allowed).size!==24||JSON.stringify(actual)!==JSON.stringify(allowed))throw Error('Implementation or undeclared support published');\nconsole.log(JSON.stringify({actualSupportHead:head,githubSha:process.env.GITHUB_SHA,base:m.base,productTreeDataOnly:m.productTree,sourceFiles:m.files.length,nodeVersion:process.version,platform:process.platform,arch:process.arch,gvyFixtureExecuted:false,gradleExecuted:false,productCommitAllowed:false}));\nNODE\n"
        },
        {
          "name": "Mocked controls and actual checkout layout",
          "timeout-minutes": 2,
          "shell": "bash",
          "run": "set -euo pipefail\nnode --max-old-space-size=128 --test --test-concurrency=1 --test-timeout=5000 .publication/detekt-adoption/offline.test.mjs >\"$RUNNER_TEMP/detekt-support-offline/units.log\" 2>&1\n"
        },
        {
          "name": "Parse inert sources without execution",
          "timeout-minutes": 2,
          "shell": "bash",
          "run": "set -euo pipefail\nfor source in io.mjs verify-source.mjs observe-java.mjs stages.mjs fixture-proof.mjs offline.test.mjs owned-command.mjs guarded-probes.mjs probe-guard.mjs probe-register.cjs probe-worker.mjs probe-fixture.mjs; do\n  node --max-old-space-size=128 --check \".publication/detekt-adoption/$source\"\ndone\nfor script in producer.sh prepare-tools.sh; do\n  bash -n \".publication/detekt-adoption/$script\"\ndone\n"
        },
        {
          "name": "Fixed twelve owned-Node-only Linux cases",
          "if": "inputs.linux12",
          "timeout-minutes": 3,
          "shell": "bash",
          "run": "set -euo pipefail\nset +e\ntimeout --signal=TERM --kill-after=5s 100s node --max-old-space-size=128 .publication/detekt-adoption/guarded-probes.mjs \"hosted-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT\" >\"$RUNNER_TEMP/detekt-support-offline/linux12.log\" 2>&1\nstatus=$?\nset -e\nprintf '%s\\n' \"$status\" >\"$RUNNER_TEMP/detekt-support-offline/linux12-status.txt\"\nexit \"$status\"\n"
        },
        {
          "name": "Bind Linux results to current licensed sources",
          "if": "inputs.linux12",
          "timeout-minutes": 2,
          "shell": "bash",
          "run": "set -euo pipefail\nnode --max-old-space-size=128 --input-type=module <<'NODE' >\"$RUNNER_TEMP/detekt-support-offline/linux12-acceptance.log\" 2>&1\nimport {resolve,join} from 'node:path';\nimport {readBounded,sha256} from './.publication/detekt-adoption/io.mjs';\nconst dir=resolve('.publication/detekt-adoption');\nconst m=JSON.parse(readBounded(join(dir,'offline-inputs.json')));\nconst tag='hosted-'+process.env.GITHUB_RUN_ID+'-'+process.env.GITHUB_RUN_ATTEMPT;\nconst result=JSON.parse(readBounded(join(dir,'probes-'+tag,'result.json')));\nconst modes=['normal','flush','same','ignoring','detached','detached-closed','timeout','overflow','between','spawn-error','anchor-spawn-error','reuse'];\nif(result.scope!=='OWNED_NODE_ONLY'||result.allPassed!==true||result.results.length!==12||result.results.some((r,i)=>r.mode!==modes[i]||r.status!==0||r.signal!==null||r.spawnError!==null||r.workerCloseObserved!==true||r.hardStopFired||r.cleanupAmbiguous||r.outputOverflow||r.registryError!==null||r.remainingOwned!==0||r.report?.passed!==true))throw Error('Incomplete/failed twelve-case acceptance');\nconst names=['owned-command.mjs','guarded-probes.mjs','probe-guard.mjs','probe-register.cjs','probe-worker.mjs','probe-fixture.mjs'];\nconst prefix='// SPDX-FileCopyrightText: Alberto Cavalcante and the gvy contributors\\n// SPDX-License-Identifier: Apache-2.0\\n';\nfor(const name of names){\n  const bytes=readBounded(join(dir,name)),row=m.canonicalBodies.find(r=>r.name===name);\n  if(!row||sha256(bytes)!==row.licensedSha256||result.sourceHashes[name]!==row.licensedSha256||!bytes.subarray(0,Buffer.byteLength(prefix)).equals(Buffer.from(prefix))||sha256(bytes.subarray(Buffer.byteLength(prefix)))!==row.originalSha256)throw Error('Wrong current licensed source/body: '+name);\n}\nconsole.log(JSON.stringify({scope:'OWNED_NODE_ONLY',acceptedCurrentLicensedSources:result.sourceHashes,modes,allPassed:true,gvyFixtureExecuted:false,javaExecuted:false,productCommitAllowed:false,evidence:'Available driver output and case summaries; large helper streams are hash/length-only and worker streams are UTF-8-decoded; full failed-leaf raw custody remains Root-owned1876 debt',limit:'Process groups plus independent registered-own-Node fixture cleanup; arbitrary escaped descendants remain unsupported'}));\nNODE\n"
        },
        {
          "name": "Install checksum-pinned static tools",
          "timeout-minutes": 5,
          "shell": "bash",
          "env": {
            "GH_TOKEN": "${{ github.token }}"
          },
          "run": "set -euo pipefail\nbins=\"$RUNNER_TEMP/detekt-offline-bin\"\ndownload=\"$RUNNER_TEMP/detekt-offline-download\"\nmkdir -m 700 \"$bins\" \"$download\"\ngh release download v0.11.0 --repo koalaman/shellcheck --pattern shellcheck-v0.11.0.linux.x86_64.tar.xz --dir \"$download\"\nprintf '%s  %s\\n' 8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198 \"$download/shellcheck-v0.11.0.linux.x86_64.tar.xz\" | sha256sum -c -\nenv -i PATH=/usr/bin:/bin LC_ALL=C LANG=C /usr/bin/tar -xJf \"$download/shellcheck-v0.11.0.linux.x86_64.tar.xz\" -C \"$download\"\ninstall -m 755 \"$download/shellcheck-v0.11.0/shellcheck\" \"$bins/shellcheck\"\ngh release download v3.12.0 --repo mvdan/sh --pattern shfmt_v3.12.0_linux_amd64 --dir \"$download\"\nprintf '%s  %s\\n' d9fbb2a9c33d13f47e7618cf362a914d029d02a6df124064fff04fd688a745ea \"$download/shfmt_v3.12.0_linux_amd64\" | sha256sum -c -\ninstall -m 755 \"$download/shfmt_v3.12.0_linux_amd64\" \"$bins/shfmt\"\ngh release download v1.7.9 --repo rhysd/actionlint --pattern actionlint_1.7.9_linux_amd64.tar.gz --dir \"$download\"\nprintf '%s  %s\\n' 233b280d05e100837f4af1433c7b40a5dcb306e3aa68fb4f17f8a7f45a7df7b4 \"$download/actionlint_1.7.9_linux_amd64.tar.gz\" | sha256sum -c -\nmkdir \"$download/actionlint\"\nenv -i PATH=/usr/bin:/bin LC_ALL=C LANG=C /usr/bin/tar -xzf \"$download/actionlint_1.7.9_linux_amd64.tar.gz\" -C \"$download/actionlint\"\ninstall -m 755 \"$download/actionlint/actionlint\" \"$bins/actionlint\"\nprintf '%s\\n' \"$bins\" >>\"$GITHUB_PATH\"\n"
        },
        {
          "name": "Check inert Bash, workflow and metadata formatting",
          "timeout-minutes": 2,
          "shell": "bash",
          "run": "set -euo pipefail\nshellcheck --rcfile tools/lint/shellcheckrc .publication/detekt-adoption/producer.sh .publication/detekt-adoption/prepare-tools.sh\nshfmt -i 2 -ci -d .publication/detekt-adoption/producer.sh .publication/detekt-adoption/prepare-tools.sh\nactionlint .github/workflows/ci.yml\nnode --max-old-space-size=128 --input-type=module <<'NODE'\nimport {readFileSync} from 'node:fs';\nfor(const name of ['receipt.json','offline-inputs.json']){\n  const text=readFileSync('.publication/detekt-adoption/'+name,'utf8');\n  if(text!==JSON.stringify(JSON.parse(text),null,2)+'\\n')throw Error('Metadata JSON formatting differs: '+name);\n}\nNODE\n"
        },
        {
          "uses": "actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9", # v7.0.2
          "name": "Retain available driver output and bounded case summaries",
          "if": "always()",
          "timeout-minutes": 5,
          "with": {
            "name": "detekt-support-offline-${{ github.run_id }}-${{ github.run_attempt }}",
            "path": "${{ runner.temp }}/detekt-support-offline\n.publication/detekt-adoption/probes-hosted-*",
            "include-hidden-files": true,
            "if-no-files-found": "error",
            "retention-days": 7
          }
        }
      ]
    }
  }
}
