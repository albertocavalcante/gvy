# Temporary execution support only. Never merge into main or the product PR.
name: Launch boundaries failure-first proof
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verified-packaged-launch-publication-${{ github.sha }}
  cancel-in-progress: false
jobs:
  candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 160
    permissions:
      contents: read
    env:
      CARGO_BUILD_JOBS: 1
      JDK_JAVA_OPTIONS: '-Xmx512m'
      JAVA_TOOL_OPTIONS: '-Xmx512m -Dorg.gradle.deprecation.trace=true'
      GRADLE_OPTS: >-
        -Dorg.gradle.jvmargs="-Xmx1536m -XX:MaxMetaspaceSize=768m -XX:+UseSerialGC"
        -Dorg.gradle.workers.max=1 -Dorg.gradle.parallel=false -Dorg.gradle.daemon=false
      NODE_OPTIONS: '--max-old-space-size=768'
      SKIP_PREPARE_SERVER: 'true'
    steps:
      - name: Initialize evidence directory
        timeout-minutes: 1
        shell: bash
        run: |
          umask 077
          mkdir -m 700 "$RUNNER_TEMP/gvy-publication-proof"
          chmod 700 "$RUNNER_TEMP/gvy-publication-proof"
      - name: Checkout temporary support ref
        timeout-minutes: 5
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: support
          persist-credentials: false
      # PLACEHOLDERS MUST BE REPLACED AND INDEPENDENTLY REVIEWED BEFORE DISPATCH.
      # The exact published base, RED/GREEN trees, paths, patches and tests
      # belong in a reviewed closed receipt, never in user inputs.
      - name: Validate bounded RED and GREEN payloads
        timeout-minutes: 5
        id: receipt
        shell: bash
        run: |
          set -euo pipefail
          proof="$GITHUB_WORKSPACE/support/.publication"
          receipt="$proof/receipt.json"
          # This helper must fail closed on unknown/missing fields; verify the
          # fixed PR head, both compressed and decompressed sizes/SHA-256,
          # helper hashes, exact trees, paths, test names/counts and assertions.
          printf '%s  %s\n' "1e09eb02bd173c9b3e08a5388652aa5e25c8a287962ac4a872b56528b06cda0d" "$proof/validate-receipt.mjs" | sha256sum -c -
          node "$proof/validate-receipt.mjs" "$receipt" "0ce9a1b6c7c8bffa4f618d0af078af7fc39d645145ac93e297c587b51f1cdcc0"
          for pair in 'phase validate-phase.mjs' 'results check-red.mjs' 'worker review-fix.sh' 'capture bounded-capture.mjs' 'budget evidence-budget.mjs' 'copy bounded-file.mjs'; do
              read -r key file <<< "$pair"
              expected=$(jq -er --arg key "$key" '.helpers[$key]' "$receipt")
              printf '%s  %s\n' "$expected" "$proof/$file" | sha256sum -c -
          done
          phases=$(jq -er 'if .mode == "red-only" then "red" else "red", "green" end' "$receipt")
          for phase in $phases; do
              expected=$(jq -er --arg phase "$phase" '.[$phase].patch.compressedSha256' "$receipt")
              printf '%s  %s\n' "$expected" "$proof/$phase.patch.gz" | sha256sum -c -
              expected_bytes=$(jq -er --arg phase "$phase" '.[$phase].patch.compressedBytes' "$receipt")
              [[ "$(stat -c %s "$proof/$phase.patch.gz")" == "$expected_bytes" ]]
              python3 - "$proof/$phase.patch.gz" "$RUNNER_TEMP/$phase.patch" <<'PYBOUND'
          import gzip, pathlib, sys
          with gzip.open(sys.argv[1], 'rb') as stream:
              data = stream.read(131073)
          if len(data) > 131072:
              raise SystemExit('patch exceeds 128 KiB')
          pathlib.Path(sys.argv[2]).write_bytes(data)
          PYBOUND
              expected=$(jq -er --arg phase "$phase" '.[$phase].patch.sha256' "$receipt")
              expected_bytes=$(jq -er --arg phase "$phase" '.[$phase].patch.bytes' "$receipt")
              [[ "$(stat -c %s "$RUNNER_TEMP/$phase.patch")" == "$expected_bytes" ]]
              printf '%s  %s\n' "$expected" "$RUNNER_TEMP/$phase.patch" | sha256sum -c -
          done
          printf 'base=%s\n' "$(jq -er '.base' "$receipt")" >>"$GITHUB_OUTPUT"
      - name: Checkout reviewed published base
        timeout-minutes: 5
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.receipt.outputs.base }}
          path: candidate
          fetch-depth: 1
          persist-credentials: false
      - name: Apply tests-only RED and validate scope
        timeout-minutes: 5
        working-directory: candidate
        shell: bash
        env:
          EXPECTED_BASE: ${{ steps.receipt.outputs.base }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_BASE" == "dbc590b62c9ed92a846e7dfb3e92a00ffba4bdbd" && "$(git rev-parse HEAD)" == "$EXPECTED_BASE" ]]
          git switch -c feat/failure-boundaries-publication
          git apply --check --index "$RUNNER_TEMP/red.patch"
          git apply --index "$RUNNER_TEMP/red.patch"
          node "$GITHUB_WORKSPACE/support/.publication/validate-phase.mjs" red "$GITHUB_WORKSPACE/support/.publication/receipt.json"
          git diff --quiet
          git diff --cached --check
          test -z "$(git ls-files --others --exclude-standard)"
      - name: Set up Python
        timeout-minutes: 5
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
      - name: Set up JDK 17 for test workers
        timeout-minutes: 5
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up JDK 21 for Gradle
        timeout-minutes: 5
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Node
        timeout-minutes: 5
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24'
      - name: Set up pnpm
        timeout-minutes: 5
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 12.14.0
      - name: Install locked project tools
        timeout-minutes: 20
        working-directory: candidate
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --require-hashes --only-binary=:all: -r .reuse/bootstrap-requirements.txt
          uv sync --project .reuse --locked
          echo "$PWD/.reuse/.venv/bin" >>"$GITHUB_PATH"
          pnpm --dir editors/code install --frozen-lockfile
          rustup toolchain install --no-self-update --profile minimal 1.96.1
          rustup component add --toolchain 1.96.1 clippy rustfmt
          rustup target add --toolchain 1.96.1 wasm32-wasip2
      - name: Fetch checksum-pinned hook tools
        timeout-minutes: 10
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          bins="$RUNNER_TEMP/spdx-hook-bin"
          download="$RUNNER_TEMP/spdx-hook-download"
          mkdir -p "$bins" "$download"
          fetch() {
              local repo="$1" version="$2" asset="$3" digest="$4"
              gh release download "$version" --repo "$repo" --pattern "$asset" --dir "$download"
              printf '%s  %s\n' "$digest" "$download/$asset" | sha256sum -c -
          }
          fetch direnv/direnv v2.38.2 direnv.linux-amd64 148820a187930d36ca6a204504e5cdb30d8396cd1a97e64c3b3f10d793c11247
          install -m 755 "$download/direnv.linux-amd64" "$bins/direnv"
          fetch evilmartians/lefthook v2.2.2 lefthook_2.2.2_Linux_x86_64 4fbf89eb7748c6aed84d833ee1a29edac48fae614468ca9a82896ec32f2800b6
          install -m 755 "$download/lefthook_2.2.2_Linux_x86_64" "$bins/lefthook"
          fetch dprint/dprint 0.64.3 dprint-x86_64-unknown-linux-gnu.zip f71cb7e22d6776439eba168d5cb296092d6413fea7148fe4d70684a2702a4fee
          unzip -q "$download/dprint-x86_64-unknown-linux-gnu.zip" -d "$download/dprint"
          install -m 755 "$download/dprint/dprint" "$bins/dprint"
          fetch mikefarah/yq v4.52.4 yq_linux_amd64 0c4d965ea944b64b8fddaf7f27779ee3034e5693263786506ccd1c120f184e8c
          install -m 755 "$download/yq_linux_amd64" "$bins/yq"
          fetch koalaman/shellcheck v0.11.0 shellcheck-v0.11.0.linux.x86_64.tar.xz 8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198
          tar -xJf "$download/shellcheck-v0.11.0.linux.x86_64.tar.xz" -C "$download"
          install -m 755 "$download/shellcheck-v0.11.0/shellcheck" "$bins/shellcheck"
          fetch mvdan/sh v3.12.0 shfmt_v3.12.0_linux_amd64 d9fbb2a9c33d13f47e7618cf362a914d029d02a6df124064fff04fd688a745ea
          install -m 755 "$download/shfmt_v3.12.0_linux_amd64" "$bins/shfmt"
          fetch astral-sh/ruff 0.17.4 ruff-x86_64-unknown-linux-gnu.tar.gz 3ab2b34aeacdbc1ea5c529cdbda3e05792633d587228123fd09f3b5a0facb27a
          mkdir "$download/ruff"
          tar -xzf "$download/ruff-x86_64-unknown-linux-gnu.tar.gz" -C "$download/ruff"
          install -m 755 "$download/ruff/ruff-x86_64-unknown-linux-gnu/ruff" "$bins/ruff"
          fetch rhysd/actionlint v1.7.9 actionlint_1.7.9_linux_amd64.tar.gz 233b280d05e100837f4af1433c7b40a5dcb306e3aa68fb4f17f8a7f45a7df7b4
          mkdir "$download/actionlint"
          tar -xzf "$download/actionlint_1.7.9_linux_amd64.tar.gz" -C "$download/actionlint"
          install -m 755 "$download/actionlint/actionlint" "$bins/actionlint"
          fetch suzuki-shunsuke/ghalint v1.5.4 ghalint_1.5.4_linux_amd64.tar.gz 977555b7142cc057aad4663679772510a9ed3f1687f26f2359d18bb6b67314fe
          mkdir "$download/ghalint"
          tar -xzf "$download/ghalint_1.5.4_linux_amd64.tar.gz" -C "$download/ghalint"
          install -m 755 "$download/ghalint/ghalint" "$bins/ghalint"
          echo "$bins" >>"$GITHUB_PATH"
      - name: Validate reviewed failure-first controls
        timeout-minutes: 75
        working-directory: candidate
        shell: bash
        env:
          EXPECTED_BASE: ${{ steps.receipt.outputs.base }}
        run: |
          set -euo pipefail
          proof="$RUNNER_TEMP/gvy-publication-proof"
          support="$GITHUB_WORKSPACE/support/.publication"
          [[ -z "${LEFTHOOK:-}" && -z "${LEFTHOOK_EXCLUDE:-}" && -z "${LEFTHOOK_SKIP:-}" ]]
          [[ -z "$(git config --get core.hooksPath || true)" ]]
          # Required helpers are separately hashed in the reviewed receipt.
          # They must retain original command/capture status and raw logs, use
          # the repository's existing unmodified diagnostic ledger. No helper
          # may publish.
          shellcheck --rcfile tools/lint/shellcheckrc "$support/review-fix.sh"
          shfmt -i 4 -ci -d "$support/review-fix.sh"
          bash -n "$support/review-fix.sh"
          node --check "$support/validate-phase.mjs"
          node --check "$support/check-red.mjs"
          bash "$support/review-fix.sh"
          # Helper must require exact RED assertions, GREEN tests, lintFix/lint and all
          # six diagnostic gates. It must verify the branch/parent/tree,
          # paths, hooks and post-commit diagnostics before creating a bundle.
          mode=$(jq -er '.mode' "$support/receipt.json")
          if [[ "$mode" == red-green ]]; then
              test -s "$proof/candidate.bundle"
          fi
          test -s "$proof/receipt.json"
          jq -e '.exit == 0 and .phase == "complete-red"' "$proof/result.json" >/dev/null
      - name: Upload candidate and evidence
        timeout-minutes: 5
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gvy-packaged-launch-publication-proof
          path: ${{ runner.temp }}/gvy-publication-proof/
          if-no-files-found: error
          retention-days: 7
