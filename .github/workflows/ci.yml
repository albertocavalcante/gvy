          import json
          import os
          import pathlib
          import sys
          import xml.etree.ElementTree as ET
          import zipfile

          private = pathlib.Path(sys.argv[2])
          LIMIT = 256 * 1024
          def read_jupiter(path):
              import os
              import pathlib
              import stat
          
              path = pathlib.Path(path)
              try:
                  descriptor = os.open(path, os.O_RDONLY | os.O_NOFOLLOW | os.O_NONBLOCK)
                  with os.fdopen(descriptor, "rb") as stream:
                      initial = os.fstat(stream.fileno())
                      if not stat.S_ISREG(initial.st_mode) or initial.st_size > LIMIT:
                          return "oversize_or_not_regular", None
                      raw = stream.read(LIMIT + 1)
                      final = os.fstat(stream.fileno())
                  current = path.lstat()
                  if (initial.st_dev, initial.st_ino, initial.st_size, initial.st_mtime_ns) != (final.st_dev, final.st_ino, final.st_size, final.st_mtime_ns):
                      return "changed", None
                  if (final.st_dev, final.st_ino) != (current.st_dev, current.st_ino) or len(raw) > LIMIT:
                      return "changed", None
                  if b"\x00" in raw:
                      return "invalid_encoding", None
                  try:
                      raw.decode("utf-8", "strict")
                  except UnicodeDecodeError:
                      return "invalid_encoding", None
                  if b"<!DOCTYPE" in raw.upper():
                      return "dtd_rejected", None
                  return "present", raw
              except FileNotFoundError:
                  return "missing", None
              except OSError:
                  return "unreadable", None
          
          modules = {
              "build-tool": ("build-tool_test", "com.github.albertocavalcante.gvy.build.LoggingProviderTest"),
              "jenkins": ("jenkins_test", "com.github.albertocavalcante.gvy.jenkins.LoggingProviderTest"),
          }
          expected = {
              "test logging uses the Logback provider()",
              "quiet test policy retains warnings and errors and allows a restored debug override()",
          }
          result = []
          for module, (target, classname) in modules.items():
              path = private / module / "TEST-junit-jupiter.xml"
              state, raw = read_jupiter(path)
              if state != "present" or raw is None:
                  raise SystemExit("missing or oversized private JUnit report")
              root = ET.fromstring(raw)
              cases = root.findall(".//testcase")
              if len(cases) != 2 or {x.get("name") for x in cases} != expected:
                  raise SystemExit("unexpected test case inventory")
              if any(x.get("classname") != classname or list(x.findall("failure")) or list(x.findall("error")) or list(x.findall("skipped")) for x in cases):
                  raise SystemExit("unexpected test class or outcome")
              result.append({"module": module, "class": classname, "cases": sorted(expected), "passed": 2, "errors": 0, "failures": 0, "skipped": 0, "xmlSha256": hashlib.sha256(raw).hexdigest()})
          receipt = {"schemaVersion": 1, "sourceHead": "f04406dac415a5b7cc1698ca8feb0d0de3e9e956", "testedHead": "1cd527e018f1cf397acb25f01a98dfa0a6662c5b", "testedTree": "71d313b3e182b2bc7de166a8308f33b2a03e2ea5", "runId": os.environ["GITHUB_RUN_ID"], "attempt": os.environ["GITHUB_RUN_ATTEMPT"], "invocation": "two direct Bazel target tests, no test-result cache", "bazelExit": {"build-tool": 0, "jenkins": 0}, "captureExit": {"build-tool": 0, "jenkins": 0}, "cleanupExit": 0, "results": result}
          pathlib.Path(sys.argv[1]).write_text(json.dumps(receipt, sort_keys=True) + "\n")
          PY
