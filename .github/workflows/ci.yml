# Temporary execution support only. Never merge into main or the product PR.
name: Packaged launch hosted proof
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: packaged-launch-proof-${{ github.sha }}
  cancel-in-progress: false
jobs:
  candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
    env:
      CARGO_BUILD_JOBS: 1
      JDK_JAVA_OPTIONS: '-Xmx512m'
      JAVA_TOOL_OPTIONS: '-Xmx512m'
      GRADLE_OPTS: >-
        -Dorg.gradle.jvmargs="-Xmx1536m -XX:MaxMetaspaceSize=768m -XX:+UseSerialGC"
        -Dorg.gradle.workers.max=1 -Dorg.gradle.parallel=false -Dorg.gradle.daemon=false
      NODE_OPTIONS: '--max-old-space-size=768'
      SKIP_PREPARE_SERVER: 'true'
    steps:
      - name: Checkout temporary support ref
        timeout-minutes: 5
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: support
          persist-credentials: false
      - name: Validate support receipt
        timeout-minutes: 5
        id: receipt
        shell: bash
        run: |
          set -euo pipefail
          receipt="$GITHUB_WORKSPACE/support/.publication/receipt.json"
          mkdir -p "$RUNNER_TEMP/gvy-pr03a-proof"
          cp "$receipt" "$RUNNER_TEMP/gvy-pr03a-proof/support-receipt.json"
          base=$(jq -er '.base' "$receipt")
          tree=$(jq -er '.tree' "$receipt")
          digest=$(jq -er '.patchSha256' "$receipt")
          compressed=$(jq -er '.payloadSha256' "$receipt")
          [[ "$base" =~ ^[0-9a-f]{40}$ && "$tree" =~ ^[0-9a-f]{40}$ && "$digest" =~ ^[0-9a-f]{64}$ && "$compressed" =~ ^[0-9a-f]{64}$ ]]
          printf '%s  %s\n' "$compressed" "$GITHUB_WORKSPACE/support/.publication/payload.patch.gz" | sha256sum -c -
          [[ "$(stat -c %s "$GITHUB_WORKSPACE/support/.publication/payload.patch.gz")" == "$(jq -er '.payloadBytes' "$receipt")" ]]
          [[ "$(jq -er '.payloadBytes' "$receipt")" -le 65536 ]]
          [[ "$(jq -er '.patchBytes' "$receipt")" -le 131072 ]]
          python3 - "$GITHUB_WORKSPACE/support/.publication/payload.patch.gz" "$RUNNER_TEMP/gvy-reviewed.patch" <<'PYBOUND'
          import gzip, pathlib, sys
          with gzip.open(sys.argv[1], 'rb') as stream:
              data = stream.read(131073)
          if len(data) > 131072:
              raise SystemExit('patch exceeds 128 KiB')
          pathlib.Path(sys.argv[2]).write_bytes(data)
          PYBOUND
          [[ "$(stat -c %s "$RUNNER_TEMP/gvy-reviewed.patch")" == "$(jq -er '.patchBytes' "$receipt")" ]]
          printf '%s  %s\n' "$digest" "$RUNNER_TEMP/gvy-reviewed.patch" | sha256sum -c -
          printf 'base=%s\ntree=%s\npatch=%s\n' "$base" "$tree" "$digest" >> "$GITHUB_OUTPUT"
      - name: Checkout exact approved base
        timeout-minutes: 5
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.receipt.outputs.base }}
          path: candidate
          fetch-depth: 1
          persist-credentials: false
      - name: Apply reviewed patch and prove tree
        timeout-minutes: 5
        working-directory: candidate
        shell: bash
        env:
          EXPECTED_BASE: ${{ steps.receipt.outputs.base }}
          EXPECTED_TREE: ${{ steps.receipt.outputs.tree }}
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "$EXPECTED_BASE" ]]
          git switch -c feat/verified-packaged-launch
          git apply --check --index "$RUNNER_TEMP/gvy-reviewed.patch"
          git apply --index "$RUNNER_TEMP/gvy-reviewed.patch"
          [[ "$(git write-tree)" == "$EXPECTED_TREE" ]]
          git diff --quiet
          git diff --cached --check
          printf '%s\0' tests/BUILD.bazel tests/build.gradle.kts tests/e2e/kotlin/com/github/albertocavalcante/gvy/gls/e2e/LanguageServerSession.kt tests/e2e/kotlin/com/github/albertocavalcante/gvy/gls/e2e/LanguageServerSessionFactory.kt tests/e2e/kotlin/com/github/albertocavalcante/gvy/gls/e2e/PackagedLaunch.kt tests/e2e/kotlin/com/github/albertocavalcante/gvy/gls/e2e/PackagedLaunchTest.kt tests/e2e/kotlin/com/github/albertocavalcante/gvy/gls/e2e/PackagedSessionFactoryTest.kt > "$RUNNER_TEMP/expected-paths.nul"
          git diff --cached --name-only --diff-filter=ACMRT -z > "$RUNNER_TEMP/actual-paths.nul"
          cmp "$RUNNER_TEMP/expected-paths.nul" "$RUNNER_TEMP/actual-paths.nul"
          test -z "$(git ls-files --others --exclude-standard)"
      - name: Set up Python
        timeout-minutes: 5
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
      - name: Set up minimum test JDK
        timeout-minutes: 5
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up JDK
        timeout-minutes: 5
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Node
        timeout-minutes: 5
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24'
      - name: Set up pnpm
        timeout-minutes: 5
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 12.14.0
      - name: Install locked project tools
        timeout-minutes: 10
        working-directory: candidate
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --require-hashes --only-binary=:all: -r .reuse/bootstrap-requirements.txt
          uv sync --project .reuse --locked
          echo "$PWD/.reuse/.venv/bin" >> "$GITHUB_PATH"
          pnpm --dir editors/code install --frozen-lockfile
          rustup toolchain install --no-self-update --profile minimal 1.96.1
          rustup component add --toolchain 1.96.1 clippy rustfmt
          rustup target add --toolchain 1.96.1 wasm32-wasip2
      - name: Fetch checksum-pinned hook tools
        timeout-minutes: 10
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          bins="$RUNNER_TEMP/spdx-hook-bin"
          download="$RUNNER_TEMP/spdx-hook-download"
          mkdir -p "$bins" "$download"
          fetch() {
            local repo="$1" version="$2" asset="$3" digest="$4"
            gh release download "$version" --repo "$repo" --pattern "$asset" --dir "$download"
            printf '%s  %s\n' "$digest" "$download/$asset" | sha256sum -c -
          }
          fetch direnv/direnv v2.38.2 direnv.linux-amd64 148820a187930d36ca6a204504e5cdb30d8396cd1a97e64c3b3f10d793c11247
          install -m 755 "$download/direnv.linux-amd64" "$bins/direnv"
          fetch evilmartians/lefthook v2.2.2 lefthook_2.2.2_Linux_x86_64 4fbf89eb7748c6aed84d833ee1a29edac48fae614468ca9a82896ec32f2800b6
          install -m 755 "$download/lefthook_2.2.2_Linux_x86_64" "$bins/lefthook"
          fetch dprint/dprint 0.64.3 dprint-x86_64-unknown-linux-gnu.zip f71cb7e22d6776439eba168d5cb296092d6413fea7148fe4d70684a2702a4fee
          unzip -q "$download/dprint-x86_64-unknown-linux-gnu.zip" -d "$download/dprint"
          install -m 755 "$download/dprint/dprint" "$bins/dprint"
          fetch mikefarah/yq v4.52.4 yq_linux_amd64 0c4d965ea944b64b8fddaf7f27779ee3034e5693263786506ccd1c120f184e8c
          install -m 755 "$download/yq_linux_amd64" "$bins/yq"
          fetch koalaman/shellcheck v0.11.0 shellcheck-v0.11.0.linux.x86_64.tar.xz 8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198
          tar -xJf "$download/shellcheck-v0.11.0.linux.x86_64.tar.xz" -C "$download"
          install -m 755 "$download/shellcheck-v0.11.0/shellcheck" "$bins/shellcheck"
          fetch mvdan/sh v3.12.0 shfmt_v3.12.0_linux_amd64 d9fbb2a9c33d13f47e7618cf362a914d029d02a6df124064fff04fd688a745ea
          install -m 755 "$download/shfmt_v3.12.0_linux_amd64" "$bins/shfmt"
          fetch astral-sh/ruff 0.17.4 ruff-x86_64-unknown-linux-gnu.tar.gz 3ab2b34aeacdbc1ea5c529cdbda3e05792633d587228123fd09f3b5a0facb27a
          mkdir "$download/ruff"; tar -xzf "$download/ruff-x86_64-unknown-linux-gnu.tar.gz" -C "$download/ruff"
          install -m 755 "$download/ruff/ruff-x86_64-unknown-linux-gnu/ruff" "$bins/ruff"
          fetch rhysd/actionlint v1.7.9 actionlint_1.7.9_linux_amd64.tar.gz 233b280d05e100837f4af1433c7b40a5dcb306e3aa68fb4f17f8a7f45a7df7b4
          mkdir "$download/actionlint"; tar -xzf "$download/actionlint_1.7.9_linux_amd64.tar.gz" -C "$download/actionlint"
          install -m 755 "$download/actionlint/actionlint" "$bins/actionlint"
          fetch suzuki-shunsuke/ghalint v1.5.4 ghalint_1.5.4_linux_amd64.tar.gz 977555b7142cc057aad4663679772510a9ed3f1687f26f2359d18bb6b67314fe
          mkdir "$download/ghalint"; tar -xzf "$download/ghalint_1.5.4_linux_amd64.tar.gz" -C "$download/ghalint"
          install -m 755 "$download/ghalint/ghalint" "$bins/ghalint"
          echo "$bins" >> "$GITHUB_PATH"
      - name: Validate proof support and run RED GREEN controls
        timeout-minutes: 40
        working-directory: candidate
        shell: bash
        env:
          EXPECTED_BASE: ${{ steps.receipt.outputs.base }}
          EXPECTED_TREE: ${{ steps.receipt.outputs.tree }}
        run: |
          set -euo pipefail
          proof="$GITHUB_WORKSPACE/support/.publication"
          for pair in 'proofScriptSha256 prove.sh' 'checkerSha256 check-results.mjs' 'fixSha256 alias-socket.patch'; do
            read -r key file <<< "$pair"
            digest=$(jq -er --arg key "$key" '.[$key]' "$proof/receipt.json")
            [[ "$digest" =~ ^[0-9a-f]{64}$ ]]
            printf '%s  %s\n' "$digest" "$proof/$file" | sha256sum -c -
          done
          shellcheck "$proof/prove.sh"
          shfmt -i 4 -ci -d "$proof/prove.sh"
          bash -n "$proof/prove.sh"
          node --check "$proof/check-results.mjs"
          bash "$proof/prove.sh"
      - name: Upload source delta and evidence on success or failure
        timeout-minutes: 5
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gvy-pr03a-control-proof
          path: ${{ runner.temp }}/gvy-pr03a-proof/
          if-no-files-found: warn
          retention-days: 7
