# Temporary execution branch. Never merge this workflow into main.
name: B04 hosted hover token coordinate GREEN
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: b04-hover-green-publication-${{ github.ref }}
  cancel-in-progress: false
jobs:
  candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      JDK_JAVA_OPTIONS: '-Xmx512m'
      JAVA_TOOL_OPTIONS: '-Xmx512m'
      GRADLE_OPTS: >-
        -Dorg.gradle.jvmargs="-Xmx1536m -XX:MaxMetaspaceSize=768m -XX:+UseSerialGC"
        -Dorg.gradle.workers.max=1 -Dorg.gradle.parallel=false -Dorg.gradle.daemon=false
        -Dorg.gradle.deprecation.trace=true
      NODE_OPTIONS: '--max-old-space-size=768'
    steps:
      - name: Checkout temporary support ref
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: support
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24.22.2'
          package-manager-cache: false
      - name: Validate fixed reviewed payload
        id: receipt
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'JS'
          import { appendFileSync, copyFileSync, mkdirSync, writeFileSync } from 'node:fs';
          import { createHash } from 'node:crypto';
          import { gunzipSync } from 'node:zlib';
          import { readEvidenceBytes, readEvidenceText } from './support/tools/ci/read-evidence.mjs';
          try {
            const root = process.env.GITHUB_WORKSPACE + '/support/.publication/';
            const r = JSON.parse(readEvidenceText(root + 'receipt.json', 4096));
            const keys = [
              "schemaVersion",
              "profile",
              "base",
              "tree",
              "sourceDisposition",
              "sourcePath",
              "sourceBlob",
              "sourceSha256",
              "testClass",
              "expectedTestCount",
              "expectedTestNames",
              "gradleVersion",
              "gradleSha256",
              "gradleCacheKey",
              "wrapperJarSha256",
              "patchBytes",
              "patchSha256",
              "payloadBytes",
              "payloadSha256",
              "baseSourceBlob",
              "testSourcePath",
              "testSourceBlob",
              "testSourceSha256",
            ];
            const valid = value => { if (!value) throw new Error(); };
            valid(JSON.stringify(Object.keys(r).sort()) === JSON.stringify(keys.sort()));
            valid(r.schemaVersion === 2);
            valid(r.profile === "b04-hover-token-coordinates-green-v1");
            valid(r.sourceDisposition === "replace-existing");
            valid(r.baseSourceBlob === "3f3e9bae923a626bc34615dba3a89842b7635869");
            valid(r.testSourcePath === "gls/src/test/kotlin/com/github/albertocavalcante/gvy/gls/providers/hover/HoverTokenCoordinatesTest.kt");
            valid(r.testSourceBlob === "94056cb8dde602df53d47d9be481c852d9d00cd2");
            valid(r.testSourceSha256 === "6afaddbdbe4d3918c84a428ebf6e4afb272602948820448560fe97860059b169");
            valid(r.sourcePath === "gls/src/main/kotlin/com/github/albertocavalcante/gvy/gls/providers/hover/HoverIdentifierRange.kt");
            valid(r.base === "1d66f5291bed55d1823ec6da5b534c034a73489a");
            valid(r.tree === "70f7fb125b6207b579a955c3f9c4176f09f33fed");
            valid(r.sourceBlob === "095b65ad6a8afc9188be1b8c05f22c98b0ee0d83");
            valid(r.sourceSha256 === "d5e1c9b10d04916cf9c8051b18ba310258883e2e3230b46d2625fef12c9eea4e");
            valid(r.patchSha256 === "2d13847dca61a8107de8318511eca3363093fdc08a0d6b14a79a9b1891d770ed");
            valid(r.patchBytes === 1767);
            valid(r.payloadBytes === 716);
            valid(r.payloadSha256 === "12a3e2011fd53d0d02c84f9229fb4894fc8104ff26cf4d5f373c38f9ff617b75");
            valid(r.testClass === "com.github.albertocavalcante.gvy.gls.providers.hover.HoverTokenCoordinatesTest");
            valid(r.expectedTestCount === 4);
            valid(JSON.stringify(r.expectedTestNames) === JSON.stringify([
              "code after a two emoji comment remains hoverable at its first character()",
              "a comment after an emoji comment rejects hover at its first slash()",
              "string whitespace after a two emoji comment remains a valid hover position()",
              "native hover after a two emoji comment returns String content and its UTF16 range()",
            ]));
            valid(r.gradleVersion === '9.8.2' && r.gradleCacheKey === '8wepis63pzuhrlfaiy04bagwu');
            valid(r.gradleSha256 === '21bd5da2de49b642904077f38c0efdc7778e92b3ed0889392dca61b97e389607');
            valid(r.wrapperJarSha256 === '3b8a25775a69158b5ad2b1d17a80a88dc7b40a352a73eb27d06c612a7ce68e98');
            for (const key of ['base', 'tree', 'sourceBlob', 'baseSourceBlob', 'testSourceBlob']) valid(typeof r[key] === 'string' && /^[0-9a-f]{40}$/.test(r[key]));
            valid(typeof r.payloadSha256 === 'string' && /^[0-9a-f]{64}$/.test(r.payloadSha256));
            valid(Number.isSafeInteger(r.patchBytes) && r.patchBytes > 0 && r.patchBytes <= 65536);
            valid(Number.isSafeInteger(r.payloadBytes) && r.payloadBytes > 0 && r.payloadBytes <= 16384);
            const payload = readEvidenceBytes(root + 'payload.patch.gz', 16384);
            const digest = bytes => createHash('sha256').update(bytes).digest('hex');
            valid(payload.length === r.payloadBytes && digest(payload) === r.payloadSha256);
            const patch = gunzipSync(payload, { maxOutputLength: 65536 });
            valid(patch.length === r.patchBytes && digest(patch) === r.patchSha256);
            writeFileSync(process.env.RUNNER_TEMP + '/gvy-b04-hover-green-reviewed.patch', patch, { flag: 'wx' });
            const proof = process.env.RUNNER_TEMP + '/gvy-b04-hover-green-publication-proof';
            mkdirSync(proof);
            copyFileSync(root + 'receipt.json', proof + '/input-receipt.json');
            appendFileSync(process.env.GITHUB_OUTPUT, `base=${r.base}\ntree=${r.tree}\nsourceBlob=${r.sourceBlob}\nsourceSha256=${r.sourceSha256}\nbaseSourceBlob=${r.baseSourceBlob}\ntestSourceBlob=${r.testSourceBlob}\ntestSourceSha256=${r.testSourceSha256}\n`);
          } catch {
            console.error('B04_PAYLOAD_VALIDATION_FAILED');
            process.exitCode = 1;
          }
          JS
      - name: Checkout exact candidate base
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.receipt.outputs.base }}
          path: candidate
          fetch-depth: 1
          persist-credentials: false
      - name: Apply only the reviewed hover caller correction
        working-directory: candidate
        shell: bash
        env:
          EXPECTED_BASE: ${{ steps.receipt.outputs.base }}
          EXPECTED_TREE: ${{ steps.receipt.outputs.tree }}
          EXPECTED_BLOB: ${{ steps.receipt.outputs.sourceBlob }}
          EXPECTED_SOURCE_SHA: ${{ steps.receipt.outputs.sourceSha256 }}
          EXPECTED_BASE_SOURCE_BLOB: ${{ steps.receipt.outputs.baseSourceBlob }}
          EXPECTED_TEST_BLOB: ${{ steps.receipt.outputs.testSourceBlob }}
          EXPECTED_TEST_SHA: ${{ steps.receipt.outputs.testSourceSha256 }}
        run: |
          set -euo pipefail
          source='gls/src/main/kotlin/com/github/albertocavalcante/gvy/gls/providers/hover/HoverIdentifierRange.kt'
          [[ "$(git rev-parse HEAD)" == "$EXPECTED_BASE" ]]
          [[ -f "$source" && ! -L "$source" ]]
          source_mode=$(git ls-tree --format='%(objectmode)' HEAD -- "$source")
          source_blob=$(git rev-parse "HEAD:$source")
          working_blob=$(git hash-object "$source")
          [[ "$source_mode" == 100644 && "$source_blob" == "$EXPECTED_BASE_SOURCE_BLOB" && "$working_blob" == "$EXPECTED_BASE_SOURCE_BLOB" ]]
          test_source='gls/src/test/kotlin/com/github/albertocavalcante/gvy/gls/providers/hover/HoverTokenCoordinatesTest.kt'
          [[ -f "$test_source" && ! -L "$test_source" ]]
          test_blob=$(git rev-parse "HEAD:$test_source")
          [[ "$test_blob" == "$EXPECTED_TEST_BLOB" ]]
          printf '%s  %s\n' "$EXPECTED_TEST_SHA" "$test_source" | sha256sum -c -
          status_before=$(git status --porcelain --untracked-files=all)
          [[ -z "$status_before" ]]
          git switch -c fix/bench-hover-token-coordinates-hosted
          git apply --check --index "$RUNNER_TEMP/gvy-b04-hover-green-reviewed.patch"
          git apply --index "$RUNNER_TEMP/gvy-b04-hover-green-reviewed.patch"
          changed_paths=$(git diff --cached --name-only "$EXPECTED_BASE")
          mapfile -t changed <<<"$changed_paths"
          [[ ${#changed[@]} == 1 && "${changed[0]}" == "$source" ]]
          [[ "$(git write-tree)" == "$EXPECTED_TREE" && "$(git rev-parse ":$source")" == "$EXPECTED_BLOB" ]]
          printf '%s  %s\n' "$EXPECTED_SOURCE_SHA" "$source" | sha256sum -c -
          git diff --quiet
          git diff --cached --check
      - name: Set up JDK for compilation and explicit test runtime
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '21.0.13+9'
      - name: Set up Python for bounded JUnit inspection
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11.18'
      - name: Provision checksum-pinned Gradle and normal hook runner
        working-directory: candidate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ -z "${GRADLE_USER_HOME:-}" ]]
          properties=gradle/wrapper/gradle-wrapper.properties
          for setting in 'distributionBase=GRADLE_USER_HOME' 'distributionPath=wrapper/dists' 'zipStoreBase=GRADLE_USER_HOME' 'zipStorePath=wrapper/dists' 'distributionUrl=https\://services.gradle.org/distributions/gradle-9.8.2-bin.zip' 'distributionSha256Sum=21bd5da2de49b642904077f38c0efdc7778e92b3ed0889392dca61b97e389607'; do
              grep -Fqx "$setting" "$properties"
          done
          [[ "$(grep -c '^distributionUrl=' "$properties")" == 1 ]]
          [[ "$(grep -c '^distributionSha256Sum=' "$properties")" == 1 ]]
          printf '%s  %s\n' 3b8a25775a69158b5ad2b1d17a80a88dc7b40a352a73eb27d06c612a7ce68e98 gradle/wrapper/gradle-wrapper.jar | sha256sum -c -
          # Official PathAssembler URL key; SHA-256 below verifies the archive.
          cache="$HOME/.gradle/wrapper/dists/gradle-9.8.2-bin/8wepis63pzuhrlfaiy04bagwu"
          test ! -e "$cache" && test ! -L "$cache"
          mkdir -p "$cache"
          mkdir "$RUNNER_TEMP/b04-hover-green-gradle-download"
          gh release download v9.8.2 --repo gradle/gradle-distributions --pattern gradle-9.8.2-bin.zip --dir "$RUNNER_TEMP/b04-hover-green-gradle-download"
          archive="$RUNNER_TEMP/b04-hover-green-gradle-download/gradle-9.8.2-bin.zip"
          [[ "$(stat -c %s "$archive")" == 151620138 ]]
          printf '%s  %s\n' 21bd5da2de49b642904077f38c0efdc7778e92b3ed0889392dca61b97e389607 "$archive" | sha256sum -c -
          mv "$archive" "$cache/gradle-9.8.2-bin.zip"
          jq -n '{version:"9.8.2",sha256:"21bd5da2de49b642904077f38c0efdc7778e92b3ed0889392dca61b97e389607",bytes:151620138,checksumVerified:true,cacheLayout:"gradle-wrapper-default"}' >"$RUNNER_TEMP/gvy-b04-hover-green-publication-proof/gradle-bootstrap.json"
          mkdir "$RUNNER_TEMP/b04-hover-green-hook-bin"
          gh release download v2.2.2 --repo evilmartians/lefthook --pattern lefthook_2.2.2_Linux_x86_64 --dir "$RUNNER_TEMP/b04-hover-green-hook-bin"
          printf '%s  %s\n' 4fbf89eb7748c6aed84d833ee1a29edac48fae614468ca9a82896ec32f2800b6 "$RUNNER_TEMP/b04-hover-green-hook-bin/lefthook_2.2.2_Linux_x86_64" | sha256sum -c -
          mv "$RUNNER_TEMP/b04-hover-green-hook-bin/lefthook_2.2.2_Linux_x86_64" "$RUNNER_TEMP/b04-hover-green-hook-bin/lefthook"
          chmod 755 "$RUNNER_TEMP/b04-hover-green-hook-bin/lefthook"
          echo "$RUNNER_TEMP/b04-hover-green-hook-bin" >>"$GITHUB_PATH"
      - name: Run normal formatter with canonical Gradle diagnostics
        id: formatted
        working-directory: candidate
        shell: bash
        env:
          EXPECTED_BASE: ${{ steps.receipt.outputs.base }}
          EXPECTED_TREE: ${{ steps.receipt.outputs.tree }}
          EXPECTED_TEST_BLOB: ${{ steps.receipt.outputs.testSourceBlob }}
          EXPECTED_TEST_SHA: ${{ steps.receipt.outputs.testSourceSha256 }}
        run: |
          set -euo pipefail
          proof="$RUNNER_TEMP/gvy-b04-hover-green-publication-proof"
          source='gls/src/main/kotlin/com/github/albertocavalcante/gvy/gls/providers/hover/HoverIdentifierRange.kt'
          test_source='gls/src/test/kotlin/com/github/albertocavalcante/gvy/gls/providers/hover/HoverTokenCoordinatesTest.kt'
          [[ -f "$test_source" && ! -L "$test_source" ]]
          test_blob=$(git rev-parse "HEAD:$test_source")
          [[ "$test_blob" == "$EXPECTED_TEST_BLOB" ]]
          printf '%s  %s\n' "$EXPECTED_TEST_SHA" "$test_source" | sha256sum -c -
          head=$(git rev-parse HEAD)
          [[ "$head" == "$EXPECTED_BASE" ]]
          [[ "$(git write-tree)" == "$EXPECTED_TREE" ]]
          jq -n --arg source "$head" --arg support "$GITHUB_SHA" --arg tree "$EXPECTED_TREE" \
              '{sourceHead:$source,supportHead:$support,inputTree:$tree,overlay:true}' >"$proof/format-input-context.json"
          if GITHUB_SHA="$EXPECTED_BASE" timeout --signal=TERM --kill-after=30s 15m node tools/ci/run-gradle.mjs --report-root "$proof/gradle" --producer b04-format lintFix --no-daemon --no-parallel --max-workers=1 -PtestJavaVersion=21 --stacktrace; then
              status=0
          else
              status=$?
          fi
          jq -n --argjson exitCode "$status" '{exitCode:$exitCode,overlay:true}' >"$proof/format-status.json"
          git diff --name-only >"$proof/formatter-changed-paths.txt"
          git diff -- "$source" >"$proof/formatter-only.diff"
          cp "$source" "$proof/formatted-HoverIdentifierRange.kt"
          if [[ "$status" != 0 ]]; then
              exit "$status"
          fi
          mapfile -t changed <"$proof/formatter-changed-paths.txt"
          [[ ${#changed[@]} == 0 || (${#changed[@]} == 1 && "${changed[0]}" == "$source") ]]
          git ls-files --others --exclude-standard -z >"$proof/formatter-untracked-paths.nul"
          test ! -s "$proof/formatter-untracked-paths.nul"
          git add "$source"
          git diff --quiet
          changed_paths=$(git diff --cached --name-only HEAD)
          mapfile -t changed <<<"$changed_paths"
          [[ ${#changed[@]} == 1 && "${changed[0]}" == "$source" ]]
          tree=$(git write-tree)
          blob=$(git rev-parse ":$source")
          digest=$(sha256sum "$source" | cut -d' ' -f1)
          printf 'tree=%s\nsourceBlob=%s\nsourceSha256=%s\n' "$tree" "$blob" "$digest" >>"$GITHUB_OUTPUT"
          jq -n --arg inputTree "$EXPECTED_TREE" --arg tree "$tree" --arg blob "$blob" --arg digest "$digest" \
              '{inputTree:$inputTree,tree:$tree,sourceBlob:$blob,sourceSha256:$digest,postBundleReview:"required"}' >"$proof/formatted-source.json"
      - name: Commit through normal hooks and export exact source proof
        working-directory: candidate
        shell: bash
        env:
          EXPECTED_BASE: ${{ steps.receipt.outputs.base }}
          EXPECTED_TREE: ${{ steps.formatted.outputs.tree }}
          INPUT_TREE: ${{ steps.receipt.outputs.tree }}
          SOURCE_SHA: ${{ steps.formatted.outputs.sourceSha256 }}
          SOURCE_BLOB: ${{ steps.formatted.outputs.sourceBlob }}
          EXPECTED_TEST_BLOB: ${{ steps.receipt.outputs.testSourceBlob }}
          EXPECTED_TEST_SHA: ${{ steps.receipt.outputs.testSourceSha256 }}
        run: |
          set -euo pipefail
          proof="$RUNNER_TEMP/gvy-b04-hover-green-publication-proof"
          [[ -z "${LEFTHOOK:-}" && -z "${LEFTHOOK_EXCLUDE:-}" && -z "${LEFTHOOK_SKIP:-}" ]]
          if git config --get core.hooksPath >/dev/null; then
              printf '%s\n' 'B04_HOOKS_PATH_MUST_BE_UNSET' >&2
              exit 1
          else
              hooks_query_status=$?
              [[ "$hooks_query_status" == 1 ]] || exit "$hooks_query_status"
          fi
          lefthook install
          test -x .git/hooks/pre-commit && test -x .git/hooks/commit-msg
          git config user.name 'gvy publication automation'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git diff --quiet
          [[ "$(git write-tree)" == "$EXPECTED_TREE" ]]
          set +e
          timeout --signal=TERM --kill-after=30s 15m git commit -m 'fix(hover): query token contexts with UTF-16 offsets' 2>&1 | (
              ulimit -f 131072
              exec tee "$proof/commit-hooks.log"
          )
          statuses=("${PIPESTATUS[@]}")
          set -e
          jq -n --argjson commandExitCode "${statuses[0]}" --argjson captureExitCode "${statuses[1]}" \
              '{commandExitCode:$commandExitCode,captureExitCode:$captureExitCode}' >"$proof/hooks-status.json"
          head_after_hooks=$(git rev-parse HEAD)
          # The pure log classifier has no Git guard; retain its observed source binding separately.
          jq -n --arg before "$EXPECTED_BASE" --arg after "$head_after_hooks" --arg tree "$EXPECTED_TREE" --arg support "$GITHUB_SHA" \
              '{scope:"post-hook-source-binding",headBeforeHooks:$before,headAfterHooks:$after,sourceTreeDuringHooks:$tree,supportHead:$support}' >"$proof/hook-source-context.json"
          if GITHUB_SHA="$head_after_hooks" node tools/ci/check-gradle-diagnostics.mjs --log "$proof/commit-hooks.log" --report "$proof/hook-diagnostics" --baseline tools/ci/gradle-diagnostics.json --producer b04-commit-hooks --root "$PWD" --exit-code "${statuses[0]}" --capture-exit-code "${statuses[1]}"; then
              diagnostic=0
          else
              diagnostic=$?
          fi
          [[ "${statuses[0]}" == 0 && "${statuses[1]}" == 0 && "$diagnostic" == 0 ]]
          [[ "$(git rev-parse HEAD^)" == "$EXPECTED_BASE" && "$(git rev-parse 'HEAD^{tree}')" == "$EXPECTED_TREE" ]]
          source='gls/src/main/kotlin/com/github/albertocavalcante/gvy/gls/providers/hover/HoverIdentifierRange.kt'
          test_source='gls/src/test/kotlin/com/github/albertocavalcante/gvy/gls/providers/hover/HoverTokenCoordinatesTest.kt'
          [[ -f "$test_source" && ! -L "$test_source" ]]
          test_blob=$(git rev-parse "HEAD:$test_source")
          [[ "$test_blob" == "$EXPECTED_TEST_BLOB" ]]
          printf '%s  %s\n' "$EXPECTED_TEST_SHA" "$test_source" | sha256sum -c -
          [[ "$(git rev-parse "HEAD:$source")" == "$SOURCE_BLOB" ]]
          printf '%s  %s\n' "$SOURCE_SHA" "$source" | sha256sum -c -
          git diff --quiet && git diff --cached --quiet
          status_after_hooks=$(git status --porcelain --untracked-files=all)
          [[ -z "$status_after_hooks" ]]
          changed_paths=$(git diff --name-only HEAD^ HEAD)
          mapfile -t changed <<<"$changed_paths"
          [[ ${#changed[@]} == 1 && "${changed[0]}" == "$source" ]]
          git bundle create "$RUNNER_TEMP/b04-hover-green-candidate.bundle" HEAD "^$EXPECTED_BASE"
          git bundle verify "$RUNNER_TEMP/b04-hover-green-candidate.bundle"
          mv "$RUNNER_TEMP/b04-hover-green-candidate.bundle" "$proof/candidate.bundle"
          jq -n --arg base "$EXPECTED_BASE" --arg input "$INPUT_TREE" --arg tree "$EXPECTED_TREE" --arg sourceSha "$SOURCE_SHA" --arg sourceBlob "$SOURCE_BLOB" \
              --arg testBlob "$EXPECTED_TEST_BLOB" --arg testSha "$EXPECTED_TEST_SHA" \
              --arg head "$(git rev-parse HEAD)" --arg support "$GITHUB_SHA" \
              '{base:$base,inputTree:$input,tree:$tree,sourceSha256:$sourceSha,sourceBlob:$sourceBlob,testSourceBlob:$testBlob,testSourceSha256:$testSha,head:$head,supportHead:$support,testStatus:"not-run",postBundleReview:"required"}' >"$proof/prepared-commit.json"
          (cd "$proof" && sha256sum candidate.bundle >bundle.sha256)
      - name: Run four hover token coordinate tests on additional JDK 21 runtime
        working-directory: candidate
        shell: bash
        run: |
          set -euo pipefail
          proof="$RUNNER_TEMP/gvy-b04-hover-green-publication-proof"
          candidate=$(git rev-parse HEAD)
          if GITHUB_SHA="$candidate" timeout --signal=TERM --kill-after=30s 15m node tools/ci/run-gradle.mjs --report-root "$proof/gradle" --producer b04-focused :gls:test --tests com.github.albertocavalcante.gvy.gls.providers.hover.HoverTokenCoordinatesTest -PtestJavaVersion=21 --no-daemon --no-parallel --max-workers=1 --rerun-tasks --stacktrace --info; then
              status=0
          else
              status=$?
          fi
          clean=true
          if status_after_tests=$(git status --porcelain --untracked-files=all); then
              [[ -z "$status_after_tests" ]] || clean=false
          else
              clean=false
          fi
          if ! git diff --quiet || ! git diff --cached --quiet || [[ "$(git rev-parse HEAD)" != "$candidate" ]]; then
              clean=false
          fi
          jq -n --arg head "$candidate" --arg support "$GITHUB_SHA" --argjson exitCode "$status" \
              --argjson worktreeCleanAfter "$clean" \
              '{candidateHead:$head,supportHead:$support,exitCode:$exitCode,worktreeCleanAfter:$worktreeCleanAfter,requestedClass:"com.github.albertocavalcante.gvy.gls.providers.hover.HoverTokenCoordinatesTest",requestedTests:4,requestedTestJavaVersion:21,minimumJava17Validated:false}' >"$proof/focused-status.json"
          if python - <<'PY'
          import hashlib
          import json
          import os
          import re
          import xml.etree.ElementTree as ET
          from pathlib import Path


          def regular_bytes(path: Path, limit: int) -> bytes:
              if path.is_symlink() or not path.is_file() or path.stat().st_size > limit:
                  raise ValueError("missing or oversized evidence")
              data = path.read_bytes()
              if len(data) > limit:
                  raise ValueError("evidence grew beyond its bound")
              return data


          def object_fields(value: object) -> dict[str, object]:
              if not isinstance(value, dict):
                  raise ValueError("expected evidence object")
              return {str(key): item for key, item in value.items()}


          def one_match(pattern: str, text: str) -> re.Match[str]:
              matches = list(re.finditer(pattern, text, re.MULTILINE))
              if len(matches) != 1:
                  raise ValueError("incomplete execution frame")
              return matches[0]


          proof = Path(os.environ["RUNNER_TEMP"]) / "gvy-b04-hover-green-publication-proof"
          report = Path(
              "gls/build/test-results/test/TEST-com.github.albertocavalcante.gvy.gls.providers.hover.HoverTokenCoordinatesTest.xml"
          )
          observation: dict[str, object] = {
              "complete": False,
              "focusedGatePassed": False,
              "requestedTests": 4,
              "compileTestKotlin": "not-observed",
              "testTask": "not-observed",
              "scope": "junit-fresh-execution-and-source",
          }
          try:
              data = regular_bytes(report, 2 * 1024 * 1024)
              (proof / "junit.xml").write_bytes(data)
              xml_text = data.decode("utf-8")
              if re.search(r"[\x00-\x08\x0b\x0c\x0e-\x1f]", xml_text) or "<!DOCTYPE" in xml_text or "<!ENTITY" in xml_text:
                  raise ValueError("unsupported XML declarations or encoding")
              encoding = re.search(r"""<\?xml\b[^?]*\bencoding\s*=\s*["']([^"']+)["']""", xml_text)
              if encoding and encoding.group(1).lower() != "utf-8":
                  raise ValueError("unsupported JUnit encoding")
              suite = ET.fromstring(xml_text)
              cases = suite.findall("testcase")
              counts = {key: int(suite.attrib[key]) for key in ("tests", "failures", "errors", "skipped")}
              classname = "com.github.albertocavalcante.gvy.gls.providers.hover.HoverTokenCoordinatesTest"
              valid = suite.tag == "testsuite" and suite.get("name") == classname
              valid = valid and all(0 <= value <= 4 for value in counts.values())
              valid = valid and counts["tests"] == len(cases) == 4 and counts["skipped"] == 0
              valid = valid and all(case.get("classname") == classname and bool(case.get("name", "").strip()) for case in cases)
              expected_names = [
                  "code after a two emoji comment remains hoverable at its first character()",
                  "a comment after an emoji comment rejects hover at its first slash()",
                  "string whitespace after a two emoji comment remains a valid hover position()",
                  "native hover after a two emoji comment returns String content and its UTF16 range()",
              ]
              valid = valid and sorted(case.get("name", "") for case in cases) == sorted(expected_names)
              valid = valid and counts["failures"] == sum(case.find("failure") is not None for case in cases)
              valid = valid and counts["errors"] == sum(case.find("error") is not None for case in cases)
              valid = valid and all(case.find("skipped") is None for case in cases)
              valid = valid and all(sum(len(case.findall(tag)) for tag in ("failure", "error")) <= 1 for case in cases)
              logs = list((proof / "gradle").glob("b04-focused-*/raw.log"))
              if len(logs) != 1:
                  raise ValueError("missing focused capture")
              raw = regular_bytes(logs[0], 128 * 1024 * 1024)
              text = raw.decode("utf-8")
              diagnostic = object_fields(
                  json.loads(regular_bytes(logs[0].with_name("diagnostics.json"), 2 * 1024 * 1024).decode("utf-8"))
              )
              context = object_fields(diagnostic.get("context"))
              raw_identity = object_fields(diagnostic.get("log"))
              prepared = object_fields(json.loads(regular_bytes(proof / "prepared-commit.json", 4096).decode("utf-8")))
              focused = object_fields(json.loads(regular_bytes(proof / "focused-status.json", 4096).decode("utf-8")))
              candidate = prepared.get("head")
              if not isinstance(candidate, str) or not re.fullmatch(r"[0-9a-f]{40}", candidate):
                  raise ValueError("invalid candidate identity")
              native_exit = diagnostic.get("commandExitCode")
              if type(native_exit) is not int or native_exit not in (0, 1):
                  raise ValueError("unexpected native Gradle exit")
              capture_exit = diagnostic.get("captureExitCode")
              if type(capture_exit) is not int or not 0 <= capture_exit <= 255:
                  raise ValueError("invalid capture exit")
              diagnostic_ok = diagnostic.get("ok")
              if not isinstance(diagnostic_ok, bool):
                  raise ValueError("invalid diagnostic verdict")
              unexpected = diagnostic.get("unexpected")
              if not isinstance(unexpected, list) or not all(isinstance(item, str) and bool(item.strip()) for item in unexpected):
                  raise ValueError("invalid unexpected diagnostic list")
              wrapper_exit = focused.get("exitCode")
              if type(wrapper_exit) is not int or not 0 <= wrapper_exit <= 255:
                  raise ValueError("invalid wrapper exit")
              expected_wrapper = native_exit if native_exit else (0 if diagnostic_ok else 1)
              required = {"schemaVersion", "complete", "captureExitCode", "producer", "worktreeDirty", "commandSignal"}
              valid = valid and required <= diagnostic.keys()
              valid = valid and type(diagnostic.get("schemaVersion")) is int and diagnostic.get("schemaVersion") == 1
              valid = valid and diagnostic.get("producer") == "b04-focused" and diagnostic.get("complete") is True
              valid = valid and capture_exit == 0
              valid = valid and diagnostic.get("commandSignal") is None and diagnostic.get("worktreeDirty") is False
              valid = valid and type(context.get("schemaVersion")) is int and context.get("schemaVersion") == 1
              valid = valid and context.get("command") == "gradle"
              valid = valid and context.get("headSha") == context.get("testedSha") == focused.get("candidateHead") == candidate
              valid = valid and focused.get("worktreeCleanAfter") is True and wrapper_exit == expected_wrapper
              # This GREEN profile qualifies only the reviewed helper correction with the unchanged four tests.
              valid = valid and prepared.get("base") == "1d66f5291bed55d1823ec6da5b534c034a73489a"
              valid = valid and prepared.get("inputTree") == "70f7fb125b6207b579a955c3f9c4176f09f33fed"
              valid = valid and prepared.get("tree") == "70f7fb125b6207b579a955c3f9c4176f09f33fed"
              valid = valid and prepared.get("sourceBlob") == "095b65ad6a8afc9188be1b8c05f22c98b0ee0d83"
              valid = valid and prepared.get("sourceSha256") == "d5e1c9b10d04916cf9c8051b18ba310258883e2e3230b46d2625fef12c9eea4e"
              valid = valid and prepared.get("testSourceBlob") == "94056cb8dde602df53d47d9be481c852d9d00cd2"
              valid = (
                  valid and prepared.get("testSourceSha256") == "6afaddbdbe4d3918c84a428ebf6e4afb272602948820448560fe97860059b169"
              )
              valid = valid and counts["failures"] == counts["errors"] == 0 and native_exit == 0
              valid = valid and focused.get("requestedClass") == classname
              valid = valid and type(focused.get("requestedTests")) is int and focused.get("requestedTests") == 4
              valid = (
                  valid and type(focused.get("requestedTestJavaVersion")) is int and focused.get("requestedTestJavaVersion") == 21
              )
              valid = valid and (native_exit == 0 or not diagnostic_ok)
              valid = valid and (not diagnostic_ok or not unexpected)
              valid = valid and type(raw_identity.get("bytes")) is int and raw_identity.get("bytes") == len(raw)
              valid = valid and raw_identity.get("sha256") == hashlib.sha256(raw).hexdigest()
              compile_headers = list(re.finditer(r"^> Task :gls:compileTestKotlin([ \t][^\n]*)?$", text, re.MULTILINE))
              compile_states = [match.group(1) or "" for match in compile_headers]
              test_headers = list(re.finditer(r"^> Task :gls:test([ \t][^\n]*)?$", text, re.MULTILINE))
              test_states = [match.group(1) or "" for match in test_headers]
              summary_matches = list(re.finditer(r"^\d+ tests completed\b[^\n]*$", text, re.MULTILINE))
              summaries = [match.group() for match in summary_matches]
              failed = counts["failures"] + counts["errors"] > 0
              expected_summary = f"{counts['tests']} tests completed, {counts['failures'] + counts['errors']} failed"
              # The observed GLS four-failure capture repeats the active heading during executor output.
              gls_four_failure_profile = (
                  test_states == ["", "", " FAILED"]
                  and counts["tests"] == counts["failures"] == 4
                  and counts["errors"] == 0
                  and summaries == [expected_summary]
                  and native_exit == 1
                  and capture_exit == 0
                  and not diagnostic_ok
                  and not unexpected
              )
              failed_profile = (test_states == ["", " FAILED"] and summaries == [expected_summary]) or gls_four_failure_profile
              success_profile = test_states == ["", ""] and not summaries
              started = one_match(r"^Gradle Test Executor ([1-9][0-9]*) started executing tests\.$", text)
              finished = one_match(r"^Gradle Test Executor ([1-9][0-9]*) finished executing tests\.$", text)
              spawned = one_match(r"^Successfully started process 'Gradle Test Executor ([1-9][0-9]*)'$", text)
              spawn = one_match(
                  r"^Starting process 'Gradle Test Executor ([1-9][0-9]*)'\. Working directory: [^\n]+ Command: "
                  r"[^\n]+worker\.org\.gradle\.process\.internal\.worker\.GradleWorkerMain 'Gradle Test Executor \1'$",
                  text,
              )
              build = one_match(r"^BUILD (SUCCESSFUL|FAILED) in [^\n]+$", text)
              executor_lines = re.findall(
                  r"^(?:Gradle Test Executor|Starting process 'Gradle Test Executor|Successfully started process 'Gradle Test Executor)[^\n]*$",
                  text,
                  re.MULTILINE,
              )
              build_lines = re.findall(r"^BUILD\b[^\n]*$", text, re.MULTILINE)
              # Do not let malformed or foreign task headings disappear into a shorter accepted profile.
              task_heading_paths = re.findall(r"> Task ([^ \t\n]+)", text)
              frame_valid = (
                  compile_states == [""]
                  and (len(test_headers) == 2 or gls_four_failure_profile)
                  and len(executor_lines) == 4
                  and len(build_lines) == 1
                  and task_heading_paths.count(":gls:compileTestKotlin") == len(compile_headers)
                  and sum(path.endswith(":test") for path in task_heading_paths) == len(test_headers)
              )
              if frame_valid:
                  frame_valid = len({started.group(1), finished.group(1), spawn.group(1), spawned.group(1)}) == 1
                  frame_valid = frame_valid and build.group(1) == ("FAILED" if failed else "SUCCESSFUL")
                  if gls_four_failure_profile:
                      frame_valid = frame_valid and (
                          compile_headers[0].end()
                          < test_headers[0].start()
                          < spawn.start()
                          < spawned.start()
                          < started.start()
                          < test_headers[1].start()
                          < finished.start()
                          < test_headers[2].start()
                          < build.start()
                      )
                      # The terminal heading and failure summary can merge in either order after finish.
                      frame_valid = frame_valid and finished.end() < summary_matches[0].start() < build.start()
                  else:
                      frame_valid = frame_valid and (
                          compile_headers[0].end()
                          < test_headers[0].start()
                          < spawn.start()
                          < spawned.start()
                          < finished.start()
                          < test_headers[1].start()
                          < build.start()
                      )
                  # The executor start marker may precede the first heading in the merged console stream.
                  frame_valid = frame_valid and compile_headers[0].end() < started.start() < finished.start()
                  if failed and not gls_four_failure_profile:
                      frame_valid = (
                          frame_valid
                          and len(summary_matches) == 1
                          and (test_headers[1].end() < summary_matches[0].start() < build.start())
                      )
              fresh_outcome = (failed_profile if failed else success_profile) and native_exit == (1 if failed else 0)
              observation.update(counts)
              observation["nativeCommandExitCode"] = native_exit
              observation["captureExitCode"] = capture_exit
              observation["toolDiagnosticsOk"] = diagnostic_ok
              observation["unexpectedDiagnosticCount"] = len(unexpected)
              observation["compileTestKotlin"] = "executed" if compile_states == [""] else "not-proved"
              observation["executorLifecycle"] = "executed" if frame_valid else "not-proved"
              if frame_valid and failed_profile:
                  observation["testTask"] = "executed-failed"
              elif frame_valid and success_profile:
                  observation["testTask"] = "executed"
              else:
                  observation["testTask"] = "not-proved"
              observation["complete"] = valid and frame_valid and fresh_outcome
              observation["focusedGatePassed"] = observation["complete"] and not failed and diagnostic_ok and not unexpected
          except (OSError, ValueError, KeyError, ET.ParseError):
              observation["error"] = "B04_JUNIT_OBSERVATION_INCOMPLETE"
          (proof / "junit-observation.json").write_text(json.dumps(observation, indent=2) + "\n", encoding="utf-8")
          raise SystemExit(0 if observation["complete"] else 2)
          PY
          then
              junit_status=0
          else
              junit_status=$?
          fi
          if [[ "$status" != 0 ]]; then
              exit "$status"
          fi
          if [[ "$clean" != true ]]; then
              exit 2
          fi
          exit "$junit_status"
      - name: Upload prepared commit and available execution evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gvy-b04-hover-green-publication-proof-${{ github.run_attempt }}
          path: ${{ runner.temp }}/gvy-b04-hover-green-publication-proof/
          if-no-files-found: error
          retention-days: 7
