# Temporary validation only; do not merge.
name: L05b bounded encoder green
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: l05b-green-${{ github.sha }}
  cancel-in-progress: false
jobs:
  candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
    env:
      JDK_JAVA_OPTIONS: '-Xmx512m'
      JAVA_TOOL_OPTIONS: '-Xmx512m'
    steps:
      - name: Create proof directory
        run: mkdir -m 700 "$RUNNER_TEMP/l05b-green-proof"
      - name: Checkout temporary support
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up test JDK
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up compiler JDK
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24'
      - name: Set up pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 12.14.0
      - name: Set up licensing Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
      - name: Install pinned hook tools
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/bin" "$RUNNER_TEMP/download"
          gh release download v2.38.2 --repo direnv/direnv --pattern direnv.linux-amd64 --dir "$RUNNER_TEMP/download"
          printf '%s  %s\n' 148820a187930d36ca6a204504e5cdb30d8396cd1a97e64c3b3f10d793c11247 "$RUNNER_TEMP/download/direnv.linux-amd64" | sha256sum -c -
          install -m 755 "$RUNNER_TEMP/download/direnv.linux-amd64" "$RUNNER_TEMP/bin/direnv"
          gh release download v2.2.2 --repo evilmartians/lefthook --pattern lefthook_2.2.2_Linux_x86_64 --dir "$RUNNER_TEMP/download"
          printf '%s  %s\n' 4fbf89eb7748c6aed84d833ee1a29edac48fae614468ca9a82896ec32f2800b6 "$RUNNER_TEMP/download/lefthook_2.2.2_Linux_x86_64" | sha256sum -c -
          install -m 755 "$RUNNER_TEMP/download/lefthook_2.2.2_Linux_x86_64" "$RUNNER_TEMP/bin/lefthook"
          echo "$RUNNER_TEMP/bin" >>"$GITHUB_PATH"
      - name: Validate and commit
        shell: bash
        run: |
          set -euo pipefail
          proof="$RUNNER_TEMP/l05b-green-proof"
          base=eb9d0251900a1a51894c13634db0e88a4cd846ff
          candidate=c9536e392d9dcacb15032ba31aea8e67acdd8efa
          cp .publication/l05b.init.gradle "$RUNNER_TEMP/l05b.init.gradle"
          printf '%s  %s\n' cc0742e076410f51f5824988f3a8f9921b372624ee84e634ceb8b3cf39d08efb "$RUNNER_TEMP/l05b.init.gradle" | sha256sum -c -
          git fetch --no-tags origin "$candidate"
          [[ "$(git rev-parse "$candidate^{tree}")" == 5d356f15063a917028a7d5befb72aa79664a9a29 ]]
          git diff --binary "$base" "$candidate" -- gls editors/code/client/test/unit/server/stderrRouter.test.ts >"$proof/source.patch"
          git switch --detach "$base"
          git switch -c fix/bounded-logback-publication
          git apply --check --index "$proof/source.patch"
          git apply --index "$proof/source.patch"
          [[ "$(git write-tree)" == 5d356f15063a917028a7d5befb72aa79664a9a29 ]]
          git diff --quiet
          git diff --cached --check
          printf '%s\0' editors/code/client/test/unit/server/stderrRouter.test.ts gls/BUILD.bazel gls/build.gradle.kts gls/src/main/kotlin/com/github/albertocavalcante/gvy/gls/config/BoundedConsoleAppender.kt gls/src/main/kotlin/com/github/albertocavalcante/gvy/gls/config/BoundedLogbackEncoder.kt gls/src/main/resources/logback.xml gls/src/test/kotlin/com/github/albertocavalcante/gvy/gls/config/BoundedLogbackRenderingTest.kt >"$RUNNER_TEMP/expected-paths"
          git diff --cached --name-only -z >"$RUNNER_TEMP/paths"
          cmp "$RUNNER_TEMP/expected-paths" "$RUNNER_TEMP/paths"
          [[ -z "${LEFTHOOK:-}" && -z "${LEFTHOOK_EXCLUDE:-}" && -z "${LEFTHOOK_SKIP:-}" ]]
          [[ -z "$(git config --get core.hooksPath || true)" ]]
          lefthook install
          test -x .git/hooks/pre-commit && test -x .git/hooks/commit-msg
          git config user.name 'gvy publication automation'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python -m pip install --require-hashes --only-binary=:all: -r .reuse/bootstrap-requirements.txt
          uv sync --project .reuse --locked --no-dev
          echo "$PWD/.reuse/.venv/bin" >>"$GITHUB_PATH"
          export PATH="$PWD/.reuse/.venv/bin:$PATH"
          direnv allow
          export GRADLE_OPTS="-Dorg.gradle.jvmargs=\"-Xmx1536m -XX:MaxMetaspaceSize=768m -XX:+UseSerialGC\" -Dorg.gradle.workers.max=1 -Dorg.gradle.parallel=false -Dorg.gradle.daemon=false -Dorg.gradle.java.installations.paths=$JAVA_HOME_17_X64,$JAVA_HOME_21_X64"
          run_pipeline() {
            set +e
            "$@" 2>&1 | python3 -c '
          import sys
          remaining = 8 * 1024 * 1024
          overflow = False
          while chunk := sys.stdin.buffer.read(65536):
              keep = chunk[:remaining]
              sys.stdout.buffer.write(keep)
              remaining -= len(keep)
              overflow = overflow or len(keep) != len(chunk)
          sys.exit(75 if overflow else 0)
          ' >"$proof/$label.log"
            local status=("${PIPESTATUS[@]}")
            printf '%s %s\n' "${status[0]}" "${status[1]}" >"$proof/$label.status"
          }
          export -f run_pipeline
          export proof
          guarded() {
            export label="$1"
            shift
            set +e
            timeout --kill-after=10s 1800s bash -c 'run_pipeline "$@"' _ "$@"
            local timeout_status=$?
            set -e
            printf '%s\n' "$timeout_status" >"$proof/$label.timeout"
            [[ "$timeout_status" == 0 && -s "$proof/$label.status" ]]
            local producer capture
            read -r producer capture <"$proof/$label.status"
            [[ "$producer" == 0 && "$capture" == 0 ]]
          }
          guarded license uv run --offline --locked --no-dev --project .reuse python .reuse/check.py --root .
          guarded lintFix direnv exec . ./gradlew lintFix --no-daemon --no-parallel --max-workers=1 '-Dorg.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=768m -XX:+UseSerialGC' "-Dorg.gradle.java.installations.paths=$JAVA_HOME_17_X64,$JAVA_HOME_21_X64"
          git diff >"$proof/formatter.patch"
          git add editors/code/client/test/unit/server/stderrRouter.test.ts gls/BUILD.bazel gls/build.gradle.kts gls/src/main/kotlin/com/github/albertocavalcante/gvy/gls/config/BoundedConsoleAppender.kt gls/src/main/kotlin/com/github/albertocavalcante/gvy/gls/config/BoundedLogbackEncoder.kt gls/src/main/resources/logback.xml gls/src/test/kotlin/com/github/albertocavalcante/gvy/gls/config/BoundedLogbackRenderingTest.kt
          git diff --quiet
          git diff --cached --check
          git diff --cached --name-only -z >"$RUNNER_TEMP/paths"
          cmp "$RUNNER_TEMP/expected-paths" "$RUNNER_TEMP/paths"
          final_tree=$(git write-tree)
          guarded scoped-lint direnv exec . ./gradlew :gls:lint --no-daemon --no-parallel --max-workers=1 '-Dorg.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=768m -XX:+UseSerialGC' "-Dorg.gradle.java.installations.paths=$JAVA_HOME_17_X64,$JAVA_HOME_21_X64"
          test ! -e gls/build/test-results/test
          encoder=gls/src/main/kotlin/com/github/albertocavalcante/gvy/gls/config/BoundedLogbackEncoder.kt
          xml=gls/build/test-results/test/TEST-com.github.albertocavalcante.gvy.gls.config.BoundedLogbackRenderingTest.xml
          saved_encoder="$RUNNER_TEMP/l05b-fixed-encoder.kt"
          cp "$encoder" "$saved_encoder"
          trap 'cp "$saved_encoder" "$encoder"' EXIT
          git show 637e0cdf967f9d5f58b6da4a0d0aadd66481e5e6:"$encoder" >"$encoder"
          export label=literal-tail-red
          set +e
          timeout --kill-after=10s 1800s bash -c 'run_pipeline "$@"' _ direnv exec . ./gradlew :gls:test --tests '*BoundedLogbackRenderingTest.unconsumed escaped placeholder tails remain literal' --no-daemon --no-parallel --max-workers=1 --no-build-cache --rerun-tasks --info -I "$RUNNER_TEMP/l05b.init.gradle" '-Dorg.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=768m -XX:+UseSerialGC' "-Dorg.gradle.java.installations.paths=$JAVA_HOME_17_X64,$JAVA_HOME_21_X64"
          red_timeout=$?
          set -e
          printf '%s\n' "$red_timeout" >"$proof/literal-tail-red.timeout"
          [[ "$red_timeout" == 0 && -s "$proof/literal-tail-red.status" ]]
          read -r red_producer red_capture <"$proof/literal-tail-red.status"
          [[ "$red_producer" =~ ^[1-9][0-9]*$ && "$red_capture" == 0 ]]
          test -f "$xml"
          cp "$xml" "$proof/literal-tail-red.xml"
          python3 - "$proof/literal-tail-red.xml" <<'PYRED'
          import sys
          import xml.etree.ElementTree as ET

          root = ET.parse(sys.argv[1]).getroot()
          cases = root.findall('testcase')
          if root.get('name') != 'com.github.albertocavalcante.gvy.gls.config.BoundedLogbackRenderingTest':
              raise SystemExit('unexpected red test class')
          if root.get('tests') != '1' or root.get('failures') != '1' or root.get('errors') != '0' or root.get('skipped') != '0' or len(cases) != 1:
              raise SystemExit('expected one assertion failure')
          case = cases[0]
          if case.get('classname') != root.get('name') or case.get('name', '').removesuffix('()') != 'unconsumed escaped placeholder tails remain literal':
              raise SystemExit('unexpected red test case')
          failure = case.find('failure')
          if failure is None or failure.get('type') not in ('java.lang.AssertionError', 'org.opentest4j.AssertionFailedError'):
              raise SystemExit('red failure is not an assertion')
          if case.find('error') is not None or case.find('skipped') is not None or 'BoundedLogbackRenderingTest.kt:' not in (failure.text or ''):
              raise SystemExit('red failure is not from the target test')
          PYRED
          cp "$saved_encoder" "$encoder"
          trap - EXIT
          git diff --quiet
          rm -- "$xml"
          export GVY_ROUTING_FIXTURE="$RUNNER_TEMP/l05b-routing.txt"
          test ! -e "$GVY_ROUTING_FIXTURE"
          guarded focused direnv exec . ./gradlew :gls:test --tests '*BoundedLogbackRenderingTest' --no-daemon --no-parallel --max-workers=1 --no-build-cache --rerun-tasks --info -I "$RUNNER_TEMP/l05b.init.gradle" '-Dorg.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=768m -XX:+UseSerialGC' "-Dorg.gradle.java.installations.paths=$JAVA_HOME_17_X64,$JAVA_HOME_21_X64"
          python3 - "$proof" <<'PYVERIFY'
          import pathlib, shlex, shutil, subprocess, sys, xml.etree.ElementTree as ET
          proof = pathlib.Path(sys.argv[1])
          source = pathlib.Path('gls/build/test-results/test/TEST-com.github.albertocavalcante.gvy.gls.config.BoundedLogbackRenderingTest.xml')
          root = ET.parse(source).getroot()
          cases = root.findall('testcase')
          if root.get('name') != 'com.github.albertocavalcante.gvy.gls.config.BoundedLogbackRenderingTest' or len(cases) != 21 or any(root.get(k) != '0' for k in ('failures','errors','skipped')) or any(case.find(k) is not None for case in cases for k in ('failure','error','skipped')):
              raise SystemExit('expected 21 fresh passing cases')
          shutil.copyfile(source, proof / 'encoder.xml')
          lines = [line for line in (proof / 'focused.log').read_text(errors='replace').splitlines() if line.startswith("Starting process 'Gradle Test Executor ") and ' Command: ' in line]
          if len(lines) != 1: raise SystemExit('expected one actual executor')
          args = shlex.split(lines[0].split(' Command: ', 1)[1])
          if not args[0].startswith('/') or not args[0].endswith('/bin/java') or [a for a in args if a.startswith('-Xmx')] != ['-Xmx128m'] or not (metas := [a for a in args if a.startswith('-XX:MaxMetaspaceSize=')]) or any(a != '-XX:MaxMetaspaceSize=512m' for a in metas): raise SystemExit('wrong executor memory')
          version = subprocess.run([args[0], '-Xmx64m', '-XX:MaxMetaspaceSize=128m', '-XshowSettings:properties', '-version'], stdout=subprocess.PIPE, stderr=subprocess.STDOUT, text=True, check=True).stdout
          if not any(line.strip() == 'java.specification.version = 17' for line in version.splitlines()): raise SystemExit('wrong executor JDK')
          (proof / 'worker-command.txt').write_text(lines[0] + '\n')
          (proof / 'worker-version.txt').write_text(version)
          PYVERIFY
          test -s "$GVY_ROUTING_FIXTURE"
          cp "$GVY_ROUTING_FIXTURE" "$proof/actual-routing.txt"
          guarded editor-install pnpm --dir editors/code install --frozen-lockfile --ignore-scripts
          guarded editor-format pnpm --dir editors/code exec prettier --write client/test/unit/server/stderrRouter.test.ts
          changed="$(git diff --name-only)"
          [[ -z "$changed" || "$changed" == editors/code/client/test/unit/server/stderrRouter.test.ts ]]
          git diff -- editors/code/client/test/unit/server/stderrRouter.test.ts >>"$proof/formatter.patch"
          git add editors/code/client/test/unit/server/stderrRouter.test.ts
          git diff --quiet
          git diff --cached --check
          git diff --cached --name-only -z >"$RUNNER_TEMP/paths"
          cmp "$RUNNER_TEMP/expected-paths" "$RUNNER_TEMP/paths"
          final_tree=$(git write-tree)
          guarded editor-compile pnpm --dir editors/code run compile
          guarded routing pnpm --dir editors/code exec mocha client/test/unit/server/stderrRouter.test.ts --grep 'keeps encoder throwable continuations'
          grep -Eq '1 passing' "$proof/routing.log"
          git diff --quiet && [[ "$(git write-tree)" == "$final_tree" ]]
          guarded hooks direnv exec . git commit -m 'fix(logging): bound default server log records'
          [[ "$(git rev-parse HEAD^)" == "$base" && "$(git rev-parse 'HEAD^{tree}')" == "$final_tree" ]]
          git diff --quiet && git diff --cached --quiet && test -z "$(git status --porcelain --untracked-files=all)"
          git bundle create "$proof/candidate.bundle" HEAD "^$base"
          git bundle verify "$proof/candidate.bundle"
          printf 'base=%s\nreviewed=%s\ninitial_tree=%s\nfinal_tree=%s\nhead=%s\nsupport=%s\n' "$base" "$candidate" 5d356f15063a917028a7d5befb72aa79664a9a29 "$final_tree" "$(git rev-parse HEAD)" "$GITHUB_SHA" >"$proof/receipt.txt"
          (cd "$proof" && sha256sum candidate.bundle source.patch encoder.xml >evidence.sha256)
      - name: Upload proof
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: l05b-green-proof
          path: ${{ runner.temp }}/l05b-green-proof/
          if-no-files-found: error
          retention-days: 7
