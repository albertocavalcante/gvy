# Temporary support worker. Never merge this workflow into main or the SPDX PR.
name: SPDX lockfile refresh preparation

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact reviewed SPDX publication source
        required: true
        type: string
        default: aba3e4a802035b3547cea86d95c208d3f932277a

permissions:
  contents: read

concurrency:
  group: spdx-lockfile-refresh-${{ github.run_id }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      APPROVED_SOURCE: aba3e4a802035b3547cea86d95c208d3f932277a
      JDK_JAVA_OPTIONS: '-Xmx1536m'
      BAZELISK_GITHUB_TOKEN: ''
    steps:
      - name: Validate exact source input
        id: input
        env:
          REQUESTED_SOURCE: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          : "${REQUESTED_SOURCE:?}" "${APPROVED_SOURCE:?}" "${GITHUB_OUTPUT:?}"
          [[ "${REQUESTED_SOURCE}" =~ ^[0-9a-f]{40}$ ]]
          [[ "${REQUESTED_SOURCE}" == "${APPROVED_SOURCE}" ]]
          printf 'sha=%s\n' "${REQUESTED_SOURCE}" >>"${GITHUB_OUTPUT}"

      - name: Checkout exact reviewed source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.input.outputs.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Prove clean source and create VM-only result branch
        id: source
        run: |
          set -euo pipefail
          : "${APPROVED_SOURCE:?}" "${GITHUB_OUTPUT:?}"
          source_head=$(git rev-parse HEAD)
          status=$(git status --porcelain --untracked-files=all)
          hooks_path=$(git config --get core.hooksPath || [[ $? -eq 1 ]])
          [[ "${source_head}" == "${APPROVED_SOURCE}" ]]
          [[ -z "${status}" && -z "${hooks_path}" ]]
          git switch -c chore/spdx-lockfile-result
          checksum=$(sha256sum MODULE.bazel.lock)
          printf 'lock_before=%s\n' "${checksum%% *}" >>"${GITHUB_OUTPUT}"

      - name: Set up JDK 21
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up pinned Bazelisk without shared cache writes
        uses: bazel-contrib/setup-bazel@f34d6a05eae3c24acab7fa54587492daeaeffdab # 0.19.2
        with:
          bazelisk-cache: false
          disk-cache: false
          repository-cache: false
          cache-save: false

      - name: Refresh the canonical lockfile
        run: |
          set -euo pipefail
          : "${RUNNER_TEMP:?}"
          bazel_version=$(bazel --version)
          [[ "${bazel_version}" == 'bazel 9.0.0' ]]
          bazel --batch --output_user_root="${RUNNER_TEMP}/gvy-bazel" \
              --output_base="${RUNNER_TEMP}/gvy-bazel-output" \
              --host_jvm_args=-Xmx1536m fetch --lockfile_mode=update \
              --repo=@junit_jupiter_api_jar \
              --repo=@kotlin_logging_jar \
              --repo=@wire_compiler_jar
          changed=$(git diff --name-only)
          untracked=$(git ls-files --others --exclude-standard)
          [[ "${changed}" == 'MODULE.bazel.lock' && -z "${untracked}" ]]
          git diff --cached --quiet
          git diff --check
          jq empty MODULE.bazel.lock

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'

      - name: Install committed licensing runtime and validate metadata
        run: |
          set -euo pipefail
          python -m pip install --require-hashes --only-binary=:all: -r .reuse/bootstrap-requirements.txt
          uv sync --project .reuse --locked --no-dev
          uv run --offline --locked --no-dev --project .reuse python .reuse/check.py --root .

      - name: Install checksum-verified normal hook runner
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          : "${RUNNER_TEMP:?}" "${GITHUB_PATH:?}"
          download="${RUNNER_TEMP}/gvy-lefthook-download"
          bins="${RUNNER_TEMP}/gvy-lockfile-bin"
          mkdir "${download}" "${bins}"
          gh release download v2.2.2 --repo evilmartians/lefthook \
              --pattern lefthook_2.2.2_Linux_x86_64 --dir "${download}"
          printf '%s  %s\n' \
              4fbf89eb7748c6aed84d833ee1a29edac48fae614468ca9a82896ec32f2800b6 \
              "${download}/lefthook_2.2.2_Linux_x86_64" | sha256sum -c -
          install -m 755 "${download}/lefthook_2.2.2_Linux_x86_64" "${bins}/lefthook"
          lefthook_version=$("${bins}/lefthook" version)
          [[ "${lefthook_version}" == '2.2.2' ]]
          echo "${bins}" >>"${GITHUB_PATH}"

      - name: Commit only the refreshed lockfile through normal hooks
        run: |
          set -euo pipefail
          : "${APPROVED_SOURCE:?}"
          [[ -z "${LEFTHOOK:-}" && -z "${LEFTHOOK_EXCLUDE:-}" && -z "${LEFTHOOK_SKIP:-}" ]]
          hooks_path=$(git config --get core.hooksPath || [[ $? -eq 1 ]])
          source_head=$(git rev-parse HEAD)
          changed=$(git diff --name-only)
          untracked=$(git ls-files --others --exclude-standard)
          [[ -z "${hooks_path}" && "${source_head}" == "${APPROVED_SOURCE}" ]]
          [[ "${changed}" == 'MODULE.bazel.lock' && -z "${untracked}" ]]
          lefthook install
          pre_commit=$(git rev-parse --git-path hooks/pre-commit)
          commit_msg=$(git rev-parse --git-path hooks/commit-msg)
          test -x "${pre_commit}" && test -x "${commit_msg}"
          git config user.name 'gvy lockfile preparation'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- MODULE.bazel.lock
          staged=$(git diff --cached --name-only)
          [[ "${staged}" == 'MODULE.bazel.lock' ]]
          git diff --quiet
          git diff --cached --check
          branch=$(git branch --show-current)
          [[ "${branch}" == 'chore/spdx-lockfile-result' ]]
          git commit -m 'fix(licensing): refresh Bazel extension lock metadata'
          parent=$(git rev-parse HEAD^)
          changed=$(git diff-tree --no-commit-id --name-status -r HEAD)
          lock_entry=$(git ls-tree HEAD -- MODULE.bazel.lock)
          status=$(git status --porcelain --untracked-files=all)
          [[ "${parent}" == "${APPROVED_SOURCE}" ]]
          [[ "${changed}" == $'M\tMODULE.bazel.lock' ]]
          [[ "${lock_entry%% *}" == '100644' && -z "${status}" ]]
          git diff --quiet
          git diff --cached --quiet

      - name: Prepare the bounded review artifact
        env:
          LOCK_BEFORE: ${{ steps.source.outputs.lock_before }}
        run: |
          set -euo pipefail
          : "${RUNNER_TEMP:?}" "${APPROVED_SOURCE:?}" "${LOCK_BEFORE:?}"
          : "${GITHUB_WORKFLOW_SHA:?}" "${GITHUB_WORKFLOW_REF:?}" "${GITHUB_RUN_ID:?}" "${GITHUB_RUN_ATTEMPT:?}"
          proof="${RUNNER_TEMP}/gvy-lockfile-proof"
          mkdir "${proof}"
          git diff --binary --no-ext-diff --no-textconv HEAD^ HEAD -- MODULE.bazel.lock >"${proof}/lockfile.patch"
          cp MODULE.bazel.lock "${proof}/MODULE.bazel.lock"
          git bundle create "${proof}/candidate.bundle" HEAD "^${APPROVED_SOURCE}"
          git bundle verify "${proof}/candidate.bundle"
          parent=$(git rev-parse HEAD^)
          head=$(git rev-parse HEAD)
          tree=$(git rev-parse 'HEAD^{tree}')
          checksum=$(sha256sum MODULE.bazel.lock)
          jq -n --arg source "${APPROVED_SOURCE}" --arg parent "${parent}" \
              --arg head "${head}" --arg tree "${tree}" \
              --arg before "${LOCK_BEFORE}" --arg after "${checksum%% *}" \
              --arg workflow "${GITHUB_WORKFLOW_SHA}" --arg workflowRef "${GITHUB_WORKFLOW_REF}" \
              --argjson run "${GITHUB_RUN_ID}" --argjson attempt "${GITHUB_RUN_ATTEMPT}" \
              '{source:$source,parent:$parent,head:$head,tree:$tree,lockBeforeSha256:$before,
                lockAfterSha256:$after,workflowSha:$workflow,workflowRef:$workflowRef,runId:$run,
                runAttempt:$attempt,changedPaths:["MODULE.bazel.lock"],bazelVersion:"9.0.0",
                operation:"bazel fetch --lockfile_mode=update",
                repositories:["@junit_jupiter_api_jar","@kotlin_logging_jar","@wire_compiler_jar"],
                hooks:"normal git commit with Lefthook 2.2.2"}' \
              >"${proof}/receipt.json"
          (cd "${proof}" && sha256sum candidate.bundle MODULE.bazel.lock lockfile.patch receipt.json >SHA256SUMS)

      - name: Upload the incremental result for review
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gvy-spdx-lockfile-refresh-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/gvy-lockfile-proof/
          if-no-files-found: error
          retention-days: 7
