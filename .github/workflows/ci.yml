# Temporary execution support only. Never merge into main or the product PR.
name: Verification failure evidence hosted preparation
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verification-failure-evidence-preparation-${{ github.sha }}
  cancel-in-progress: false
jobs:
  candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      CARGO_BUILD_JOBS: 1
      JDK_JAVA_OPTIONS: '-Xmx512m'
      JAVA_TOOL_OPTIONS: '-Xmx512m -Dorg.gradle.deprecation.trace=true'
      GRADLE_OPTS: >-
        -Dorg.gradle.jvmargs="-Xmx1536m -XX:MaxMetaspaceSize=768m -XX:+UseSerialGC"
        -Dorg.gradle.workers.max=1 -Dorg.gradle.parallel=false -Dorg.gradle.daemon=false
      NODE_OPTIONS: '--max-old-space-size=768'
      SKIP_PREPARE_SERVER: 'true'
    steps:
      - name: Checkout temporary support ref
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: support
          persist-credentials: false
      - name: Validate support receipt
        id: receipt
        shell: bash
        run: |
          set -euo pipefail
          receipt="$GITHUB_WORKSPACE/support/.publication/receipt.json"
          base=$(jq -er '.base' "$receipt")
          tree=$(jq -er '.tree' "$receipt")
          digest=$(jq -er '.patchSha256' "$receipt")
          compressed=$(jq -er '.payloadSha256' "$receipt")
          [[ "$base" =~ ^[0-9a-f]{40}$ && "$tree" =~ ^[0-9a-f]{40}$ && "$digest" =~ ^[0-9a-f]{64}$ && "$compressed" =~ ^[0-9a-f]{64}$ ]]
          printf '%s  %s\n' "$compressed" "$GITHUB_WORKSPACE/support/.publication/payload.patch.gz" | sha256sum -c -
          [[ "$(stat -c %s "$GITHUB_WORKSPACE/support/.publication/payload.patch.gz")" == "$(jq -er '.payloadBytes' "$receipt")" ]]
          [[ "$(jq -er '.payloadBytes' "$receipt")" -le 65536 ]]
          [[ "$(jq -er '.patchBytes' "$receipt")" -le 131072 ]]
          python3 - "$GITHUB_WORKSPACE/support/.publication/payload.patch.gz" "$RUNNER_TEMP/gvy-reviewed.patch" <<'PYBOUND'
          import gzip, pathlib, sys
          with gzip.open(sys.argv[1], 'rb') as stream:
              data = stream.read(131073)
          if len(data) > 131072:
              raise SystemExit('patch exceeds 128 KiB')
          pathlib.Path(sys.argv[2]).write_bytes(data)
          PYBOUND
          [[ "$(stat -c %s "$RUNNER_TEMP/gvy-reviewed.patch")" == "$(jq -er '.patchBytes' "$receipt")" ]]
          printf '%s  %s\n' "$digest" "$RUNNER_TEMP/gvy-reviewed.patch" | sha256sum -c -
          printf 'base=%s\ntree=%s\npatch=%s\n' "$base" "$tree" "$digest" >> "$GITHUB_OUTPUT"
      - name: Checkout exact approved base
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.receipt.outputs.base }}
          path: candidate
          fetch-depth: 1
          persist-credentials: false
      - name: Apply reviewed patch and prove tree
        working-directory: candidate
        shell: bash
        env:
          EXPECTED_BASE: ${{ steps.receipt.outputs.base }}
          EXPECTED_TREE: ${{ steps.receipt.outputs.tree }}
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "$EXPECTED_BASE" ]]
          git switch -c fix/bounded-failure-evidence-publication
          git apply --check --index "$RUNNER_TEMP/gvy-reviewed.patch"
          git apply --index "$RUNNER_TEMP/gvy-reviewed.patch"
          [[ "$(git write-tree)" == "$EXPECTED_TREE" ]]
          git diff --quiet
          git diff --cached --check
          expected_paths=(
            tests/build.gradle.kts
            tests/e2e/kotlin/com/github/albertocavalcante/gvy/gls/e2e/BoundedFailureEvidence.kt
            tests/e2e/kotlin/com/github/albertocavalcante/gvy/gls/e2e/BoundedFailureEvidenceTest.kt
            tests/e2e/kotlin/com/github/albertocavalcante/gvy/gls/e2e/NamedObservationRecorder.kt
            tests/e2e/kotlin/com/github/albertocavalcante/gvy/gls/e2e/NamedObservationRecorderTest.kt
          )
          printf '%s\0' "${expected_paths[@]}" > "$RUNNER_TEMP/expected-paths.nul"
          git diff --cached --name-only --diff-filter=ACMRT -z > "$RUNNER_TEMP/actual-paths.nul"
          cmp "$RUNNER_TEMP/expected-paths.nul" "$RUNNER_TEMP/actual-paths.nul"
          test -z "$(git ls-files --others --exclude-standard)"
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
      - name: Set up JDK
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24'
      - name: Set up pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 12.14.0
      - name: Install locked project tools
        working-directory: candidate
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --require-hashes --only-binary=:all: -r .reuse/bootstrap-requirements.txt
          uv sync --project .reuse --locked
          echo "$PWD/.reuse/.venv/bin" >> "$GITHUB_PATH"
          pnpm --dir editors/code install --frozen-lockfile
          rustup toolchain install --no-self-update --profile minimal 1.96.1
          rustup component add --toolchain 1.96.1 clippy rustfmt
          rustup target add --toolchain 1.96.1 wasm32-wasip2
      - name: Fetch checksum-pinned hook tools
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          bins="$RUNNER_TEMP/spdx-hook-bin"
          download="$RUNNER_TEMP/spdx-hook-download"
          mkdir -p "$bins" "$download"
          fetch() {
            local repo="$1" version="$2" asset="$3" digest="$4"
            gh release download "$version" --repo "$repo" --pattern "$asset" --dir "$download"
            printf '%s  %s\n' "$digest" "$download/$asset" | sha256sum -c -
          }
          fetch direnv/direnv v2.38.2 direnv.linux-amd64 148820a187930d36ca6a204504e5cdb30d8396cd1a97e64c3b3f10d793c11247
          install -m 755 "$download/direnv.linux-amd64" "$bins/direnv"
          fetch evilmartians/lefthook v2.2.2 lefthook_2.2.2_Linux_x86_64 4fbf89eb7748c6aed84d833ee1a29edac48fae614468ca9a82896ec32f2800b6
          install -m 755 "$download/lefthook_2.2.2_Linux_x86_64" "$bins/lefthook"
          fetch dprint/dprint 0.64.3 dprint-x86_64-unknown-linux-gnu.zip f71cb7e22d6776439eba168d5cb296092d6413fea7148fe4d70684a2702a4fee
          unzip -q "$download/dprint-x86_64-unknown-linux-gnu.zip" -d "$download/dprint"
          install -m 755 "$download/dprint/dprint" "$bins/dprint"
          fetch mikefarah/yq v4.52.4 yq_linux_amd64 0c4d965ea944b64b8fddaf7f27779ee3034e5693263786506ccd1c120f184e8c
          install -m 755 "$download/yq_linux_amd64" "$bins/yq"
          fetch koalaman/shellcheck v0.11.0 shellcheck-v0.11.0.linux.x86_64.tar.xz 8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198
          tar -xJf "$download/shellcheck-v0.11.0.linux.x86_64.tar.xz" -C "$download"
          install -m 755 "$download/shellcheck-v0.11.0/shellcheck" "$bins/shellcheck"
          fetch mvdan/sh v3.12.0 shfmt_v3.12.0_linux_amd64 d9fbb2a9c33d13f47e7618cf362a914d029d02a6df124064fff04fd688a745ea
          install -m 755 "$download/shfmt_v3.12.0_linux_amd64" "$bins/shfmt"
          fetch astral-sh/ruff 0.17.4 ruff-x86_64-unknown-linux-gnu.tar.gz 3ab2b34aeacdbc1ea5c529cdbda3e05792633d587228123fd09f3b5a0facb27a
          mkdir "$download/ruff"; tar -xzf "$download/ruff-x86_64-unknown-linux-gnu.tar.gz" -C "$download/ruff"
          install -m 755 "$download/ruff/ruff-x86_64-unknown-linux-gnu/ruff" "$bins/ruff"
          fetch rhysd/actionlint v1.7.9 actionlint_1.7.9_linux_amd64.tar.gz 233b280d05e100837f4af1433c7b40a5dcb306e3aa68fb4f17f8a7f45a7df7b4
          mkdir "$download/actionlint"; tar -xzf "$download/actionlint_1.7.9_linux_amd64.tar.gz" -C "$download/actionlint"
          install -m 755 "$download/actionlint/actionlint" "$bins/actionlint"
          fetch suzuki-shunsuke/ghalint v1.5.4 ghalint_1.5.4_linux_amd64.tar.gz 977555b7142cc057aad4663679772510a9ed3f1687f26f2359d18bb6b67314fe
          mkdir "$download/ghalint"; tar -xzf "$download/ghalint_1.5.4_linux_amd64.tar.gz" -C "$download/ghalint"
          install -m 755 "$download/ghalint/ghalint" "$bins/ghalint"
          echo "$bins" >> "$GITHUB_PATH"
      - name: Check out the exact RED baseline
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.receipt.outputs.base }}
          path: red-candidate
          fetch-depth: 1
          persist-credentials: false
      - name: Verify interruption controls fail on the prior renderer
        working-directory: red-candidate
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "1b22b95eb919fc4f59b547ab861b5758835e84cf" ]]
          compressed="$GITHUB_WORKSPACE/support/.publication/red-payload.patch.gz"
          patch="$RUNNER_TEMP/gvy-failure-red.patch"
          [[ "$(stat -c %s "$compressed")" == 4235 ]]
          printf '%s  %s\n' '543aff087b3bad0a2dbeff6d062659e6c7ff7ce2dfa04f09c65c14905e0f3095' "$compressed" | sha256sum -c -
          python3 - "$compressed" "$patch" <<'PYREDPATCH'
          import gzip, pathlib, sys
          with gzip.open(sys.argv[1], 'rb') as stream:
              data = stream.read(17682)
          assert len(data) == 17681
          pathlib.Path(sys.argv[2]).write_bytes(data)
          PYREDPATCH
          printf '%s  %s\n' 'c99d9f33707338b571d2259049885ba0408d2c6099599cf5c777f8216fc235e3' "$patch" | sha256sum -c -
          git apply --check --index "$patch"
          git apply --index "$patch"
          [[ "$(git write-tree)" == "ff5078f9634f5f2346916463cca5f97ed1901698" ]]
          git diff --quiet
          direnv allow
          mkdir "$RUNNER_TEMP/gvy-failure-red"
          cp "$patch" "$RUNNER_TEMP/gvy-failure-red/red-payload.patch"
          cp tests/e2e/kotlin/com/github/albertocavalcante/gvy/gls/e2e/BoundedFailureEvidence.kt "$RUNNER_TEMP/gvy-failure-red/red-source.kt"
          cp tests/e2e/kotlin/com/github/albertocavalcante/gvy/gls/e2e/BoundedFailureEvidenceTest.kt "$RUNNER_TEMP/gvy-failure-red/red-test.kt"
          printf '%s  %s\n' '47e00a567188e37024540130ef0b2cb7aab17cfcefbf4489773a1896d388d1c9' "$RUNNER_TEMP/gvy-failure-red/red-source.kt" | sha256sum -c -
          printf '%s  %s\n' '0a34b6a0813f2791f2d63885c86f19c19afa2483ee6dcefaf58800467e88f83f' "$RUNNER_TEMP/gvy-failure-red/red-test.kt" | sha256sum -c -
          set +e
          direnv exec . ./gradlew :tests:harnessTest \
            --tests '*BoundedFailureEvidenceTest.interrupted IO getter*' \
            --tests '*BoundedFailureEvidenceTest.closed by interrupt getter*' \
            --tests '*BoundedFailureEvidenceTest.socket timeout getter*' \
            --no-daemon --no-parallel --no-build-cache --console=plain --warning-mode=all --max-workers=1 \
            '-Dorg.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=768m -XX:+UseSerialGC' \
            2>&1 | tee "$RUNNER_TEMP/gvy-failure-red/red.log"
          statuses=("${PIPESTATUS[@]}")
          node tools/ci/check-gradle-diagnostics.mjs --log "$RUNNER_TEMP/gvy-failure-red/red.log" \
            --exit-code "${statuses[0]}" --capture-exit-code "${statuses[1]}" --producer failure-evidence-red \
            --baseline tools/ci/gradle-diagnostics.json --root "$PWD" --report "$RUNNER_TEMP/gvy-failure-red/diagnostics"
          checker_status=$?
          set -e
          python3 - "$RUNNER_TEMP/gvy-failure-red/diagnostics/diagnostics.json" "$checker_status" <<'PYREDDIAG'
          import json, pathlib, sys
          d=json.loads(pathlib.Path(sys.argv[1]).read_text())
          assert int(sys.argv[2]) == 1 and d['complete'] and not d['ok']
          assert d['commandExitCode'] == 1 and d['captureExitCode'] == 0 and not d['unexpected']
          assert d['errors'] == ['Gradle command failed with exit 1']
          PYREDDIAG
          cp tests/build/test-results/harnessTest/TEST-com.github.albertocavalcante.gvy.gls.e2e.BoundedFailureEvidenceTest.xml "$RUNNER_TEMP/gvy-failure-red/red.xml"
          python3 - "$RUNNER_TEMP/gvy-failure-red/red.xml" "${statuses[0]}" "${statuses[1]}" <<'PYRED'
          import pathlib, sys, xml.etree.ElementTree as ET
          assert int(sys.argv[2]) != 0 and int(sys.argv[3]) == 0
          path = pathlib.Path(sys.argv[1]); assert path.stat().st_size <= 1048576
          root = ET.parse(path).getroot(); cases = root.findall('testcase')
          assert len(cases) == 3 and int(root.attrib['tests']) == 3
          assert int(root.attrib['failures']) == 3 and int(root.attrib['errors']) == 0 and int(root.attrib['skipped']) == 0
          expected = ['interrupted IO getter propagates identity', 'closed by interrupt getter propagates identity', 'socket timeout getter propagates identity']
          assert all(sum(fragment in c.attrib['name'] for c in cases) == 1 for fragment in expected)
          for case in cases:
              faults = case.findall('failure'); assert len(faults) == 1
              assert faults[0].attrib['type'] in ('java.lang.AssertionError', 'org.opentest4j.AssertionFailedError')
          PYRED
          grep -F '> Task :tests:harnessTest FAILED' "$RUNNER_TEMP/gvy-failure-red/red.log" >/dev/null
          grep -F 'BUILD FAILED' "$RUNNER_TEMP/gvy-failure-red/red.log" >/dev/null
          git diff --quiet
          [[ "$(git write-tree)" == "ff5078f9634f5f2346916463cca5f97ed1901698" ]]
      - name: Verify GREEN source and focused tests
        working-directory: candidate
        shell: bash
        env:
          EXPECTED_BASE: ${{ steps.receipt.outputs.base }}
          EXPECTED_TREE: ${{ steps.receipt.outputs.tree }}
          PATCH_SHA: ${{ steps.receipt.outputs.patch }}
        run: |
          set -euo pipefail
          [[ -z "${LEFTHOOK:-}" && -z "${LEFTHOOK_EXCLUDE:-}" && -z "${LEFTHOOK_SKIP:-}" ]]
          [[ -z "$(git config --get core.hooksPath || true)" ]]
          command -v shellcheck; command -v shfmt; command -v dprint; command -v yq; command -v ruff
          lefthook install
          test -x .git/hooks/pre-commit && test -x .git/hooks/commit-msg
          git config user.name 'gvy publication automation'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git diff --quiet
          [[ "$(git write-tree)" == "$EXPECTED_TREE" ]]
          direnv allow
          direnv exec . java -version
          mkdir "$RUNNER_TEMP/gvy-failure-lint"
          set +e
          direnv exec . ./gradlew lintFix --no-daemon --no-parallel --no-build-cache --console=plain --warning-mode=all --max-workers=1 \
            '-Dorg.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=768m -XX:+UseSerialGC' \
            2>&1 | tee "$RUNNER_TEMP/gvy-failure-lint/lint.log"
          lint_statuses=("${PIPESTATUS[@]}")
          node tools/ci/check-gradle-diagnostics.mjs --log "$RUNNER_TEMP/gvy-failure-lint/lint.log" \
            --exit-code "${lint_statuses[0]}" --capture-exit-code "${lint_statuses[1]}" --producer failure-evidence-lint \
            --baseline tools/ci/gradle-diagnostics.json --root "$PWD" --report "$RUNNER_TEMP/gvy-failure-lint/diagnostics"
          lint_checker=$?
          set -e
          [[ ${lint_statuses[0]} == 0 && ${lint_statuses[1]} == 0 && ${lint_checker} == 0 ]]
          python3 - "$RUNNER_TEMP/gvy-failure-lint/diagnostics/diagnostics.json" <<'PYLINTDIAG'
          import json, pathlib, sys
          d=json.loads(pathlib.Path(sys.argv[1]).read_text())
          assert d['complete'] and d['ok'] and not d['unexpected'] and not d['errors']
          assert d['commandExitCode'] == 0 and d['captureExitCode'] == 0
          PYLINTDIAG
          git diff --quiet
          [[ "$(git write-tree)" == "$EXPECTED_TREE" ]]
          set +e
          direnv exec . ./gradlew :tests:harnessTest \
            --tests '*.BoundedFailureEvidenceTest' --tests '*.NamedObservationRecorderTest' \
            --no-daemon --no-parallel --no-build-cache --console=plain --warning-mode=all --max-workers=1 \
            '-Dorg.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=768m -XX:+UseSerialGC' \
            2>&1 | tee "$RUNNER_TEMP/gvy-failure-green.log"
          green_statuses=("${PIPESTATUS[@]}")
          node tools/ci/check-gradle-diagnostics.mjs --log "$RUNNER_TEMP/gvy-failure-green.log" \
            --exit-code "${green_statuses[0]}" --capture-exit-code "${green_statuses[1]}" --producer failure-evidence-green \
            --baseline tools/ci/gradle-diagnostics.json --root "$PWD" --report "$RUNNER_TEMP/gvy-failure-green-diagnostics"
          green_checker=$?
          set -e
          [[ ${green_statuses[0]} == 0 && ${green_statuses[1]} == 0 && ${green_checker} == 0 ]]
          python3 - "$RUNNER_TEMP/gvy-failure-green-diagnostics/diagnostics.json" <<'PYGREENDIAG'
          import json, pathlib, sys
          d=json.loads(pathlib.Path(sys.argv[1]).read_text())
          assert d['complete'] and d['ok'] and not d['unexpected'] and not d['errors']
          assert d['commandExitCode'] == 0 and d['captureExitCode'] == 0
          PYGREENDIAG
          git diff --quiet
          [[ "$(git write-tree)" == "$EXPECTED_TREE" ]]
          git diff --cached --name-only --diff-filter=ACMRT -z > "$RUNNER_TEMP/gvy-staged-paths"
          while IFS= read -r -d '' staged_file; do
            [[ -f "$staged_file" ]] || continue
            first_line=''
            IFS= read -r first_line < "$staged_file" || true
            case "$staged_file:$first_line" in
              *.zsh:*) zsh -n "$staged_file" ;;
              *.sh:*|.envrc:*|*:'#!'*bash*|*:'#!'*'/sh'*)
                shellcheck --rcfile tools/lint/shellcheckrc "$staged_file"
                shfmt -i 4 -ci -d "$staged_file"
                bash -n "$staged_file"
                ;;
              *) ;;
            esac
          done < "$RUNNER_TEMP/gvy-staged-paths"
          mkdir "$RUNNER_TEMP/gvy-failure-evidence-proof"
          cp tests/e2e/kotlin/com/github/albertocavalcante/gvy/gls/e2e/BoundedFailureEvidence.kt "$RUNNER_TEMP/gvy-failure-evidence-proof/green-source.kt"
          cp tests/e2e/kotlin/com/github/albertocavalcante/gvy/gls/e2e/BoundedFailureEvidenceTest.kt "$RUNNER_TEMP/gvy-failure-evidence-proof/green-test.kt"
          printf '%s  %s\n' 'eb16dea750c90299c19c7ae5c64b7a88ad6e49edb67fa13d3f3cc27cc777bb91' "$RUNNER_TEMP/gvy-failure-evidence-proof/green-source.kt" | sha256sum -c -
          printf '%s  %s\n' '0a34b6a0813f2791f2d63885c86f19c19afa2483ee6dcefaf58800467e88f83f' "$RUNNER_TEMP/gvy-failure-evidence-proof/green-test.kt" | sha256sum -c -
          cp -R "$RUNNER_TEMP/gvy-failure-red" "$RUNNER_TEMP/gvy-failure-evidence-proof/red"
          cp "$RUNNER_TEMP/gvy-failure-green.log" "$RUNNER_TEMP/gvy-failure-evidence-proof/"
          cp -R "$RUNNER_TEMP/gvy-failure-lint" "$RUNNER_TEMP/gvy-failure-evidence-proof/lint"
          cp -R "$RUNNER_TEMP/gvy-failure-green-diagnostics" "$RUNNER_TEMP/gvy-failure-evidence-proof/green-diagnostics"
          cp tests/build/test-results/harnessTest/TEST-com.github.albertocavalcante.gvy.gls.e2e.BoundedFailureEvidenceTest.xml "$RUNNER_TEMP/gvy-failure-evidence-proof/green.xml"
          cp tests/build/test-results/harnessTest/TEST-com.github.albertocavalcante.gvy.gls.e2e.NamedObservationRecorderTest.xml "$RUNNER_TEMP/gvy-failure-evidence-proof/recorder.xml"
          python3 - "$RUNNER_TEMP/gvy-failure-evidence-proof/green.xml" "$RUNNER_TEMP/gvy-failure-evidence-proof/recorder.xml" <<'PYGREEN'
          import pathlib, sys, xml.etree.ElementTree as ET
          fragments = ['interrupted IO getter propagates identity', 'closed by interrupt getter propagates identity', 'socket timeout getter propagates identity']
          for name in sys.argv[1:]:
              path = pathlib.Path(name); assert path.stat().st_size <= 1048576
              root = ET.parse(path).getroot(); assert int(root.attrib['tests']) > 0
              assert all(int(root.attrib.get(k, '0')) == 0 for k in ('failures', 'errors', 'skipped'))
              if name.endswith('/green.xml'):
                  cases = root.findall('testcase')
                  assert all(sum(fragment in c.attrib['name'] for c in cases) == 1 for fragment in fragments)
          PYGREEN
          cp "$RUNNER_TEMP/gvy-staged-paths" "$RUNNER_TEMP/gvy-failure-evidence-proof/staged-paths.nul"
          jq -n --arg base "$EXPECTED_BASE" --arg tree "$EXPECTED_TREE" --arg patch "$PATCH_SHA" --arg support "$GITHUB_SHA" \
            '{base:$base,tree:$tree,patchSha256:$patch,supportHead:$support}' > "$RUNNER_TEMP/gvy-failure-evidence-proof/receipt.json"
      - name: Upload proof
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gvy-failure-evidence-red-green-proof
          path: ${{ runner.temp }}/gvy-failure-evidence-proof/
          if-no-files-found: error
          retention-days: 7
      - name: Upload failed proof evidence
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gvy-failure-evidence-failed-proof
          path: |
            ${{ runner.temp }}/gvy-failure-red/
            ${{ runner.temp }}/gvy-failure-green.log
            ${{ runner.temp }}/gvy-failure-lint/
            ${{ runner.temp }}/gvy-failure-green-diagnostics/
            red-candidate/tests/build/test-results/harnessTest/*.xml
            candidate/tests/build/test-results/harnessTest/*.xml
            candidate/tests/e2e/kotlin/com/github/albertocavalcante/gvy/gls/e2e/BoundedFailureEvidence.kt
            candidate/tests/e2e/kotlin/com/github/albertocavalcante/gvy/gls/e2e/BoundedFailureEvidenceTest.kt
          if-no-files-found: warn
          retention-days: 7
