name: Focused Bazel logging parity witness
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: bazel-logging-parity-witness-${{ github.sha }}
  cancel-in-progress: false
jobs:
  witness:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 1cd527e018f1cf397acb25f01a98dfa0a6662c5b
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: bazel-contrib/setup-bazel@f34d6a05eae3c24acab7fa54587492daeaeffdab # 0.19.2
        with:
          bazelisk-cache: true
          disk-cache: bazel-logging-parity-witness
          repository-cache: true
      - name: Run isolated witness
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == 1cd527e018f1cf397acb25f01a98dfa0a6662c5b ]]
          [[ "$(git rev-parse 'HEAD^{tree}')" == 71d313b3e182b2bc7de166a8308f33b2a03e2ea5 ]]
          private="$RUNNER_TEMP/parity-private"
          public="$RUNNER_TEMP/parity-receipt"
          mkdir -m 700 "$private" "$public"
          mkdir -m 700 "$private/build-tool" "$private/jenkins"
          bazel --version >"$private/bazel-version" 2>&1
          echo 'BAZELISK_GITHUB_TOKEN=' >>"$GITHUB_ENV"
          [[ "$GITHUB_RUN_ID" =~ ^[0-9]+$ && "$GITHUB_RUN_ATTEMPT" =~ ^[0-9]+$ ]]
          [[ "$(cat .bazelversion)" == 9.0.0 ]]
          grep -qx "bazel 9.0.0" "$private/bazel-version"
          printf 'witness source=1cd527e018f1cf397acb25f01a98dfa0a6662c5b bazel_pin=9.0.0 run=%s attempt=%s\n' "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT"
          cleanup_done=0
          cleanup_exit=125
          cleanup() {
          	if ((cleanup_done == 0)); then
          		cleanup_done=1
          		set +e
          		timeout --kill-after=5s 20s bazel --host_jvm_args=-Xmx1024m shutdown >"$private/shutdown.log" 2>&1
          		cleanup_exit=$?
          		set -e
          		printf 'bazel_cleanup_exit=%s\n' "$cleanup_exit"
          	fi
          }
          trap cleanup EXIT
          run_target() {
          	local name="$1" target="$2"
          	set +e
          	timeout --kill-after=10s 1200s bazel --host_jvm_args=-Xmx1024m test --jobs=1 --local_test_jobs=1 --nocache_test_results --test_output=errors --test_env=JDK_JAVA_OPTIONS=-Xmx512m "--sandbox_writable_path=$private/$name" '--test_arg=--include-classname=^.*\.LoggingProviderTest$' "--test_arg=--reports-dir=$private/$name" "$target" 2>&1 | python3 -c '
          import sys
          remaining = 4 * 1024 * 1024
          overflow = False
          while chunk := sys.stdin.buffer.read(65536):
              keep = chunk[:remaining]
              sys.stdout.buffer.write(keep)
              remaining -= len(keep)
              overflow = overflow or len(keep) != len(chunk)
          sys.exit(75 if overflow else 0)
          ' >"$private/$name.log"
          	local status=("${PIPESTATUS[@]}")
          	printf '%s %s\n' "${status[0]}" "${status[1]}" >"$private/$name.status"
          	set -e
          }
          test ! -e "$private/build-tool/TEST-junit-jupiter.xml"
          test ! -e "$private/jenkins/TEST-junit-jupiter.xml"
          run_target build-tool //build-tool:build-tool_test
          run_target jenkins //jenkins:jenkins_test
          read -r first first_capture <"$private/build-tool.status"
          read -r second second_capture <"$private/jenkins.status"
          printf 'build_tool_exit=%s capture=%s jenkins_exit=%s capture=%s\n' "$first" "$first_capture" "$second" "$second_capture"
          cleanup
          if ((first != 0 || first_capture != 0 || second != 0 || second_capture != 0 || cleanup_exit != 0)); then
          	python3 - "$first" "$first_capture" "$second" "$second_capture" "$cleanup_exit" "$public/failure.json" "$private" 2>"$private/classifier.log" <<'DIAG' || echo "diagnostic_unavailable"
          import json
          import os
          import pathlib
          import re
          import sys
          import xml.etree.ElementTree as ET
          
          LIMIT = 256 * 1024
          CASES = {
              "test logging uses the Logback provider": "provider",
              "quiet test policy retains warnings and errors and allows a restored debug override": "quiet_policy",
          }
          TYPES = {
              "java.lang.AssertionError": "assertion",
              "org.opentest4j.AssertionFailedError": "assertion",
              "java.lang.ClassNotFoundException": "class_not_found",
              "java.lang.NoClassDefFoundError": "class_not_found",
              "java.lang.UnsupportedClassVersionError": "class_version",
          }
          PATTERNS = {
              "reports_dir_option": r"(?i)(unknown option|unmatched argument|unrecognized option)[^\n]{0,160}--reports-dir",
              "include_classname_option": r"(?i)(unknown option|unmatched argument|unrecognized option)[^\n]{0,160}--include-classname",
              "missing_execute": r"(?i)(missing required (sub)?command|unknown command[^\n]{0,80}execute)",
              "zero_tests": r"(?i)(no tests (were )?found|0 tests found)",
              "wrapper_missing": r"(?i)(wrapper[^\n]{0,120}(no such file|not found|permission denied))",
              "output_env_missing": r"TEST_UNDECLARED_OUTPUTS_DIR: parameter (null or )?not set",
              "class_not_found": r"(?i)(classnotfoundexception|noclassdeffounderror)",
              "class_version": r"(?i)unsupportedclassversionerror",
              "bootstrap_console_launcher": r"(?i)(?:could not find or load main class|ClassNotFoundException:|NoClassDefFoundError:)\s*org[./]junit[./]platform[./]console[./]ConsoleLauncher\b",
              "bootstrap_jupiter_engine": r"(?i)(?:ClassNotFoundException:|NoClassDefFoundError:)\s*org[./]junit[./]jupiter[./]engine[./]JupiterTestEngine\b",
              "bootstrap_slf4j": r"(?i)(?:ClassNotFoundException:|NoClassDefFoundError:)\s*org[./]slf4j[./]LoggerFactory\b",
              "bootstrap_logback_classic": r"(?i)(?:ClassNotFoundException:|NoClassDefFoundError:)\s*ch[./]qos[./]logback[./]classic[./]LoggerContext\b",
              "bootstrap_logback_core": r"(?i)(?:ClassNotFoundException:|NoClassDefFoundError:)\s*ch[./]qos[./]logback[./]core[./]ConsoleAppender\b",
              "bootstrap_build_test": r"(?i)(?:ClassNotFoundException:|NoClassDefFoundError:)\s*com[./]github[./]albertocavalcante[./]gvy[./]build[./]LoggingProviderTest\b",
              "bootstrap_jenkins_test": r"(?i)(?:ClassNotFoundException:|NoClassDefFoundError:)\s*com[./]github[./]albertocavalcante[./]gvy[./]jenkins[./]LoggingProviderTest\b",
          }
          
          def bounded(path):
              try:
                  with pathlib.Path(path).open("rb") as stream:
                      data = stream.read(LIMIT + 1)
                  return ("oversize", None) if len(data) > LIMIT else ("present", data)
              except FileNotFoundError:
                  return ("missing", None)
              except OSError:
                  return ("unreadable", None)
          
          def read_jupiter(path):
              import os
              import pathlib
              import stat
          
              path = pathlib.Path(path)
              try:
                  descriptor = os.open(path, os.O_RDONLY | os.O_NOFOLLOW | os.O_NONBLOCK)
                  with os.fdopen(descriptor, "rb") as stream:
                      initial = os.fstat(stream.fileno())
                      if not stat.S_ISREG(initial.st_mode) or initial.st_size > LIMIT:
                          return "oversize_or_not_regular", None
                      raw = stream.read(LIMIT + 1)
                      final = os.fstat(stream.fileno())
                  current = path.lstat()
                  if (initial.st_dev, initial.st_ino, initial.st_size, initial.st_mtime_ns) != (final.st_dev, final.st_ino, final.st_size, final.st_mtime_ns):
                      return "changed", None
                  if (final.st_dev, final.st_ino) != (current.st_dev, current.st_ino) or len(raw) > LIMIT:
                      return "changed", None
                  if b"\x00" in raw:
                      return "invalid_encoding", None
                  try:
                      raw.decode("utf-8", "strict")
                  except UnicodeDecodeError:
                      return "invalid_encoding", None
                  if b"<!DOCTYPE" in raw.upper():
                      return "dtd_rejected", None
                  return "present", raw
              except FileNotFoundError:
                  return "missing", None
              except OSError:
                  return "unreadable", None
          
          def source_line(failure, classname):
              pattern = re.compile(
                  r"^\s*at " + re.escape(classname) +
                  r"(?:\$[A-Za-z0-9_$]+)?\.[^(]+\(LoggingProviderTest\.kt:([0-9]+)\)\s*$"
              )
              for line in (failure.text or "").splitlines():
                  match = pattern.fullmatch(line)
                  if match:
                      number = match.group(1)
                      if len(number) > 4:
                          return None
                      value = int(number)
                      return value if 1 <= value <= 4096 else None
              return None
          
          def classify(log, xml, classname):
              log_state, log_bytes = log
              xml_state, xml_bytes = xml
              text = log_bytes.decode("utf-8", "replace") if log_bytes is not None else ""
              codes = [key for key, pattern in PATTERNS.items() if re.search(pattern, text)]
              result = {"log": log_state, "xml": xml_state, "codes": codes or ["unknown"], "cases": []}
              if xml_bytes is None:
                  return result
              if b"\x00" in xml_bytes:
                  result["xml"] = "invalid_encoding"
                  return result
              try:
                  xml_bytes.decode("utf-8", "strict")
              except UnicodeDecodeError:
                  result["xml"] = "invalid_encoding"
                  return result
              if b"<!DOCTYPE" in xml_bytes.upper():
                  result["xml"] = "dtd_rejected"
                  return result
              try:
                  root = ET.fromstring(xml_bytes)
              except ET.ParseError:
                  result["xml"] = "malformed"
                  return result
              found = []
              for case in root.findall(".//testcase"):
                  name = case.get("name", "").removesuffix("()")
                  if case.get("classname") != classname or name not in CASES:
                      continue
                  children = [child for child in case if child.tag in ("failure", "error", "skipped")]
                  if len(children) > 1:
                      outcome, kind = "ambiguous", "unknown"
                  elif not children:
                      outcome, kind = "passed", "none"
                  else:
                      child = children[0]
                      outcome = {"failure": "failed", "error": "error", "skipped": "skipped"}[child.tag]
                      kind = TYPES.get(child.get("type", ""), "unknown") if child.tag != "skipped" else "none"
                  line = source_line(children[0], classname) if len(children) == 1 and outcome in ("failed", "error") else None
                  found.append({"id": CASES[name], "outcome": outcome, "type": kind, "sourceLine": line})
              if len(found) > 2 or len({item["id"] for item in found}) != len(found):
                  result["xml"] = "ambiguous"
                  return result
              result["cases"] = sorted(found, key=lambda item: item["id"])
              result["knownCounts"] = {key: sum(item["outcome"] == key for item in found) for key in ("passed", "failed", "error", "skipped", "ambiguous")}
              return result
          
          def main():
              first, first_capture, second, second_capture, cleanup, dest, private = sys.argv[1:]
              if not all(value.isdecimal() for value in (first, first_capture, second, second_capture, cleanup)):
                  raise SystemExit("invalid status")
              modules = {
                  "build-tool": ("build-tool_test", "com.github.albertocavalcante.gvy.build.LoggingProviderTest"),
                  "jenkins": ("jenkins_test", "com.github.albertocavalcante.gvy.jenkins.LoggingProviderTest"),
              }
              result = {}
              for module, (target, classname) in modules.items():
                  base = pathlib.Path("bazel-testlogs") / module / target
                  generic = bounded(base / "test.xml")
                  jupiter = read_jupiter(pathlib.Path(private) / module / "TEST-junit-jupiter.xml")
                  selected = jupiter if jupiter[0] == "present" else generic
                  observed = classify(bounded(base / "test.log"), selected, classname)
                  observed["jupiter"] = jupiter[0]
                  observed["bazelXml"] = generic[0]
                  observed["xmlOrigin"] = "jupiter" if jupiter[0] == "present" else "bazel_fallback"
                  result[module] = observed
              payload = {"schemaVersion": 1, "kind": "bazel-parity-failure", "source": "1cd527e018f1cf397acb25f01a98dfa0a6662c5b", "runId": os.environ["GITHUB_RUN_ID"], "attempt": os.environ["GITHUB_RUN_ATTEMPT"], "bazelExit": {"build-tool": int(first), "jenkins": int(second)}, "captureExit": {"build-tool": int(first_capture), "jenkins": int(second_capture)}, "cleanupExit": int(cleanup), "modules": result}
              pathlib.Path(dest).write_text(json.dumps(payload, sort_keys=True) + "\n")
          
          if __name__ == "__main__":
              main()
          
          DIAG
          	echo "Focused Bazel witness failed; private output withheld." >&2
          	exit 1
          fi
          if ! python3 - "$public/receipt.json" "$private" >"$private/receipt-build.log" 2>&1 <<'PY'
