name: Runmux owner canary
on:
  workflow_dispatch:
permissions: {}
jobs:
  canary:
    if: ${{ github.repository == 'albertocavalcante/gvy' && github.actor == 'albertocavalcante' && github.ref == 'refs/heads/ci/runmux-owner-canary' }}
    runs-on: air-gvy
    timeout-minutes: 5
    steps:
      - name: Verify isolated runner
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -s)" = Linux
          test "$(uname -m)" = aarch64
          test "$(id -u)" -ne 0
          case "$RUNNER_NAME" in rmx-air-*) ;; *) exit 1 ;; esac
          printf 'Verified runmux Linux ARM64 runner %s\n' "$RUNNER_NAME"
