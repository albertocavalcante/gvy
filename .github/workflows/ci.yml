name: CI
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      runner_label:
        description: 'Runner label to use'
        required: false
        type: choice
        options:
          - 'self-hosted'
          - 'magalu'
          - 'local-macos'
          - 'github-hosted'
        default: 'github-hosted'
      disable_scan:
        description: Disable Gradle build scan
        required: false
        type: boolean
        default: false
      coverage:
        description: Generate coverage reports (always on for pushes to main)
        required: false
        type: boolean
        default: false
      sonar:
        description: Upload coverage and analysis to SonarCloud (needs coverage and the SONAR_TOKEN secret)
        required: false
        type: boolean
        default: false
      test_log_level:
        description: 'Gradle log level for test tasks'
        required: false
        type: choice
        options:
          - 'default'
          - 'info'
          - 'debug'
        default: 'default'
env:
  # Preferred OS for single-run checks (Verify JAR, Sonar, artifacts).
  # Override via repo variable CI_PRIMARY_OS (e.g., macos-15).
  # Default: ubuntu-24.04 (faster, cheaper than macOS)
  PRIMARY_OS: >-
    ${{ (github.event.inputs.runner_label == 'local-macos' || vars.CI_RUNNER_LABEL == 'local-macos') && 'local-macos' ||
        (github.event.inputs.runner_label == 'magalu' || vars.CI_RUNNER_LABEL == 'magalu') && 'magalu' ||
        (vars.CI_PRIMARY_OS || 'ubuntu-24.04') }}
concurrency:
  # PRs: group by head_ref (cancel outdated runs for same branch)
  # Main pushes: group by SHA (allows parallel runs per commit for fast regression detection)
  # workflow_dispatch: group by run ID (never wait for other CI runs)
  group: >-
    ${{ github.workflow }}-${{
      github.event_name == 'pull_request' && github.head_ref ||
      github.event_name == 'workflow_dispatch' && github.run_id ||
      github.sha
    }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# ============================================================================
# RUNNER CONFIGURATION
# ============================================================================
# Priority: workflow_dispatch input > CI_RUNNER_LABEL repo variable > self-hosted
#
# Default: github-hosted runner (standard GitHub Actions runners)
#
# Runner options:
#   - self-hosted: Local runner (fastest, no cost)
#   - magalu: Magalu Cloud ephemeral runner (use runner-provision.yml first!)
#   - github-hosted: GitHub-hosted runners (default, macos-15 for PRs, matrix for main)
#
# To switch runners permanently:
#   Settings → Secrets and variables → Actions → Variables → New repository variable
#   Name: CI_RUNNER_LABEL  Value: github-hosted (or magalu)
#
# To switch for a single run:
#   Actions → CI → Run workflow → runner_label: <choice>
#
# Magalu Cloud runners:
#   1. Run "Infra: Provision Magalu Runner" workflow first
#   2. Then run CI with runner_label: magalu
#   3. Run "Infra: Destroy Magalu Runner" when done (or wait for nightly cleanup)
#
# NOTE: Avoiding ubuntu-latest due to stability issues causing builds to hang.
# See: https://github.com/actions/runner-images/issues/13182
#
# Available runner labels: https://github.com/actions/runner-images#available-images
# ============================================================================

jobs:
  check-paths:
    runs-on: ${{ vars.CI_FAST_RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      run_main_ci: ${{ steps.filter.outputs.run_main_ci }}
      run_bazel_ci: ${{ steps.filter.outputs.run_bazel_ci }}
      run_zed_ci: ${{ steps.filter.outputs.run_zed_ci }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Self-test CI policy
        run: node --test tools/ci/*.test.mjs
      - name: Enforce temporary dependency accountability
        run: node tools/ci/dependency-maintenance.mjs
      - name: Classify exact revisions
        id: filter
        run: node tools/ci/ci-applicability.mjs "$RUNNER_TEMP/ci-applicability.json"
      - name: Upload applicability evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-applicability
          path: ${{ runner.temp }}/ci-applicability.json
          if-no-files-found: error
          retention-days: 14

  bazel:
    name: Bazel validation
    needs: check-paths
    if: needs.check-paths.outputs.run_bazel_ci == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/ci-bazel.yml

  check-runner:
    name: Check Runner Availability
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    needs: check-paths
    if: needs.check-paths.outputs.run_main_ci == 'true'
    outputs:
      provisioning_triggered: ${{ steps.exit-early.outputs.provisioning_triggered }}
    steps:
      - name: Checkout (for local action)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github/actions
          persist-credentials: false

      - name: Determine Runner Label
        id: mode
        run: |
          # Priority: Input > Variable > Default(github-hosted)
          LABEL="${{ github.event.inputs.runner_label || vars.CI_RUNNER_LABEL || 'github-hosted' }}"
          echo "label=$LABEL" >> "$GITHUB_OUTPUT"
          echo "Checking availability for: $LABEL"

      # --- Magalu Check ---
      - name: Check Magalu runner
        if: steps.mode.outputs.label == 'magalu'
        id: check-magalu
        uses: ./.github/actions/runner-status
        with:
          mode: check
          label: magalu
          github-token: ${{ secrets.GH_PAT_RUNNER }}

      - name: Trigger provisioning (Magalu)
        if: steps.mode.outputs.label == 'magalu' && steps.check-magalu.outputs.has-runners != 'true'
        id: exit-early
        env:
          GH_TOKEN: ${{ secrets.GH_PAT_RUNNER }}
        run: |
          echo "Triggering runner-provision.yml..."
          gh workflow run runner-provision.yml --repo "${{ github.repository }}"
          echo ""
          echo "⏳ Provisioning triggered. Manual approval may be required."
          echo "👉 Go to: https://github.com/${{ github.repository }}/actions/workflows/runner-provision.yml"
          echo ""
          echo "::notice::Provisioning requested. Required validation remains blocked; rerun this revision after the runner is available."
          # Set output to signal downstream jobs to skip
          echo "provisioning_triggered=true" >> "$GITHUB_OUTPUT"

      # --- Local macOS Check ---
      - name: Check Local macOS runner
        if: steps.mode.outputs.label == 'local-macos'
        id: check-local
        uses: ./.github/actions/runner-status
        with:
          mode: check
          label: local-macos
          github-token: ${{ secrets.GH_PAT_RUNNER }}

      - name: Verify Local macOS Availability
        if: steps.mode.outputs.label == 'local-macos' && steps.check-local.outputs.has-runners != 'true'
        run: |
          echo "❌ No local macOS runner found online with label 'local-macos'."
          echo ""
          echo "To set up a runner on your Mac:"
          echo "  ./tools/github/actions/setup-macos-runner.sh"
          echo ""
          echo "Ensure the runner service is active:"
          echo "  cd ~/.gha-runners/groovy-lsp-*"
          echo "  ./svc.sh status"
          echo ""
          exit 1

      # --- Summary ---
      - name: Runner Check Summary
        if: always()
        run: |
          LABEL="${{ steps.mode.outputs.label }}"
          echo "Runner label: $LABEL"

          case "$LABEL" in
            "magalu")
              if [[ "${{ steps.check-magalu.outputs.has-runners }}" == "true" ]]; then
                echo "✅ Magalu runner available"
              else
                echo "⏳ Magalu runner provisioning triggered"
              fi
              ;;
            "local-macos")
              if [[ "${{ steps.check-local.outputs.has-runners }}" == "true" ]]; then
                echo "✅ Local macOS runner available"
              else
                echo "❌ Local macOS runner check failed (see above)"
              fi
              ;;
            "github-hosted")
              echo "✅ Using GitHub-hosted cloud runners (no check needed)"
              ;;
            *)
              echo "✅ Runner check complete for: $LABEL"
              ;;
          esac

  lint:
    name: Lint
    needs: [check-paths, check-runner]
    # Run if paths require CI and no provisioning triggered
    if: |
      !cancelled() && needs.check-paths.outputs.run_main_ci == 'true' &&
      needs.check-runner.result == 'success' && needs.check-runner.outputs.provisioning_triggered != 'true'
    runs-on: ${{ vars.CI_FAST_RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Run Lint
        run: node tools/ci/run-gradle.mjs --report-root "$RUNNER_TEMP/gradle-evidence" --producer lint lint --parallel --max-workers=2 --build-cache --stacktrace

      - name: Upload Gradle diagnostic evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gradle-evidence-lint-${{ github.run_attempt }}
          path: ${{ runner.temp }}/gradle-evidence/
          if-no-files-found: error
          retention-days: 14


  build:
    name: Build and Test
    needs: [check-paths, check-runner]
    # Applicable code must run on an available runner for this revision.
    if: |
      !cancelled() && needs.check-paths.outputs.run_main_ci == 'true' &&
      needs.check-runner.result == 'success' && needs.check-runner.outputs.provisioning_triggered != 'true'
    timeout-minutes: 45
    # For self-hosted runners, we need label arrays; for cloud runners, use the matrix value directly
    runs-on: ${{ matrix.os == 'magalu' && fromJSON('["self-hosted", "magalu", "groovy-lsp"]') || matrix.os == 'local-macos' && fromJSON('["self-hosted", "local-macos", "groovy-lsp"]') || matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # Runner selection:
        #   - magalu: Magalu Cloud ephemeral runner (provision first via runner-provision.yml)
        #   - local-macos: Local macOS runner (setup with tools/github/actions/setup-macos-runner.sh)
        #   - github-hosted: GitHub-hosted (Ubuntu is now the default for PRs and main, macOS remains as an additional check)
        # NOTE: macOS is retained for compatibility, but Ubuntu is the more stable default
        # See: https://github.com/actions/runner-images/issues/13182
        os: ${{ fromJSON( (github.event.inputs.runner_label == 'local-macos' || vars.CI_RUNNER_LABEL == 'local-macos') && '["local-macos"]' || (github.event.inputs.runner_label == 'magalu' || vars.CI_RUNNER_LABEL == 'magalu') && '["magalu"]' || (github.event_name == 'pull_request' && format('["{0}"]', vars.CI_PRIMARY_OS || 'ubuntu-24.04') || format('["{0}", "{1}"]', vars.CI_PRIMARY_OS || 'ubuntu-24.04', (vars.CI_PRIMARY_OS == 'macos-15') && 'ubuntu-24.04' || 'macos-15')) ) }}
        java: ${{ fromJSON( (github.event.inputs.runner_label == 'local-macos' || vars.CI_RUNNER_LABEL == 'local-macos' || github.event.inputs.runner_label == 'magalu' || vars.CI_RUNNER_LABEL == 'magalu') && '[17]' || (github.event_name == 'pull_request' && '[17]' || '[17, 21]') ) }}
        exclude:
          - os: ubuntu-24.04
            java: 21
    env:
      # Coverage reports: every push to main, and on demand (Run workflow → coverage).
      COVERAGE: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event.inputs.coverage == 'true' }}
      # SonarCloud is opt-in: repository variable SONAR_ENABLED=true, or Run workflow → sonar.
      SONAR: ${{ vars.SONAR_ENABLED == 'true' || github.event.inputs.sonar == 'true' }}
      HAS_SONAR_TOKEN: ${{ secrets.SONAR_TOKEN != '' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Shallow clone for PRs (faster), deep clone for main (SonarCloud needs history)
          fetch-depth: ${{ github.event_name == 'pull_request' && 1 || 0 }}
          persist-credentials: false

      - name: Set up Node.js for profiling tools
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24

      - name: Test profiling tools
        run: node --test tools/perf/*.test.mjs

      - name: Test release artifact pairing
        run: node --test tools/ci/*-artifacts.test.mjs

      - name: 🖥️ Runner Specs
        shell: bash
        run: |
          # Cross-platform CPU/RAM detection
          # TODO: Add Windows support using: wmic cpu get NumberOfCores, systeminfo for RAM
          if [[ "${{ runner.os }}" == "macOS" ]]; then
            CORES=$(sysctl -n hw.ncpu)
            RAM=$(echo "scale=1; $(sysctl -n hw.memsize) / 1024 / 1024 / 1024" | bc)
            RAM="${RAM} GB"
          elif [[ "${{ runner.os }}" == "Windows" ]]; then
            CORES="N/A (Windows not yet supported)"
            RAM="N/A"
          else
            CORES=$(nproc)
            RAM=$(free -h | awk '/Mem:/ {print $2}')
          fi
          DISK=$(df -h / | awk 'NR==2 {print $4 " free"}' 2>/dev/null || echo "N/A")
          HOSTNAME=$(hostname)

          # Print to console (visible immediately)
          echo "╔════════════════════════════════════════╗"
          echo "║        Runner Specifications           ║"
          echo "╠════════════════════════════════════════╣"
          echo "║ OS:         ${{ runner.os }} / ${{ runner.arch }}"
          echo "║ CPU Cores:  $CORES"
          echo "║ RAM:        $RAM"
          echo "║ Disk:       $DISK"
          echo "║ Hostname:   $HOSTNAME"
          echo "╚════════════════════════════════════════╝"
          echo ""

          # Also write to summary (for post-job formatted view)
          {
            echo "## 🖥️ Runner: ${{ runner.name }}"
            echo ""
            echo "| Spec | Value |"
            echo "|------|-------|"
            echo "| **OS** | ${{ runner.os }} / ${{ runner.arch }} |"
            echo "| **CPU Cores** | $CORES |"
            echo "| **RAM** | $RAM |"
            echo "| **Disk** | $DISK |"
            echo "| **Hostname** | $HOSTNAME |"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - name: Verify daemon memory sampler with the real JDK
        if: runner.os == 'Linux' && runner.environment == 'github-hosted'
        timeout-minutes: 2
        env:
          GVY_MEMORY_PROBE_NATIVE_TEST: 'true'
        run: node --test tools/ci/gradle-memory-probe.test.mjs
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
          # Allow writing to cache for main OR PRs from the same repository
          # Read-only for forks to prevent cache poisoning
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
          # Self-hosted runners may have pre-existing Gradle User Home - allow overwrite
          cache-overwrite-existing: ${{ matrix.os == 'self-hosted' }}
      - name: Set Gradle flags
        shell: bash
        run: |-
          # Set scan flag
          if [[ "${{ github.event.inputs.disable_scan }}" == "true" ]]; then
            echo "GRADLE_SCAN_FLAG=-Dorg.gradle.scan=false" >> "$GITHUB_ENV"
          else
            echo "GRADLE_SCAN_FLAG=" >> "$GITHUB_ENV"
          fi

          # Set test log level flag
          case "${{ github.event.inputs.test_log_level }}" in
            "info")
              echo "TEST_LOG_FLAG=--info" >> "$GITHUB_ENV"
              ;;
            "debug")
              echo "TEST_LOG_FLAG=--debug" >> "$GITHUB_ENV"
              ;;
            *)
              echo "TEST_LOG_FLAG=" >> "$GITHUB_ENV"
              ;;
          esac

      # NOTE: --parallel and --build-cache are redundant with gradle.properties settings
      # (org.gradle.parallel=true, org.gradle.caching=true) but kept explicit for:
      # 1. Self-documentation - CI intent is clear without checking gradle.properties
      # 2. Defense in depth - CI works even if gradle.properties changes

      # Compile and unit tests in one invocation, so Gradle tests a module while still compiling the
      # modules that depend on it (two steps put a full barrier in between). classes and testClasses
      # keep compiling modules without tests. Lint runs in a separate parallel job; unit tests
      # also feed the coverage reports below.
      - name: Verify protobuf generation with bounded JVMs
        env:
          GVY_GRADLE_MEMORY_PROBE: ${{ runner.os == 'Linux' && runner.environment == 'github-hosted' && 'true' || 'false' }}
        run: >-
          node tools/ci/run-gradle.mjs --report-root "$RUNNER_TEMP/gradle-evidence" --producer proto-generation
          :schemas:generateProtos :indexer:scip:generateProtos --rerun-tasks --max-workers=2 --build-cache --stacktrace

      - name: Compile and Run Unit Tests
        timeout-minutes: 25
        env:
          GVY_GRADLE_MEMORY_PROBE: ${{ runner.os == 'Linux' && runner.environment == 'github-hosted' && 'true' || 'false' }}
        run: |
          args=(classes testClasses test --parallel --max-workers=2 --build-cache --stacktrace)
          if [[ -n "${TEST_LOG_FLAG}" ]]; then
            args+=("${TEST_LOG_FLAG}")
          fi
          if [[ -n "${GRADLE_SCAN_FLAG}" ]]; then
            args+=("${GRADLE_SCAN_FLAG}")
          fi
          node tools/ci/run-gradle.mjs --report-root "$RUNNER_TEMP/gradle-evidence" --producer unit "${args[@]}"

      # Coverage reports (see COVERAGE above) come from this job's own test outputs: a separate job reran
      # the whole build (282 tasks) to get them. Their own invocation avoids the Kover hang with --parallel
      # (Kotlin/kotlinx-kover#509). SonarCloud only uploads when opted in (see SONAR above).
      - name: Generate Coverage Reports
        if: env.COVERAGE == 'true' && matrix.os == env.PRIMARY_OS && matrix.java == 17
        env:
          GVY_GRADLE_MEMORY_PROBE: ${{ runner.os == 'Linux' && runner.environment == 'github-hosted' && 'true' || 'false' }}
        run: node tools/ci/run-gradle.mjs --report-root "$RUNNER_TEMP/gradle-evidence" --producer coverage koverXmlReport koverHtmlReport --parallel --max-workers=2 --build-cache --stacktrace

      - name: Upload Coverage Reports
        if: env.COVERAGE == 'true' && matrix.os == env.PRIMARY_OS && matrix.java == 17
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-reports
          path: '**/build/reports/kover/'
          retention-days: 7

      # SonarCloud is advisory: it must never fail CI (auth or otherwise). See PR description.
      - name: SonarCloud Analysis
        id: sonar
        if: env.COVERAGE == 'true' && matrix.os == env.PRIMARY_OS && matrix.java == 17 && env.SONAR == 'true' && env.HAS_SONAR_TOKEN == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          set +e
          args=(sonar --info -Dsonar.qualitygate.wait=false)
          if [[ -n "${GRADLE_SCAN_FLAG}" ]]; then args+=("${GRADLE_SCAN_FLAG}"); fi
          ./gradlew "${args[@]}" 2>&1 | tee sonar.log
          rc=${PIPESTATUS[0]}
          set -e
          if [[ $rc -eq 0 ]]; then
            echo "### ✅ SonarCloud analysis uploaded" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if grep -qiE 'HTTP (401|403)|Unauthorized|Forbidden|sonar\.token|Not authorized' sonar.log; then
            msg="SonarCloud AUTH failure (exit $rc): rotate SONAR_TOKEN or check sonar.projectKey. Analysis skipped; CI continues."
          else
            msg="SonarCloud analysis failed (exit $rc): non-blocking, see step log."
          fi
          echo "::warning title=SonarCloud::${msg}"
          echo "### ⚠️ ${msg}" >> "$GITHUB_STEP_SUMMARY"
          exit 0

      - name: SonarCloud enabled without a token
        if: env.COVERAGE == 'true' && matrix.os == env.PRIMARY_OS && matrix.java == 17 && env.SONAR == 'true' && env.HAS_SONAR_TOKEN != 'true'
        run: |
          echo "::warning title=SonarCloud::SonarCloud is enabled but the SONAR_TOKEN secret is not set; skipped."
          echo "### ⚠️ SonarCloud enabled but SONAR_TOKEN is not set: skipped" >> "$GITHUB_STEP_SUMMARY"

      # Build shadowJar for verification (E2E tests run in parallel job)
      - name: Build Shadow JAR
        env:
          GVY_GRADLE_MEMORY_PROBE: ${{ runner.os == 'Linux' && runner.environment == 'github-hosted' && 'true' || 'false' }}
        if: matrix.os == env.PRIMARY_OS && matrix.java == 17
        run: node tools/ci/run-gradle.mjs --report-root "$RUNNER_TEMP/gradle-evidence" --producer shadow-jar :gls:shadowJar --parallel --max-workers=2 --build-cache --stacktrace

      - name: Upload Gradle diagnostic evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gradle-evidence-${{ matrix.os }}-java${{ matrix.java }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/gradle-evidence/
          if-no-files-found: error
          retention-days: 14

      # Keep HTML/JUnit reports without granting test jobs check-publishing tokens.
      - name: Require unit test reports
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          shopt -s globstar nullglob
          reports=(**/build/test-results/test/*.xml)
          if (( ${#reports[@]} == 0 )); then
            echo "::error::Unit test execution produced no JUnit reports."
            exit 1
          fi

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results-${{ matrix.os }}-java${{ matrix.java }}
          path: |-
            **/build/test-results/
            **/build/reports/tests/
            **/build/reports/problems/
            **/build/reports/kover/
          retention-days: 7

      # NEW: Upload JVM diagnostic logs for deadlock/hang analysis
      # These files are generated by the test monitoring infrastructure in build.gradle.kts
      # - test-jvm-*.log: per-process HotSpot XML, thread dumps and lock info
      # - test-recording.jfr: Java Flight Recorder data (if Tier 2 enabled)
      # Use fastThread.io or JDK Mission Control to analyze these files
      - name: Upload Test Diagnostic Logs
        if: always()  # Upload even if tests fail or timeout
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-diagnostics-${{ matrix.os }}-java${{ matrix.java }}
          path: |-
            **/build/test-jvm-*.log
            **/build/test-recording.jfr
          retention-days: 7
          if-no-files-found: ignore  # Don't fail if files don't exist (e.g., tests passed quickly)

      # Verify JAR (built in previous step)
      - name: Resolve shadow JAR
        if: matrix.os == env.PRIMARY_OS && matrix.java == 17
        id: resolve-jar
        shell: bash
        run: |-
          set -euo pipefail
          shopt -s nullglob
          jar_files=(gls/build/libs/gls-*-all.jar)
          if [[ ${#jar_files[@]} -eq 0 ]]; then
            echo "::error::Shadow JAR not found in gls/build/libs"
            exit 1
          fi
          echo "jar_path=${jar_files[0]}" >> "$GITHUB_OUTPUT"

      - name: Verify JAR
        if: matrix.os == env.PRIMARY_OS && matrix.java == 17
        run: |-
          echo "Testing JAR with --help flag..."
          java -Xmx256m -jar "${{ steps.resolve-jar.outputs.jar_path }}" --help

      - name: Upload JAR artifact
        if: matrix.os == env.PRIMARY_OS && matrix.java == 17
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: groovy-lsp-jar-${{ matrix.os }}-java${{ matrix.java }}
          path: ${{ steps.resolve-jar.outputs.jar_path }}
          retention-days: 7

  # E2E tests run in parallel with the build
  e2e-test:
    name: E2E Tests (shard ${{ matrix.shard }})
    # Runs alongside the build, not after it: this job builds what it needs itself (Gradle
    # cache), and waiting on the build only added its duration to the critical path.
    needs: [check-paths, check-runner]
    if: |
      !cancelled() && needs.check-paths.outputs.run_main_ci == 'true' &&
      needs.check-runner.result == 'success' && needs.check-runner.outputs.provisioning_triggered != 'true'
    strategy:
      fail-fast: false
      matrix:
        # Scenarios run one at a time in a single JVM; split them by a stable hash of their name.
        shard: [0, 1, 2]
    # Run on PRIMARY_OS only - E2E tests are platform-independent LSP protocol tests
    # Use same runner selection logic as PRIMARY_OS to respect workflow_dispatch
    runs-on: ${{ (github.event.inputs.runner_label == 'local-macos' || vars.CI_RUNNER_LABEL == 'local-macos') && fromJSON('["self-hosted", "local-macos", "groovy-lsp"]') || (github.event.inputs.runner_label == 'magalu' || vars.CI_RUNNER_LABEL == 'magalu') && fromJSON('["self-hosted", "magalu", "groovy-lsp"]') || (vars.CI_PRIMARY_OS || 'ubuntu-24.04') }}
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Set Gradle flags
        shell: bash
        run: |
          if [[ "${{ github.event.inputs.disable_scan }}" == "true" ]]; then
            echo "GRADLE_SCAN_FLAG=-Dorg.gradle.scan=false" >> "$GITHUB_ENV"
          else
            echo "GRADLE_SCAN_FLAG=" >> "$GITHUB_ENV"
          fi

          case "${{ github.event.inputs.test_log_level }}" in
            "info")
              echo "TEST_LOG_FLAG=--info" >> "$GITHUB_ENV"
              ;;
            "debug")
              echo "TEST_LOG_FLAG=--debug" >> "$GITHUB_ENV"
              ;;
            *)
              echo "TEST_LOG_FLAG=" >> "$GITHUB_ENV"
              ;;
          esac

      # E2E Tests (automatically builds shadowJar via task dependency)
      # Now runs with intelligent parallel forks (2-3 based on runner OS)
      - name: Run E2E Tests
        timeout-minutes: 15
        run: |
          args=(:tests:e2eTest --parallel --max-workers=2 --build-cache --stacktrace "-Dgroovy.lsp.e2e.shard=${{ matrix.shard }}/3")
          if [[ -n "${TEST_LOG_FLAG}" ]]; then
            args+=("${TEST_LOG_FLAG}")
          fi
          if [[ -n "${GRADLE_SCAN_FLAG}" ]]; then
            args+=("${GRADLE_SCAN_FLAG}")
          fi
          node tools/ci/run-gradle.mjs --report-root "$RUNNER_TEMP/gradle-evidence" --producer e2e "${args[@]}"

      - name: Upload Gradle diagnostic evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gradle-evidence-e2e-${{ matrix.shard }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/gradle-evidence/
          if-no-files-found: error
          retention-days: 14

      - name: Upload E2E Test Results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-test-results-shard-${{ matrix.shard }}
          path: |-
            **/build/test-results/e2eTest/
            **/build/reports/tests/e2eTest/
          retention-days: 7

      - name: Require E2E test reports
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          shopt -s globstar nullglob
          reports=(**/build/test-results/e2eTest/*.xml)
          if (( ${#reports[@]} == 0 )); then
            echo "::error::E2E execution produced no JUnit reports."
            exit 1
          fi

  # Cross-platform smoke tests - verify JAR works on key platforms
  # Lighter than the release matrix; validate the packaged JAR before merging too.
  smoke-test:
    name: Smoke Test (${{ matrix.os }})
    needs: build
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # Key platforms for quick validation (full matrix in release.yml)
        os: [ubuntu-24.04, macos-15, windows-2022]
    steps:
      - name: Download JAR artifact
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          pattern: groovy-lsp-jar-*
          merge-multiple: true
          path: dist

      - name: Set up JDK 17
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: 17

      - name: Verify Java version
        run: java -Xmx64m -version

      - name: Run smoke test
        shell: bash
        run: |
          JAR_FILE=$(find dist -name "*.jar" -type f | head -1)
          if [[ -z "$JAR_FILE" ]]; then
            echo "::error::No JAR file found in dist/"
            exit 1
          fi
          echo "Testing JAR: $JAR_FILE"
          java -Xmx256m -jar "$JAR_FILE" --help
          echo "✅ Smoke test passed on ${{ matrix.os }}!"

  launcher:
    name: Native launcher
    needs: check-paths
    if: needs.check-paths.outputs.run_main_ci == 'true' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
    uses: ./.github/workflows/ci-launcher.yml

  zed:
    name: Zed adapter
    needs: check-paths
    if: needs.check-paths.outputs.run_zed_ci == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      CARGO_BUILD_JOBS: 2
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Provision pinned Rust toolchain and WASM target
        working-directory: editors/zed
        run: rustup show active-toolchain
      - name: Check Rust adapter
        run: make zed-check
      - name: Build WASM adapter
        run: make zed-build

  validate:
    name: Validation Check
    runs-on: ${{ vars.CI_FAST_RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      checks: read
    needs: [lint, build, e2e-test, smoke-test, launcher, zed, bazel, check-runner, check-paths]
    if: always()
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Require accounted Actions diagnostics
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node tools/ci/check-runner-diagnostics.mjs --report "$RUNNER_TEMP/runner-diagnostics"
      - name: Require complete current-run validation
        if: ${{ !cancelled() }}
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
          SOURCE_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node tools/ci/check-readiness.mjs "$RUNNER_TEMP/ci-readiness.json" "$RUNNER_TEMP/runner-diagnostics/diagnostics.json"
      - name: Upload required verdict
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-readiness
          path: ${{ runner.temp }}/ci-readiness.json
          if-no-files-found: error
          retention-days: 14
      - name: Upload Actions diagnostic evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: runner-diagnostics-${{ github.run_attempt }}
          path: ${{ runner.temp }}/runner-diagnostics/
          if-no-files-found: error
          retention-days: 14
  dependency-check:
    name: Check Dependencies
    runs-on: ${{ vars.CI_FAST_RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: 15
    permissions:
      contents: read
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up JDK 17
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: 17
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
      - name: Check for dependency updates
        run: ./gradlew dependencyUpdates --refresh-dependencies || true
