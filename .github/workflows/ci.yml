# Temporary proof worker; do not merge. Requires independent review before publishing or dispatch.
name: Receipt JVM composition intermediate proof
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: receipt-jvm-intermediate-${{ github.sha }}
  cancel-in-progress: false
jobs:
  proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      JDK_JAVA_OPTIONS: '-Xmx512m'
      JAVA_TOOL_OPTIONS: '-Xmx512m -Dorg.gradle.deprecation.trace=true'
      GRADLE_OPTS: >-
        -Dorg.gradle.jvmargs="-Xmx1536m -XX:MaxMetaspaceSize=768m -XX:+UseSerialGC"
        -Dorg.gradle.workers.max=1 -Dorg.gradle.parallel=false -Dorg.gradle.daemon=false
      SKIP_PREPARE_SERVER: 'true'
    steps:
      - name: Checkout reviewed support payload
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: support
          persist-credentials: false
      - name: Checkout pinned main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 130e449ecd3136e12f8800094e121ed872703d9d
          path: candidate
          persist-credentials: false
      - name: Verify payload and exact candidate tree
        shell: bash
        working-directory: candidate
        run: |
          set -euo pipefail
          payload="$GITHUB_WORKSPACE/support/.publication/candidate.patch.gz"
          [[ "$(stat -c %s "$payload")" == 98392 ]]
          printf '%s  %s\n' 3ffd18bcd98167f7baa9daee7e09bfe412bb3aaa57d7de7f76e896aa6cb4d752 "$payload" | sha256sum -c -
          python3 - "$payload" "$RUNNER_TEMP/candidate.patch" <<'PY'
          import gzip, pathlib, sys
          with gzip.open(sys.argv[1], 'rb') as source:
              data = source.read(496990)
          assert len(data) == 496989
          pathlib.Path(sys.argv[2]).write_bytes(data)
          PY
          printf '%s  %s\n' 7397dc81162df4246c84ccf2c77b9c2883207396f91d02bf81e4396381ff9ff1 "$RUNNER_TEMP/candidate.patch" | sha256sum -c -
          git apply --check --index "$RUNNER_TEMP/candidate.patch"
          git apply --index "$RUNNER_TEMP/candidate.patch"
          [[ "$(git write-tree)" == d2f9e27ee9cdd969f2763cb01d3df24b6b18fe0c ]]
          git diff --quiet
          git diff --cached --check
      - name: Set up JDK
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24'
      - name: Prepare producer-context verifier
        working-directory: candidate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/receipt-proof"
          [[ "$(git -C "$GITHUB_WORKSPACE/support" rev-parse HEAD)" == "$GITHUB_SHA" ]]
          printf '%s\n' "$GITHUB_SHA" > "$RUNNER_TEMP/receipt-proof/support-sha.txt"
          cat > "$RUNNER_TEMP/receipt-proof/verify-producer.py" <<'PYVERIFY'
          import glob, hashlib, json, os, pathlib, re, sys
          producer, expected_exit = sys.argv[1], int(sys.argv[2])
          paths = glob.glob(os.path.join(os.environ['RUNNER_TEMP'], 'receipt-proof', 'gradle', producer + '-*'))
          assert len(paths) == 1
          directory = pathlib.Path(paths[0]); summary = json.loads((directory / 'summary.json').read_text())
          context = json.loads((directory / 'context.json').read_text())
          base = '130e449ecd3136e12f8800094e121ed872703d9d'
          assert summary['producer'] == producer and summary['context'] == context
          assert context['headSha'] == base and context['testedSha'] == base and context['command'] == 'gradle'
          assert context['runId'] == os.environ['GITHUB_RUN_ID'] and context['runAttempt'] == int(os.environ['GITHUB_RUN_ATTEMPT'])
          assert re.fullmatch(r'[0-9a-f-]{36}', context['invocationId']) and directory.name == producer + '-' + context['invocationId']
          assert summary['worktreeDirty'] is True and summary['complete'] is True
          assert summary['commandExitCode'] == expected_exit and summary['captureExitCode'] == 0
          assert summary['ok'] is (expected_exit == 0) and not summary['unexpected']
          assert summary['errors'] == ([] if expected_exit == 0 else ['Gradle command failed with exit 1'])
          raw = (directory / 'raw.log').read_bytes()
          assert len(raw) == summary['log']['bytes'] and hashlib.sha256(raw).hexdigest() == summary['log']['sha256']
          assert (directory / 'console.log').read_bytes() == raw
          print(directory)
          PYVERIFY
      - name: Focused Node controls
        working-directory: candidate
        shell: bash
        run: |
          set -euo pipefail
          set +e
          node --test --test-reporter=tap tools/perf/*verification*.test.mjs tools/perf/prepared-classpath.test.mjs tools/perf/agent-outcome-envelope.test.mjs tools/perf/runtime-facts*.test.mjs tools/perf/input-identity.test.mjs tools/perf/private-log.test.mjs 2>&1 | tee "$RUNNER_TEMP/receipt-proof/node.tap"
          statuses=("${PIPESTATUS[@]}")
          set -e
          printf 'node_exit=%s capture_exit=%s\n' "${statuses[0]}" "${statuses[1]}" > "$RUNNER_TEMP/receipt-proof/node-status.txt"
          (( statuses[0] == 0 && statuses[1] == 0 ))
          for line in '# tests 163' '# pass 163' '# fail 0' '# cancelled 0' '# skipped 0' '# todo 0'; do grep -Fx "$line" "$RUNNER_TEMP/receipt-proof/node.tap" >/dev/null; done
      - name: Compile and run focused Kotlin controls
        working-directory: candidate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/receipt-proof"
          set +e
          GITHUB_SHA=130e449ecd3136e12f8800094e121ed872703d9d node tools/ci/run-gradle.mjs --report-root "$RUNNER_TEMP/receipt-proof/gradle" --producer receipt-kotlin :tests:harnessTest --rerun --tests '*PublicOutcomeVisibilityTest' --tests '*RequestWaitTest' --tests '*XfailOutcomeTest' --tests '*AgentRunEvidenceCollectorTest' --tests '*AgentRunObserverTest' --tests '*AgentOutcomeJsonTest' --tests '*NamedObservationExecutionTest' --no-daemon --no-parallel --no-build-cache --max-workers=1 '-Dorg.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=768m -XX:+UseSerialGC'
          status=$?
          set -e
          printf '%s\n' "$status" > "$RUNNER_TEMP/receipt-proof/kotlin-exit.txt"
          python3 "$RUNNER_TEMP/receipt-proof/verify-producer.py" receipt-kotlin 0 > "$RUNNER_TEMP/receipt-proof/kotlin-dir.txt"
          (( status == 0 ))
          grep -Fx '> Task :tests:harnessTest' "$(cat "$RUNNER_TEMP/receipt-proof/kotlin-dir.txt")/raw.log" >/dev/null
          mkdir -p "$RUNNER_TEMP/receipt-proof/green-xml"
          python3 - "$PWD/tests/build/test-results/harnessTest" "$RUNNER_TEMP/receipt-proof/green-xml" <<'PY'
          import json, pathlib, shutil, sys, xml.etree.ElementTree as ET
          root = pathlib.Path(sys.argv[1]); destination = pathlib.Path(sys.argv[2])
          prefix = 'com.github.albertocavalcante.gvy.gls.e2e.'
          expected = {prefix + name for name in ('RequestWaitTest', 'XfailOutcomeTest', 'AgentRunEvidenceCollectorTest', 'AgentRunObserverTest', 'AgentOutcomeJsonTest', 'NamedObservationExecutionTest')}
          expected.add(prefix + 'visibility.PublicOutcomeVisibilityTest')
          files = list(root.glob('TEST-*.xml'))
          assert {path.name for path in files} == {'TEST-' + name + '.xml' for name in expected} and len(files) == 7
          inventory = {}
          for path in files:
              assert path.stat().st_size <= 1048576
              doc = ET.parse(path).getroot(); name = doc.attrib['name']
              assert name in expected and name not in inventory and path.name == 'TEST-' + name + '.xml'
              assert int(doc.attrib['tests']) > 0 and int(doc.attrib['failures']) == 0 and int(doc.attrib['errors']) == 0 and int(doc.attrib['skipped']) == 0
              cases = doc.findall('testcase'); names = [case.attrib['name'] for case in cases]
              assert len(cases) == int(doc.attrib['tests']) and len(names) == len(set(names))
              assert all(case.attrib['classname'] == name and not case.findall('failure') and not case.findall('error') and not case.findall('skipped') for case in cases)
              shutil.copyfile(path, destination / path.name)
              inventory[name] = {'count': len(cases), 'cases': names}
          controls = {
              prefix + 'RequestWaitTest': ['interrupted get restores interrupt after successful request cancellation', 'socket timeout does not set the interrupt flag'],
              prefix + 'XfailOutcomeTest': ['IO interruption from a failure getter propagates while socket timeout remains incomplete'],
              prefix + 'AgentRunEvidenceCollectorTest': ['wrapped socket timeout is unavailable without setting interrupt'],
              prefix + 'AgentOutcomeJsonTest': ['private cancellation and cleanup omit throwable content'],
              prefix + 'visibility.PublicOutcomeVisibilityTest': ['public result evidence is accessible to callers'],
          }
          for name, fragments in controls.items():
              for fragment in fragments: assert sum(fragment in case for case in inventory[name]['cases']) == 1
          (destination / 'inventory.json').write_text(json.dumps(inventory, indent=2, sort_keys=True) + '\n')
          PY
      - name: Prepare Gradle classpath manifest
        working-directory: candidate
        shell: bash
        run: |
          set -euo pipefail
          # The checkout has the reviewed patch staged. This 12-hex tree-derived token is a
          # synthetic test identity, not an artifact source stamp or compiler attestation.
          [[ "$(git write-tree)" == d2f9e27ee9cdd969f2763cb01d3df24b6b18fe0c ]]
          git diff --cached --quiet && exit 1
          java_path=$(readlink -f "$(command -v java)")
          java_hash=$(sha256sum "$java_path" | cut -d' ' -f1)
          set +e
          GITHUB_SHA=130e449ecd3136e12f8800094e121ed872703d9d node tools/ci/run-gradle.mjs --report-root "$RUNNER_TEMP/receipt-proof/gradle" --producer receipt-prepare :tests:prepareAgentVerification -Dgroovy.lsp.agent.manifest="$RUNNER_TEMP/receipt-proof/classpath.json" -Dgroovy.lsp.agent.sourceCommit=130e449ecd3136e12f8800094e121ed872703d9d -Dgroovy.lsp.agent.sourceDirty=true -Dgroovy.lsp.agent.sourceDirtyHash=d2f9e27ee9cd -Dgroovy.lsp.agent.javaSha256="$java_hash" --no-daemon --no-parallel --no-build-cache --max-workers=1 '-Dorg.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=768m -XX:+UseSerialGC'
          status=$?
          set -e
          printf '%s\n' "$status" > "$RUNNER_TEMP/receipt-proof/prepare-exit.txt"
          python3 "$RUNNER_TEMP/receipt-proof/verify-producer.py" receipt-prepare 0 > "$RUNNER_TEMP/receipt-proof/prepare-dir.txt"
          (( status == 0 ))
          grep -Fx '> Task :tests:prepareAgentVerification' "$(cat "$RUNNER_TEMP/receipt-proof/prepare-dir.txt")/raw.log" >/dev/null
          JAVA_HASH="$java_hash" MANIFEST="$RUNNER_TEMP/receipt-proof/classpath.json" node --input-type=module <<'JS'
          import fs from 'node:fs/promises';
          import { createHash } from 'node:crypto';
          import { inspectPreparedClasspath } from './tools/perf/prepared-classpath.mjs';
          const bytes = await fs.readFile(process.env.MANIFEST);
          const options = { preparedManifest: process.env.MANIFEST, preparedManifestSha256: createHash('sha256').update(bytes).digest('hex'), sourceCommit: '130e449ecd3136e12f8800094e121ed872703d9d', sourceDirty: true, sourceDirtyHash: 'd2f9e27ee9cd', javaSha256: process.env.JAVA_HASH };
          if ((await inspectPreparedClasspath(options)).status !== 'verified') throw Error('Gradle/Node classpath hashes differ');
          if ((await inspectPreparedClasspath({ ...options, javaSha256: '0'.repeat(64) })).status !== 'unavailable') throw Error('Java mismatch accepted');
          const entry = JSON.parse(bytes).entries.find(e => e.kind === 'directory' && e.path.startsWith(process.cwd() + '/tests/build/'));
          if (!entry) throw Error('No owned test classpath directory');
          const marker = entry.path + '/receipt-proof-mutation';
          await fs.writeFile(marker, 'control', { flag: 'wx' });
          try { if ((await inspectPreparedClasspath(options)).status !== 'mismatch') throw Error('Classpath mutation accepted'); }
          finally { await fs.unlink(marker); }
          JS
      - name: Interrupt restoration behavioral RED control
        working-directory: candidate
        shell: bash
        run: |
          set -euo pipefail
          file=tests/e2e/kotlin/com/github/albertocavalcante/gvy/gls/e2e/RequestWait.kt
          mkdir -p "$RUNNER_TEMP/receipt-proof/red-xml"
          cp "$file" "$RUNNER_TEMP/receipt-proof/request-wait-original.kt"
          git show ":$file" | sha256sum > "$RUNNER_TEMP/receipt-proof/red-xml/staged.sha256"
          sha256sum "$file" > "$RUNNER_TEMP/receipt-proof/red-xml/original.sha256"
          python3 - "$file" <<'PYRED'
          import pathlib, sys
          path = pathlib.Path(sys.argv[1]); source = path.read_text()
          line = '        if (isInterruptedFailure(failure)) Thread.currentThread().interrupt()\n'
          assert source.count(line) == 1
          path.write_text(source.replace(line, ''))
          PYRED
          sha256sum "$file" > "$RUNNER_TEMP/receipt-proof/red-xml/mutated.sha256"
          set +e
          GITHUB_SHA=130e449ecd3136e12f8800094e121ed872703d9d node tools/ci/run-gradle.mjs --report-root "$RUNNER_TEMP/receipt-proof/gradle" --producer receipt-interrupt-red :tests:harnessTest --rerun --tests '*RequestWaitTest.interrupted get restores interrupt after successful request cancellation*' --no-daemon --no-parallel --no-build-cache --max-workers=1 '-Dorg.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=768m -XX:+UseSerialGC'
          status=$?
          set -e
          printf '%s\n' "$status" > "$RUNNER_TEMP/receipt-proof/red-exit.txt"
          cp "$RUNNER_TEMP/receipt-proof/request-wait-original.kt" "$file"
          sha256sum "$file" > "$RUNNER_TEMP/receipt-proof/red-xml/restored.sha256"
          [[ "$(cut -d' ' -f1 "$RUNNER_TEMP/receipt-proof/red-xml/staged.sha256")" == "$(cut -d' ' -f1 "$RUNNER_TEMP/receipt-proof/red-xml/restored.sha256")" ]]
          [[ "$(cut -d' ' -f1 "$RUNNER_TEMP/receipt-proof/red-xml/original.sha256")" == "$(cut -d' ' -f1 "$RUNNER_TEMP/receipt-proof/red-xml/restored.sha256")" ]]
          [[ "$(cut -d' ' -f1 "$RUNNER_TEMP/receipt-proof/red-xml/mutated.sha256")" != "$(cut -d' ' -f1 "$RUNNER_TEMP/receipt-proof/red-xml/restored.sha256")" ]]
          python3 "$RUNNER_TEMP/receipt-proof/verify-producer.py" receipt-interrupt-red 1 > "$RUNNER_TEMP/receipt-proof/red-dir.txt"
          (( status == 1 ))
          grep -Fx '> Task :tests:harnessTest FAILED' "$(cat "$RUNNER_TEMP/receipt-proof/red-dir.txt")/raw.log" >/dev/null
          python3 - "$PWD/tests/build/test-results/harnessTest/TEST-com.github.albertocavalcante.gvy.gls.e2e.RequestWaitTest.xml" <<'PYREDXML'
          import pathlib, sys, xml.etree.ElementTree as ET
          path = pathlib.Path(sys.argv[1]); assert path.stat().st_size <= 1048576
          doc = ET.parse(path).getroot(); cases = doc.findall('testcase')
          assert len(cases) == 1 and int(doc.attrib['failures']) == 1 and int(doc.attrib['errors']) == 0
          assert 'interrupted get restores interrupt after successful request cancellation' in cases[0].attrib['name']
          failure = cases[0].findall('failure'); assert len(failure) == 1 and failure[0].attrib['type'] in ('java.lang.AssertionError', 'org.opentest4j.AssertionFailedError')
          PYREDXML
          cp tests/build/test-results/harnessTest/TEST-com.github.albertocavalcante.gvy.gls.e2e.RequestWaitTest.xml "$RUNNER_TEMP/receipt-proof/red-xml/"
          git diff --quiet
      - name: Upload proof logs and XML
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: receipt-jvm-intermediate
          path: |
            ${{ runner.temp }}/receipt-proof/node.tap
            ${{ runner.temp }}/receipt-proof/*-exit.txt
            ${{ runner.temp }}/receipt-proof/*-status.txt
            ${{ runner.temp }}/receipt-proof/support-sha.txt
            ${{ runner.temp }}/receipt-proof/gradle/
            ${{ runner.temp }}/receipt-proof/green-xml/
            ${{ runner.temp }}/receipt-proof/red-xml/
          if-no-files-found: error
          retention-days: 7
