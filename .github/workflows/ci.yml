name: Test backend parity preparation
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: test-backend-parity-${{ github.sha }}
  cancel-in-progress: false
jobs:
  parity:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
    env:
      JDK_JAVA_OPTIONS: '-Xmx512m'
      JAVA_TOOL_OPTIONS: '-Xmx512m'
    steps:
      - name: Prepare evidence directory
        run: mkdir -m 700 "$RUNNER_TEMP/parity-proof"
      - name: Checkout reviewed support
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: support
          persist-credentials: false
      - name: Checkout base
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 130e449ecd3136e12f8800094e121ed872703d9d
          path: baseline
          persist-credentials: false
      - name: Checkout candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 0992d37ced8af7afaf4d53063cb2836066c583f0
          path: candidate
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Java 17
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Java 21
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '21'
      - name: Fetch checksum-pinned hook tools
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          bins="$RUNNER_TEMP/parity-bin"
          download="$RUNNER_TEMP/parity-download"
          mkdir -p "$bins" "$download"
          gh release download v2.38.2 --repo direnv/direnv --pattern direnv.linux-amd64 --dir "$download"
          printf '%s  %s\n' 148820a187930d36ca6a204504e5cdb30d8396cd1a97e64c3b3f10d793c11247 "$download/direnv.linux-amd64" | sha256sum -c -
          install -m 755 "$download/direnv.linux-amd64" "$bins/direnv"
          gh release download v2.2.2 --repo evilmartians/lefthook --pattern lefthook_2.2.2_Linux_x86_64 --dir "$download"
          printf '%s  %s\n' 4fbf89eb7748c6aed84d833ee1a29edac48fae614468ca9a82896ec32f2800b6 "$download/lefthook_2.2.2_Linux_x86_64" | sha256sum -c -
          install -m 755 "$download/lefthook_2.2.2_Linux_x86_64" "$bins/lefthook"
          echo "$bins" >>"$GITHUB_PATH"
      - name: Bind and format candidate
        working-directory: candidate
        shell: bash
        run: |
          set -euo pipefail
          proof="$RUNNER_TEMP/parity-proof"
          [[ "$(git rev-parse HEAD)" == 0992d37ced8af7afaf4d53063cb2836066c583f0 ]]
          [[ "$(git rev-parse 'HEAD^{tree}')" == 17d0f9851adbf23338b11bfd4d6179d906013106 ]]
          git merge-base --is-ancestor 130e449ecd3136e12f8800094e121ed872703d9d HEAD
          printf '%s  %s\n' 7ed933ec81e68c3b98066f2b3273f475ad9a82cdcb19258ce7f835dd56797f5f "$GITHUB_WORKSPACE/support/.publication/parity.init.gradle" | sha256sum -c -
          git switch -c test/logging-backend-parity
          git reset --soft 130e449ecd3136e12f8800094e121ed872703d9d
          [[ "$(git write-tree)" == 17d0f9851adbf23338b11bfd4d6179d906013106 ]]
          git diff --quiet
          printf '%s\n' build-tool/BUILD.bazel build-tool/build.gradle.kts build-tool/src/test/kotlin/com/github/albertocavalcante/gvy/build/LoggingProviderTest.kt jenkins/BUILD.bazel jenkins/build.gradle.kts jenkins/src/test/kotlin/com/github/albertocavalcante/gvy/jenkins/LoggingProviderTest.kt tools/test-logging/BUILD.bazel tools/test-logging/src/test/resources/logback-test.xml >"$RUNNER_TEMP/expected-paths"
          git diff --cached --name-only >"$RUNNER_TEMP/input-paths"
          cmp "$RUNNER_TEMP/expected-paths" "$RUNNER_TEMP/input-paths"
          direnv allow
          direnv exec . ./gradlew lintFix --no-daemon --no-parallel --max-workers=1 \
          	'-Dorg.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=768m -XX:+UseSerialGC' \
          	"-Dorg.gradle.java.installations.paths=$JAVA_HOME_17_X64,$JAVA_HOME_21_X64" 2>&1 | tee "$proof/lintFix.log"
          while IFS= read -r path; do
          	case "$path" in
          	build-tool/BUILD.bazel | build-tool/build.gradle.kts | build-tool/src/test/kotlin/com/github/albertocavalcante/gvy/build/LoggingProviderTest.kt | jenkins/BUILD.bazel | jenkins/build.gradle.kts | jenkins/src/test/kotlin/com/github/albertocavalcante/gvy/jenkins/LoggingProviderTest.kt | tools/test-logging/BUILD.bazel | tools/test-logging/src/test/resources/logback-test.xml) ;;
          	*)
          		echo "Unexpected formatted path: $path" >&2
          		exit 1
          		;;
          	esac
          done < <(git diff --name-only)
          git add build-tool/BUILD.bazel build-tool/build.gradle.kts build-tool/src/test/kotlin/com/github/albertocavalcante/gvy/build/LoggingProviderTest.kt jenkins/BUILD.bazel jenkins/build.gradle.kts jenkins/src/test/kotlin/com/github/albertocavalcante/gvy/jenkins/LoggingProviderTest.kt tools/test-logging/BUILD.bazel tools/test-logging/src/test/resources/logback-test.xml
          git diff --quiet
          git diff --cached --check
          git diff --cached --name-only >"$RUNNER_TEMP/formatted-paths"
          cmp "$RUNNER_TEMP/expected-paths" "$RUNNER_TEMP/formatted-paths"
          git write-tree >"$proof/formatted-tree"
          git diff --cached --binary >"$proof/formatted.patch"
          sha256sum "$proof/formatted.patch" >"$proof/formatted.sha256"
      - name: Four independent config mutations
        working-directory: candidate
        shell: bash
        run: |
          set -euo pipefail
          proof="$RUNNER_TEMP/parity-proof"
          config=tools/test-logging/src/test/resources/logback-test.xml
          cp "$config" "$RUNNER_TEMP/parity-canonical.xml"
          for mode in missing wrong-target duplicate missing-level; do
          	cp "$RUNNER_TEMP/parity-canonical.xml" "$config"
          	case "$mode" in
          	missing) rm "$config" ;;
          	wrong-target) perl -0777 -i -pe 's/<target>System.err<\/target>/<target>System.out<\/target>/' "$config" ;;
          	duplicate) perl -0777 -i -pe 's/<root level="WARN">/<appender name="DUPLICATE" class="ch.qos.logback.core.ConsoleAppender"><target>System.err<\/target><encoder><pattern>%msg%n<\/pattern><\/encoder><\/appender>\n    <root level="WARN">/; s/<appender-ref ref="STDERR" \/>/<appender-ref ref="STDERR" \/>\n        <appender-ref ref="DUPLICATE" \/>/' "$config" ;;
          	missing-level) perl -0777 -i -pe 's/%-5level/LEVEL/' "$config" ;;
          	esac
          	rm -f build-tool/build/test-results/test/TEST-com.github.albertocavalcante.gvy.build.LoggingProviderTest.xml jenkins/build/test-results/test/TEST-com.github.albertocavalcante.gvy.jenkins.LoggingProviderTest.xml
          	set +e
          	direnv exec . ./gradlew :build-tool:test --tests 'com.github.albertocavalcante.gvy.build.LoggingProviderTest' :jenkins:test --tests 'com.github.albertocavalcante.gvy.jenkins.LoggingProviderTest' \
          		--continue --rerun-tasks --no-build-cache --no-daemon --no-parallel --max-workers=1 --info \
          		-I "$GITHUB_WORKSPACE/support/.publication/parity.init.gradle" \
          		'-Dorg.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=768m -XX:+UseSerialGC' \
          		"-Dorg.gradle.java.installations.paths=$JAVA_HOME_17_X64,$JAVA_HOME_21_X64" >"$proof/$mode.log" 2>&1
          	status=$?
          	set -e
          	[[ "$status" != 0 ]]
          	for module in build-tool jenkins; do
          		if [[ "$module" == build-tool ]]; then package=build; else package=jenkins; fi
          		xml="$module/build/test-results/test/TEST-com.github.albertocavalcante.gvy.$package.LoggingProviderTest.xml"
          		python3 - "$mode" "$xml" <<'PYXML'
          import sys
          import xml.etree.ElementTree as ET
          mode, path = sys.argv[1:]
          root = ET.parse(path).getroot()
          cases = root.findall("testcase")
          failed = [(case, case.find("failure")) for case in cases if case.find("failure") is not None]
          if root.get("tests") != "2" or root.get("errors") != "0" or root.get("skipped") != "0" or len(failed) != 1:
              raise SystemExit("mutation did not produce the intended single assertion failure")
          case, failure = failed[0]
          text = (failure.get("message") or "") + (failure.text or "")
          expected = {"missing": ("not null",), "wrong-target": ("System.err", "System.out"),
                      "duplicate": ("<1>", "<2>"), "missing-level": ("Unexpected rendered log record",)}
          if "quiet test policy" not in case.get("name", "") or "AssertionFailedError" not in failure.get("type", ""):
              raise SystemExit("wrong failing case or failure type")
          if not all(part in text for part in expected[mode]):
              raise SystemExit("wrong assertion failure for mutation " + mode)
          PYXML
          		cp "$xml" "$proof/$mode-$module.xml"
          	done
          done
          cp "$RUNNER_TEMP/parity-canonical.xml" "$config"
          git diff --quiet
          [[ "$(git write-tree)" == "$(cat "$proof/formatted-tree")" ]]
      - name: Restored tests and scoped lint
        working-directory: candidate
        shell: bash
        run: |
          set -euo pipefail
          proof="$RUNNER_TEMP/parity-proof"
          rm -f build-tool/build/test-results/test/TEST-com.github.albertocavalcante.gvy.build.LoggingProviderTest.xml jenkins/build/test-results/test/TEST-com.github.albertocavalcante.gvy.jenkins.LoggingProviderTest.xml
          direnv exec . ./gradlew :build-tool:test --tests 'com.github.albertocavalcante.gvy.build.LoggingProviderTest' :jenkins:test --tests 'com.github.albertocavalcante.gvy.jenkins.LoggingProviderTest' :build-tool:lint :jenkins:lint \
          	--rerun-tasks --no-build-cache --no-daemon --no-parallel --max-workers=1 --info \
          	-I "$GITHUB_WORKSPACE/support/.publication/parity.init.gradle" \
          	'-Dorg.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=768m -XX:+UseSerialGC' \
          	"-Dorg.gradle.java.installations.paths=$JAVA_HOME_17_X64,$JAVA_HOME_21_X64" 2>&1 | tee "$proof/positive.log"
          grep -F "$JAVA_HOME_17_X64/bin/java" "$proof/positive.log" | grep -F 'Gradle Test Executor' | grep -F -- '-Xmx512m' | grep -F -- '-XX:MaxMetaspaceSize=512m' >"$proof/actual-test-java.txt"
          for module in build-tool jenkins; do
          	if [[ "$module" == build-tool ]]; then package=build; else package=jenkins; fi
          	xml="$module/build/test-results/test/TEST-com.github.albertocavalcante.gvy.$package.LoggingProviderTest.xml"
          	python3 - "$xml" <<'PYXML'
          import sys
          import xml.etree.ElementTree as ET
          root = ET.parse(sys.argv[1]).getroot()
          cases = root.findall("testcase")
          if root.get("tests") != "2" or any(root.get(k) != "0" for k in ("failures", "errors", "skipped")) or len(cases) != 2:
              raise SystemExit("expected two passing provider tests")
          if any(any(case.find(k) is not None for k in ("failure", "error", "skipped")) for case in cases):
              raise SystemExit("unexpected nonpassing provider test")
          PYXML
          	cp "$xml" "$proof/positive-$module.xml"
          done
          git diff --quiet
          [[ "$(git write-tree)" == "$(cat "$proof/formatted-tree")" ]]
      - name: Compare production graphs, JAR entries and POM tasks
        shell: bash
        run: |
          set -euo pipefail
          proof="$RUNNER_TEMP/parity-proof"
          for checkout in baseline candidate; do
          	cd "$GITHUB_WORKSPACE/$checkout"
          	direnv allow
          	for module in build-tool jenkins; do
          		direnv exec . ./gradlew ":$module:dependencies" --configuration runtimeClasspath -q --no-daemon --no-parallel --max-workers=1 \
          			'-Dorg.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=768m -XX:+UseSerialGC' >"$proof/$checkout-$module-graph.txt" 2>"$proof/$checkout-$module-graph.stderr"
          		direnv exec . ./gradlew ":$module:tasks" --all -q --no-daemon --no-parallel --max-workers=1 \
          			'-Dorg.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=768m -XX:+UseSerialGC' >"$proof/$checkout-$module-tasks.txt" 2>&1
          		awk '/^generatePomFileFor[A-Za-z0-9]+Publication[[:space:]]/ {print $1}' "$proof/$checkout-$module-tasks.txt" | sort >"$proof/$checkout-$module-pom-tasks.txt"
          		while IFS= read -r task; do
          			[[ "$task" =~ ^generatePomFileFor[A-Za-z0-9]+Publication$ ]]
          			direnv exec . ./gradlew ":$module:$task" --no-daemon --no-parallel --max-workers=1 \
          				'-Dorg.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=768m -XX:+UseSerialGC' >>"$proof/$checkout-$module-pom.log" 2>&1
          		done <"$proof/$checkout-$module-pom-tasks.txt"
          	done
          	direnv exec . ./gradlew :build-tool:jar :jenkins:jar --no-daemon --no-parallel --max-workers=1 \
          		'-Dorg.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=768m -XX:+UseSerialGC' >"$proof/$checkout-jar.log" 2>&1
          	for module in build-tool jenkins; do
          		mapfile -t jars < <(find "$module/build/libs" -maxdepth 1 -type f -name '*.jar' -print)
          		[[ ${#jars[@]} == 1 ]]
          		unzip -Z1 "${jars[0]}" | LC_ALL=C sort >"$proof/$checkout-$module-entries.txt"
          		if grep -E '(^|/)(logback-test\.xml|logback-classic|logback-core)' "$proof/$checkout-$module-entries.txt"; then
          			echo "Test logging resource leaked into production JAR" >&2
          			exit 1
          		fi
          	done
          done
          for module in build-tool jenkins; do
          	cmp "$proof/baseline-$module-graph.txt" "$proof/candidate-$module-graph.txt"
          	cmp "$proof/baseline-$module-entries.txt" "$proof/candidate-$module-entries.txt"
          	cmp "$proof/baseline-$module-pom-tasks.txt" "$proof/candidate-$module-pom-tasks.txt"
          	if [[ -s "$proof/baseline-$module-pom-tasks.txt" ]]; then
          		diff -ru "$GITHUB_WORKSPACE/baseline/$module/build/publications" "$GITHUB_WORKSPACE/candidate/$module/build/publications" >"$proof/$module-pom-diff.txt"
          	else
          		printf '%s\n' 'No configured POM generation tasks; no POM artifact claim.' >"$proof/$module-pom-absent.txt"
          	fi
          done
      - name: Commit with normal hooks
        working-directory: candidate
        shell: bash
        run: |
          set -euo pipefail
          proof="$RUNNER_TEMP/parity-proof"
          [[ -z "${LEFTHOOK:-}" && -z "${LEFTHOOK_EXCLUDE:-}" && -z "${LEFTHOOK_SKIP:-}" ]]
          [[ -z "$(git config --get core.hooksPath || true)" ]]
          lefthook install
          test -x .git/hooks/pre-commit && test -x .git/hooks/commit-msg
          git config user.name 'gvy publication automation'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git diff --quiet && [[ "$(git write-tree)" == "$(cat "$proof/formatted-tree")" ]]
          direnv exec . git commit -m 'test(logging): align test backend behavior' 2>&1 | tee "$proof/hooks.log"
          [[ "$(git rev-parse HEAD^)" == 130e449ecd3136e12f8800094e121ed872703d9d ]]
          [[ "$(git rev-parse 'HEAD^{tree}')" == "$(cat "$proof/formatted-tree")" ]]
          git diff --quiet && git diff --cached --quiet
          git bundle create "$proof/candidate.bundle" HEAD ^130e449ecd3136e12f8800094e121ed872703d9d
          git bundle verify "$proof/candidate.bundle"
          git rev-parse HEAD >"$proof/head"
          (cd "$proof" && sha256sum candidate.bundle >bundle.sha256)
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-backend-parity-proof
          path: ${{ runner.temp }}/parity-proof/
          if-no-files-found: error
          retention-days: 7
