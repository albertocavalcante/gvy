name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read # Required for Claude to read CI results on PRs
    steps:
      - name: Checkout repository
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@a017b830c03e23789b11fb69ed571ea61c12e45c # v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

          # This is an optional setting that allows Claude to read CI results on PRs
          additional_permissions: |
            actions: read

          # Security constraints to enforce AGENTS.md rules
          # Allows: Read/analyze code, run Gradle, check git status, use gh CLI, run make commands
          # Prevents: git add ., git push --force, rm -rf, curl/wget (use gh instead)
          claude_args: |
            --allowed-tools "Read,Glob,Grep,Edit,Bash(./gradlew :*),Bash(git status),Bash(git diff:*),Bash(git log:*),Bash(git branch:*),Bash(gh :*),Bash(make :*)"
            --disallowed-tools "Bash(git add .),Bash(git push --force),Bash(rm -rf:*),Bash(curl :*),Bash(wget :*)"
            --max-turns 10

      - name: Upload Claude execution log
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: claude-log-${{ github.event.issue.number || github.event.pull_request.number }}-${{ github.run_id }}
          path: /home/runner/work/_temp/claude-execution-output.json
          retention-days: 7
          if-no-files-found: ignore

      - name: Output failure summary
        if: failure()
        run: |
          {
            echo "## Claude Code Execution Failed"
            echo ""
            if [ -f /home/runner/work/_temp/claude-execution-output.json ]; then
              echo "### Execution Details"
              echo '```json'
              jq -r 'if .type == "result" then {type, subtype, is_error, duration_ms, num_turns, total_cost_usd, permission_denials} else {type, subtype, message} end' /home/runner/work/_temp/claude-execution-output.json 2>/dev/null | head -50 || head -100 /home/runner/work/_temp/claude-execution-output.json
              echo '```'
              echo ""
              echo "Full log available in artifacts: **claude-log-${{ github.event.issue.number || github.event.pull_request.number }}-${{ github.run_id }}**"
            else
              echo "No execution log found."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

