name: CI (Bazel)

on:
  push:
    branches:
      - main
    paths:
      - 'MODULE.bazel'
      - 'MODULE.bazel.lock'
      - 'BUILD.bazel'
      - '**/BUILD.bazel'
      - '**/*.bzl'
      - '.bazelrc'
      - '.bazelversion'
      - 'third_party/patches/**'
      - '.github/workflows/ci-bazel.yml'
      - 'tools/ci/bazel-diagnostics*'
      - '**/src/**'
      - '!editors/zed/**'
      - '**/build.gradle.kts'
      - 'gradle/libs.versions.toml'
      - 'tests/e2e/**'
      - 'editors/code/client/src/**'
      - 'editors/code/**/tsconfig*.json'
      - 'editors/code/**/package.json'
      - 'editors/code/pnpm-lock.yaml'
      - 'editors/code/pnpm-workspace.yaml'
  schedule:
    - cron: '30 4 * * *' # Daily at 04:30 UTC: backstop for drift the push filter misses
  pull_request:
    branches:
      - main
    paths:
      - 'MODULE.bazel'
      - 'MODULE.bazel.lock'
      - 'BUILD.bazel'
      - '**/BUILD.bazel'
      - '**/*.bzl'
      - '.bazelrc'
      - '.bazelversion'
      - 'third_party/patches/**'
      - '.github/workflows/ci-bazel.yml'
      - 'tools/ci/bazel-diagnostics*'
      - '**/src/**'
      - '!editors/zed/**'
      - '**/build.gradle.kts'
      - 'gradle/libs.versions.toml'
      - 'tests/e2e/**'
      - 'editors/code/client/src/**'
      - 'editors/code/**/tsconfig*.json'
      - 'editors/code/**/package.json'
      - 'editors/code/pnpm-lock.yaml'
      - 'editors/code/pnpm-workspace.yaml'
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.head_ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            name: linux-amd64
          # macOS disabled for now - enable when Bazel setup is stable
          # - os: macos-15
          #   name: darwin-arm64

    runs-on: ${{ matrix.os }}
    name: Build (${{ matrix.name }})
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Bazelisk
        uses: bazel-contrib/setup-bazel@f34d6a05eae3c24acab7fa54587492daeaeffdab # 0.19.2
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}
          repository-cache: true

      - name: Self-test diagnostic gate
        run: node --test tools/ci/bazel-diagnostics.test.mjs

      - name: Build all targets
        run: |
          mkdir -p "$RUNNER_TEMP/bazel-diagnostics"
          bazel build //... --lockfile_mode=error --keep_going --color=no --curses=no 2>&1 | tee "$RUNNER_TEMP/bazel-diagnostics/build.log"

      - name: Run tests
        run: bazel test //... --lockfile_mode=error --test_output=errors --test_verbose_timeout_warnings --color=no --curses=no 2>&1 | tee "$RUNNER_TEMP/bazel-diagnostics/test.log"

      - name: Enforce diagnostic accountability
        if: ${{ !cancelled() }}
        run: |
          node tools/ci/bazel-diagnostics.mjs \
            --baseline tools/ci/bazel-diagnostics.json \
            --report "$RUNNER_TEMP/bazel-diagnostics" \
            "$RUNNER_TEMP/bazel-diagnostics/build.log" \
            "$RUNNER_TEMP/bazel-diagnostics/test.log"

      - name: Upload diagnostic evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bazel-diagnostics-${{ matrix.name }}
          path: ${{ runner.temp }}/bazel-diagnostics/
          if-no-files-found: error
          retention-days: 14

      - name: Upload test logs on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bazel-testlogs-${{ matrix.name }}
          path: |
            bazel-testlogs/**/test.log
            bazel-testlogs/**/test.xml
          retention-days: 7

  buildifier:
    runs-on: ubuntu-24.04
    name: Lint (Buildifier)
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Bazelisk
        uses: bazel-contrib/setup-bazel@f34d6a05eae3c24acab7fa54587492daeaeffdab # 0.19.2
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}-lint
          repository-cache: true

      - name: Check BUILD files formatting
        run: bazel run @buildifier_prebuilt//:buildifier -- -mode=check -lint=warn -r .
