name: CI (Bazel)

on:
  workflow_call:
  schedule:
    - cron: '30 4 * * *' # Daily at 04:30 UTC: full drift backstop
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: bazel-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.head_ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            name: linux-amd64
          # macOS disabled for now - enable when Bazel setup is stable
          # - os: macos-15
          #   name: darwin-arm64

    runs-on: ${{ matrix.os }}
    name: Build (${{ matrix.name }})
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Bazelisk
        uses: bazel-contrib/setup-bazel@f34d6a05eae3c24acab7fa54587492daeaeffdab # 0.19.2
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}
          repository-cache: true

      - name: Self-test diagnostic and evidence gates
        run: node --test tools/ci/*.test.mjs

      - name: Build all targets and capture evidence
        run: node tools/ci/run-bazel.mjs --report-root "$RUNNER_TEMP/bazel-evidence" --producer bazel-build build //...

      - name: Run tests and capture evidence
        run: node tools/ci/run-bazel.mjs --report-root "$RUNNER_TEMP/bazel-evidence" --producer bazel-test test //...

      - name: Enforce diagnostic accountability
        if: ${{ !cancelled() }}
        run: |
          shopt -s nullglob
          logs=("$RUNNER_TEMP"/bazel-evidence/*/console.log)
          node tools/ci/bazel-diagnostics.mjs \
            --baseline tools/ci/bazel-diagnostics.json \
            --report "$RUNNER_TEMP/bazel-evidence/diagnostics" "${logs[@]}"

      - name: Summarize invocation evidence
        if: ${{ !cancelled() }}
        run: node tools/ci/summarize-bazel.mjs "$RUNNER_TEMP/bazel-evidence"

      - name: Upload BEP, profiles and diagnostic evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bazel-evidence-${{ matrix.name }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/bazel-evidence/
          if-no-files-found: error
          retention-days: 14

      - name: Upload test logs on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bazel-testlogs-${{ matrix.name }}
          path: |
            bazel-testlogs/**/test.log
            bazel-testlogs/**/test.xml
          retention-days: 7

  buildifier:
    runs-on: ubuntu-24.04
    name: Lint (Buildifier)
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Bazelisk
        uses: bazel-contrib/setup-bazel@f34d6a05eae3c24acab7fa54587492daeaeffdab # 0.19.2
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}-lint
          repository-cache: true

      - name: Check BUILD files formatting
        run: bazel run @buildifier_prebuilt//:buildifier -- -mode=check -lint=warn -r .
