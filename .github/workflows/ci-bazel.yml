name: CI (Bazel)

on:
  push:
    branches:
      - main
    paths:
      - 'MODULE.bazel'
      - 'MODULE.bazel.lock'
      - 'BUILD.bazel'
      - '**/BUILD.bazel'
      - '**/*.bzl'
      - '.bazelrc'
      - '.bazelversion'
      - 'third_party/patches/**'
      - '.github/workflows/ci-bazel.yml'
      - 'tools/ci/bazel-diagnostics*'
      - '**/src/**'
      - '**/build.gradle.kts'
      - 'gradle/libs.versions.toml'
      - 'tests/e2e/**'
      - 'editors/code/**'
  schedule:
    - cron: '30 4 * * *' # Daily at 04:30 UTC: backstop for drift the push filter misses
  pull_request:
    branches:
      - main
    paths:
      - 'MODULE.bazel'
      - 'MODULE.bazel.lock'
      - 'BUILD.bazel'
      - '**/BUILD.bazel'
      - '**/*.bzl'
      - '.bazelrc'
      - '.bazelversion'
      - 'third_party/patches/**'
      - '.github/workflows/ci-bazel.yml'
      - 'tools/ci/bazel-diagnostics*'
      - '**/src/**'
      - '**/build.gradle.kts'
      - 'gradle/libs.versions.toml'
      - 'tests/e2e/**'
      - 'editors/code/**'
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.head_ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            name: linux-amd64
          # macOS disabled for now - enable when Bazel setup is stable
          # - os: macos-15
          #   name: darwin-arm64

    runs-on: ${{ matrix.os }}
    name: Build (${{ matrix.name }})
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Bazelisk
        uses: bazel-contrib/setup-bazel@e8776f58fb6a6e9055cbaf1b38c52ccc5247e9c4 # 0.14.0
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}
          repository-cache: true

      - name: Self-test diagnostic gate
        run: node --test tools/ci/bazel-diagnostics.test.mjs

      - name: Build all targets
        run: |
          mkdir -p "$RUNNER_TEMP/bazel-diagnostics"
          bazel build //... --color=no --curses=no 2>&1 | tee "$RUNNER_TEMP/bazel-diagnostics/build.log"

      - name: Run tests
        run: bazel test //... --test_output=errors --color=no --curses=no 2>&1 | tee "$RUNNER_TEMP/bazel-diagnostics/test.log"

      - name: Enforce diagnostic accountability
        if: ${{ !cancelled() }}
        run: |
          node tools/ci/bazel-diagnostics.mjs \
            --baseline tools/ci/bazel-diagnostics.json \
            --report "$RUNNER_TEMP/bazel-diagnostics" \
            "$RUNNER_TEMP/bazel-diagnostics/build.log" \
            "$RUNNER_TEMP/bazel-diagnostics/test.log"

      - name: Upload diagnostic evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: bazel-diagnostics-${{ matrix.name }}
          path: ${{ runner.temp }}/bazel-diagnostics/
          if-no-files-found: error
          retention-days: 14

      - name: Upload test logs on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: bazel-testlogs-${{ matrix.name }}
          path: |
            bazel-testlogs/**/test.log
            bazel-testlogs/**/test.xml
          retention-days: 7

  buildifier:
    runs-on: ubuntu-24.04
    name: Lint (Buildifier)
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Setup Bazelisk
        uses: bazel-contrib/setup-bazel@e8776f58fb6a6e9055cbaf1b38c52ccc5247e9c4 # 0.14.0
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}-lint
          repository-cache: true

      - name: Check BUILD files formatting
        run: bazel run @buildifier_prebuilt//:buildifier -- -mode=check -lint=warn -r .
