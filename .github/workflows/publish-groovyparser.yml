name: Publish GroovyParser Core

on:
  push:
    tags:
      - 'groovyparser-v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (e.g., 0.1.0)'
        required: true
        type: string
      dry_run:
        description: 'Dry run (build but do not publish)'
        required: false
        type: boolean
        default: false

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read

    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup licensing tools
        uses: ./.github/actions/setup-licensing
      - name: Check license metadata before building
        run: uv run --offline --locked --no-dev --project .reuse python .reuse/check.py --root .

      - name: Determine version
        id: version
        run: |
          if [[ -n "${{ github.event.inputs.version }}" ]]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            # Extract version from tag (groovyparser-v1.0.0 -> 1.0.0)
            VERSION="${GITHUB_REF_NAME#groovyparser-v}"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Publishing version: ${VERSION}"

      - name: Set up JDK 17
        uses: actions/setup-java@f2beeb24e141e01a676f977032f5a29d81c9e27e # v5.1.0
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2
        with:
          cache-read-only: false

      - name: Build and test
        run: |
          ./gradlew :parser:core:build :parser:core:test \
            --parallel --build-cache --stacktrace

      - name: Upload build artifacts
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: groovyparser-core-artifacts
          path: |
            parser/core/build/libs/*.jar
          retention-days: 7

  publish:
    name: Publish to GitHub Packages
    needs: build
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Setup licensing tools
        uses: ./.github/actions/setup-licensing
      - name: Check license metadata before publishing
        run: uv run --offline --locked --no-dev --project .reuse python .reuse/check.py --root .

      - name: Set up JDK 17
        uses: actions/setup-java@f2beeb24e141e01a676f977032f5a29d81c9e27e # v5.1.0
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2

      - name: Publish to GitHub Packages
        run: |
          ./gradlew :parser:core:publish \
            -Pversion=${{ needs.build.outputs.version }} \
            --stacktrace
        env:
          ORG_GRADLE_PROJECT_GitHubPackagesUsername: ${{ github.actor }}
          ORG_GRADLE_PROJECT_GitHubPackagesPassword: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish summary
        run: |
          {
            echo "## 📦 GroovyParser Core Published"
            echo ""
            echo "**Version:** ${{ needs.build.outputs.version }}"
            echo ""
            echo "### Installation"
            echo ""
            echo '```kotlin'
            echo 'repositories {'
            echo '    maven {'
            echo '        url = uri("https://maven.pkg.github.com/albertocavalcante/gvy")'
            echo '    }'
            echo '}'
            echo ''
            echo 'dependencies {'
            echo "    implementation(\"com.github.albertocavalcante:groovyparser-core:${{ needs.build.outputs.version }}\")"
            echo '}'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

