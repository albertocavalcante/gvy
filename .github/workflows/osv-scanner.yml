# OSV-Scanner checks dependencies for known vulnerabilities on PRs and on a schedule.
name: OSV-Scanner

on:
  pull_request:
    branches: [main]
    paths:
      - '**/build.gradle.kts'
      - '**/settings.gradle.kts'
      - 'gradle/libs.versions.toml'
      - '**/package.json'
      - '**/pnpm-lock.yaml'
      - '**/pnpm-workspace.yaml'
      - '**/Cargo.toml'
      - '**/Cargo.lock'
      - 'MODULE.bazel'
      - 'MODULE.bazel.lock'
      - '**/*.lockfile'
      - '**/gradle.lockfile'
      - '.github/workflows/osv-scanner.yml'
  schedule:
    - cron: "0 5 * * 1"

permissions:
  actions: read
  contents: read
  security-events: write

concurrency:
  # Cancel superseded runs on PRs; never cancel runs on main.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  scan-scheduled:
    if: ${{ github.event_name == 'schedule' }}
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@2a387edfbe02a11d856b89172f6e978100177eb4 # v2.3.2
    with:
      scan-args: |-
        --include-git-root
        -r
        ./

  scan-pr:
    if: ${{ github.event_name == 'pull_request' }}
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable-pr.yml@2a387edfbe02a11d856b89172f6e978100177eb4 # v2.3.2
    with:
      scan-args: |-
        --include-git-root
        -r
        ./
