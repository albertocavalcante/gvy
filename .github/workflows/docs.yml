name: Deploy docs

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "editors/code/package.json"
      - "CONTRIBUTING.md"
      - ".github/workflows/docs.yml"
  pull_request:
    paths:
      - "docs/**"
      - "editors/code/package.json"
      - "CONTRIBUTING.md"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read

# PR builds get their own per-ref group so they never queue behind or cancel a
# main deploy; deploys keep the shared "pages" group and are never cancelled.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('docs-pr-{0}', github.ref) || 'pages' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4

      - name: Setup Pages
        id: pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0

      - name: Install dependencies
        working-directory: docs/website
        run: bun install --frozen-lockfile

      - name: Validate documentation
        working-directory: docs/website
        run: bun run validate

      - name: Install browser
        working-directory: docs/website
        run: bunx playwright install --with-deps chromium

      - name: Test documentation in Chromium
        id: browser-tests
        working-directory: docs/website
        env:
          GVY_E2E_CLIPBOARD: "1"
        run: bun run test:e2e

      - name: Upload browser report
        if: always() && steps.browser-tests.outcome != 'skipped'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: docs-browser-report
          path: |
            docs/website/playwright-report
            docs/website/test-results
          if-no-files-found: ignore
          retention-days: 7

      - name: Assert pages were generated
        run: |
          count=$(find docs/website/dist -name '*.html' | wc -l | tr -d ' ')
          echo "Built ${count} pages" | tee -a "$GITHUB_STEP_SUMMARY"
          if [ "${count}" -lt 2 ]; then
            echo "::error::Docs build produced ${count} HTML page(s), expected at least 2 (check src/content.config.ts and the content collections)"
            exit 1
          fi

      - name: Upload artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: docs/website/dist

  deploy:
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
