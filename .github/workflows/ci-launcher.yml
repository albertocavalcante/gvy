name: Native launcher CI

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

env:
  # Capture Gradle diagnostics; native compiler memory is outside the JVM sampler's contract.
  GVY_GRADLE_MEMORY_PROBE: 'false'

concurrency:
  group: launcher-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.head_ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  build-server:
    name: Stage launcher server payload
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      server_sha256: ${{ steps.upload_server.outputs.artifact-digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Setup build Java
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Stage candidate server
        run: >-
          node tools/ci/run-gradle.mjs --report-root "$RUNNER_TEMP/launcher-gradle-evidence" --producer launcher-server
          :gls:stageEditorServer --no-daemon --no-parallel --build-cache --stacktrace
          --max-workers=2 '-Dorg.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=2g -Dfile.encoding=UTF-8'

      - name: Upload Gradle diagnostic evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gradle-evidence-launcher-server-${{ github.run_attempt }}
          path: ${{ runner.temp }}/launcher-gradle-evidence/
          # Context, logs and diagnostic receipts form a multi-file evidence archive.
          archive: true
          if-no-files-found: error
          retention-days: 14

      - name: Upload candidate server
        id: upload_server
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: gls/build/editor-server/gls.jar
          # The JAR is already an archive; direct transfer avoids the deprecated ZIP extractor.
          # In this mode the action uses the uploaded filename, gls.jar, as the artifact name.
          archive: false
          if-no-files-found: error
          retention-days: 1

      - name: Require uploaded server digest
        env:
          GVY_SERVER_SHA256: ${{ steps.upload_server.outputs.artifact-digest }}
        run: |
          if [[ ! "$GVY_SERVER_SHA256" =~ ^[0-9a-fA-F]{64}$ ]]; then
            echo "::error::Uploaded server SHA-256 is missing or invalid"
            exit 1
          fi

  native:
    name: Launcher (${{ matrix.target }})
    needs: build-server
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            arch: x64
            target: linuxX64
            producer: launcher-linux-x64
            executable: gvy.kexe
            test-task: linuxX64Test
            link-task: linkReleaseExecutableLinuxX64
          # macos-15 is the standard Arm64 runner; macos-15-intel is a separate image.
          - os: macos-15
            arch: arm64
            target: macosArm64
            producer: launcher-macos-arm64
            executable: gvy.kexe
            test-task: macosArm64Test
            link-task: linkReleaseExecutableMacosArm64
          - os: windows-2025
            arch: x64
            target: mingwX64
            producer: launcher-windows-x64
            executable: gvy.exe
            test-task: mingwX64Test
            link-task: linkReleaseExecutableMingwX64
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Setup build Java
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24

      - name: Verify native runner architecture
        env:
          EXPECTED_ARCH: ${{ matrix.arch }}
        run: node -e 'if (process.arch !== process.env.EXPECTED_ARCH) throw new Error("Unexpected native runner architecture")'

      - name: Select Windows PE probe compiler
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # TODO(#1828): Recheck the pinned K/N compiler compatibility by 2026-12-11.
          # See: https://github.com/albertocavalcante/gvy/issues/1828
          # The runner image installs modern MinGW here. K/N's older GCC crashes on Server 2025.
          $compiler = 'C:\mingw64\bin\gcc.exe'
          if (!(Test-Path -LiteralPath $compiler -PathType Leaf)) {
            throw 'The Windows runner must provide its documented MinGW x64 compiler'
          }
          $target = (& $compiler -dumpmachine).Trim()
          if ($LASTEXITCODE -ne 0 -or $target -ne 'x86_64-w64-mingw32') {
            throw 'The Windows probe compiler must target native MinGW x64'
          }
          $version = (& $compiler -dumpfullversion).Trim()
          if ($LASTEXITCODE -ne 0 -or $version -notmatch '^([0-9]+)\.' -or [int]$Matches[1] -lt 15) {
            throw 'The Windows probe requires GCC 15 or newer'
          }
          & $compiler --version
          if ($LASTEXITCODE -ne 0) { throw 'Cannot identify the Windows probe compiler' }
          Write-Output "Probe compiler SHA-256: $((Get-FileHash $compiler -Algorithm SHA256).Hash)"
          "GVY_PROBE_CC=$compiler" >> $env:GITHUB_ENV
          Split-Path -Parent $compiler >> $env:GITHUB_PATH

      - name: Build Windows evidence helpers
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $reader = Join-Path $env:RUNNER_TEMP 'gvy-windows-evidence-reader.exe'
          & $env:GVY_PROBE_CC -std=c11 -O2 -static -Wall -Wextra -Werror tools/ci/windows-evidence-reader.c -o $reader
          if ($LASTEXITCODE -ne 0) { throw 'Cannot build the Windows evidence reader' }
          Write-Output "Evidence reader SHA-256: $((Get-FileHash $reader -Algorithm SHA256).Hash)"
          "GVY_CI_EVIDENCE_READER=$reader" >> $env:GITHUB_ENV
          $rootHelper = Join-Path $env:RUNNER_TEMP 'gvy-windows-private-root.exe'
          & $env:GVY_PROBE_CC -std=c11 -O2 -static -Wall -Wextra -Werror tools/ci/windows-private-root.c -ladvapi32 -o $rootHelper
          if ($LASTEXITCODE -ne 0) { throw 'Cannot build the Windows private-root helper' }
          Write-Output "Private-root helper SHA-256: $((Get-FileHash $rootHelper -Algorithm SHA256).Hash)"
          "GVY_CI_PRIVATE_ROOT_HELPER=$rootHelper" >> $env:GITHUB_ENV
          "GVY_PRIVATE_ROOT_HELPER=$rootHelper" >> $env:GITHUB_ENV
          "GVY_TEST_CC=$env:GVY_PROBE_CC" >> $env:GITHUB_ENV
          "GVY_TEST_PWSH=$(Join-Path $PSHOME 'pwsh.exe')" >> $env:GITHUB_ENV

      - name: Select Windows Gradle Bash
        if: runner.os == 'Windows'
        run: |
          bash_path=$(cygpath -w "$BASH")
          printf 'GVY_CI_GRADLE_BASH=%s\n' "$bash_path" >> "$GITHUB_ENV"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Verify Gradle capture and evidence reads
        run: >-
          node --test --test-concurrency=1 tools/ci/gradle-launch.test.mjs
          tools/ci/read-evidence.test.mjs tools/ci/windows-evidence.test.mjs

      - name: Verify Windows provisioning boundary
        if: runner.os == 'Windows'
        run: >-
          node --test --test-concurrency=1 tools/ci/windows-private-root.test.mjs
          tools/ci/native-provisioning.windows.test.mjs

      - name: Test and link native launcher
        env:
          NATIVE_TEST_TASK: ${{ matrix.test-task }}
          NATIVE_LINK_TASK: ${{ matrix.link-task }}
          NATIVE_PRODUCER: ${{ matrix.producer }}
          NATIVE_TARGET: ${{ matrix.target }}
        run: >-
          node tools/ci/run-gradle.mjs --report-root "$RUNNER_TEMP/launcher-gradle-evidence" --producer "$NATIVE_PRODUCER"
          --native-provisioning "$NATIVE_TARGET"
          ":launcher:$NATIVE_TEST_TASK" ":launcher:$NATIVE_LINK_TASK"
          --no-daemon --no-parallel --build-cache --stacktrace --max-workers=2
          '-Dorg.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8'
          -Pkotlin.native.jvmArgs=-Xmx1536m

      - name: Upload Gradle diagnostic evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gradle-evidence-${{ matrix.producer }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/launcher-gradle-evidence/
          # Context, logs and diagnostic receipts form a multi-file evidence archive.
          archive: true
          if-no-files-found: error
          retention-days: 14

      - name: Setup minimum runtime Java
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: 17

      - name: Download candidate server
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: gls.jar
          path: gls/build/editor-server
          skip-decompress: true
          digest-mismatch: error

      - name: Verify candidate server SHA-256
        env:
          GVY_TEST_JAR: ${{ github.workspace }}/gls/build/editor-server/gls.jar
          GVY_SERVER_SHA256: ${{ needs.build-server.outputs.server_sha256 }}
        run: |
          node <<'NODE'
          const { createHash } = require('node:crypto');
          const { readFileSync } = require('node:fs');
          const expected = process.env.GVY_SERVER_SHA256;
          if (!expected || !/^[0-9a-f]{64}$/i.test(expected)) {
            throw new Error('Server SHA-256 is missing or invalid');
          }
          const actual = createHash('sha256').update(readFileSync(process.env.GVY_TEST_JAR)).digest('hex');
          if (actual !== expected.toLowerCase()) {
            throw new Error('Downloaded server SHA-256 does not match the producer');
          }
          NODE

      - name: Verify forwarding and actual server CLI/LSP
        env:
          GVY_LAUNCHER: ${{ github.workspace }}/launcher/build/bin/${{ matrix.target }}/releaseExecutable/${{ matrix.executable }}
          GVY_TEST_JAR: ${{ github.workspace }}/gls/build/editor-server/gls.jar
        run: |
          test -x "$GVY_LAUNCHER"
          test -s "$GVY_TEST_JAR"
          node --test --test-concurrency=1 launcher/test/*.test.cjs
