name: CI (Buck2)

on:
  push:
    branches:
      - main
    paths:
      - '.buckroot'
      - '.buckconfig'
      - '.buckversion'
      - 'BUCK'
      - '**/BUCK'
      - '**/*.bzl'
      - 'platforms/**'
      - 'toolchains/**'
      - 'examples/**'
      - 'third_party/buck2/**'
      - 'third_party/kotlin/**'
      - '.github/workflows/ci-buck2.yml'
  pull_request:
    branches:
      - main
    paths:
      - '.buckroot'
      - '.buckconfig'
      - '.buckversion'
      - 'BUCK'
      - '**/BUCK'
      - '**/*.bzl'
      - 'platforms/**'
      - 'toolchains/**'
      - 'examples/**'
      - 'third_party/buck2/**'
      - 'third_party/kotlin/**'
      - '.github/workflows/ci-buck2.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.head_ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Buck2 version - pinned for reproducible builds
  # Update by checking: https://github.com/facebook/buck2/releases
  BUCK2_VERSION: "2026-01-19"
  # Compressed release-asset SHA-256 digests from GitHub's release API; update with the version.
  BUCK2_SHA256_LINUX_AMD64: "13e2ae9484470ed4e7913bacacedd0dcb3568441bc3312240407f834a5fbc851"
  BUCK2_SHA256_DARWIN_ARM64: "6a8e3e6b3e70e1ecf363eacf8ad005e590be65719c61e9f5c8409e91909136be"
  # Buck2 prelude commit - pinned for reproducible builds
  # Update by checking: https://github.com/facebook/buck2-prelude/commits/main
  BUCK2_PRELUDE_COMMIT: "995098bdde54250a15887935df4e9bd0cda28ba7"
  # Target platform for builds (required for rules using select())
  TARGET_PLATFORM: prelude//platforms:default

jobs:
  lint:
    runs-on: ubuntu-24.04
    name: Lint (Starlark)
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Install Buck2
        run: |
          set -euo pipefail

          # Download Buck2
          BUCK2_URL="https://github.com/facebook/buck2/releases/download/$BUCK2_VERSION/buck2-x86_64-unknown-linux-gnu.zst"
          echo "Downloading Buck2 from: $BUCK2_URL"
          curl -fsSL "$BUCK2_URL" -o buck2.zst
          printf '%s  %s\n' "$BUCK2_SHA256_LINUX_AMD64" buck2.zst | shasum -a 256 -c -

          # Decompress
          if ! command -v zstd >/dev/null; then
            echo "::error::zstd is required on this runner"
            exit 1
          fi
          zstd -d buck2.zst -o buck2

          # Install
          install_dir="$RUNNER_TEMP/gvy-buck2"
          mkdir -p "$install_dir"
          install -m 0755 buck2 "$install_dir/buck2"
          printf '%s\n' "$install_dir" >>"$GITHUB_PATH"

          # Verify
          "$install_dir/buck2" --version

      - name: Cache Buck2 prelude
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: prelude
          key: buck2-prelude-${{ env.BUCK2_PRELUDE_COMMIT }}

      - name: Initialize Buck2 prelude
        run: |
          if [ ! -d "prelude/.git" ]; then
            echo "Fetching Buck2 prelude at commit ${{ env.BUCK2_PRELUDE_COMMIT }}..."
            rm -rf prelude
            git clone https://github.com/facebook/buck2-prelude.git prelude
            cd prelude
            git checkout "${{ env.BUCK2_PRELUDE_COMMIT }}"
            cd ..
          fi
          echo "Prelude ready at commit $(cd prelude && git rev-parse --short HEAD)"

      - name: Lint BUCK files
        run: |
          # Find all BUCK files (excluding prelude which is external)
          echo "Finding BUCK files to lint..."
          find . -name 'BUCK' -not -path './prelude/*' | sort | tee /tmp/buck_files.txt
          echo ""
          echo "Running starlark lint..."
          xargs buck2 starlark lint < /tmp/buck_files.txt

  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            name: linux-amd64
            buck2_target: x86_64-unknown-linux-gnu
          - os: macos-15
            name: darwin-arm64
            buck2_target: aarch64-apple-darwin

    runs-on: ${{ matrix.os }}
    name: Build (${{ matrix.name }})
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: 21

      - name: Install Buck2
        env:
          BUCK2_TARGET: ${{ matrix.buck2_target }}
        run: |
          set -euo pipefail

          # Download Buck2
          case "$BUCK2_TARGET" in
            x86_64-unknown-linux-gnu) expected_sha256="$BUCK2_SHA256_LINUX_AMD64" ;;
            aarch64-apple-darwin) expected_sha256="$BUCK2_SHA256_DARWIN_ARM64" ;;
            *)
              echo "::error::Unsupported Buck2 target: $BUCK2_TARGET"
              exit 1
              ;;
          esac
          BUCK2_URL="https://github.com/facebook/buck2/releases/download/$BUCK2_VERSION/buck2-$BUCK2_TARGET.zst"
          echo "Downloading Buck2 from: $BUCK2_URL"
          curl -fsSL "$BUCK2_URL" -o buck2.zst
          printf '%s  %s\n' "$expected_sha256" buck2.zst | shasum -a 256 -c -

          # Decompress
          if ! command -v zstd >/dev/null; then
            echo "::error::zstd is required on this runner"
            exit 1
          fi
          zstd -d buck2.zst -o buck2

          # Install
          install_dir="$RUNNER_TEMP/gvy-buck2"
          mkdir -p "$install_dir"
          install -m 0755 buck2 "$install_dir/buck2"
          printf '%s\n' "$install_dir" >>"$GITHUB_PATH"

          # Verify
          "$install_dir/buck2" --version

      - name: Cache Buck2 prelude
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: prelude
          key: buck2-prelude-${{ env.BUCK2_PRELUDE_COMMIT }}

      - name: Initialize Buck2 prelude
        run: |
          if [ ! -d "prelude/.git" ]; then
            echo "Fetching Buck2 prelude at commit ${{ env.BUCK2_PRELUDE_COMMIT }}..."
            rm -rf prelude
            git clone https://github.com/facebook/buck2-prelude.git prelude
            cd prelude
            git checkout "${{ env.BUCK2_PRELUDE_COMMIT }}"
            cd ..
          fi
          echo "Prelude ready at commit $(cd prelude && git rev-parse --short HEAD)"

      - name: Buck2 audit cells
        run: buck2 audit cell

      - name: Buck2 targets
        run: buck2 targets //...

      - name: Buck2 build
        run: |
          # Build all targets with explicit target platform
          # The --target-platforms flag is required because the prelude's
          # genrule rule uses select() which needs platform configuration.
          # Pass JAVA_HOME config so the toolchain can find the JDK
          buck2 build //... \
            --target-platforms=${{ env.TARGET_PLATFORM }} \
            --config java.java_home="$JAVA_HOME"

      - name: Buck2 build Kotlin example
        run: |
          buck2 build //examples/kotlin:hello_lib \
            --target-platforms=${{ env.TARGET_PLATFORM }} \
            --config java.java_home="$JAVA_HOME"
