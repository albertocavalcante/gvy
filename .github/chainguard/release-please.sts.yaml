# Octo STS trust policy: lets the Release Please workflow on main mint a short-lived token for this
# repository, so no long-lived PAT is stored. Octo STS reads this file from the default branch only.
# https://github.com/octo-sts/app
issuer: https://token.actions.githubusercontent.com

# Branch: main only. Accepts both subject formats GitHub issues (name-only and owner@id/repo@id).
subject_pattern: repo:albertocavalcante(@54247214)?/gvy(@1063688755)?:ref:refs/heads/main

claim_pattern:
  # Pin by immutable IDs: a deleted-and-recreated repository or owner with the same name never matches.
  repository_owner_id: "54247214"
  repository_id: "1063688755"
  # Only this workflow file, as it exists on main. A branch that edits it cannot mint.
  job_workflow_ref: albertocavalcante/gvy/\.github/workflows/release-please\.yml@refs/heads/main
  event_name: (push|workflow_dispatch)

# Release Please pushes its release branch, opens or updates the release PR, labels it, and tags
# and publishes the release. The autorelease labels already exist, so issues: write is not needed.
permissions:
  contents: write
  pull_requests: write
