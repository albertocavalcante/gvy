name: "CodeQL config"

queries:
  - uses: security-extended

paths-ignore:
  - "**/src/test/**"
  - "**/__tests__/**"
  - "**/*.test.js"
  - "**/*.test.ts"
  - "**/*.spec.js"
  - "**/*.spec.ts"
  - "**/.gradle/**"
  - "**/build/**"
  - "**/dist/**"
  - "**/node_modules/**"
  - "**/out/**"
