name: Set up licensing checks
description: Install the hash-verified bootstrap and locked licensing toolchain.
runs:
  using: composite
  steps:
    - name: Set up Python
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: '3.11'
    - name: Install pinned uv
      shell: bash
      working-directory: ${{ github.workspace }}
      run: >-
        python -m pip install --require-hashes --only-binary=:all: -r .reuse/bootstrap-requirements.txt
    - name: Install locked licensing dependencies
      shell: bash
      working-directory: ${{ github.workspace }}
      run: |
        if [[ "${RUNNER_OS:-}" == "Windows" ]]; then
            uv sync --project .reuse --locked --no-dev --link-mode copy
        else
            uv sync --project .reuse --locked --no-dev
        fi
