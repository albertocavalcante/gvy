name: document-symbol-basic
description: Document symbols should include class and method entries.
workspace:
  fixture: empty-workspace
steps:
  - initialize: {}
  - initialized: {}
  - waitNotification:
      method: groovy/status
      checks:
        - jsonPath: $.health
          expect:
            type: EQUALS
            value: ok
        - jsonPath: $.quiescent
          expect:
            type: EQUALS
            value: true
      timeoutMs: 180000
  - openDocument:
      path: src/Symbols.groovy
      languageId: groovy
      version: 1
      text: |
        package com.example

        class Widget {
            String name

            Widget(String name) {
                this.name = name
            }

            int compute(int value) {
                return value + name.length()
            }
        }
  - request:
      method: textDocument/documentSymbol
      params:
        textDocument:
          uri: "{{workspace.uri}}src/Symbols.groovy"
      saveAs: documentSymbols
  - assert:
      source: documentSymbols
      checks:
        # One top-level class; its constructor, method and property are children, not siblings.
        - jsonPath: $.length()
          expect:
            type: EQUALS
            value: 1
        - jsonPath: "$[?(@.right.name == 'Widget' && @.right.kind == 'Class')]"
          expect:
            type: NOT_EMPTY
        - jsonPath: $[0].right.children.length()
          expect:
            type: EQUALS
            value: 3
        - jsonPath: "$[0].right.children[?(@.name == 'Widget' && @.kind == 'Constructor')]"
          expect:
            type: NOT_EMPTY
        - jsonPath: "$[0].right.children[?(@.name == 'compute' && @.kind == 'Method')]"
          expect:
            type: NOT_EMPTY
        # The property is listed once: not again as its backing field, and parameters are not symbols.
        - jsonPath: "$[0].right.children[?(@.name == 'name' && @.kind == 'Property')]"
          expect:
            type: NOT_EMPTY
  - shutdown: {}
  - exit: {}
