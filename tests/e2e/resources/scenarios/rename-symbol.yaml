# Known failure: rename stays within one file until the workspace index gives locals, parameters and
# overloads distinct symbol ids (today every local of a class shares an id with a same-named field,
# and untyped receivers are credited to the enclosing class), so cross-file rename could edit
# unrelated code. Find-references and incoming calls do use the index. The assertions below are
# exact and ready once the ids are fixed. Tracked by gvy#1587 (see also #1384).
name: rename-symbol
description: Rename a method reference across multiple files.
xfail:
  issue: 1587
  reason: cross-file method rename is refused instead of applied
  match: 'renaming across files is not supported'
workspace:
  fixture: empty-workspace
steps:
  - initialize: {}
  - initialized: {}
  
  # Setup: Define a class with a method
  - openDocument:
      path: src/main/groovy/Definitions.groovy
      languageId: groovy
      version: 1
      text: |
        package com.example
        
        class Service {
            void performAction() {
                println "Old Action"
            }
        }

  # Setup: Usage in another file
  - openDocument:
      path: src/main/groovy/Usages.groovy
      languageId: groovy
      version: 1
      text: |
        package com.example
        
        class Client {
            void run() {
                Service s = new Service()
                s.performAction()
            }
        }

  - waitNotification:
      method: groovy/status
      checks:
        - jsonPath: $.health
          expect:
            type: EQUALS
            value: ok
        - jsonPath: $.quiescent
          expect:
            type: EQUALS
            value: true
      timeoutMs: 30000

  # Rename 'performAction' to 'doSomething'
  - request:
      method: textDocument/rename
      params:
        textDocument:
          uri: "{{workspace.uri}}src/main/groovy/Definitions.groovy"
        position:
          line: 3
          character: 20
        newName: "doSomething"
      saveAs: renameResult

  - assert:
      source: renameResult
      checks:
        # We expect changes as documentChanges array
        - jsonPath: $.documentChanges.length()
          expect:
            type: EQUALS
            value: 2 # Changes in Definitions.groovy and Usages.groovy
        
        # One edit in Definitions.groovy: the method name only
        - jsonPath: "$.documentChanges[?(@.textDocument.uri == '{{workspace.uri}}src/main/groovy/Definitions.groovy')].edits[*]"
          expect:
            type: SIZE
            value: 1
        - jsonPath: "$.documentChanges[?(@.textDocument.uri == '{{workspace.uri}}src/main/groovy/Definitions.groovy')].edits[*].range.start"
          expect:
            type: CONTAINS
            value: { line: 3, character: 9 }

        # One edit in Usages.groovy: the call's method name only
        - jsonPath: "$.documentChanges[?(@.textDocument.uri == '{{workspace.uri}}src/main/groovy/Usages.groovy')].edits[*]"
          expect:
            type: SIZE
            value: 1
        - jsonPath: "$.documentChanges[?(@.textDocument.uri == '{{workspace.uri}}src/main/groovy/Usages.groovy')].edits[*].range.start"
          expect:
            type: CONTAINS
            value: { line: 5, character: 10 }

        # Every edit is the new name and ends where 'performAction' ends: the name only, not the node
        - jsonPath: "$.documentChanges[*].edits[*].newText"
          expect:
            type: CONTAINS_ALL
            values: ["doSomething"]
        - jsonPath: "$.documentChanges[*].edits[*].range.end"
          expect:
            type: CONTAINS_ALL
            values: [{ line: 3, character: 22 }, { line: 5, character: 23 }]

  - shutdown: {}
  - exit: {}
