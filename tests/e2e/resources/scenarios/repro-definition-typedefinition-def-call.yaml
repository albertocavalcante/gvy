name: repro-definition-typedefinition-def-call
description: Go to type definition on a def initialised from a cross-file method call reaches the return type
xfail:
  issue: 1535
  reason: typeDefinition on a def initialised from a method call whose class is in another file returns nothing
  match: 'Actual: \[\]'
workspace:
  fixture: empty-workspace
  files:
    src/main/groovy/demo/order/Order.groovy: |
      package demo.order

      class |^orderDecl|Order { String customer }
    src/main/groovy/demo/service/OrderService.groovy: |
      package demo.service

      import demo.order.Order

      class OrderService { Order place(String customer) { new Order(customer: customer) } }
    src/main/groovy/demo/Use.groovy: |
      package demo

      import demo.service.OrderService

      class Use {
          void run(OrderService svc) {
              def |^use|placed = svc.place('x')
              println placed
          }
      }
steps:
  - initialize:
      initializationOptions:
        groovy.languageServer.engine: native
  - initialized: {}
  - waitNotification:
      method: groovy/status
      checks:
        - jsonPath: $.health
          expect: { type: EQUALS, value: ok }
        - jsonPath: $.quiescent
          expect: { type: EQUALS, value: true }
      timeoutMs: 60000
  - openDocument:
      path: "{{cursor.use.path}}"
  - request:
      method: textDocument/typeDefinition
      params:
        textDocument: { uri: "{{cursor.use.uri}}" }
        position: "{{cursor.use}}"
      saveAs: result
  - assert:
      source: result
      checks:
        - jsonPath: "$.items[*].uri"
          expect: { type: CONTAINS, value: "{{cursor.orderDecl.path}}" }
  - shutdown: {}
  - exit: {}
