name: repro-diagnostics-codenarc-unknown-ruleset
description: An invalid workspace ruleset reports its rejection and runs the default rules.
workspace:
  fixture: empty-workspace
  files:
    .codenarc: |
      ruleset {
          ruleset('rulesets/imports.xml') {
              include 'UnusedImport'
          }
          ruleset('rulesets/empty.xml')
      }
    src/main/groovy/demo/Unused.groovy: |
      package demo

      import java.util.concurrent.TimeUnit

      class |^u|Unused {
          void run() {
              try { println 1 } catch (Exception e) {}
          }
      }
steps:
  - initialize:
      initializationOptions:
        groovy.languageServer.engine: native
        groovy.codenarc.enabled: true
        groovy.codenarc.autoDetect: true
  - initialized: {}
  - waitNotification:
      method: groovy/status
      checks:
        - jsonPath: $.health
          expect: { type: EQUALS, value: ok }
        - jsonPath: $.quiescent
          expect: { type: EQUALS, value: true }
      timeoutMs: 60000
  - openDocument:
      path: "{{cursor.u.path}}"
  - waitNotification:
      method: textDocument/publishDiagnostics
      saveAs: diags
      checks:
        - jsonPath: $.uri
          expect: { type: EQUALS, value: "{{cursor.u.uri}}" }
        - jsonPath: $.diagnostics[?(@.source == 'CodeNarc' && @.code == 'EmptyCatchBlock')]
          expect: { type: NOT_EMPTY }
        - jsonPath: $.diagnostics[?(@.code == 'gvy.providerFailure' && @.message =~ /.*\.codenarc.*rulesets\/empty.xml.*/)]
          expect: { type: NOT_EMPTY }
      timeoutMs: 20000
  - assert:
      source: diags
      checks:
        - jsonPath: "$.diagnostics[?(@.code == 'gvy.providerFailure')].relatedInformation[0].location.uri"
          expect: { type: EQUALS, value: ["{{workspace.uri}}.codenarc"] }
  - shutdown: {}
  - exit: {}
