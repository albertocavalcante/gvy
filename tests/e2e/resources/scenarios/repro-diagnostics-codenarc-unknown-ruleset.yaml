name: repro-diagnostics-codenarc-unknown-ruleset
description: A .codenarc with one unknown ruleset still yields the valid rules diagnostics
xfail:
  issue: 1542
  reason: one unknown bundled ruleset in .codenarc silently disables every CodeNarc diagnostic
  match: 'CodeNarc.*Actual: \[\]'
workspace:
  fixture: empty-workspace
  files:
    .codenarc: |
      ruleset {
          ruleset('rulesets/imports.xml') {
              include 'UnusedImport'
          }
          ruleset('rulesets/empty.xml') {
              include 'EmptyCatchBlock'
          }
      }
    src/main/groovy/demo/Unused.groovy: |
      package demo

      import java.util.concurrent.TimeUnit

      class |^u|Unused {}
steps:
  - initialize:
      initializationOptions:
        groovy.languageServer.engine: native
        groovy.codenarc.enabled: true
        groovy.codenarc.autoDetect: true
  - initialized: {}
  - waitNotification:
      method: groovy/status
      checks:
        - jsonPath: $.health
          expect: { type: EQUALS, value: ok }
        - jsonPath: $.quiescent
          expect: { type: EQUALS, value: true }
      timeoutMs: 60000
  - openDocument:
      path: "{{cursor.u.path}}"
  - waitNotification:
      method: textDocument/publishDiagnostics
      saveAs: diags
      checks:
        - jsonPath: $.uri
          expect: { type: EQUALS, value: "{{cursor.u.uri}}" }
        - jsonPath: $.diagnostics[?(@.message =~ /.*[Uu]nused import.*/)]
          expect: { type: NOT_EMPTY }
      timeoutMs: 20000
  - assert:
      source: diags
      checks:
        - jsonPath: "$.diagnostics[?(@.source == 'CodeNarc')]"
          expect: { type: NOT_EMPTY }
  - shutdown: {}
  - exit: {}
