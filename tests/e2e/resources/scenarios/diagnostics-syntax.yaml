name: diagnostics-syntax
description: Detects syntax diagnostics and ensures they clear after fixing the source.
workspace:
  fixture: diagnostics-basic
steps:
  - initialize: {}
  - initialized: {}
  - openDocument:
      path: src/Problem.groovy
      languageId: groovy
      version: 1
      text: |
        class Problem {
            def run() {
                println 'broken'
        }
  - waitNotification:
      method: textDocument/publishDiagnostics
      saveAs: initialDiagnostics
      checks:
        - jsonPath: $.uri
          expect:
            type: EQUALS
            value: "{{workspace.uri}}src/Problem.groovy"
        - jsonPath: $.diagnostics
          expect:
            type: NOT_EMPTY
        - jsonPath: $.version
          expect:
            type: EQUALS
            value: 1
  - assert:
      source: initialDiagnostics
      checks:
        - jsonPath: $.diagnostics[0].message
          expect:
            type: CONTAINS
            value: "Unclosed '{': expected '}' before end of file."
        # LSP4J Gson serializes DiagnosticSeverity as string: "Error", "Warning", "Information", "Hint"
        - jsonPath: $.diagnostics[0].severity
          expect:
            type: EQUALS
            value: 'Error'
        - jsonPath: $.diagnostics[0].range.start.line
          expect:
            type: EQUALS
            value: 0
  - changeDocument:
      path: src/Problem.groovy
      version: 2
      text: |
        class Problem {
            def run() {
                println 'fixed'
            }
        }
  - waitNotification:
      method: textDocument/publishDiagnostics
      saveAs: postChangeDiagnostics
      checks:
        - jsonPath: $.uri
          expect:
            type: EQUALS
            value: "{{workspace.uri}}src/Problem.groovy"
        - jsonPath: $.diagnostics
          expect:
            type: EMPTY
        - jsonPath: $.version
          expect:
            type: EQUALS
            value: 2
  - shutdown: {}
  - exit: {}
