name: 'definition-jar'
description: 'Goto definition for class in JAR dependency navigates to extracted source'
workspace:
  fixture: 'gradle-dependency'
  files:
    'src/main/groovy/DependencyTest.groovy': |
      package com.example

      import com.example.testlib.Greeter

      class DependencyTest {
          def test() {
              // Should resolve to the source JAR class
              def greeter = new Greeter("World")
              greeter.greet()
          }
      }

steps:
  - initialize: {}
  - initialized: {}
  - openDocument:
      path: 'src/main/groovy/DependencyTest.groovy'
      languageId: 'groovy'
      version: 1
      text: |
        package com.example

        import com.example.testlib.Greeter

        class DependencyTest {
            def test() {
                // Should resolve to the source JAR class
                def greeter = new Greeter("World")
                greeter.greet()
            }
        }

  - waitNotification:
      method: window/showMessage
      checks:
        - jsonPath: '$.message'
          expect:
            type: 'CONTAINS'
            value: 'Resolving build dependencies'
      timeoutMs: 10000

  # Optional: Gradle distribution download (only on cold CI, can take 60-180s)
  # Skips early if "Dependencies loaded" arrives (warm cache scenario)
  - waitNotification:
      method: window/showMessage
      checks:
        - jsonPath: '$.message'
          expect:
            type: 'CONTAINS'
            value: 'Downloading Gradle distribution'
      timeoutMs: 180000
      optional: true

  # After download notification (or skipped), wait for download + resolution to complete
  # If download is happening, this can take 60-180s for the download itself
  - waitNotification:
      method: window/showMessage
      checks:
        - jsonPath: '$.message'
          expect:
            type: 'CONTAINS'
            value: 'Dependencies loaded'
      timeoutMs: 180000

  # A local flatDir JAR has no verified coordinates; an adjacent source JAR alone is not trusted.
  - request:
      method: 'textDocument/definition'
      params:
        textDocument:
          uri: '{{workspace.uri}}src/main/groovy/DependencyTest.groovy'
        position:
          line: 2
          character: 30
      saveAs: 'unattachedDefinition'

  - assert:
      source: 'unattachedDefinition'
      checks:
        - jsonPath: '$.items'
          expect:
            type: 'EQUALS'
            value: []

  # Explicitly authorize the local source archive for this resolved dependency.
  - request:
      method: 'groovy/sourceAttach'
      params:
        documentUri: '{{workspace.uri}}src/main/groovy/DependencyTest.groovy'
        position:
          line: 2
          character: 30
        sourcesUri: '{{workspace.uri}}libs/testlib-sources.jar'
        documentVersion: 1
      saveAs: 'attachedSource'

  - assert:
      source: 'attachedSource'
      checks:
        - jsonPath: '$.status'
          expect:
            type: 'EQUALS'
            value: 'LOCATED'

  - request:
      method: 'textDocument/definition'
      params:
        textDocument:
          uri: '{{workspace.uri}}src/main/groovy/DependencyTest.groovy'
        position:
          line: 2
          character: 30
      saveAs: 'definitionResult'

  - assert:
      source: 'definitionResult'
      checks:
        - jsonPath: '$.items[0].uri'
          expect:
            type: 'MATCHES_REGEX'
            value: 'file:.*Greeter\.java'
        - jsonPath: '$.items[0].range.start.line'
          expect:
            type: 'EQUALS'
            value: 6
        - jsonPath: '$.items[0].range.start.character'
          expect:
            type: 'EQUALS'
            value: 13
        - jsonPath: '$.items[0].range.end.character'
          expect:
            type: 'EQUALS'
            value: 20

  - shutdown: {}
  - exit: {}
