# Known failure: workspace/symbol does not return symbols of documents that were only opened (not on disk).
# Tracked by https://github.com/albertocavalcante/gvy/issues/431.
name: workspace-symbols
description: Search for symbols across the workspace.
xfail:
  issue: 431
  reason: workspace/symbol misses symbols of documents opened via didOpen
  match: 'UniqueController.*SIZE\. Actual: \[\]'
workspace:
  fixture: empty-workspace
steps:
  - initialize: {}
  - initialized: {}
  
  # Setup: Define distinct symbols
  - openDocument:
      path: src/main/groovy/Symbols.groovy
      languageId: groovy
      version: 1
      text: |
        class UniqueController {
            void uniqueMethod() {}
        }

  - waitNotification:
      method: groovy/status
      checks:
        - jsonPath: $.health
          expect:
            type: EQUALS
            value: ok
        - jsonPath: $.quiescent
          expect:
            type: EQUALS
            value: true
      timeoutMs: 30000

  # Search for 'Unique'
  - request:
      method: workspace/symbol
      params:
        query: "Unique"
      saveAs: symbolResult

  - assert:
      source: symbolResult
      checks:
        # Expect Controller and Method (depending on how fuzzy search works)
        # Usually exact or prefix match
        - jsonPath: $.length()
          expect:
            type: GTE
            value: 1
        
        - jsonPath: "$[?(@.name == 'UniqueController')]"
          expect:
            type: SIZE
            value: 1
        - jsonPath: "$[?(@.name == 'UniqueController')].kind"
          expect:
            type: EQUALS
            value: 5 # Class = 5

  # Search for 'uniqueMethod'
  - request:
      method: workspace/symbol
      params:
        query: "uniqueMethod"
      saveAs: methodSymbolResult

  - assert:
      source: methodSymbolResult
      checks:
        - jsonPath: "$.[?(@.name == 'uniqueMethod')]"
          expect:
            type: SIZE
            value: 1
        - jsonPath: "$.[?(@.name == 'uniqueMethod')].kind"
          expect:
            type: EQUALS
            value: 6 # Method = 6

  - shutdown: {}
  - exit: {}
