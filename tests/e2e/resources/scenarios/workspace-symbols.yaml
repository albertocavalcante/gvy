# Known failure: workspace/symbol does not return symbols of documents that were only opened (not on disk).
# Tracked by https://github.com/albertocavalcante/gvy/issues/431.
name: workspace-symbols
description: Search for symbols across the workspace.
xfail:
  issue: 431
  reason: workspace/symbol misses symbols of documents opened via didOpen
  match: 'UniqueController.*SIZE\. Actual: \[\]'
workspace:
  fixture: empty-workspace
steps:
  - initialize: {}
  - initialized: {}
  
  # Setup: Define distinct symbols
  - openDocument:
      path: src/main/groovy/Symbols.groovy
      languageId: groovy
      version: 1
      text: |
        class UniqueController {
            void uniqueMethod() {}
        }

  - waitNotification:
      method: groovy/status
      checks:
        - jsonPath: $.health
          expect:
            type: EQUALS
            value: ok
        - jsonPath: $.quiescent
          expect:
            type: EQUALS
            value: true
      timeoutMs: 30000

  # Search for 'Unique'
  - request:
      method: workspace/symbol
      params:
        query: "Unique"
      saveAs: symbolResult

  - assert:
      source: symbolResult
      checks:
        # Keep this exact missing-symbol check first so only the known failure matches xfail.
        - jsonPath: "$.items[?(@.name == 'UniqueController')]"
          expect:
            type: SIZE
            value: 1
        - jsonPath: "$.items[?(@.name == 'UniqueController')].kind"
          expect:
            type: EQUALS
            value: [Class]
        - jsonPath: "$.items[?(@.name == 'UniqueController')].location.uri"
          expect:
            type: EQUALS
            value: ["{{workspace.uri}}src/main/groovy/Symbols.groovy"]

  # Search for 'uniqueMethod'
  - request:
      method: workspace/symbol
      params:
        query: "uniqueMethod"
      saveAs: methodSymbolResult

  - assert:
      source: methodSymbolResult
      checks:
        - jsonPath: "$.items[?(@.name == 'uniqueMethod')]"
          expect:
            type: SIZE
            value: 1
        - jsonPath: "$.items[?(@.name == 'uniqueMethod')].kind"
          expect:
            type: EQUALS
            value: [Method]
        - jsonPath: "$.items[?(@.name == 'uniqueMethod')].location.uri"
          expect:
            type: EQUALS
            value: ["{{workspace.uri}}src/main/groovy/Symbols.groovy"]

  - shutdown: {}
  - exit: {}
