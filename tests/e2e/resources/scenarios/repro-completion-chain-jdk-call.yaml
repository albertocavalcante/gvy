name: repro-completion-chain-jdk-call
description: Member completion after `"abc".toUpperCase().` offers String members
xfail:
  issue: 1525
  reason: completion after a JDK call result offers only Object and GDK members
  match: '(?s)Actual:.*"getMetaClass"'
workspace:
  fixture: empty-workspace
  files:
    src/main/groovy/demo/Svc.groovy: |
      package demo

      class Svc {
          void run() {
              'abc'.toUpperCase().|^c|
          }
      }
steps:
  - initialize:
      initializationOptions:
        groovy.languageServer.engine: native
  - initialized: {}
  - waitNotification:
      method: groovy/status
      checks:
        - jsonPath: $.health
          expect: { type: EQUALS, value: ok }
        - jsonPath: $.quiescent
          expect: { type: EQUALS, value: true }
      timeoutMs: 60000
  - openDocument:
      path: "{{cursor.c.path}}"
  - request:
      method: textDocument/completion
      params:
        textDocument: { uri: "{{cursor.c.uri}}" }
        position: "{{cursor.c}}"
      saveAs: result
  - assert:
      source: result
      checks:
        - jsonPath: "$.items[*].label"
          expect: { type: CONTAINS, value: "toLowerCase" }
  - shutdown: {}
  - exit: {}
