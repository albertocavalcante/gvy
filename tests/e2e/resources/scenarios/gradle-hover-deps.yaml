name: gradle-hover-deps
description: Gradle workspace should resolve external dependencies referenced by source files.
workspace:
  fixture: gradle-dependency
steps:
  - initialize: {}
  - initialized: {}
  - waitNotification:
      method: window/showMessage
      timeoutMs: 90000
      checks:
        - jsonPath: $.message
          expect:
            type: MATCHES_REGEX
            value: '^Dependencies loaded: [1-9][0-9]* JARs from Gradle$'
  - openDocument:
      path: src/main/groovy/PortMappingDeclaration.groovy
      languageId: groovy
      version: 1
  # TODO(#1657): Fence the final provider cohort before treating this empty publication as completed diagnostics.
  # See: https://github.com/albertocavalcante/gvy/issues/1657
  - waitNotification:
      method: textDocument/publishDiagnostics
      saveAs: resolvedDiagnostics
      timeoutMs: 60000
      checks:
        - jsonPath: $.uri
          expect:
            type: EQUALS
            value: "{{workspace.uri}}src/main/groovy/PortMappingDeclaration.groovy"
        - jsonPath: $.version
          expect:
            type: EQUALS
            value: 1
        - jsonPath: $.diagnostics
          expect:
            type: EQUALS
            value: []
  # Wait for workspace startup and indexing to become quiescent before teardown.
  - waitNotification:
      method: groovy/status
      timeoutMs: 90000
      checks:
        - jsonPath: $.health
          expect:
            type: EQUALS
            value: ok
        - jsonPath: $.quiescent
          expect:
            type: EQUALS
            value: true
  - shutdown: {}
  - exit: {}
