name: rename-basic
description: >
  Test textDocument/rename to rename symbols.
  Verifies that rename returns correct workspace edits for variables and methods.
workspace:
  fixture: definition-basic
steps:
  - initialize: {}
  - initialized: {}
  # Wait for server to be ready
  - waitNotification:
      method: groovy/status
      checks:
        - jsonPath: $.health
          expect:
            type: EQUALS
            value: ok
        - jsonPath: $.quiescent
          expect:
            type: EQUALS
            value: true
      timeoutMs: 60000

  # Test 1: Rename a local variable
  - openDocument:
      path: src/RenameTest.groovy
      languageId: groovy
      version: 1
      text: |
        def myVariable = "hello"
        println myVariable
        def result = myVariable.toUpperCase()
  - request:
      method: textDocument/rename
      params:
        textDocument:
          uri: "{{workspace.uri}}src/RenameTest.groovy"
        position:
          line: 0
          character: 4
        newName: renamedVariable
      saveAs: renameResult

  # Verify rename returns workspace edits
  - assert:
      source: renameResult
      checks:
        - jsonPath: $.documentChanges[0].textDocument.version
          expect:
            type: EQUALS
            value: 1
            message: "Rename must preserve the open document version used for its ranges"
        - jsonPath: $.documentChanges[0].edits
          expect:
            type: SIZE
            value: 3
            message: "Should return 3 text edits for renamed variable (decl + 2 usages)"
        - jsonPath: $.documentChanges
          expect:
            type: SIZE
            value: 1
        - jsonPath: $.documentChanges[0].edits[*]
          expect:
            type: CONTAINS_ALL
            values:
              - range:
                  start: { line: 0, character: 4 }
                  end: { line: 0, character: 14 }
                newText: renamedVariable
              - range:
                  start: { line: 1, character: 8 }
                  end: { line: 1, character: 18 }
                newText: renamedVariable
              - range:
                  start: { line: 2, character: 13 }
                  end: { line: 2, character: 23 }
                newText: renamedVariable

  # Default expressions participate in semantic binding and must be edited too.
  - openDocument:
      path: src/DefaultBindings.groovy
      languageId: groovy
      version: 7
      text: |
        class DefaultBindings { def call(value, copy = value) { value } }
  - request:
      method: textDocument/rename
      params:
        textDocument:
          uri: "{{workspace.uri}}src/DefaultBindings.groovy"
        position: { line: 0, character: 48 }
        newName: renamed
      saveAs: defaultRename
  - assert:
      source: defaultRename
      checks:
        - jsonPath: $.documentChanges
          expect: { type: SIZE, value: 1 }
        - jsonPath: $.documentChanges[0].textDocument.version
          expect: { type: EQUALS, value: 7 }
        - jsonPath: $.documentChanges[0].edits
          expect: { type: SIZE, value: 3 }
        - jsonPath: $.documentChanges[0].edits[*]
          expect:
            type: CONTAINS_ALL
            values:
              - range:
                  start: { line: 0, character: 33 }
                  end: { line: 0, character: 38 }
                newText: renamed
              - range:
                  start: { line: 0, character: 47 }
                  end: { line: 0, character: 52 }
                newText: renamed
              - range:
                  start: { line: 0, character: 56 }
                  end: { line: 0, character: 61 }
                newText: renamed

  - shutdown: {}
  - exit: {}
