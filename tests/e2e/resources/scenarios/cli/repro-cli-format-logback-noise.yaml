name: repro-cli-format-logback-noise
description: '`gls format` writes no Logback status lines to stdout'
xfail:
  issue: 1271
  reason: Logback prints its version-mismatch status lines to stdout, ahead of the formatted text
  match: '\|-WARN in ch\.qos\.logback'
workspace:
  fixture: empty-workspace
  files:
    A.groovy: |
      class A {}
steps:
  - cli:
      command: gls format
      args:
        - "A.groovy"
      saveAs: formatResult
      timeoutSeconds: 60
  - assert:
      source: formatResult
      checks:
        - jsonPath: $.stdout
          expect: { type: NOT_CONTAINS, value: "|-WARN in ch.qos.logback" }
