import javax.inject.Inject
import org.gradle.api.Plugin
import org.gradle.api.Project
import org.gradle.api.tasks.SourceSetContainer
import org.gradle.api.artifacts.component.ModuleComponentIdentifier
import org.gradle.tooling.provider.model.ToolingModelBuilder
import org.gradle.tooling.provider.model.ToolingModelBuilderRegistry

class GvyScopedWorkspace implements Serializable {
    String buildDirectory
    List targets
}
class GvyScopedTarget implements Serializable {
    String projectPath
    String projectDirectory
    String sourceSet
    String configuration
    String enrichmentConfiguration
    String state
    List sourceRoots
    List artifacts
}
class GvyScopedEntry implements Serializable {
    String path
    List coordinateCandidates
}
class GvyScopedCoordinates implements Serializable {
    String group
    String module
    String version
}

class GvyScopedModelBuilder implements ToolingModelBuilder {
    boolean canBuild(String name) {
        name == 'com.github.albertocavalcante.gvy.build.gradle.GradleScopedDependencyModel'
    }

    Object buildAll(String name, Project requested) {
        def targets = []
        requested.rootProject.allprojects.each { project ->
            def names = []
            def observed = []
            def completed = withProjectLock(project) { locked ->
                // Start clean on every run, so a retry can never duplicate names or targets
                names.clear()
                observed.clear()
                def sourceSets = locked.extensions.findByType(SourceSetContainer)
                names.addAll(sourceSets?.names ?: [])
                sourceSets?.each { sourceSet -> observed << observe(locked, sourceSet) }
            }
            targets.addAll(observed)
            if (!completed) {
                // Failed outside observe(): each known source set it did not reach is reported UNRESOLVED.
                // When even the names are unknown, the project's targets stay absent, which means unknown.
                def reached = observed*.sourceSet as Set
                names.findAll { !(it in reached) }.each { targets << unresolved(project, it) }
            }
        }
        new GvyScopedWorkspace(buildDirectory: requested.rootProject.projectDir.absolutePath, targets: targets)
    }

    private static GvyScopedTarget unresolved(Project project, String sourceSet) {
        new GvyScopedTarget(
            projectPath: project.path,
            projectDirectory: project.projectDir.absolutePath,
            sourceSet: sourceSet,
            state: 'UNRESOLVED',
            sourceRoots: [],
            artifacts: []
        )
    }

    private static GvyScopedTarget observe(Project project, sourceSet) {
        def target = unresolved(project, sourceSet.name)
        try {
            // Inside the guard: lazily configured roots can fail for one target without erasing siblings.
            target.sourceRoots = sourceSet.allSource.srcDirs.collect { it.absolutePath }
            def classpath = sourceSet.compileClasspath.collect { it }
            target.artifacts = classpath.collect { new GvyScopedEntry(path: it.absolutePath, coordinateCandidates: []) }
            target.state = 'COMPLETE'
            enrich(project, sourceSet, classpath, target)
        } catch (Exception failure) {
            rethrowCancellationOrError(failure)
            target.state = 'UNRESOLVED'
            target.sourceRoots = []
            target.artifacts = []
        }
        target
    }

    /*
     * Runs [action] holding [project]'s own lock. This builder runs for the root project; under
     * org.gradle.parallel=true Gradle refuses to resolve another project's configurations from it
     * ("Resolution of the configuration ... was attempted without an exclusive lock"), so every
     * subproject target came back UNRESOLVED (#1363).
     *
     * INTERNAL GRADLE API: ProjectInternal.getOwner() returns the project's ProjectState, and
     * ProjectState.applyToMutableState(Consumer) runs the consumer under that project's lock. Gradle's
     * own tooling model builders take the lock the same way. Verified in CI on the build's own Gradle (9.8.2)
     * and, weekly by the Gradle Compatibility workflow, on 7.3.3 (the oldest Gradle that runs on JDK 17), the
     * latest 8.14.x and the latest release (#1376); older versions are not checked. It is
     * feature-detected (respondsTo, then a dynamic call through the public interface, because the
     * implementation class is not public): when it is missing or refuses before running the action, the
     * project is resolved directly, which is the previous behaviour and works without parallel mode.
     * Per-target failures inside the action are isolated by observe(); a failure outside it reports the
     * project's unreached source sets as UNRESOLVED. Only errors and cancellation propagate.
     * Returns whether [action] completed; a failure never escapes into sibling projects.
     */
    private static boolean withProjectLock(Project project, Closure action) {
        def owner = projectState(project)
        def ran = false
        try {
            if (owner == null) {
                ran = true
                action(project)
            } else {
                owner.applyToMutableState({ locked ->
                    ran = true
                    action(locked)
                } as java.util.function.Consumer)
            }
            return true
        } catch (Exception failure) {
            rethrowCancellationOrError(failure)
            if (ran) return false
        }
        // The lock refused before running the action: resolve directly, the previous behaviour.
        try {
            action(project)
            true
        } catch (Exception failure) {
            rethrowCancellationOrError(failure)
            false
        }
    }

    /** The project's ProjectState when it offers applyToMutableState(Consumer), else null (feature detection). */
    private static Object projectState(Project project) {
        return null // RED (#1376): lock API detection forced off, to show the compatibility job can fail
        try {
            if (!project.respondsTo('getOwner')) return null
            def owner = project.getOwner()
            owner?.respondsTo('applyToMutableState', java.util.function.Consumer) ? owner : null
        } catch (Exception failure) {
            rethrowCancellationOrError(failure)
            null
        }
    }

    private static void enrich(Project project, sourceSet, List classpath, GvyScopedTarget target) {
        try {
            target.enrichmentConfiguration = sourceSet.compileClasspathConfigurationName
            def configuration = project.configurations.getByName(target.enrichmentConfiguration)
            // Default strict resolution; no lenient view can hide nominal artifact failures.
            def resolved = configuration.incoming.artifacts.artifacts
            def byFile = [:].withDefault { [] }
            resolved.each { artifact ->
                def component = artifact.id.componentIdentifier
                if (component instanceof ModuleComponentIdentifier) {
                    byFile[artifact.file] << new GvyScopedCoordinates(
                        group: component.group, module: component.module, version: component.version
                    )
                }
            }
            def configurationFiles = configuration.collect { it }
            if (classpath == configurationFiles) target.configuration = configuration.name
            classpath.eachWithIndex { file, index ->
                target.artifacts[index].coordinateCandidates = byFile[file]
            }
        } catch (Exception failure) {
            rethrowCancellationOrError(failure)
            // Effective enumeration is independent of optional nominal configuration enrichment.
        }
    }

    private static void rethrowCancellationOrError(Throwable failure) {
        def seen = Collections.newSetFromMap(new IdentityHashMap<Throwable, Boolean>())
        def current = failure
        while (current != null && seen.add(current)) {
            if (current instanceof Error || current instanceof InterruptedException ||
                current instanceof java.util.concurrent.CancellationException ||
                current instanceof org.gradle.api.BuildCancelledException) {
                throw current
            }
            current = current.cause
        }
    }
}

class GvyScopedModelPlugin implements Plugin<Project> {
    @Inject GvyScopedModelPlugin(ToolingModelBuilderRegistry registry) {
        registry.register(new GvyScopedModelBuilder())
    }
    void apply(Project project) {}
}

gradle.beforeProject { project ->
    if (project == project.rootProject) project.pluginManager.apply(GvyScopedModelPlugin)
}
