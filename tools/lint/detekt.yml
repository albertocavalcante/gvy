build:
  maxIssues: 0
  excludeCorrectable: false
config:
  validation: true
  warningsAsErrors: false
complexity:
  active: true
  CyclomaticComplexMethod:
    active: true
    threshold: 15
  LongMethod:
    active: true
    threshold: 60
  LongParameterList:
    active: true
    functionThreshold: 6
    constructorThreshold: 7
    ignoreDefaultParameters: false
    ignoreDataClasses: true
  LargeClass:
    active: true
    threshold: 600
  TooManyFunctions:
    active: true
    excludes:
    - '**/dsl/**'
    - '**/test/**'
    - '**/visitor/**'
    thresholdInFiles: 20
    thresholdInClasses: 18
    thresholdInInterfaces: 13
    thresholdInObjects: 13
    thresholdInEnums: 5
coroutines:
  active: true
  SleepInsteadOfDelay:
    active: true
empty-blocks:
  active: true
  EmptyCatchBlock:
    active: true
    allowedExceptionNameRegex: _|(ignore|expected).*
  EmptyFunctionBlock:
    active: true
exceptions:
  active: true
  TooGenericExceptionCaught:
    active: true
    excludes:
    - '**/test/**'
    exceptionNames:
    - ArrayIndexOutOfBoundsException
    - Error
    - Exception
    - IllegalMonitorStateException
    - NullPointerException
    - IndexOutOfBoundsException
    - RuntimeException
    - Throwable
  SwallowedException:
    active: true
    ignoredExceptionTypes:
    - InterruptedException
    - NumberFormatException
    - ParseException
    - MalformedURLException
    allowedExceptionNameRegex: _|(ignore|expected).*
formatting:
  active: true
  android: false
  autoCorrect: true
  NoWildcardImports:
    active: true
    autoCorrect: true
  NoUnusedImports:
    active: true
    autoCorrect: true
  FinalNewline:
    active: true
    autoCorrect: true
  MaximumLineLength:
    active: true
    maxLineLength: 120
  NoTrailingSpaces:
    active: true
    autoCorrect: true
  NoSemicolons:
    active: true
    autoCorrect: true
  ImportOrdering:
    active: true
    autoCorrect: true
  ModifierOrdering:
    active: true
    autoCorrect: true
  NoConsecutiveBlankLines:
    active: true
    autoCorrect: true
  SpacingBetweenPackageAndImports:
    active: true
    autoCorrect: true
  ArgumentListWrapping:
    active: true
    autoCorrect: true
gvy:
  active: true
  RegexInFunctionBody:
    active: true
    excludes:
    - '**/src/test/**'
    - '**/src/jmh/**'
    # Modules whose regexes are not hoisted yet. Remove a line in the same pull request that hoists that module;
    # the rule then guards it. Never add a line here (or a baseline entry) for a module that is clean. See #2420.
    - '**/build-tool/src/**'
    - '**/diagnostics/codenarc/src/**'
    - '**/jenkins/src/**'
    - '**/parser/core/src/**'
    - '**/semantics/core/src/**'
  VolatileProperty:
    active: true
    # Every linted module is guarded; no module is excluded (#2474). Kotlin outside src/main and src/test, such as
    # tests/e2e, is not linted unless its module sets detekt.source (#2480).
  JdkAtomics:
    active: true
    excludes:
    # Permanent: tests, the facade itself, and modules published on their own, which must not depend on the unpublished
    # :common:concurrent. tools/ci/detekt-ratchet-excludes.test.mjs knows these patterns. detekt matches them against
    # absolute paths, so a module pattern names the module's src: '**/bsp/**' would also exempt build-tool's bsp
    # package.
    - '**/src/test/**'
    - '**/src/jvmTest/**'
    - '**/src/commonTest/**'
    - '**/src/jmh/**'
    - '**/common/concurrent/src/**'
    - '**/bsp/bsp-core/src/**'
    - '**/bsp/maven-bsp/src/**'
    - '**/parser/core/src/**'
    # Modules still to migrate (#2474). Remove a line in the pull request that migrates that module; the guard test
    # fails on a line whose module no longer uses java.util.concurrent.atomic in its main sources.
    - '**/gls/src/**'
    - '**/indexer/lsif/src/**'
    - '**/viz/desktop/src/**'
naming:
  active: true
  ClassNaming:
    active: true
    classPattern: "[A-Z][a-zA-Z0-9]*"
  FunctionNaming:
    active: true
    excludes:
    - '**/test/**'
    functionPattern: "^([a-z][a-zA-Z0-9]*)|(`.*`)$"
  PackageNaming:
    active: true
    packagePattern: "[a-z]+(\\.[a-z][A-Za-z0-9]*)*"
  VariableNaming:
    active: true
    variablePattern: "[a-z][A-Za-z0-9]*"
performance:
  active: true
  ForEachOnRange:
    active: true
    excludes:
    - '**/test/**'
  SpreadOperator:
    active: true
    excludes:
    - '**/test/**'
potential-bugs:
  active: true
  EqualsAlwaysReturnsTrueOrFalse:
    active: true
  IteratorHasNextCallsNextMethod:
    active: true
  IteratorNotThrowingNoSuchElementException:
    active: true
  UnnecessaryNotNullOperator:
    active: true
  UnnecessarySafeCall:
    active: true
  UnreachableCode:
    active: true
  UnsafeCallOnNullableType:
    active: true
  UnsafeCast:
    active: true
style:
  active: true
  ForbiddenMethodCall:
    active: true
    # Forbid println/print in main source code - use logging instead
    # Note: This doesn't affect string literals containing "println" (e.g., Groovy code in tests)
    methods:
      - 'kotlin.io.println'
      - 'kotlin.io.print'
    excludes:
      - '**/test/**'  # Allow in tests for now (will clean up separately)
  ForbiddenComment:
    active: true
    comments:
    - "STOPSHIP:"
    - "XXX:"
  ForbiddenImport:
    active: true
    # The stdlib atomics are experimental (KT-82228). Only :common:concurrent opts into them, behind gvy's own
    # OnceFlag, SharedValue and Counter; elsewhere, use those types (#2474). Syntax-only, so the PR lint gate runs it.
    forbiddenPatterns: 'kotlin\.concurrent\.atomics\..*'
    excludes:
    - '**/common/concurrent/src/**'
  LoopWithTooManyJumpStatements:
    active: true
  MaxLineLength:
    active: true
    maxLineLength: 120
    excludePackageStatements: true
    excludeImportStatements: true
  MagicNumber:
    active: true
    excludes:
    - '**/test/**'
    ignoreNumbers:
    - '-1'
    - '0'
    - '1'
    - '2'
    ignoreHashCodeFunction: true
    ignorePropertyDeclaration: false
    ignoreLocalVariableDeclaration: false
    ignoreConstantDeclaration: true
    ignoreCompanionObjectPropertyDeclaration: true
    ignoreAnnotation: false
    ignoreNamedArgument: true
    ignoreEnums: false
    ignoreRanges: false
    ignoreExtensionFunctions: true
  ReturnCount:
    active: true
    max: 3
    excludedFunctions:
    - equals
    excludeLabeled: false
    excludeReturnFromLambda: true
    excludeGuardClauses: true
  UnusedImports:
    active: true
  UnusedParameter:
    active: true
    allowedNames: ignored|_
  UnusedPrivateClass:
    active: true
  UnusedPrivateMember:
    active: true
  UseCheckNotNull:
    active: true
  UseRequire:
    active: true
  UseRequireNotNull:
    active: true
  # Enforce no star imports everywhere, including tests
  WildcardImport:
    active: true
