packages:
  - client

# rules_js 2.8.3 needs this empty Bazel lifecycle allowlist; pnpm 12 uses allowBuilds.
# Compatibility debt: https://github.com/albertocavalcante/gvy/issues/1603
onlyBuiltDependencies: []

allowBuilds:
  "@vscode/vsce-sign": false
  esbuild: true
  keytar: false

# Only resolve versions that have been public for two weeks (supply-chain
# cooling-off). Packages listed in the exclude list were adopted on purpose
# before that window elapsed.
minimumReleaseAge: 20160
minimumReleaseAgeExclude:
  - "@types/vscode"
  - "@vscode/vsce"
  - vscode-languageclient
  - vscode-languageserver-protocol
  - vscode-languageserver-types
  - vscode-jsonrpc
  - vscode-languageserver-textdocument
  # Security fixes adopted inside the window:
  # @azure/identity 4.14.1 moves to @azure/msal-node ^7.1.0 (GHSA-xcx6-jx8p-x3h5);
  # serialize-javascript 7.1.3 fixes GHSA-m5mm-p8h7-m29v.
  - "@azure/identity"
  - serialize-javascript
