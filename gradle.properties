# Gradle properties
# Split the 5 GiB daemon heap/metaspace budget for Kotlin compiler and plugin class loading.
# Test workers have separate heaps; shared hosts still coordinate builds with build-slot.
org.gradle.jvmargs=-Xms512m -Xmx3g -XX:+UseG1GC -XX:MaxMetaspaceSize=2g -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8

# Console output: plain provides faster feedback and more consistent CI logs
# Uncomment the line below to enable rich (colored) output even when not connected to a tty
org.gradle.console=plain
# org.gradle.console=rich

# Performance Tuning
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.configuration-cache.problems=fail
org.gradle.vfs.watch=true
# Allow Gradle to use more workers (defaults to CPU count, usually better than hardcoding 4)
# org.gradle.workers.max=4

# TODO(#1603): Gate Gradle diagnostics and retire deprecated build/plugin APIs.
# See: https://github.com/albertocavalcante/gvy/issues/1603
org.gradle.warning.mode=all
org.gradle.scan=true

# Kotlin
kotlin.code.style=official
kotlin.incremental=true
kotlin.compiler.execution.strategy=in-process
